<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スキル棚卸し管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f4f6f8; font-family: sans-serif; padding: 15px; color: #2f3640; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .member-tabs-container { background: #2c3e50; padding: 8px 12px; display: flex; align-items: center; gap: 8px; overflow-x: auto; border-radius: 6px 6px 0 0; margin-bottom: 15px; }
        .member-tab { background: #34495e; color: #ecf0f1; padding: 6px 14px; border-radius: 4px 4px 0 0; font-size: 13px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 8px; border: none; }
        .member-tab.active { background: white; color: #2c3e50; font-weight: bold; }
        .member-tab .tab-del { background: transparent; border: none; color: #e74c3c; font-size: 12px; cursor: pointer; padding: 0 2px; border-radius: 50%; }
        .doc-title { font-size: 20px; margin: 0 0 10px 0; color: #2c3e50; border-bottom: 2px solid #2c3e50; padding-bottom: 5px; outline: none; }
        .skill-meta-bar { display: flex; justify-content: flex-end; gap: 20px; margin-bottom: 15px; font-size: 13px; }
        .skill-meta-bar input { border: none; border-bottom: 1px solid #ccc; padding: 2px 5px; font-size: 13px; background: transparent; }
        .criteria-box { background-color: #f8f9fa; border: 1px solid #e9ecef; border-left: 4px solid #3498db; padding: 10px 15px; margin-bottom: 20px; font-size: 13px; border-radius: 0 4px 4px 0; }
        .section-block { margin-top: 25px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; background: #ecf0f1; border-left: 4px solid #2c3e50; padding: 4px 8px; margin-bottom: 8px; }
        .section-title { font-size: 14px; font-weight: bold; color: #2c3e50; margin: 0; flex-grow: 1; outline: none; }
        .move-btn-group { display: flex; gap: 2px; margin-right: 6px; }
        .btn-move { background: #d5dbdb; color: #2c3e50; border: 1px solid #bdc3c7; border-radius: 3px; font-size: 10px; padding: 2px 5px; cursor: pointer; }
        table.skill-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
        table.skill-table th, table.skill-table td { border: 1px solid #bdc3c7; padding: 6px 8px; font-size: 12px; text-align: left; background: #fff; }
        table.skill-table th { background-color: #f2f4f4; color: #2c3e50; font-weight: bold; }
        .col-drag { width: 50px; text-align: center !important; }
        .col-eval { width: 55px; text-align: center !important; }
        .col-item { width: 150px; }
        .col-action { width: 40px; text-align: center !important; }
        select.eval-select { width: 100%; padding: 2px; font-size: 13px; border: 1px solid #ccc; border-radius: 3px; text-align: center; }
        .btn-row-add { background: #f39c12; color: white; border: none; padding: 6px 12px; font-size: 12px; border-radius: 3px; cursor: pointer; margin-top: 4px; font-weight: bold; }
        .btn-del { background: #e74c3c; color: white; border: none; width: 22px; height: 22px; font-size: 13px; font-weight: bold; border-radius: 50%; cursor: pointer; text-align: center; }
        [contenteditable="true"]:hover { background-color: #f9f9f9; }
        [contenteditable="true"]:focus { background-color: #eaf2f8; outline: none; }
    </style>
</head>
<body>
    <div style="max-width: 900px; margin: 0 auto;">
        <a href="index.html" class="text-blue-600 font-bold mb-4 inline-block">← ポータルサイトに戻る</a>

        <div class="container">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <div>
                    <h1 class="text-xl font-bold text-slate-800">📊 スキル棚卸し管理</h1>
                    <p class="text-xs text-gray-500">Firestoreリアルタイム同期版</p>
                </div>
                <div class="flex items-center gap-3">
                    <span id="skill-sync-status" class="text-xs text-gray-500">保存済み</span>
                    <button onclick="addNewMember()" class="bg-amber-600 text-white text-xs px-3 py-1.5 rounded font-bold">+ メンバー追加</button>
                    <button onclick="addSkillSection()" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded font-bold">+ セクション追加</button>
                    <button onclick="window.print()" class="bg-gray-600 text-white text-xs px-3 py-1.5 rounded font-bold">印刷 / PDF</button>
                </div>
            </div>

            <div class="member-tabs-container" id="member-tabs-bar"></div>

            <h1 class="doc-title" contenteditable="true" id="doc-title-input">スキル棚卸しチェックリスト</h1>

            <div class="skill-meta-bar">
                <div>実施日: <input type="date" id="skill-eval-date"></div>
                <div>氏名: <input type="text" id="skill-eval-name" placeholder="名前を入力"></div>
            </div>

            <div class="criteria-box">
                <h3 class="font-bold mb-1 text-slate-800">【評価基準】</h3>
                <ul class="list-disc pl-4 space-y-0.5">
                    <li><strong>○</strong>：単独で作業・対応が可能</li>
                    <li><strong>△</strong>：人に聞けば（マニュアル等があれば）対応が可能</li>
                    <li><strong>×</strong>：未経験、または対応不可・不明</li>
                </ul>
            </div>

            <div id="skill-sections-container"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0", authDomain: "souko-2de57.firebaseapp.com", projectId: "souko-2de57" }));

        const defaultSkillSections = [
            {
                title: "1. 共通業務・システム操作",
                items: [
                    { item: "入荷対応", detail: "商品の入荷検品・登録作業", eval: "" },
                    { item: "送り状作成 ヤマト運輸", detail: "送り状・発送ラベルの発行", eval: "" },
                    { item: "送り状作成 佐川急便", detail: "送り状・発送ラベルの発行", eval: "" },
                    { item: "送り状作成 西濃運輸", detail: "送り状・発送ラベルの発行", eval: "" }
                ]
            }
        ];

        let skillAppData = {
            docTitle: "スキル棚卸しチェックリスト",
            activeMemberId: "member_1",
            members: {
                "member_1": { id: "member_1", name: "山田 太郎", evalDate: new Date().toISOString().slice(0, 10), sections: JSON.parse(JSON.stringify(defaultSkillSections)) }
            }
        };

        const skillContainer = document.getElementById('skill-sections-container');
        const skillTabsBar = document.getElementById('member-tabs-bar');
        const skillStatusEl = document.getElementById('skill-sync-status');
        const docTitleInput = document.getElementById('doc-title-input');
        const evalDateInput = document.getElementById('skill-eval-date');
        const evalNameInput = document.getElementById('skill-eval-name');
        let skillSaveTimer = null;

        function renderSkillTabs() {
            skillTabsBar.innerHTML = '';
            Object.values(skillAppData.members).forEach(member => {
                const tab = document.createElement('button');
                tab.className = `member-tab ${member.id === skillAppData.activeMemberId ? 'active' : ''}`;
                tab.innerHTML = `<span>${member.name || '（氏名未入力）'}</span>${Object.keys(skillAppData.members).length > 1 ? `<button class="tab-del" onclick="deleteSkillMember(event, '${member.id}')">×</button>` : ''}`;
                tab.onclick = (e) => { if (!e.target.classList.contains('tab-del')) switchSkillMember(member.id); };
                skillTabsBar.appendChild(tab);
            });
        }

        function switchSkillMember(memberId) {
            saveCurrentMemberState();
            skillAppData.activeMemberId = memberId;
            loadMemberToUI();
            renderSkillTabs();
        }

        function saveCurrentMemberState() {
            const m = skillAppData.members[skillAppData.activeMemberId];
            if (!m) return;
            m.name = evalNameInput.value;
            m.evalDate = evalDateInput.value;
            m.sections = gatherSectionsData();
            skillAppData.docTitle = docTitleInput.innerText;
        }

        function loadMemberToUI() {
            const m = skillAppData.members[skillAppData.activeMemberId];
            if (!m) return;
            docTitleInput.innerText = skillAppData.docTitle || "スキル棚卸しチェックリスト";
            evalNameInput.value = m.name || "";
            evalDateInput.value = m.evalDate || new Date().toISOString().slice(0, 10);
            skillContainer.innerHTML = '';
            (m.sections && m.sections.length > 0 ? m.sections : defaultSkillSections).forEach(sec => {
                skillContainer.appendChild(createSectionBlock(sec.title, sec.items));
            });
        }

        window.addNewMember = () => {
            saveCurrentMemberState();
            const newId = 'member_' + Date.now();
            skillAppData.members[newId] = { id: newId, name: `メンバー ${Object.keys(skillAppData.members).length + 1}`, evalDate: new Date().toISOString().slice(0, 10), sections: JSON.parse(JSON.stringify(defaultSkillSections)) };
            skillAppData.activeMemberId = newId;
            loadMemberToUI();
            renderSkillTabs();
            triggerAutoSave();
        };

        window.deleteSkillMember = (e, memberId) => {
            e.stopPropagation();
            if (Object.keys(skillAppData.members).length <= 1) { alert("最後のメンバーは削除できません。"); return; }
            if (confirm("このメンバーを削除しますか？")) {
                delete skillAppData.members[memberId];
                if (skillAppData.activeMemberId === memberId) skillAppData.activeMemberId = Object.keys(skillAppData.members)[0];
                loadMemberToUI();
                renderSkillTabs();
                triggerAutoSave();
            }
        };

        function createRow(itemText = "", detailText = "", evalVal = "") {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="col-drag"><div class="move-btn-group"><button class="btn-move" onclick="moveRow(this, -1)">▲</button><button class="btn-move" onclick="moveRow(this, 1)">▼</button></div></td>
            <td class="col-eval"><select class="eval-select" onchange="triggerAutoSave()"><option value="" ${evalVal===""?"selected":""}></option><option value="○" ${evalVal==="○"?"selected":""}>○</option><option value="△" ${evalVal==="△"?"selected":""}>△</option><option value="×" ${evalVal==="×"?"selected":""}>×</option></select></td>
            <td class="col-item" contenteditable="true">${itemText || "新規項目"}</td>
            <td contenteditable="true">${detailText || "説明"}</td>
            <td class="col-action"><button class="btn-del" onclick="this.closest('tr').remove(); triggerAutoSave();">×</button></td>`;
            tr.querySelectorAll('[contenteditable="true"], select').forEach(el => el.addEventListener('input', () => { if(el === evalNameInput) renderSkillTabs(); triggerAutoSave(); }));
            return tr;
        }

        function createSectionBlock(titleText = "新規セクション", items = []) {
            const block = document.createElement('div');
            block.className = 'section-block';
            block.innerHTML = `<div class="section-header"><div class="move-btn-group"><button class="btn-move" onclick="moveSection(this, -1)">▲</button><button class="btn-move" onclick="moveSection(this, 1)">▼</button></div><div class="section-title" contenteditable="true">${titleText}</div><button class="btn-del" onclick="if(confirm('セクションを削除しますか？')){this.closest('.section-block').remove(); triggerAutoSave();}">×</button></div>
            <table class="skill-table"><thead><tr><th class="col-drag">移動</th><th class="col-eval">評価</th><th class="col-item">項目</th><th>内容・詳細</th><th class="col-action">削除</th></tr></thead><tbody></tbody></table>
            <button class="btn-row-add" onclick="addRow(this)">+ 項目（行）を追加</button>`;
            const tbody = block.querySelector('tbody');
            (items.length > 0 ? items : [{item:'', detail:'', eval:''}]).forEach(it => tbody.appendChild(createRow(it.item, it.detail, it.eval)));
            block.querySelector('.section-title').addEventListener('input', triggerAutoSave);
            return block;
        }

        window.addRow = (btn) => { btn.previousElementSibling.querySelector('tbody').appendChild(createRow()); triggerAutoSave(); };
        window.moveRow = (btn, dir) => { const tr = btn.closest('tr'); if (dir === -1 && tr.previousElementSibling) tr.parentElement.insertBefore(tr, tr.previousElementSibling); else if (dir === 1 && tr.nextElementSibling) tr.parentElement.insertBefore(tr.nextElementSibling, tr); triggerAutoSave(); };
        window.moveSection = (btn, dir) => { const blk = btn.closest('.section-block'); if (dir === -1 && blk.previousElementSibling) skillContainer.insertBefore(blk, blk.previousElementSibling); else if (dir === 1 && blk.nextElementSibling) skillContainer.insertBefore(blk.nextElementSibling, blk); triggerAutoSave(); };
        window.addSkillSection = () => { skillContainer.appendChild(createSectionBlock()); triggerAutoSave(); };

        function gatherSectionsData() {
            const sections = [];
            document.querySelectorAll('#skill-sections-container .section-block').forEach(blk => {
                const title = blk.querySelector('.section-title').innerText.trim();
                const items = [];
                blk.querySelectorAll('tbody tr').forEach(tr => {
                    items.push({ item: tr.querySelectorAll('td')[2].innerText.trim(), detail: tr.querySelectorAll('td')[3].innerText.trim(), eval: tr.querySelector('.eval-select').value });
                });
                sections.push({ title, items });
            });
            return sections;
        }

        async function saveSkillData() {
            try {
                skillStatusEl.innerText = "保存中...";
                saveCurrentMemberState();
                await setDoc(doc(db, "settings", "skill_checklist"), { docTitle: docTitleInput.innerText, activeMemberId: skillAppData.activeMemberId, members: skillAppData.members, updatedAt: new Date().toISOString() });
                skillStatusEl.innerText = "保存済み";
            } catch(e) { skillStatusEl.innerText = "エラー"; }
        }

        function triggerAutoSave() {
            skillStatusEl.innerText = "保存中...";
            clearTimeout(skillSaveTimer);
            skillSaveTimer = setTimeout(saveSkillData, 800);
            renderSkillTabs();
        }

        async function init() {
            try {
                const docSnap = await getDoc(doc(db, "settings", "skill_checklist"));
                if (docSnap.exists() && docSnap.data().members) skillAppData = docSnap.data();
            } catch(e) {}
            renderSkillTabs();
            loadMemberToUI();
        }

        docTitleInput.addEventListener('input', triggerAutoSave);
        evalDateInput.addEventListener('input', triggerAutoSave);
        evalNameInput.addEventListener('input', () => { renderSkillTabs(); triggerAutoSave(); });

        init();
    </script>
</body>
</html>
