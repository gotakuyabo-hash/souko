<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>不明品・セラー報告ポスト 📦</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 max-w-lg mx-auto">

    <header class="mb-4 text-center">
        <h1 class="text-xl font-bold text-slate-800">📦 不明品・セラー報告ポスト</h1>
        <p class="text-xs text-slate-500">履歴検索・絞り込み・削除対応版</p>
    </header>

    <!-- 設定カード -->
    <div class="bg-white rounded-xl p-4 mb-4 shadow-sm border border-slate-200">
        <details class="text-xs" id="settingsDetails">
            <summary class="font-bold text-slate-600 cursor-pointer">⚙️ 送信先グループ・メンション設定（タップして展開）</summary>
            <div class="mt-3 space-y-3 pt-2 border-t border-slate-100">
                <div>
                    <button type="button" onclick="fetchChatRooms()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-bold text-xs">🔄 チャットグループ一覧を取得する</button>
                </div>
                <div>
                    <label class="block font-medium mb-1">🔍 グループ名で絞り込み</label>
                    <input type="text" id="roomSearchInput" placeholder="例: 倉庫, 運営" oninput="filterRooms()" class="w-full border border-slate-300 rounded p-2 text-xs bg-slate-50">
                </div>
                <div>
                    <label class="block font-medium mb-1">送信先グループ（よく使う順・ルーム選択）</label>
                    <select id="roomSelect" onchange="onRoomSelectChange()" class="w-full border border-slate-300 rounded p-2 text-xs bg-white">
                        <option value="">-- 上のボタンを押してグループを取得してください --</option>
                    </select>
                </div>
                <div>
                    <label class="block font-medium mb-1">選択中のルームID</label>
                    <input type="text" id="cwRoomId" placeholder="自動入力されます" readonly class="w-full border border-slate-300 bg-slate-50 rounded p-2 text-xs text-slate-500">
                </div>
                <div>
                    <label class="block font-medium mb-1">担当者 メンション先（宛先選択）</label>
                    <select id="memberSelect" onchange="onMemberSelectChange()" class="w-full border border-slate-300 rounded p-2 text-xs bg-white">
                        <option value="">-- グループ選択後にメンバーが読み込まれます --</option>
                    </select>
                </div>
                <input type="hidden" id="cwAccountId">
                <input type="hidden" id="cwAccountName">
                
                <div>
                    <label class="block font-medium mb-1">GAS ウェブアプリURL</label>
                    <input type="text" id="gasUrl" value="https://script.google.com/macros/s/AKfycbwgKjStq9vJe-eslIldR8aTHfNC5VX6RPszqdyJ6K2LeD2TaQPAabCckVQNWz44QSO39A/exec" class="w-full border border-slate-300 bg-slate-50 rounded p-2 text-xs text-slate-600">
                </div>
                <button type="button" onclick="saveSettings()" class="w-full bg-slate-700 text-white py-2 rounded font-bold">設定を保存する</button>
            </div>
        </details>
    </div>

    <!-- 入力・報告フォーム -->
    <div class="bg-white rounded-xl p-4 mb-4 shadow-sm border border-slate-200">
        <form id="reportForm" class="space-y-3">
            <div>
                <label class="block text-xs font-bold mb-1">伝票番号 / 注文番号 (任意)</label>
                <input type="text" id="referenceNumber" placeholder="バーコード読取または手入力" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-bold mb-1">ステータス・状態</label>
                <select id="issueType" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:border-blue-500">
                    <option value="宛名・注文者不明">宛名・注文者不明</option>
                    <option value="注文番号不明">注文番号不明</option>
                    <option value="商品破損・不備あり">商品破損・不備あり</option>
                    <option value="納品数不足・過剰">納品数不足・過剰</option>
                    <option value="その他確認事項">その他確認事項</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1">詳細メモ・保管場所など</label>
                <textarea id="memo" rows="2" placeholder="例: 棚A-3に一時保管しています。確認お願いします。" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500"></textarea>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1">📷 証拠写真（カメラ起動・選択）</label>
                <input type="file" id="reportImage" accept="image/*" capture="environment" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
            </div>
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-lg font-bold text-sm shadow transition">
                🚀 画像付きでChatwork報告 ＆ 記録
            </button>
        </form>
        <p id="statusMsg" class="text-center text-xs text-slate-500 mt-2 min-h-[1.5rem]"></p>
    </div>

    <!-- 履歴カード（検索・絞り込み付き） -->
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-2">
            <h3 class="font-bold text-sm text-slate-700">📋 報告履歴</h3>
            <button type="button" onclick="loadHistoryFromFirestore()" class="text-[11px] text-blue-600 underline">🔄 更新</button>
        </div>

        <!-- 履歴フィルター（検索 ＆ 日付） -->
        <div class="grid grid-cols-2 gap-2 mb-3">
            <div>
                <label class="block text-[10px] text-slate-500 mb-0.5">キーワード検索</label>
                <input type="text" id="historySearchKeyword" placeholder="番号・メモなど" oninput="filterHistoryView()" class="w-full border border-slate-300 rounded p-1.5 text-xs">
            </div>
            <div>
                <label class="block text-[10px] text-slate-500 mb-0.5">日付絞り込み</label>
                <input type="date" id="historyDateFilter" onchange="filterHistoryView()" class="w-full border border-slate-300 rounded p-1.5 text-xs bg-white">
            </div>
        </div>

        <ul id="historyList" class="space-y-2 text-xs">
            <li class="text-center text-slate-400 py-2">読み込み中...</li>
        </ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
            authDomain: "souko-2de57.firebaseapp.com",
            projectId: "souko-2de57",
            storageBucket: "souko-2de57.firebasestorage.app",
            messagingSenderId: "642116656086",
            appId: "1:642116656086:web:139cc5558a4ef6ebda6277",
            measurementId: "G-8WG8GWQGCR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.query = query;
        window.orderBy = orderBy;

        window.loadHistoryFromFirestore();
    </script>

    <script>
        let allRoomsData = [];
        let allHistoryData = [];

        window.addEventListener('DOMContentLoaded', () => {
            const savedRoom = localStorage.getItem('fumeihin_cw_room') || '';
            const savedAccount = localStorage.getItem('fumeihin_cw_account') || '';
            const savedAccountName = localStorage.getItem('fumeihin_cw_account_name') || '';
            const savedGas = localStorage.getItem('fumeihin_gas_url') || '';

            document.getElementById('cwRoomId').value = savedRoom;
            document.getElementById('cwAccountId').value = savedAccount;
            document.getElementById('cwAccountName').value = savedAccountName;
            if (savedGas) document.getElementById('gasUrl').value = savedGas;

            if (savedRoom) {
                fetchRoomMembers(savedRoom, savedAccount);
            }
        });

        async function fetchChatRooms() {
            const gasUrl = document.getElementById('gasUrl').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            try {
                statusMsg.innerText = "チャットグループ一覧を取得中...";
                const res = await fetch(gasUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getRooms' })
                });

                const data = await res.json();
                if (data.status !== 'success') throw new Error(data.message || '取得失敗');

                allRoomsData = data.rooms;
                renderRoomOptions(allRoomsData);
                statusMsg.innerText = `グループを ${allRoomsData.length}件 取得しました！`;
                document.getElementById('settingsDetails').open = true;
            } catch (err) {
                alert('取得エラー: ' + err.message);
                statusMsg.innerText = "";
            }
        }

        function renderRoomOptions(rooms, filterKeyword = '') {
            const select = document.getElementById('roomSelect');
            const currentRoomId = document.getElementById('cwRoomId').value;
            const usageCounts = JSON.parse(localStorage.getItem('fumeihin_room_counts') || '{}');

            const sortedRooms = [...rooms].sort((a, b) => {
                return (usageCounts[b.room_id] || 0) - (usageCounts[a.room_id] || 0);
            });

            const keyword = filterKeyword.toLowerCase();
            const filtered = sortedRooms.filter(room => room.name.toLowerCase().includes(keyword));

            select.innerHTML = '<option value="">-- グループを選択してください --</option>';
            filtered.forEach(room => {
                const count = usageCounts[room.room_id] || 0;
                const opt = document.createElement('option');
                opt.value = room.room_id;
                const pinBadge = count > 0 ? `🔥(${count}回) ` : '';
                opt.textContent = `${pinBadge}[${room.type}] ${room.name} (${room.room_id})`;
                if (String(room.room_id) === String(currentRoomId)) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function filterRooms() {
            const keyword = document.getElementById('roomSearchInput').value;
            if (allRoomsData.length > 0) renderRoomOptions(allRoomsData, keyword);
        }

        async function onRoomSelectChange() {
            const select = document.getElementById('roomSelect');
            const roomId = select.value;
            document.getElementById('cwRoomId').value = roomId;
            if (roomId) {
                incrementRoomUsage(roomId);
                await fetchRoomMembers(roomId);
            }
        }

        function incrementRoomUsage(roomId) {
            const usageCounts = JSON.parse(localStorage.getItem('fumeihin_room_counts') || '{}');
            usageCounts[roomId] = (usageCounts[roomId] || 0) + 1;
            localStorage.setItem('fumeihin_room_counts', JSON.stringify(usageCounts));
        }

        async function fetchRoomMembers(roomId, selectedAccountId = '') {
            const gasUrl = document.getElementById('gasUrl').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const memberSelect = document.getElementById('memberSelect');

            try {
                statusMsg.innerText = "グループのメンバーを取得中...";
                memberSelect.innerHTML = '<option value="">読み込み中...</option>';

                const res = await fetch(gasUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getMembers', roomId: roomId })
                });

                const data = await res.json();
                if (data.status !== 'success') throw new Error(data.message || 'メンバー取得失敗');

                const members = data.members;
                memberSelect.innerHTML = '<option value="">-- メンションなし --</option>';
                members.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.account_id;
                    opt.textContent = `${m.name} (${m.role_name || 'メンバー'})`;
                    if (String(m.account_id) === String(selectedAccountId)) opt.selected = true;
                    memberSelect.appendChild(opt);
                });
                statusMsg.innerText = "設定の準備が整いました！";
            } catch (err) {
                memberSelect.innerHTML = '<option value="">メンバー取得エラー</option>';
                statusMsg.innerText = "";
            }
        }

        function onMemberSelectChange() {
            const select = document.getElementById('memberSelect');
            const accountId = select.value;
            document.getElementById('cwAccountId').value = accountId;
            const selectedOpt = select.options[select.selectedIndex];
            const accountName = accountId ? selectedOpt.textContent.split(' (')[0] : '';
            document.getElementById('cwAccountName').value = accountName;
        }

        function saveSettings() {
            localStorage.setItem('fumeihin_cw_room', document.getElementById('cwRoomId').value.trim());
            localStorage.setItem('fumeihin_cw_account', document.getElementById('cwAccountId').value.trim());
            localStorage.setItem('fumeihin_cw_account_name', document.getElementById('cwAccountName').value.trim());
            localStorage.setItem('fumeihin_gas_url', document.getElementById('gasUrl').value.trim());
            alert('設定を保存しました！');
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        const reportForm = document.getElementById('reportForm');
        const statusMsg = document.getElementById('statusMsg');

        reportForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const refNum = document.getElementById('referenceNumber').value.trim();
            const issueType = document.getElementById('issueType').value;
            const memo = document.getElementById('memo').value.trim();
            const gasUrl = document.getElementById('gasUrl').value.trim();
            const imageInput = document.getElementById('reportImage');
            
            const roomId = document.getElementById('cwRoomId').value.trim() || localStorage.getItem('fumeihin_cw_room');
            const accountId = document.getElementById('cwAccountId').value.trim() || localStorage.getItem('fumeihin_cw_account');
            const accountName = document.getElementById('cwAccountName').value.trim() || localStorage.getItem('fumeihin_cw_account_name');

            if (!window.db) return;

            try {
                statusMsg.innerText = "クラウドに保存中...";

                await window.addDoc(window.collection(window.db, "fumeihin_reports"), {
                    referenceNumber: refNum || "なし",
                    issueType: issueType,
                    memo: memo || "",
                    createdAt: new Date().toISOString()
                });

                if (roomId && gasUrl) {
                    statusMsg.innerText = "Chatworkへ送信中...";
                    let mention = accountId ? `[To:${accountId}] ${accountName}さん\n\n` : '';
                    let messageBody = `${mention}いつもお世話になっております。\n` +
                                      `【不明品・確認のご連絡】\n` +
                                      `----------------------------------\n` +
                                      `■ 該当番号: ${refNum || 'なし'}\n` +
                                      `■ 状態: ${issueType}\n` +
                                      `■ メモ: ${memo || 'なし'}\n` +
                                      `----------------------------------\n` +
                                      `お手数お掛け致しますが、ご確認宜しくお願い致します。`;

                    let payloadData = { action: 'sendMessage', roomId: roomId, messageBody: messageBody };

                    if (imageInput.files && imageInput.files[0]) {
                        const file = imageInput.files[0];
                        payloadData.imageBase64 = await fileToBase64(file);
                        payloadData.imageName = file.name || 'evidence.jpg';
                        payloadData.imageMimeType = file.type || 'image/jpeg';
                    }

                    await fetch(gasUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payloadData)
                    });
                }

                statusMsg.innerText = "報告＆送信完了しました！";
                reportForm.reset();
                window.loadHistoryFromFirestore();
            } catch (err) {
                statusMsg.innerText = "エラー: " + err.message;
            }
        });

        window.loadHistoryFromFirestore = async function() {
            if (!window.db) return;
            const historyList = document.getElementById('historyList');
            try {
                const q = window.query(window.collection(window.db, "fumeihin_reports"), window.orderBy("createdAt", "desc"));
                const querySnapshot = await window.getDocs(q);
                
                allHistoryData = [];
                querySnapshot.forEach((docSnap) => {
                    allHistoryData.push({ id: docSnap.id, ...docSnap.data() });
                });

                filterHistoryView();
            } catch (err) {
                historyList.innerHTML = '<li class="text-center text-red-500 py-2">履歴の読み込み失敗</li>';
            }
        };

        window.filterHistoryView = function() {
            const historyList = document.getElementById('historyList');
            const keyword = document.getElementById('historySearchKeyword').value.toLowerCase();
            const dateFilter = document.getElementById('historyDateFilter').value;

            const filtered = allHistoryData.filter(item => {
                const itemDateStr = item.createdAt ? item.createdAt.split('T')[0] : '';
                
                if (dateFilter && itemDateStr !== dateFilter) return false;

                if (keyword) {
                    const targetText = `${item.referenceNumber} ${item.issueType} ${item.memo}`.toLowerCase();
                    if (!targetText.includes(keyword)) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                historyList.innerHTML = '<li class="text-center text-slate-400 py-2">該当する履歴はありません</li>';
                return;
            }

            historyList.innerHTML = filtered.map(item => `
                <li class="p-2.5 bg-slate-50 rounded border border-slate-100 flex justify-between items-start">
                    <div>
                        <span class="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.5 rounded font-bold">${item.issueType}</span><br>
                        <span class="text-slate-600 text-xs">番号: ${item.referenceNumber} / メモ: ${item.memo || 'なし'}</span>
                        <div class="text-[10px] text-slate-400 mt-1">${new Date(item.createdAt).toLocaleString()}</div>
                    </div>
                    <button type="button" onclick="deleteHistoryItem('${item.id}', '${item.referenceNumber}')" class="text-red-500 hover:text-red-700 text-xs px-2 py-1 bg-red-50 rounded border border-red-100 ml-2 whitespace-nowrap">🗑️ 削除</button>
                </li>
            `).join('');
        };

        window.deleteHistoryItem = async function(docId, refNum) {
            if (!confirm(`該当番号「${refNum}」の報告履歴を削除してもよろしいですか？`)) {
                return;
            }

            try {
                const statusMsg = document.getElementById('statusMsg');
                statusMsg.innerText = "履歴を削除中...";

                await window.deleteDoc(window.doc(window.db, "fumeihin_reports", docId));
                
                statusMsg.innerText = "履歴を削除しました。";
                window.loadHistoryFromFirestore();
            } catch (err) {
                alert('削除エラー: ' + err.message);
                statusMsg.innerText = "";
            }
        };
    </script>
</body>
</html>
