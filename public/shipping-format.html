<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出荷・送り状 自動整形ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.1.0/encoding.min.js"></script>
    <style>
        body { background: #f4f6f8; font-family: sans-serif; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 800px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div style="max-width: 800px; margin: 0 auto;">
        <a href="index.html" class="text-blue-600 font-bold mb-4 inline-block">← ポータルサイトに戻る</a>
        <div class="card">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                <h2 class="text-lg font-bold text-slate-800">📦 出荷・送り状 自動整形ツール</h2>
                <button onclick="resetData()" class="bg-rose-500 hover:bg-rose-600 text-white text-xs px-3 py-1.5 rounded font-bold transition">🔄 リセット</button>
            </div>
            <p class="text-xs text-slate-500 mb-4">「受注データCSV」をドラッグ＆ドロップしてください。</p>

            <div id="dropZone" class="border-2 border-dashed border-sky-400 rounded-lg bg-sky-50/50 p-6 text-center cursor-pointer hover:bg-sky-50 transition mb-4" onclick="document.getElementById('fileInput').click()">
                <div class="text-3xl mb-1">📂</div>
                <div class="font-bold text-slate-700 text-sm">ここに受注CSVファイルをドラッグ＆ドロップ</div>
                <p class="text-xs text-slate-500 mt-1">またはクリックしてファイルを選択</p>
                <input type="file" id="fileInput" class="hidden" accept=".csv">
            </div>

            <div id="fileStatus" class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded mb-4 font-mono">読み込まれたファイル: なし</div>

            <div id="status" class="text-sm font-bold text-sky-600 mb-3">ファイルを選択してください</div>

            <!-- 受注データ基準のソート機能エリア -->
            <div id="sortControlArea" class="hidden bg-slate-50 p-3.5 rounded border border-slate-200 mb-4">
                <div class="text-xs font-bold text-slate-700 mb-2">⚙️ 受注データ基準のソート設定（並び替え）</div>
                <div class="flex flex-wrap items-center gap-2">
                    <select id="sortColumnSelect" class="text-xs border border-slate-300 rounded px-2.5 py-1.5 bg-white flex-1 min-w-[180px] cursor-pointer">
                        <option value="">（ソートする列を選択）</option>
                        <option value="30">商品コード (列 30)</option>
                        <option value="27">メモ１ (列 27)</option>
                    </select>
                    <select id="sortDirectionSelect" class="text-xs border border-slate-300 rounded px-2.5 py-1.5 bg-white cursor-pointer">
                        <option value="asc">昇順 (古い順 / A→Z)</option>
                        <option value="desc">降順 (新しい順 / Z→A)</option>
                    </select>
                    <button onclick="applyDynamicSort()" class="bg-sky-600 hover:bg-sky-700 text-white text-xs px-3.5 py-1.5 rounded font-bold transition">ソート実行</button>
                    <button onclick="resetSort()" class="bg-slate-300 hover:bg-slate-400 text-slate-700 text-xs px-3 py-1.5 rounded font-bold transition">解除</button>
                </div>
            </div>

            <div class="max-h-48 overflow-y-auto border border-slate-200 rounded mb-4">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-slate-800 text-white sticky top-0">
                        <tr><th class="p-2">ショップ</th><th class="p-2">受注番号</th><th class="p-2">宛名</th><th class="p-2">商品名</th></tr>
                    </thead>
                    <tbody id="orderTableBody">
                        <tr><td colspan="4" class="text-center text-slate-400 p-4">データがありません</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="flex gap-3 flex-wrap">
                <button id="printBtn" onclick="openPrintPreview()" disabled class="flex-1 bg-sky-600 hover:bg-sky-700 disabled:bg-slate-300 text-white font-bold py-2 px-4 rounded text-xs transition">🖨️ 検品シート印刷</button>
                <button id="yamatoBtn" onclick="exportYamatoCsv()" disabled class="flex-1 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-bold py-2 px-4 rounded text-xs transition">🐱 ヤマトB2 CSV出力</button>
                <button id="ehidenBtn" onclick="exportEhidenCsv()" disabled class="flex-1 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-bold py-2 px-4 rounded text-xs transition">飛 佐川CSV出力（16文字制限）</button>
            </div>
        </div>
    </div>

    <script>
        let loadedRows = [];
        let sortedRows = [];
        let originalRows = [];
        let headerRow = [];

        const dropZone = document.getElementById('dropZone');
        ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, (ev) => { ev.preventDefault(); dropZone.classList.add('bg-sky-100'); }));
        ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, (ev) => { ev.preventDefault(); dropZone.classList.remove('bg-sky-100'); }));
        dropZone.addEventListener('drop', (e) => { if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
        document.getElementById('fileInput').addEventListener('change', (e) => { if(e.target.files.length) handleFile(e.target.files[0]); });

        function resetData() {
            loadedRows = [];
            sortedRows = [];
            originalRows = [];
            headerRow = [];
            document.getElementById('fileInput').value = '';
            document.getElementById('fileStatus').textContent = "読み込まれたファイル: なし";
            document.getElementById('status').textContent = "ファイルを選択してください";
            document.getElementById('sortControlArea').classList.add('hidden');
            document.getElementById('orderTableBody').innerHTML = '<tr><td colspan="4" class="text-center text-slate-400 p-4">データがありません</td></tr>';
            document.getElementById('printBtn').disabled = true;
            document.getElementById('yamatoBtn').disabled = true;
            document.getElementById('ehidenBtn').disabled = true;
        }

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const buffer = e.target.result;
                const codes = new Uint8Array(buffer);
                const encoding = Encoding.detect(codes);
                const text = Encoding.convert(codes, { to: 'UNICODE', from: encoding, type: 'string' });
                const rows = parseRobustCSV(text);

                if (rows.length === 0) return;

                // 受注データのヘッダー行を特定
                let dataStartIndex = 0;
                for (let i = 0; i < rows.length; i++) {
                    if (rows[i].length > 5 && (rows[i].some(c => c.includes('受注番号') || c.includes('コントロールカラム') || c.includes('受注ID')))) {
                        headerRow = rows[i];
                        dataStartIndex = i + 1;
                        break;
                    }
                }

                if (headerRow.length === 0) {
                    headerRow = rows[0];
                    dataStartIndex = 1;
                }

                // 受注データの行を純粋に読み込み
                loadedRows = rows.slice(dataStartIndex).filter(r => r && r.length > 5 && r.some(c => c.trim() !== ''));
                originalRows = [...loadedRows];
                sortedRows = [...loadedRows];

                document.getElementById('fileStatus').textContent = "📂 受注データ読み込み済み: " + file.name;
                document.getElementById('sortControlArea').classList.remove('hidden');
                renderTable();
            };
            reader.readAsArrayBuffer(file);
        }

        function applyDynamicSort() {
            const colIndexVal = document.getElementById('sortColumnSelect').value;
            const direction = document.getElementById('sortDirectionSelect').value;

            if (colIndexVal === "") {
                alert('ソートする列を選択してください。');
                return;
            }

            const colIndex = parseInt(colIndexVal, 10);

            sortedRows = [...originalRows].sort((a, b) => {
                let valA = a[colIndex] !== undefined ? String(a[colIndex]).trim() : '';
                let valB = b[colIndex] !== undefined ? String(b[colIndex]).trim() : '';

                let cmp = valA.localeCompare(valB, 'ja', { numeric: true, sensitivity: 'base' });
                return direction === 'asc' ? cmp : -cmp;
            });

            renderTable();
        }

        function resetSort() {
            document.getElementById('sortColumnSelect').value = "";
            document.getElementById('sortDirectionSelect').value = "asc";
            sortedRows = [...originalRows];
            renderTable();
        }

        function parseRobustCSV(text) {
            let rows = [], currentRow = [], currentVal = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i], nextC = text[i + 1];
                if (inQuotes) {
                    if (c === '"') {
                        if (nextC === '"') { currentVal += '"'; i++; }
                        else { inQuotes = false; }
                    } else { currentVal += c; }
                } else {
                    if (c === '"') { inQuotes = true; }
                    else if (c === ',') { currentRow.push(currentVal); currentVal = ''; }
                    else if (c === '\r' || c === '\n') {
                        if (c === '\r' && nextC === '\n') { i++; }
                        currentRow.push(currentVal); rows.push(currentRow); currentRow = []; currentVal = '';
                    } else { currentVal += c; }
                }
            }
            if (currentVal !== '' || currentRow.length > 0) { currentRow.push(currentVal); rows.push(currentRow); }
            return rows;
        }

        function renderTable() {
            const statusEl = document.getElementById('status');
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '';

            if (sortedRows.length > 0) {
                statusEl.textContent = `✅ 受注データ読込成功: ${sortedRows.length}件`;
                document.getElementById('printBtn').disabled = false;
                document.getElementById('yamatoBtn').disabled = false;
                document.getElementById('ehidenBtn').disabled = false;

                sortedRows.forEach(r => {
                    let tr = document.createElement('tr');
                    tr.className = "border-b border-slate-100 hover:bg-slate-50";
                    let shop = r[3] || ''; // 店舗名
                    let orderNo = r[5] || ''; // 受注番号
                    let name = r[40] || ''; // 配送先氏名
                    let item = r[31] || ''; // 商品名
                    tr.innerHTML = `<td class="p-2">${shop}</td><td class="p-2 font-bold">${orderNo}</td><td class="p-2">${name}</td><td class="p-2">${item}</td>`;
                    tbody.appendChild(tr);
                });
            } else {
                statusEl.textContent = `⚠ 受注データが見つかりませんでした。`;
            }
        }

        function parseCsvStringToUint8(csvString) {
            const unicodeList = Encoding.stringToCode(csvString);
            const sjisCodeList = Encoding.convert(unicodeList, { to: 'SJIS', from: 'UNICODE', type: 'array' });
            return new Uint8Array(sjisCodeList);
        }

        function exportCsvGeneric(dataOrUint8, filename) {
            let uint8Array = dataOrUint8;
            if (Array.isArray(dataOrUint8)) {
                let csvString = dataOrUint8.map(r => r.map(v => `"${String(v !== undefined && v !== null ? v : '').replace(/"/g, '""')}"`).join(",")).join("\r\n");
                uint8Array = parseCsvStringToUint8(csvString);
            }
            const blob = new Blob([uint8Array], { type: 'text/csv;charset=shift_jis;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function getTodayString() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}/${m}/${day}`;
        }

        // 受注データを基準にソート順を完全反映したヤマトB2 CSV出力
        function exportYamatoCsv() {
            if (sortedRows.length === 0) {
                alert('出力するデータがありません。');
                return;
            }

            const todayStr = getTodayString();
            let processedRows = sortedRows.map(row => {
                let r = [...row];
                while (r.length < 42) r.push("");
                r[4] = todayStr;       // 出荷日
                r[39] = '09050540672'; // 依頼主電話番号
                r[26] = "";            // 請求金額クリアなど
                return r;
            });

            let outputRows = [headerRow, ...processedRows];
            exportCsvGeneric(outputRows, "yamato_processed_sorted.csv");
        }

        // 受注データを基準にソート順を完全反映した佐川（e飛伝）CSV出力（品名16文字制限）
        function exportEhidenCsv() {
            if (sortedRows.length === 0) {
                alert('出力するデータがありません。');
                return;
            }

            let processedRows = sortedRows.map(row => {
                let r = [...row];
                let targetIdx = 31; // 商品名列 (列31)
                if (r[targetIdx]) {
                    let val = String(r[targetIdx]).trim();
                    if (val.length > 16) {
                        r[targetIdx] = val.substring(0, 16);
                    }
                }
                return r;
            });

            let outputRows = [headerRow, ...processedRows];
            exportCsvGeneric(outputRows, "ehiden_processed_sorted.csv");
        }

        function openPrintPreview() {
            if (sortedRows.length === 0) {
                alert('印刷するデータがありません。');
                return;
            }
            const todayStr = new Date().toLocaleDateString();
            let htmlPages = [];
            sortedRows.forEach(r => {
                let shop = r[3] || '';
                let orderNo = r[5] || '';
                let name = r[40] || '';
                let item = r[31] || '';
                htmlPages.push(`<div class="page" style="width:94mm;height:144mm;padding:3mm;box-sizing:border-box;page-break-after:always;font-family:sans-serif;background:#fff;overflow:hidden;"><div style="font-size:14pt;font-weight:bold;border-bottom:2px solid #333;padding-bottom:2px;margin-bottom:6px;">出荷検品シート</div><table style="width:100%;margin-bottom:6px;"><tr><td style="font-size:12pt;font-weight:bold;border-bottom:2px solid #333;padding-bottom:2px;">${name || '（宛名なし）'} 様</td><td style="text-align:right;font-weight:bold;font-size:11pt;color:#c0392b;">${shop}</td></tr></table><table style="width:100%;border-collapse:collapse;margin-bottom:6px;background:#f8f9fa;border:1px solid #ccc;"><tr><td style="padding:3px 5px;font-size:9.5pt;"><b>受注番号:</b> ${orderNo}</td><td style="padding:3px 5px;font-size:9.5pt;text-align:right;"><b>発行日:</b> ${todayStr}</td></tr></table><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:#2c3e50;color:#fff;font-size:9.5pt;"><th style="width:15%;padding:4px;text-align:center;">確認</th><th style="width:70%;padding:4px;text-align:left;">商品名</th><th style="width:15%;padding:4px;text-align:center;">数量</th></tr></thead><tbody><tr><td style="text-align:center;"><div style="width:14px;height:14px;border:1.5px solid #333;margin:0 auto;"></div></td><td style="font-size:10.5pt;padding:4px;">${item}</td><td style="text-align:center;font-weight:bold;font-size:12pt;padding:4px;">1</td></tr></tbody></table></div>`);
            });
            const printWin = window.open('', '_blank');
            printWin.document.write(`<html><head><title>出荷検品シート印刷</title><style>@page { size: 100mm 150mm; margin: 0; body { margin: 0; padding: 0; background: #eee; } .page { margin: 0 auto; margin-bottom: 10px; box-shadow: 0 0 5px rgba(0,0,0,0.2); } @media print { body { background: none; } .page { margin: 0; box-shadow: none; } }</style></head><body>${htmlPages.join('')}<script>window.onload = function() { setTimeout(() => { window.print(); }, 400); };<\/script></body></html>`);
            printWin.document.close();
        }
    </script>
</body>
</html>
