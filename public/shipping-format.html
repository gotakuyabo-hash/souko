<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出荷・送り状 自動整形ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.1.0/encoding.min.js"></script>
    <style>
        body { background: #f4f6f8; font-family: sans-serif; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 800px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div style="max-width: 800px; margin: 0 auto;">
        <a href="index.html" class="text-blue-600 font-bold mb-4 inline-block">← ポータルサイトに戻る</a>
        <div class="card">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                <h2 class="text-lg font-bold text-slate-800">📦 出荷・送り状 自動整形ツール</h2>
                <button onclick="resetData()" class="bg-rose-500 hover:bg-rose-600 text-white text-xs px-3 py-1.5 rounded font-bold transition">🔄 リセット</button>
            </div>
            <p class="text-xs text-slate-500 mb-4">「受注CSV」および「運送会社CSV（ヤマト / 佐川）」をまとめてドラッグ＆ドロップしてください。</p>

            <div id="dropZone" class="border-2 border-dashed border-sky-400 rounded-lg bg-sky-50/50 p-6 text-center cursor-pointer hover:bg-sky-50 transition mb-4" onclick="document.getElementById('fileInput').click()">
                <div class="text-3xl mb-1">📂</div>
                <div class="font-bold text-slate-700 text-sm">ここにCSVファイルをドラッグ＆ドロップ（複数可）</div>
                <p class="text-xs text-slate-500 mt-1">またはクリックしてファイルを選択</p>
                <input type="file" id="fileInput" class="hidden" multiple accept=".csv">
            </div>

            <div id="fileStatus" class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded mb-4 font-mono">読み込まれたファイル: なし</div>

            <div id="status" class="text-sm font-bold text-sky-600 mb-3">ファイルを選択してください</div>

            <div id="sortControlArea" class="hidden bg-slate-50 p-3.5 rounded border border-slate-200 mb-4">
                <div class="text-xs font-bold text-slate-700 mb-2">⚙️ ソート設定（並び替え）</div>
                <div class="flex flex-wrap items-center gap-2">
                    <select id="sortColumnSelect" class="text-xs border border-slate-300 rounded px-2.5 py-1.5 bg-white flex-1 min-w-[180px] cursor-pointer">
                        <option value="">（ソートする列を選択）</option>
                    </select>
                    <select id="sortDirectionSelect" class="text-xs border border-slate-300 rounded px-2.5 py-1.5 bg-white cursor-pointer">
                        <option value="asc">昇順 (古い順 / A→Z)</option>
                        <option value="desc">降順 (新しい順 / Z→A)</option>
                    </select>
                    <button onclick="applyDynamicSort()" class="bg-sky-600 hover:bg-sky-700 text-white text-xs px-3.5 py-1.5 rounded font-bold transition">ソート実行</button>
                    <button onclick="resetSort()" class="bg-slate-300 hover:bg-slate-400 text-slate-700 text-xs px-3 py-1.5 rounded font-bold transition">解除</button>
                </div>
            </div>

            <div class="max-h-48 overflow-y-auto border border-slate-200 rounded mb-4">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-slate-800 text-white sticky top-0">
                        <tr><th class="p-2">ショップ</th><th class="p-2">受注番号</th><th class="p-2">宛名</th><th class="p-2">商品名 / コード</th></tr>
                    </thead>
                    <tbody id="orderTableBody">
                        <tr><td colspan="4" class="text-center text-slate-400 p-4">データがありません</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="flex gap-3 flex-wrap">
                <button id="printBtn" onclick="openPrintPreview()" disabled class="flex-1 bg-sky-600 hover:bg-sky-700 disabled:bg-slate-300 text-white font-bold py-2 px-4 rounded text-xs transition">🖨️ 検品シート印刷</button>
                <button id="yamatoBtn" onclick="exportYamatoCsv()" disabled class="flex-1 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-bold py-2 px-4 rounded text-xs transition">🐱 ヤマトCSV出力</button>
                <button id="ehidenBtn" onclick="exportEhidenCsv()" disabled class="flex-1 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-bold py-2 px-4 rounded text-xs transition">飛 佐川CSV出力</button>
            </div>
        </div>
    </div>

    <script>
        let loadedFiles = {};
        let extractedOrders = [];
        let originalOrderList = [];
        let orderHeaders = [];
        let lastLoadedFilename = "";

        const dropZone = document.getElementById('dropZone');
        ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, (ev) => { ev.preventDefault(); dropZone.classList.add('bg-sky-100'); }));
        ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, (ev) => { ev.preventDefault(); dropZone.classList.remove('bg-sky-100'); }));
        dropZone.addEventListener('drop', (e) => { if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
        document.getElementById('fileInput').addEventListener('change', (e) => { if(e.target.files.length) handleFiles(e.target.files); });

        function resetData() {
            loadedFiles = {};
            extractedOrders = [];
            originalOrderList = [];
            orderHeaders = [];
            lastLoadedFilename = "";
            document.getElementById('fileInput').value = '';
            document.getElementById('fileStatus').textContent = "読み込まれたファイル: なし";
            document.getElementById('status').textContent = "ファイルを選択してください";
            document.getElementById('sortControlArea').classList.add('hidden');
            document.getElementById('orderTableBody').innerHTML = '<tr><td colspan="4" class="text-center text-slate-400 p-4">データがありません</td></tr>';
            document.getElementById('printBtn').disabled = true;
            document.getElementById('yamatoBtn').disabled = true;
            document.getElementById('ehidenBtn').disabled = true;
            alert('リセットしました');
        }

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                lastLoadedFilename = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const buffer = e.target.result;
                    const codes = new Uint8Array(buffer);
                    const encoding = Encoding.detect(codes);
                    const text = Encoding.convert(codes, { to: 'UNICODE', from: encoding, type: 'string' });
                    const rows = parseRobustCSV(text);
                    loadedFiles[file.name] = rows;
                    updateFileStatus();
                    processOrderData();
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function updateFileStatus() {
            const list = Object.keys(loadedFiles);
            document.getElementById('fileStatus').textContent = list.length === 0 ? "読み込まれたファイル: なし" : "📂 読み込み済み: " + list.join(" / ");
        }

        function parseRobustCSV(text) {
            let rows = [], currentRow = [], currentVal = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i], nextC = text[i + 1];
                if (inQuotes) {
                    if (c === '"') {
                        if (nextC === '"') { currentVal += '"'; i++; }
                        else { inQuotes = false; }
                    } else { currentVal += c; }
                } else {
                    if (c === '"') { inQuotes = true; }
                    else if (c === ',') { currentRow.push(currentVal); currentVal = ''; }
                    else if (c === '\r' || c === '\n') {
                        if (c === '\r' && nextC === '\n') { i++; }
                        currentRow.push(currentVal); rows.push(currentRow); currentRow = []; currentVal = '';
                    } else { currentVal += c; }
                }
            }
            if (currentVal !== '' || currentRow.length > 0) { currentRow.push(currentVal); rows.push(currentRow); }
            return rows;
        }

        function cleanOrderNoNormalized(str) {
            if (!str) return "";
            return String(str).replace(/^No:?[\.\s]*/i, "").replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/[\s\-\_\u2010-\u2015\u30fc\uff0d\uff3f]/g, "").trim().toLowerCase();
        }

        function processOrderData() {
            let orderRows = null;
            for (let fname in loadedFiles) {
                if (fname.toLowerCase().includes('order') || fname.toLowerCase().includes('受注')) {
                    orderRows = loadedFiles[fname];
                    break;
                }
            }
            if (!orderRows && Object.keys(loadedFiles).length > 0) {
                orderRows = loadedFiles[Object.keys(loadedFiles)[0]];
            }
            if (!orderRows || orderRows.length === 0) return;

            orderHeaders = orderRows[0];
            populateColumnSelect();

            let ordersMap = {};
            let orderList = [];
            for (let i = 1; i < orderRows.length; i++) {
                let r = orderRows[i];
                if (!r || r.length < 35) continue;
                if (/-0$/.test(String(r[6] || ''))) continue;

                let shopName = String(r[3] || '').trim();
                let orderNo = String(r[5] || '').trim();
                let normOrderNo = cleanOrderNoNormalized(orderNo);
                let itemName = String(r[31] || '').trim();
                let qty = parseInt(r[34], 10) || 1;
                let customerName = String(r[40] || '').trim();

                if (!orderNo || !itemName) continue;
                if (!ordersMap[normOrderNo]) {
                    ordersMap[normOrderNo] = { orderNo, normOrderNo, shopName, customerName, rawRow: r, items: [] };
                    orderList.push(ordersMap[normOrderNo]);
                }
                ordersMap[normOrderNo].items.push({ name: itemName, qty: qty });
            }

            originalOrderList = [...orderList];
            extractedOrders = [...orderList];

            document.getElementById('sortControlArea').classList.remove('hidden');
            renderOrderTable();
        }

        function populateColumnSelect() {
            const select = document.getElementById('sortColumnSelect');
            select.innerHTML = '<option value="">（ソートする列を選択）</option>';

            const targetCols = [
                { index: 30, name: orderHeaders[30] || '商品コード' },
                { index: 27, name: orderHeaders[27] || 'メモ１' }
            ];

            targetCols.forEach(col => {
                let opt = document.createElement('option');
                opt.value = col.index;
                opt.textContent = `${col.name} (列 ${col.index})`;
                select.appendChild(opt);
            });
        }

        function applyDynamicSort() {
            const colIndexVal = document.getElementById('sortColumnSelect').value;
            const direction = document.getElementById('sortDirectionSelect').value;

            if (colIndexVal === "") {
                alert('ソートする列を選択してください。');
                return;
            }

            const colIndex = parseInt(colIndexVal, 10);

            extractedOrders = [...originalOrderList].sort((a, b) => {
                let valA = a.rawRow && a.rawRow[colIndex] !== undefined ? String(a.rawRow[colIndex]).trim() : '';
                let valB = b.rawRow && b.rawRow[colIndex] !== undefined ? String(b.rawRow[colIndex]).trim() : '';

                let cmp = valA.localeCompare(valB, 'ja', { numeric: true, sensitivity: 'base' });
                return direction === 'asc' ? cmp : -cmp;
            });

            renderOrderTable();
        }

        function resetSort() {
            document.getElementById('sortColumnSelect').value = "";
            document.getElementById('sortDirectionSelect').value = "asc";
            extractedOrders = [...originalOrderList];
            renderOrderTable();
        }

        function renderOrderTable() {
            const statusEl = document.getElementById('status');
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '';
            let totalItems = extractedOrders.reduce((sum, o) => sum + o.items.length, 0);

            if (extractedOrders.length > 0) {
                statusEl.textContent = `✅ 抽出成功: ${extractedOrders.length}件の注文（明細 ${totalItems}件）`;
                document.getElementById('printBtn').disabled = false;
                document.getElementById('yamatoBtn').disabled = false;
                document.getElementById('ehidenBtn').disabled = false;

                extractedOrders.forEach(ord => {
                    let tr = document.createElement('tr');
                    tr.className = "border-b border-slate-100 hover:bg-slate-50";
                    let firstItem = ord.items[0] ? ord.items[0].name : '';
                    tr.innerHTML = `<td class="p-2">${ord.shopName}</td><td class="p-2 font-bold">${ord.orderNo}</td><td class="p-2">${ord.customerName}</td><td class="p-2">${firstItem} (${ord.items.length}点)</td>`;
                    tbody.appendChild(tr);
                });
            } else {
                statusEl.textContent = `⚠ 注文データが見つかりませんでした。（列構造をご確認ください）`;
            }
        }

        function parseCsvStringToUint8(csvString) {
            const unicodeList = Encoding.stringToCode(csvString);
            const sjisCodeList = Encoding.convert(unicodeList, { to: 'SJIS', from: 'UNICODE', type: 'array' });
            return new Uint8Array(sjisCodeList);
        }

        function exportCsvGeneric(dataOrUint8, filename) {
            let uint8Array = dataOrUint8;
            if (Array.isArray(dataOrUint8)) {
                let csvString = dataOrUint8.map(r => r.map(v => `"${String(v !== undefined && v !== null ? v : '').replace(/"/g, '""')}"`).join(",")).join("\r\n");
                uint8Array = parseCsvStringToUint8(csvString);
            }
            const blob = new Blob([uint8Array], { type: 'text/csv;charset=shift_jis;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function getTodayString() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}/${m}/${day}`;
        }

        function exportYamatoCsv() {
            let targetRows = null;
            for (let fname in loadedFiles) {
                if (fname.toLowerCase().includes('yamato') || fname.toLowerCase().includes('b2') || fname.toLowerCase().includes('ヤマト')) {
                    targetRows = loadedFiles[fname];
                    break;
                }
            }
            if (!targetRows) {
                for (let fname in loadedFiles) {
                    if (fname !== lastLoadedFilename && !fname.toLowerCase().includes('order') && !fname.toLowerCase().includes('受注')) {
                        targetRows = loadedFiles[fname];
                        break;
                    }
                }
            }
            if (!targetRows && Object.keys(loadedFiles).length > 0) {
                targetRows = loadedFiles[lastLoadedFilename];
            }
            if (!targetRows) { alert('加工対象のヤマトCSVファイルが見つかりません。'); return; }

            let processedRows = [];
            let rowMap = new Map();

            targetRows.forEach(row => {
                for (let cell of row) {
                    let norm = cleanOrderNoNormalized(cell);
                    if (norm && extractedOrders.some(o => o.normOrderNo === norm)) {
                        rowMap.set(norm, [...row]);
                        break;
                    }
                }
            });

            const todayStr = getTodayString();

            extractedOrders.forEach(ord => {
                let r = rowMap.get(ord.normOrderNo);
                if (r) {
                    while (r.length < 42) {
                        r.push("");
                    }

                    r[4] = todayStr;
                    r[39] = '09050540672';
                    r[26] = "";

                    let nameVal = String(r[27] || '');
                    if (nameVal.length > 25) {
                        r[27] = nameVal.substring(0, 25);
                    }

                    let addr1 = String(r[11] || '');
                    if (addr1.length >= 36) {
                        let part1 = addr1.substring(0, 35);
                        let part2 = addr1.substring(35);
                        r[11] = part1;
                        r[12] = part2 + (r[12] && r[12].trim() !== "" ? " " + r[12] : "");
                    }

                    processedRows.push(r);
                }
            });

            exportCsvGeneric(processedRows.length > 0 ? processedRows : targetRows, "yamato_processed_sorted.csv");
        }

        function exportEhidenCsv() {
            let targetRows = null;
            for (let fname in loadedFiles) {
                if (fname.toLowerCase().includes('ehiden') || fname.toLowerCase().includes('sagawa') || fname.toLowerCase().includes('佐川')) {
                    targetRows = loadedFiles[fname];
                    break;
                }
            }
            if (!targetRows) {
                for (let fname in loadedFiles) {
                    if (fname !== lastLoadedFilename && !fname.toLowerCase().includes('order') && !fname.toLowerCase().includes('受注')) {
                        targetRows = loadedFiles[fname];
                        break;
                    }
                }
            }
            if (!targetRows && Object.keys(loadedFiles).length > 0) {
                targetRows = loadedFiles[lastLoadedFilename];
            }
            if (!targetRows) { alert('加工対象の佐川CSVファイルが見つかりません。'); return; }

            let header = targetRows[0];
            let dataRows = targetRows.slice(1);
            let rowMap = new Map();

            dataRows.forEach(row => {
                for (let cell of row) {
                    let norm = cleanOrderNoNormalized(cell);
                    if (norm && extractedOrders.some(o => o.normOrderNo === norm)) {
                        rowMap.set(norm, [...row]);
                        break;
                    }
                }
            });

            let sortedDataRows = [];
            extractedOrders.forEach(ord => {
                if (rowMap.has(ord.normOrderNo)) {
                    let r = rowMap.get(ord.normOrderNo);

                    if (r.length > 24 && r[24]) {
                        let p1 = String(r[24]);
                        if (p1.length > 16) {
                            r[24] = p1.substring(0, 16);
                        }
                    }

                    sortedDataRows.push(r);
                }
            });

            exportCsvGeneric([header, ...sortedDataRows], "ehiden_processed_sorted.csv");
        }

        function openPrintPreview() {
            if (extractedOrders.length === 0) {
                alert('印刷する注文データがありません。');
                return;
            }
            const todayStr = new Date().toLocaleDateString();
            let htmlPages = [];
            extractedOrders.forEach(order => {
                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `<tr><td style="text-align:center;"><div style="width:14px;height:14px;border:1.5px solid #333;margin:0 auto;"></div></td><td style="font-size:10.5pt;padding:4px;">${item.name}</td><td style="text-align:center;font-weight:bold;font-size:12pt;padding:4px;">${item.qty}</td></tr>`;
                });
                htmlPages.push(`<div class="page" style="width:94mm;height:144mm;padding:3mm;box-sizing:border-box;page-break-after:always;font-family:sans-serif;background:#fff;overflow:hidden;"><div style="font-size:14pt;font-weight:bold;border-bottom:2px solid #333;padding-bottom:2px;margin-bottom:6px;">出荷検品シート</div><table style="width:100%;margin-bottom:6px;"><tr><td style="font-size:12pt;font-weight:bold;border-bottom:2px solid #333;padding-bottom:2px;">${order.customerName || '（宛名なし）'} 様</td><td style="text-align:right;font-weight:bold;font-size:11pt;color:#c0392b;">${order.shopName || ''}</td></tr></table><table style="width:100%;border-collapse:collapse;margin-bottom:6px;background:#f8f9fa;border:1px solid #ccc;"><tr><td style="padding:3px 5px;font-size:9.5pt;"><b>受注番号:</b> ${order.orderNo}</td><td style="padding:3px 5px;font-size:9.5pt;text-align:right;"><b>発行日:</b> ${todayStr}</td></tr></table><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:#2c3e50;color:#fff;font-size:9.5pt;"><th style="width:15%;padding:4px;text-align:center;">確認</th><th style="width:70%;padding:4px;text-align:left;">商品名</th><th style="width:15%;padding:4px;text-align:center;">数量</th></tr></thead><tbody>${itemsHtml}</tbody></table></div>`);
            });
            const printWin = window.open('', '_blank');
            printWin.document.write(`<html><head><title>出荷検品シート印刷</title><style>@page { size: 100mm 150mm; margin: 0; } body { margin: 0; padding: 0; background: #eee; } .page { margin: 0 auto; margin-bottom: 10px; box-shadow: 0 0 5px rgba(0,0,0,0.2); } @media print { body { background: none; } .page { margin: 0; box-shadow: none; } }</style></head><body>${htmlPages.join('')}<script>window.onload = function() { setTimeout(() => { window.print(); }, 400); };<\/script></body></html>`);
            printWin.document.close();
        }
    </script>
</body>
</html>
