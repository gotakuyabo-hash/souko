<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>返送タスク</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#1C2430; --muted:#5B6675; --line:#D5DBE2;
  --accent:#1F5FBF; --accent-ink:#FFFFFF; --done:#2E7D4F; --warn:#B4531B; --soft:#F6F8FA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12161C; --surface:#1B2129; --ink:#E7ECF2; --muted:#9AA6B5; --line:#2D3642;
    --accent:#6FA3F0; --accent-ink:#0E1620; --done:#5CC08A; --warn:#E39561; --soft:#222A34;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  font-size:16px; line-height:1.6;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ログイン */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.login h1{font-size:22px;margin:0 0 4px}
.login p{margin:0 0 20px;color:var(--muted);font-size:14px}
.login input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:17px}
.login button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.login .err{color:var(--warn);font-size:14px;margin-top:10px;min-height:1.4em}

/* ヘッダー */
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{font-size:19px;margin:0;white-space:nowrap}
.count{font-size:14px;color:var(--muted)}
.bar .grow{flex:1}
.search{display:flex;gap:6px}
.search input{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.btn{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.updated{width:100%;font-size:12px;color:var(--muted)}

main{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
.notice{padding:14px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.notice.err{border-color:var(--warn);color:var(--warn)}
.list{display:grid;gap:14px}
@media (min-width:900px){.list{grid-template-columns:1fr 1fr}}

/* タスクカード */
.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.task.is-done{opacity:.55}
.task-head{display:flex;align-items:baseline;gap:8px;padding:12px 16px 0;color:var(--muted);font-size:13px;flex-wrap:wrap}
.task-head .due.over{color:var(--warn);font-weight:700}
.kind{font-size:15px;font-weight:700;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.kind.haiki{background:#F9D9D6;border-color:#E3A29B;color:#7A1D14}
.kind.dhl{background:#FFE27A;border-color:#E8C33A;color:#5A3E00}
.kind.ems{background:#D7E6FF;border-color:#A8C4F2;color:#123B7A}
.kind.zaiko{background:#D9F0E2;border-color:#9FD3B4;color:#1C5A37}
.who{font-weight:700;color:var(--warn)}
.files{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.files button{padding:9px 12px;border:1px solid var(--accent);border-radius:9px;background:var(--surface);color:var(--accent);font-weight:700;font-size:14px}

.item{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:14px 16px;border-bottom:1px dashed var(--line)}
.item:last-of-type{border-bottom:0}
.photo{width:112px;height:112px;border-radius:10px;background:var(--soft);border:1px solid var(--line);padding:0;overflow:hidden;display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:contain;background:#fff}
.photo span{font-size:12px;color:var(--muted);padding:6px;text-align:center}
.no-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.no{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:.01em}
.no small{font-size:14px;font-weight:700;color:var(--muted);margin-right:2px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.chip.dhl{background:#FFE27A;border-color:#E8C33A;color:#5A3E00}
.chip.ems{background:#D7E6FF;border-color:#A8C4F2;color:#123B7A}
.chip.ok{background:#FBE3D3;border-color:#EDB892;color:#7A3410}
.chip.arrived{background:#D9F0E2;border-color:#9FD3B4;color:#1C5A37}
.title{margin:6px 0 4px;font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.meta b{color:var(--ink)}
.label{margin-top:8px;font-size:14px}
.label a{color:var(--accent);font-weight:700}
.missing{grid-column:1/-1;color:var(--warn);font-size:14px}
.receipt{grid-column:1/-1}
.receipt-label{font-size:13px;color:var(--muted);margin-bottom:6px}
.receipt-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.receipt-grid .kind{font-size:14px;font-weight:700;padding-right:4px}
.rc{padding:10px 6px;border:1px solid var(--line);border-radius:9px;background:var(--soft);font-size:14px;font-weight:700}
.rc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rc:disabled{opacity:.6;cursor:wait}

.body{margin:0 16px;padding:10px 12px;background:var(--soft);border-radius:10px;font-size:14px;white-space:pre-wrap;word-break:break-word;max-height:8.5em;overflow:auto}
.body-wrap{padding-bottom:4px}
.link-no{display:flex;gap:6px;margin:10px 16px 0}
.link-no input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}

.actions{padding:14px 16px 16px;margin-top:auto}
.done-btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--done);color:#fff;font-weight:700;font-size:18px}
.done-btn.confirm{background:var(--warn)}
.done-btn:disabled{opacity:.6;cursor:wait}
.done-msg{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--done)}
.done-msg button{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;padding:6px}

details.others{margin-top:22px}
details.others summary{cursor:pointer;color:var(--muted);font-weight:700;padding:6px 0}

/* 画像拡大 */
.zoom{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:20px}
.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:10px}

/* No.検索結果 */
.lookup{margin-bottom:14px}
.lookup .task{border-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:92vw;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.task{transition:opacity .3s}}

/* 検索 */
.finder{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:16px}
.finder label{display:block;font-weight:700;margin-bottom:8px}
.finder-row{display:flex;gap:8px}
.finder input{flex:1;min-width:0;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--soft);font-size:28px;font-weight:700;letter-spacing:.04em}
.finder input:focus{border-color:var(--accent);outline:none}
.finder button{padding:0 22px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-size:13px;color:var(--muted);align-items:center}
.recent button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--soft);font-weight:700;font-size:14px}
.section-title{font-size:14px;font-weight:700;color:var(--muted);padding:12px 16px 0;margin:0}
.tasks-box{border-top:1px solid var(--line);margin-top:4px}
.one-task{padding:4px 0 0}
.one-task + .one-task{border-top:1px dashed var(--line)}
.empty-note{margin:8px 16px 16px;font-size:14px;color:var(--muted)}

/* タブ */
.tabs{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:4px}
.tab{flex:1;padding:12px 8px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;font-size:16px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.finder input.text{font-size:20px;letter-spacing:0}
.hit-note{font-size:14px;color:var(--muted);margin:0 0 10px}
.cust{font-size:18px;font-weight:700;margin-top:2px}
.badge-task{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--warn);color:#fff}
.no-task{font-size:13px;color:var(--muted);padding:0 16px 14px;margin:0}
</style>
</head>
<body>

<section class="login" id="loginView" hidden>
  <form id="loginForm">
    <h1>返送タスク</h1>
    <p>合言葉を入れてください</p>
    <input type="password" id="pass" autocomplete="current-password" required>
    <button type="submit">はじめる</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div id="appView" hidden>
  <header>
    <div class="bar">
      <h1>返送タスク</h1>
      <span class="grow"></span>
      <button class="btn" id="logoutBtn">ログアウト</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabRecv" aria-selected="true">荷物を受領する</button>
      <button class="tab" role="tab" id="tabDone" aria-selected="false">タスクを完了する</button>
    </div>
  </header>

  <main>
    <!-- 受領 -->
    <section id="recvView">
      <form class="finder" id="recvForm">
        <label for="recvQ">名前・品名・注文番号</label>
        <div class="finder-row">
          <input id="recvQ" class="text" autocomplete="off" placeholder="例：山崎宏一">
          <button type="submit" id="recvBtn">検索</button>
        </div>
      </form>
      <div id="recvResult"></div>
    </section>

    <!-- タスク完了 -->
    <section id="doneView" hidden>
      <div class="finder">
        <label for="doneQ">受領済みの荷物から探す</label>
        <div class="finder-row">
          <input id="doneQ" class="text" autocomplete="off" placeholder="返送No.・名前・品名で絞り込み">
          <button type="button" id="doneReload">更新</button>
        </div>
      </div>
      <div id="doneResult"></div>
    </section>
  </main>
</div>

<div class="zoom" id="zoom" hidden><img alt="商品画像（拡大）" id="zoomImg"></div>

<script>
// Functionsを直接呼ぶ（firebase.jsonのrewrites設定は不要）
const API = "https://asia-northeast1-souko-2de57.cloudfunctions.net/henso";
let token = "";
try { token = localStorage.getItem("henso_token") || ""; } catch (e) {}

let recv = null;            // 受領タブの検索結果 { matchedBy, items }
let received = null;        // タスク完了タブの受領済み一覧
const doneSet = new Set();  // このページで完了にしたタスク

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = (s) => String(s || "").normalize("NFKC").toLowerCase().replace(/[\s\-‐－]/g, "");

function toast(msg, actionLabel, onAction) {
  document.querySelectorAll(".toast").forEach((x) => x.remove());
  const t = document.createElement("div");
  t.className = "toast";
  const span = document.createElement("span");
  span.textContent = msg;
  t.appendChild(span);
  if (actionLabel) {
    const b = document.createElement("button");
    b.textContent = actionLabel;
    b.onclick = () => { t.remove(); onAction(); };
    t.appendChild(b);
  }
  document.body.appendChild(t);
  setTimeout(() => t.remove(), actionLabel ? 6000 : 2600);
}

async function api(path, opt = {}) {
  const res = await fetch(API + path, {
    ...opt,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/login") { logout(); throw new Error("ログインが切れました。合言葉を入れ直してください。"); }
  if (!res.ok) {
    if (res.status === 404 && !data.error) throw new Error("サーバー（henso）が見つかりません。Functionsのデプロイが終わっているか確認してください（404）");
    throw new Error(data.error || "エラー（" + res.status + "）");
  }
  return data;
}

function showLogin() { $("loginView").hidden = false; $("appView").hidden = true; $("pass").focus(); }
function showApp() { $("loginView").hidden = true; $("appView").hidden = false; switchTab("recv"); }
function logout() { token = ""; try { localStorage.removeItem("henso_token"); } catch (e) {} showLogin(); }
$("logoutBtn").addEventListener("click", logout);

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginErr").textContent = "";
  try {
    const d = await api("/login", { method: "POST", body: JSON.stringify({ pass: $("pass").value }) });
    token = d.token;
    try { localStorage.setItem("henso_token", token); } catch (e) {}
    $("pass").value = "";
    showApp();
  } catch (err) { $("loginErr").textContent = err.message; }
});

/* ---------- タブ ---------- */
function switchTab(name) {
  const isRecv = name === "recv";
  $("tabRecv").setAttribute("aria-selected", isRecv);
  $("tabDone").setAttribute("aria-selected", !isRecv);
  $("recvView").hidden = !isRecv;
  $("doneView").hidden = isRecv;
  if (isRecv) $("recvQ").focus();
  else loadReceived();
}
$("tabRecv").addEventListener("click", () => switchTab("recv"));
$("tabDone").addEventListener("click", () => switchTab("done"));

/* ---------- 共通の表示部品 ---------- */
function chipClass(s) {
  if (/DHL/i.test(s)) return "dhl";
  if (/EMS/i.test(s)) return "ems";
  if (/承認/.test(s)) return "ok";
  if (/到着/.test(s)) return "arrived";
  return "";
}

function photoHtml(it) {
  return it.image
    ? `<button class="photo" data-zoom="${esc(it.image)}" aria-label="画像を拡大"><img src="${esc(it.image)}" alt="" loading="lazy"></button>`
    : `<div class="photo"><span>画像なし</span></div>`;
}

function infoHtml(it) {
  return `<div>
    <div class="no-line">
      <span class="no"><small>返送No.</small>${esc(it.no)}</span>
      ${it.status ? `<span class="chip ${chipClass(it.status)}">${esc(it.status)}</span>` : ""}
    </div>
    ${it.name ? `<div class="cust">${esc(it.name)}</div>` : ""}
    <p class="title">${esc(it.title || "（商品名なし）")}</p>
    <div class="meta">
      <span>数量 <b>${esc(it.qty || "-")}</b></span>
      <span>${esc(it.store)}</span>
      <span>配送No.${esc(it.haisoNo || "-")}</span>
      ${it.orderNo ? `<span>${esc(it.orderNo)}</span>` : ""}
    </div>
  </div>`;
}

/* ---------- 受領タブ ---------- */
const RECEIPT = [
  { kind: "元払", values: ["到着済（元払／未開封）", "到着済（元払／開封済）"] },
  { kind: "着払", values: ["到着済（着払／未開封）", "到着済（着払／開封済）"] },
];
function receiptHtml(it) {
  const rows = RECEIPT.map((g) => `<span class="kind">${g.kind}</span>` +
    g.values.map((v) => `<button class="rc" data-receipt="${esc(v)}" data-row="${it.rowNumber}" data-no="${esc(it.no)}"
      aria-pressed="${it.status === v}">${/未開封/.test(v) ? "未開封" : "開封済"}</button>`).join("")).join("");
  return `<div class="receipt"><div class="receipt-label">受け取った荷物の状態を選んでください</div><div class="receipt-grid">${rows}</div></div>`;
}

const FIELD_LABEL = { name: "名前", title: "品名", orderNo: "注文番号" };

async function searchRecv() {
  const q = $("recvQ").value.trim();
  if (!q) { $("recvQ").focus(); return; }
  $("recvBtn").disabled = true; $("recvBtn").textContent = "検索中…";
  $("recvResult").innerHTML = "";
  try {
    recv = await api("/search?fresh=1&q=" + encodeURIComponent(q));
    renderRecv();
  } catch (err) {
    $("recvResult").innerHTML = `<div class="notice err">${esc(err.message)}</div>`;
  } finally {
    $("recvBtn").disabled = false; $("recvBtn").textContent = "検索";
  }
}
$("recvForm").addEventListener("submit", (e) => { e.preventDefault(); searchRecv(); });

function renderRecv() {
  if (!recv) { $("recvResult").innerHTML = ""; return; }
  if (!recv.items.length) {
    $("recvResult").innerHTML = `<div class="notice">名前・品名・注文番号のどれでも見つかりませんでした。字を短くして（名字だけ、品名の一部など）もう一度お試しください。</div>`;
    return;
  }
  const note = recv.matchedBy === "name"
    ? `名前で ${recv.items.length} 件見つかりました`
    : `名前では見つからなかったため、${FIELD_LABEL[recv.matchedBy]}で ${recv.items.length} 件見つかりました`;
  $("recvResult").innerHTML = `<p class="hit-note">${note}</p><div class="list">${
    recv.items.map((it) => `<article class="task"><div class="item">${photoHtml(it)}${infoHtml(it)}${receiptHtml(it)}</div></article>`).join("")
  }</div>`;
}

async function sendReceipt(no, rowNumber, value, undo) {
  const d = await api("/receipt", { method: "POST", body: JSON.stringify({ no, rowNumber, value, undo: !!undo }) });
  if (recv) recv.items.filter((it) => it.rowNumber === rowNumber).forEach((it) => (it.status = value));
  received = null; // 受領済み一覧は次に開いたとき読み直す
  renderRecv();
  return d.prev;
}

/* ---------- タスク完了タブ ---------- */
async function loadReceived(force) {
  if (received && !force) { renderDone(); return; }
  $("doneReload").disabled = true; $("doneReload").textContent = "読込中…";
  $("doneResult").innerHTML = `<div class="notice">受領済みの荷物を読み込んでいます…</div>`;
  try {
    const d = await api("/received?fresh=1");
    received = d.items;
    renderDone();
  } catch (err) {
    $("doneResult").innerHTML = `<div class="notice err">${esc(err.message)}</div>`;
  } finally {
    $("doneReload").disabled = false; $("doneReload").textContent = "更新";
  }
}
$("doneReload").addEventListener("click", () => loadReceived(true));
$("doneQ").addEventListener("input", renderDone);

function filesHtml(it) {
  if (!it.files || !it.files.length) return "";
  return `<div class="files">${it.files.map((f) =>
    `<button data-file="${f.fileId}" data-room="${it.roomId}">${/\.pdf$/i.test(f.filename) ? "EMS書類" : "DHLラベル"}を開く</button>`).join("")}</div>`;
}
function amazonLabelHtml(it) {
  if (!it.label) return "";
  return /^https?:\/\//.test(it.label)
    ? `<div class="label" style="grid-column:1/-1"><a href="${esc(it.label)}" target="_blank" rel="noopener">DHLラベル（Amazon）を開く</a></div>`
    : `<div class="label" style="grid-column:1/-1">${esc(it.label)}</div>`;
}

function dueHtml(t) {
  if (!t.limitTime) return "";
  const d = new Date(t.limitTime * 1000);
  const over = d.getTime() < Date.now() - 24 * 3600 * 1000;
  return `<span class="due ${over ? "over" : ""}">期限 ${d.getMonth() + 1}/${d.getDate()}</span>`;
}

function taskHtml(t) {
  const done = doneSet.has(t.taskId);
  return `<div class="one-task ${done ? "is-done" : ""}">
    <div class="task-head">
      ${t.kind && t.kind.label ? `<span class="kind ${t.kind.key}">${esc(t.kind.label)}</span>` : ""}
      ${t.assignedBy ? `<span>依頼：${esc(t.assignedBy)}</span>` : ""}
      ${dueHtml(t)}
    </div>
    <div class="body-wrap" style="padding-top:10px"><div class="body">${esc(t.body)}</div></div>
    <div class="actions">
      ${done
        ? `<div class="done-msg"><span>完了しました</span><button data-undo="${t.taskId}" data-room="${t.roomId}">元に戻す</button></div>`
        : `<button class="done-btn" data-done="${t.taskId}" data-room="${t.roomId}">タスクを完了にする</button>`}
    </div>
  </div>`;
}

function renderDone() {
  if (!received) return;
  const q = norm($("doneQ").value);
  const list = q
    ? received.filter((it) => [it.no, it.name, it.title, it.orderNo].some((v) => norm(v).includes(q)))
    : received;
  if (!received.length) {
    $("doneResult").innerHTML = `<div class="notice">受領済み（ステータスが「到着済」）の荷物はありません。</div>`;
    return;
  }
  if (!list.length) {
    $("doneResult").innerHTML = `<div class="notice">受領済みの荷物の中に見つかりませんでした。</div>`;
    return;
  }
  const withTask = received.filter((it) => it.tasks.length).length;
  $("doneResult").innerHTML = `<p class="hit-note">受領済み ${received.length} 件（うちタスクあり ${withTask} 件）</p><div class="list">${
    list.map((it) => `<article class="task">
      <div class="item">${photoHtml(it)}${infoHtml(it)}${filesHtml(it)}${amazonLabelHtml(it)}</div>
      <div class="tasks-box">
        <p class="section-title">Chatworkのタスク ${it.tasks.length ? `<span class="badge-task">${it.tasks.length}件</span>` : ""}</p>
        ${it.tasks.length ? it.tasks.map(taskHtml).join("") : `<p class="no-task" style="padding-top:8px">まだタスクは来ていません</p>`}
      </div>
    </article>`).join("")
  }</div>`;
}

async function setStatus(roomId, taskId, status) {
  await api("/status", { method: "POST", body: JSON.stringify({ roomId, taskId, status }) });
  if (status === "done") doneSet.add(taskId); else doneSet.delete(taskId);
  renderDone();
  toast(status === "done" ? "Chatworkのタスクを完了にしました" : "タスクを未完了に戻しました");
}

/* ---------- クリック ---------- */
const confirmTimers = {};
document.addEventListener("click", async (e) => {
  const zoomBtn = e.target.closest("[data-zoom]");
  if (zoomBtn) { $("zoomImg").src = zoomBtn.dataset.zoom; $("zoom").hidden = false; return; }
  if (e.target.closest("#zoom")) { $("zoom").hidden = true; return; }

  const fileBtn = e.target.closest("[data-file]");
  if (fileBtn) {
    // スマホでポップアップが止められないよう、先に新しいタブを開いておく
    const w = window.open("", "_blank");
    fileBtn.disabled = true;
    try {
      const d = await api(`/file?roomId=${fileBtn.dataset.room}&fileId=${fileBtn.dataset.file}`);
      if (w) w.location.href = d.url; else location.href = d.url;
    } catch (err) { if (w) w.close(); toast(err.message); }
    finally { fileBtn.disabled = false; }
    return;
  }

  const rc = e.target.closest("[data-receipt]");
  if (rc) {
    if (rc.getAttribute("aria-pressed") === "true") return;
    const value = rc.dataset.receipt, row = Number(rc.dataset.row), no = rc.dataset.no;
    rc.closest(".receipt-grid").querySelectorAll(".rc").forEach((b) => (b.disabled = true));
    try {
      const prev = await sendReceipt(no, row, value);
      toast(`返送No.${no}：${value}`, "元に戻す", async () => {
        try { await sendReceipt(no, row, prev, true); toast("元のステータスに戻しました"); }
        catch (err) { toast(err.message); }
      });
    } catch (err) {
      toast(err.message);
      rc.closest(".receipt-grid").querySelectorAll(".rc").forEach((b) => (b.disabled = false));
    }
    return;
  }

  const doneBtn = e.target.closest("[data-done]");
  if (doneBtn) {
    const id = Number(doneBtn.dataset.done);
    // 誤タップ防止：2回押しで完了
    if (!doneBtn.classList.contains("confirm")) {
      doneBtn.classList.add("confirm");
      doneBtn.textContent = "もう一度押すと完了";
      clearTimeout(confirmTimers[id]);
      confirmTimers[id] = setTimeout(() => {
        doneBtn.classList.remove("confirm");
        doneBtn.textContent = "タスクを完了にする";
      }, 3000);
      return;
    }
    clearTimeout(confirmTimers[id]);
    doneBtn.disabled = true; doneBtn.textContent = "送信中…";
    try { await setStatus(doneBtn.dataset.room, id, "done"); }
    catch (err) { toast(err.message); doneBtn.disabled = false; doneBtn.classList.remove("confirm"); doneBtn.textContent = "タスクを完了にする"; }
    return;
  }

  const undoBtn = e.target.closest("[data-undo]");
  if (undoBtn) {
    undoBtn.disabled = true;
    try { await setStatus(undoBtn.dataset.room, Number(undoBtn.dataset.undo), "open"); }
    catch (err) { toast(err.message); undoBtn.disabled = false; }
  }
});

/* 起動 */
if (token) { showApp(); } else { showLogin(); }
