<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBA作業カード進捗管理ボード</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dragging {
            opacity: 0.4;
        }
        .drag-over {
            background-color: #f1f5f9 !important;
            border-color: #3b82f6 !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- ヘッダー & 案件（プラン）切り替え -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    <span>📦</span> FBA作業・件数管理ボード
                </h1>
                <p class="text-sm text-slate-600 mt-1">商品名と件数を入れると「ピック」「梱包」のカードが自動生成されます</p>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="flex-1 md:w-64">
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">現在の対象案件（プラン）</label>
                    <select id="planSelector" onchange="changePlan(this.value)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">案件を選択してください...</option>
                    </select>
                </div>
                <button onclick="openPlanModal()" class="mt-5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-lg transition shadow-sm whitespace-nowrap">
                    + 案件を追加
                </button>
            </div>
        </header>

        <!-- 作業カード追加バー（案件選択時のみ有効） -->
        <div id="taskInputContainer" class="bg-blue-50/70 border border-blue-200 p-5 rounded-2xl mb-8 hidden shadow-sm">
            <h2 class="text-xs font-bold text-blue-900 uppercase tracking-wider mb-3">商品を登録して作業カードを自動生成</h2>
            <form onsubmit="handleAddTask(event)" class="grid grid-cols-1 md:grid-cols-12 gap-3">
                <div class="md:col-span-7">
                    <label class="block text-[10px] font-bold text-blue-800 uppercase tracking-wider mb-1">商品名</label>
                    <input type="text" id="taskProductName" required placeholder="例: ステンレスマグボトル 500ml" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm font-medium bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="md:col-span-4">
                    <label class="block text-[10px] font-bold text-blue-800 uppercase tracking-wider mb-1">件数・数量</label>
                    <input type="text" id="taskQuantity" required placeholder="例: 120個 (3箱)" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm font-medium bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="md:col-span-1 flex items-end">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-sm">自動生成</button>
                </div>
            </form>
        </div>

        <!-- カンバンボード（4カラム） -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-start">
            
            <!-- カラム 1: 未着手 -->
            <div class="bg-slate-200/70 rounded-2xl p-4 border border-slate-300 transition" 
                 ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropTask(event, 'todo')">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-300">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 pointer-events-none">
                        <span class="w-3 h-3 rounded-full bg-amber-500"></span> 1. 未着手 (To Do)
                    </h3>
                    <span id="count-todo" class="text-xs bg-slate-300 text-slate-800 px-2 py-0.5 rounded-full font-bold">0</span>
                </div>
                <div id="col-todo" class="space-y-3 min-h-[350px]"></div>
            </div>

            <!-- カラム 2: 進行中 -->
            <div class="bg-slate-200/70 rounded-2xl p-4 border border-slate-300 transition" 
                 ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropTask(event, 'in_progress')">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-300">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 pointer-events-none">
                        <span class="w-3 h-3 rounded-full bg-blue-500"></span> 2. 進行中 (Doing)
                    </h3>
                    <span id="count-in_progress" class="text-xs bg-slate-300 text-slate-800 px-2 py-0.5 rounded-full font-bold">0</span>
                </div>
                <div id="col-in_progress" class="space-y-3 min-h-[350px]"></div>
            </div>

            <!-- カラム 3: 出荷・配送中 -->
            <div class="bg-slate-200/70 rounded-2xl p-4 border border-slate-300 transition" 
                 ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropTask(event, 'shipping')">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-300">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 pointer-events-none">
                        <span class="w-3 h-3 rounded-full bg-purple-500"></span> 3. 出荷・配送中
                    </h3>
                    <span id="count-shipping" class="text-xs bg-slate-300 text-slate-800 px-2 py-0.5 rounded-full font-bold">0</span>
                </div>
                <div id="col-shipping" class="space-y-3 min-h-[350px]"></div>
            </div>

            <!-- カラム 4: 完了 -->
            <div class="bg-slate-200/70 rounded-2xl p-4 border border-slate-300 transition" 
                 ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropTask(event, 'done')">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-300">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 pointer-events-none">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span> 4. 完了 (Done)
                    </h3>
                    <span id="count-done" class="text-xs bg-slate-300 text-slate-800 px-2 py-0.5 rounded-full font-bold">0</span>
                </div>
                <div id="col-done" class="space-y-3 min-h-[350px]"></div>
            </div>

        </div>
    </div>

    <!-- 新規案件作成モーダル -->
    <div id="planModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200">
            <h3 class="text-lg font-bold text-slate-900 mb-4">新規FBA案件（プラン）の追加</h3>
            <form onsubmit="handleCreatePlan(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">案件名・納品プラン名</label>
                    <input type="text" id="planTitle" required placeholder="例: 10月下旬 FBA通常納品 第1便" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closePlanModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">キャンセル</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium bg-slate-900 hover:bg-slate-800 text-white rounded-lg transition shadow-sm">作成する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK & アプリケーションロジック -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
            authDomain: "souko-2de57.firebaseapp.com",
            projectId: "souko-2de57",
            storageBucket: "souko-2de57.firebasestorage.app",
            messagingSenderId: "642116656086",
            appId: "1:642116656086:web:139cc5558a4ef6ebda6277",
            measurementId: "G-8WG8GWQGCR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentPlanId = null;
        let unsubscribeTasks = null;

        const statuses = ['todo', 'in_progress', 'shipping', 'done'];

        async function loadPlans() {
            const planSelector = document.getElementById('planSelector');
            const snapshot = await getDocs(collection(db, "fba_plans"));
            
            planSelector.innerHTML = '<option value="">案件を選択してください...</option>';
            
            let firstId = null;
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                if (!firstId) firstId = id;

                const option = document.createElement('option');
                option.value = id;
                option.textContent = data.title;
                planSelector.appendChild(option);
            });

            if (currentPlanId && document.querySelector(`option[value="${currentPlanId}"]`)) {
                planSelector.value = currentPlanId;
                switchPlan(currentPlanId);
            } else if (snapshot.size > 0) {
                planSelector.value = firstId;
                switchPlan(firstId);
            }
        }

        window.changePlan = function(planId) {
            switchPlan(planId);
        }

        function switchPlan(planId) {
            currentPlanId = planId;
            const inputContainer = document.getElementById('taskInputContainer');

            if (!planId) {
                inputContainer.classList.add('hidden');
                clearColumns();
                return;
            }

            inputContainer.classList.remove('hidden');

            if (unsubscribeTasks) unsubscribeTasks();

            const q = query(collection(db, "fba_tasks"), where("planId", "==", planId));
            unsubscribeTasks = onSnapshot(q, (snapshot) => {
                statuses.forEach(status => {
                    document.getElementById(`col-${status}`).innerHTML = '';
                    document.getElementById(`count-${status}`).textContent = '0';
                });

                const counts = { todo: 0, in_progress: 0, shipping: 0, done: 0 };

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const status = data.status || 'todo';
                    counts[status]++;

                    const cardHTML = createTaskCardHTML(id, data);
                    document.getElementById(`col-${status}`).insertAdjacentHTML('beforeend', cardHTML);
                });

                statuses.forEach(status => {
                    document.getElementById(`count-${status}`).textContent = counts[status];
                });
            });
        }

        function clearColumns() {
            statuses.forEach(status => {
                document.getElementById(`col-${status}`).innerHTML = '';
                document.getElementById(`count-${status}`).textContent = '0';
            });
        }

        // 見やすさを高めたカードデザイン（作業名・商品名・件数）
        function createTaskCardHTML(id, data) {
            const isPick = data.taskName === 'ピック';
            const badgeColor = isPick ? 'bg-amber-100 text-amber-900 border-amber-300' : 'bg-indigo-100 text-indigo-900 border-indigo-300';

            return `
                <div draggable="true" 
                     ondragstart="dragStart(event, '${id}')" 
                     class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition cursor-grab active:cursor-grabbing">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-extrabold px-2.5 py-1 rounded-md border ${badgeColor}">${escapeHTML(data.taskName || '作業')}</span>
                        <button onclick="deleteTask('${id}')" class="text-slate-400 hover:text-red-600 text-sm font-bold px-1.5 py-0.5">✕</button>
                    </div>
                    <div class="font-bold text-slate-900 text-sm leading-snug mb-3">${escapeHTML(data.productName || '')}</div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs font-medium text-slate-600">
                        <span>件数:</span>
                        <span class="font-extrabold text-slate-900 bg-slate-100 px-2 py-0.5 rounded">${escapeHTML(data.quantity || '')}</span>
                    </div>
                </div>
            `;
        }

        // --- ドラッグ＆ドロップ処理 ---
        window.dragStart = function(event, id) {
            event.dataTransfer.setData('text/plain', id);
            event.target.classList.add('dragging');
            event.target.addEventListener('dragend', () => {
                event.target.classList.remove('dragging');
            }, { once: true });
        };

        window.allowDrop = function(event) {
            event.preventDefault();
            event.currentTarget.classList.add('drag-over');
        };

        window.removeDropStyle = function(event) {
            event.currentTarget.classList.remove('drag-over');
        };

        window.dropTask = async function(event, newStatus) {
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');

            const id = event.dataTransfer.getData('text/plain');
            if (!id) return;

            try {
                const docRef = doc(db, "fba_tasks", id);
                await updateDoc(docRef, { status: newStatus });
            } catch (e) {
                console.error("Error updating status: ", e);
            }
        };

        // --- 商品名と件数から「ピック」「梱包」のカードを自動で2枚生成 ---
        window.handleAddTask = async function(event) {
            event.preventDefault();
            if (!currentPlanId) {
                alert("先に案件を選択してください。");
                return;
            }

            const productName = document.getElementById('taskProductName').value;
            const quantity = document.getElementById('taskQuantity').value;

            try {
                // 1. ピック用カードを追加
                await addDoc(collection(db, "fba_tasks"), {
                    planId: currentPlanId,
                    productName,
                    taskName: 'ピック',
                    quantity,
                    status: 'todo',
                    createdAt: serverTimestamp()
                });

                // 2. 梱包用カードを追加
                await addDoc(collection(db, "fba_tasks"), {
                    planId: currentPlanId,
                    productName,
                    taskName: '梱包',
                    quantity,
                    status: 'todo',
                    createdAt: serverTimestamp()
                });

                // フォームをリセット
                document.getElementById('taskProductName').value = '';
                document.getElementById('taskQuantity').value = '';
            } catch (e) {
                console.error("Error adding tasks: ", e);
                alert("タスクの自動生成に失敗しました。");
            }
        };

        // --- 作業カードの削除 ---
        window.deleteTask = async function(id) {
            if (confirm("この作業カードを削除してもよろしいですか？")) {
                try {
                    await deleteDoc(doc(db, "fba_tasks", id));
                } catch (e) {
                    console.error("Error deleting task: ", e);
                }
            }
        };

        // --- 新規案件（プラン）の作成 ---
        window.handleCreatePlan = async function(event) {
            event.preventDefault();
            const title = document.getElementById('planTitle').value;

            try {
                const docRef = await addDoc(collection(db, "fba_plans"), {
                    title,
                    createdAt: serverTimestamp()
                });
                closePlanModal();
                document.getElementById('planTitle').value = '';
                await loadPlans();
                document.getElementById('planSelector').value = docRef.id;
                switchPlan(docRef.id);
            } catch (e) {
                console.error("Error creating plan: ", e);
                alert("案件の作成に失敗しました。");
            }
        };

        window.openPlanModal = function() {
            document.getElementById('planModal').classList.remove('hidden');
            document.getElementById('planModal').classList.add('flex');
        }
        window.closePlanModal = function() {
            document.getElementById('planModal').classList.remove('flex');
            document.getElementById('planModal').classList.add('hidden');
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        loadPlans();
    </script>
</body>
</html>
