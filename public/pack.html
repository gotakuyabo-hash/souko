<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>梱包チェック</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{ --ink:#1c2733; --muted:#5d6b77; --line:#d3d9d7; --ok:#1e8e4f; --ng:#c0392b; --warn:#d68910; --accent:#0f5f8a; }
*{ box-sizing:border-box; }
body{ margin:0; font-family:"BIZ UDPGothic","Hiragino Sans",sans-serif; color:var(--ink); background:#eef1f0; -webkit-text-size-adjust:100%; }
header{ position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:10px 14px; }
header .order{ font-size:13px; color:var(--muted); word-break:break-all; }
header .progress{ font-size:22px; font-weight:700; margin-top:2px; }
header .bar{ height:6px; background:#e6eae9; border-radius:3px; margin-top:6px; overflow:hidden; }
header .bar i{ display:block; height:100%; width:0; background:var(--ok); transition:width .2s; }
main{ padding:12px 12px 140px; }
.item{ display:flex; gap:12px; background:#fff; border:2px solid var(--line); border-radius:12px; padding:10px; margin-bottom:10px; align-items:center; }
.item img, .item .noimg{ width:96px; height:96px; object-fit:contain; border-radius:8px; background:#f5f6f6; flex:none; }
.item .noimg{ display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); text-align:center; }
.item .info{ flex:1; min-width:0; }
.item .title{ font-size:15px; font-weight:700; line-height:1.35; word-break:break-all; }
.item .code{ font-size:12px; color:var(--muted); margin-top:3px; word-break:break-all; }
.item .count{ font-size:26px; font-weight:700; margin-top:4px; }
.item .count small{ font-size:14px; color:var(--muted); font-weight:400; }
.item.done{ border-color:var(--ok); background:#eefaf2; }
.item.done .count{ color:var(--ok); }
.item.over{ border-color:var(--ng); background:#fdeeee; }
.item.unknown{ border-style:dashed; border-color:var(--warn); }
.item .manual.sub{ border-color:#9aa5ae; background:#fff; color:#3d4a55; font-size:13px; padding:6px 10px; }
.item .manual.undo{ border-color:#bbb; background:#fff; color:#777; font-size:13px; padding:6px 10px; }
.item .manual{ margin-top:6px; font-size:14px; padding:8px 12px; border-radius:8px; border:1px solid var(--warn); background:#fff8e8; color:#7a4d00; }
.allok{ display:none; text-align:center; background:var(--ok); color:#fff; border-radius:12px; padding:18px; font-size:26px; font-weight:700; margin-bottom:12px; }
.allok.show{ display:block; }
.foot{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); z-index:6; }
.foot .row{ display:flex; gap:8px; }
.btn{ flex:1; font-size:17px; font-weight:700; padding:14px; border-radius:10px; border:none; background:var(--accent); color:#fff; }
.btn.ghost{ background:#fff; color:var(--accent); border:2px solid var(--accent); flex:none; }
#manualInput{ width:100%; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:8px; margin-top:8px; }
#readerWrap{ display:none; position:fixed; left:0; right:0; bottom:0; top:0; background:rgba(0,0,0,.85); z-index:10; padding:12px; }
#readerWrap.on{ display:block; }
#reader{ width:100%; max-width:520px; margin:40px auto 0; background:#000; border-radius:10px; overflow:hidden; }
#readerWrap .close{ display:block; margin:14px auto 0; max-width:520px; width:100%; }
#readerMsg{ color:#fff; text-align:center; margin-top:10px; font-size:15px; min-height:22px; }
#flash{ position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; flex-direction:column; color:#fff; font-weight:700; text-align:center; padding:20px; }
#flash.on{ display:flex; }
#flash.ok{ background:rgba(30,142,79,.92); }
#flash.ng{ background:rgba(192,57,43,.95); }
#flash .big{ font-size:44px; white-space:pre-line; line-height:1.25; }
#flash .small{ font-size:17px; margin-top:10px; word-break:break-all; white-space:pre-line; }
.err{ background:#fdeeee; border:1px solid var(--ng); color:var(--ng); padding:14px; border-radius:10px; font-size:15px; }
.note{ font-size:12px; color:var(--muted); margin-top:6px; }
/* 配送管理アプリの検品書（タイルで選ぶ） */
.us-box{ background:#fff; border:3px solid var(--accent); border-radius:12px; margin-bottom:14px; overflow:hidden; }
.us-box.ok{ border-color:var(--ok); } .us-box.stop{ border-color:var(--ng); }
.us-bhead{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 12px; }
.us-bhead b{ font-size:16px; flex:1; } .us-bhead .manual{ margin-top:0; }
.us-tag{ display:inline-block; font-size:11px; font-weight:700; background:var(--accent); color:#fff; border-radius:4px; padding:1px 6px; }
.us-tag.warn{ background:var(--ng); }
.us-msg{ padding:8px 12px; font-size:14px; font-weight:700; border-top:1px solid var(--line); }
.us-msg.ng{ background:#fdeeee; color:var(--ng); } .us-msg.ok{ background:#eefaf2; color:var(--ok); }
.us-it{ display:flex; gap:12px; padding:12px; border-top:1px solid var(--line); align-items:flex-start; }
.us-it.done{ background:#eefaf2; }
.us-it .info{ flex:1; min-width:0; }
.us-big{ width:130px; height:130px; object-fit:contain; border-radius:8px; background:#f5f6f6; flex:none; }
.us-noimg{ display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); text-align:center; }
.us-note{ background:#fff8e8; border-radius:6px; padding:4px 8px; font-size:13px; white-space:pre-wrap; margin-top:4px; }
.us-many{ color:var(--ng); }
.us-ghead{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:4px 0 8px; }
.us-ghead input{ flex:1; min-width:160px; font-size:15px; padding:8px; border:1px solid var(--line); border-radius:8px; }
.us-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
.us-tile{ position:relative; display:flex; flex-direction:column; gap:4px; padding:6px; border:2px solid var(--line); border-radius:10px; background:#fff; text-align:left; font:inherit; color:inherit; }
.us-timg{ width:100%; height:auto; aspect-ratio:1/1; object-fit:contain; border-radius:6px; background:#f5f6f6; }
.us-tile .tn{ font-size:12px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.us-tile .tm{ font-size:12px; color:var(--muted); }
.us-tile .tq{ position:absolute; top:4px; right:4px; background:var(--ink); color:#fff; border-radius:6px; padding:2px 8px; font-weight:700; font-size:18px; line-height:1.2; box-shadow:0 0 0 2px #fff; }
.us-tile .tq.many{ background:var(--ng); font-size:20px; }
.us-tile .tnote{ font-size:12px; line-height:1.35; background:#fff3c4; border:1px solid var(--warn); border-radius:4px; padding:2px 4px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-wrap; }
.us-qty{ display:inline-flex; align-items:baseline; gap:6px; margin:6px 0; padding:6px 14px; border-radius:8px; background:#e8eef2; font-weight:700; font-size:16px; }
.us-qty b{ font-size:34px; line-height:1; }
.us-qty.many{ background:var(--ng); color:#fff; }
.us-qty small{ font-size:12px; font-weight:400; }
.us-memo{ background:#fff3c4; border:2px solid var(--warn); border-radius:8px; padding:8px 10px; font-size:15px; font-weight:700; white-space:pre-wrap; margin-top:6px; word-break:break-all; }
.us-tile .tc{ position:absolute; top:4px; left:4px; background:var(--accent); color:#fff; border-radius:4px; padding:0 6px; font-weight:700; font-size:12px; }
.us-tile .tb{ font-size:11px; font-weight:700; color:#7a4d00; background:#fff8e8; border:1px solid var(--warn); border-radius:4px; padding:0 4px; width:max-content; }
.us-tile.done{ opacity:.45; border-color:var(--ok); } .us-tile.stop{ border-color:var(--ng); }
.us-tile.sel{ border-color:var(--accent); box-shadow:0 0 0 3px #f4c842; }
@media (max-width:480px){ .us-grid{ grid-template-columns:repeat(3,1fr); } .us-big{ width:96px; height:96px; } }
</style>
</head>
<body>
<header>
  <div id="dayProg" style="display:none;margin:0 0 8px;font-size:14px"></div>
  <div class="order" id="orderNo">受注番号：</div>
  <div class="progress" id="progress">読み込み中…</div>
  <div class="bar"><i id="bar"></i></div>
</header>
<main>
  <div class="allok" id="allok">✓ 梱包OK<div id="allokSub" style="font-size:14px;font-weight:400;margin-top:6px;">次の検品シートのQRを読むと、次の注文に進みます</div></div>
  <div id="labelTag" style="display:none;margin:6px 0;padding:8px 10px;border-radius:8px;font-weight:700;font-size:14px"></div>
  <div id="holdBox" style="display:none;margin:6px 0"></div>
  <div id="list"></div>
  <div class="note" id="cacheNote"></div>
</main>
<div class="foot">
  <div class="row">
    <button class="btn" id="scanBtn">📷 商品のシールをスキャン</button>
    <button class="btn ghost" id="resetBtn">やり直し</button>
  </div>
  <input id="manualInput" inputmode="text" autocomplete="off" placeholder="スキャナ・手入力はここ（Enterで照合）" autocapitalize="off" spellcheck="false">
</div>
<div id="readerWrap">
  <div id="reader"></div>
  <div id="readerMsg">シールのバーコードを枠に入れてください</div>
  <button class="btn ghost close" id="closeBtn">閉じる</button>
</div>
<div id="flash"><div class="big" id="flashBig"></div><div class="small" id="flashSmall"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, query, where, documentId, serverTimestamp, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
  authDomain: "souko-2de57.firebaseapp.com",
  projectId: "souko-2de57",
  storageBucket: "souko-2de57.firebasestorage.app"
});
const db = getFirestore(app);

/* ---------- 共通 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const toHalf = s => String(s || '').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ');
const norm = s => toHalf(s).trim().toUpperCase();

/* ---------- QRの中身を読む： #o=受注番号&i=コード*数量,…
   ?コード:商品名*数量 ＝ マスタにあるがバーコードなし（おまけ等）、!コード:商品名*数量 ＝ マスタ未登録。どちらも目視で確認 ---------- */
function parseHash() {
  const h = location.hash.replace(/^#/, '');
  const out = { order: '', items: [], us: '', nos: [], trk: '' };
  h.split('&').forEach(part => {
    const eq = part.indexOf('=');
    if (eq < 0) return;
    const k = part.slice(0, eq), v = part.slice(eq + 1);
    if (k === 'o') out.order = safeDecode(v);
    if (k === 'u') out.us = safeDecode(v);
    if (k === 'n') out.nos = [...new Set(v.split(',').map(Number).filter(Boolean))];
    if (k === 't') out.trk = safeDecode(v);
    if (k === 'i') v.split(',').filter(Boolean).forEach(t => {
      const star = t.lastIndexOf('*');
      let code = star >= 0 ? t.slice(0, star) : t;
      const qty = star >= 0 ? (parseInt(t.slice(star + 1), 10) || 1) : 1;
      const kind = code.startsWith('?') ? 'nobc' : code.startsWith('!') ? 'unreg' : '';
      let name = '';
      if (kind) {
        code = code.slice(1);
        const c = code.indexOf(':');
        if (c >= 0) { name = safeDecode(code.slice(c + 1)); code = code.slice(0, c); }
      }
      out.items.push({ code: safeDecode(code), name, qty, kind, unknown: !!kind, scanned: 0 });
    });
  });
  return out;
}
function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }

/* ---------- zaicoの在庫の写し（まとまるくんと同じ zaico_inventory_cache）から 名前・画像 を引く ----------
   読み取り回数を抑えるため、端末に「コード → 名前・画像」を保存して使い回す。
   必要なコードが見つからないとき・6時間たったときだけ読み直す */
const LS_KEY = 'pack_zaico_map_v2';   // v1（画像なしで保存されたもの）は使わない
const MAX_AGE = 6 * 60 * 60 * 1000;
function readLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }
function writeLocal(o) { try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) { console.warn(e); } }
function imgOf(x) {
  const u = (x.item_image && x.item_image.url) || x.imageUrl || x.image_url || x.img || '';
  return typeof u === 'string' ? u : '';
}
async function fetchZaicoMap() {
  const ref = doc(db, 'zaico_inventory_cache', 'current');
  const meta = (await getDoc(ref)).data();
  if (!meta) throw new Error('在庫の写しがまだありません（まとまるくんを一度開いてください）');
  const ps = await getDocs(collection(ref, 'parts'));
  const parts = ps.docs.map(d => d.data()).filter(p => p.v === meta.v).sort((a, b) => a.i - b.i);
  if (parts.length !== meta.parts) throw new Error('在庫の写しを作り直している途中です。少し待ってから開き直してください');
  const base = JSON.parse(parts.map(p => p.s).join(''));
  const map = {};
  let withImg = 0;
  base.forEach(x => {
    const c = norm(x.code);
    if (!c) return;
    const img = imgOf(x);
    if (img) withImg++;
    map[c] = { t: String(x.title || ''), img };
  });
  const o = { at: Date.now(), v: meta.v, withImg, map, src: 'cache' };
  // 在庫の写しに画像のURLが入っていないときは、zaicoの在庫一覧を返す関数から画像だけ取り寄せる
  if (!withImg) {
    o.imgTried = Date.now();
    try { await fillImagesFromList(o); } catch (e) { console.warn('zaicoから画像を取り寄せられませんでした', e); o.imgError = e.message; }
  }
  writeLocal(o);
  return o;
}
const URL_LIST_ZAICO_INVENTORIES = "https://asia-northeast1-souko-2de57.cloudfunctions.net/apiListZaicoInventories";
async function fillImagesFromList(o) {
  let page = 1, n = 0, seen = 0;
  for (let guard = 0; page && guard < 200; guard++) {
    $('cacheNote').textContent = `zaicoから商品画像を読み込んでいます…（${seen.toLocaleString()}件）`;
    const res = await fetch(`${URL_LIST_ZAICO_INVENTORIES}?page=${page}&pages=10`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'zaicoの在庫一覧を取得できませんでした');
    (data.items || []).forEach(x => {
      seen++;
      const c = norm(x.code), img = imgOf(x);
      if (!c) return;
      if (!o.map[c]) o.map[c] = { t: String(x.title || ''), img: '' };
      if (img) { o.map[c].img = img; n++; }
    });
    page = data.nextPage || null;
  }
  o.withImg = n;
  o.src = n ? 'list' : 'cache';
  if (!n) o.imgError = 'zaicoの在庫一覧の関数も画像のURLを返していません';
}
async function getZaicoMap(codes) {
  const local = readLocal();
  const fresh = local && Date.now() - local.at < MAX_AGE;
  const allFound = local && codes.every(c => local.map[norm(c)]);
  // 画像が取れなかったときは、1時間たったらもう一度試す
  const imgRetry = local && !local.withImg && (!local.imgTried || Date.now() - local.imgTried > 60 * 60 * 1000);
  if (fresh && allFound && !imgRetry) return local;
  try { return await fetchZaicoMap(); }
  catch (e) { if (local) { console.warn(e); return local; } throw e; }
}


/* ===================================================================
   US吉田様など「配送管理アプリ」の検品書QR（#u=お客様ID&n=No.,…&t=追跡番号）
   商品のバーコードがないので、タイルで商品を選んで目で照合する。
   「箱に入れた」で梱包済み（orders/{No}.pack）と入荷日（シート・空のときだけ）を入れる
   =================================================================== */
const auth = getAuth(app);
let authUser = null, authReadyResolve;
const authReady = new Promise(r => authReadyResolve = r);
onAuthStateChanged(auth, u => {
  authUser = u; authReadyResolve(); if (state.us && US.needLogin && u) usStart();
  // ログイン必須：ログインしていなければ画面を覆う（キャンセル済みの警告・送り状の照合にログインが要るため）
  const g = document.getElementById('loginGate'); if (g) g.style.display = u ? 'none' : 'flex';
  if (u) { const n = document.getElementById('loginNote'); if (n) n.remove(); watchCancels(); watchProgress(); if (!state.us && state.order) checkOrderCanceled(); }
});
document.getElementById('gateLoginBtn').onclick = () => {
  document.getElementById('gateErr').textContent = '';
  const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt:'select_account' });
  signInWithPopup(auth, p).catch(err => { if (!/popup-closed|cancelled-popup/.test(err.code || '')) document.getElementById('gateErr').textContent = 'ログインできませんでした：' + err.message; });
};
const US = { cfgId:'', pre:null, labeled:new Set(), cfg:null, rows:{}, flags:{}, sel:null, needLogin:false, pf:'', q:Promise.resolve(), codeOf:{}, codeSrc:{}, master:null };
/* ---------- US：商品のバーコード（No.指定の注文など、PKGIDがない商品を照合する） ----------
   usItemMaster/{お客様ID} に登録した「商品名 → zaicoのコード」で照合する（シートの商品名はzaicoにないので、目で見て手で登録）
   登録のしかた：商品を選んで ① 商品のバーコードを読む ／ ② 「zaicoの商品から選ぶ」で画像を見て選ぶ
   読み取り：箱を開いたとき usItemMaster 1回（zaicoの写しは「選ぶ」を開いたときだけ。端末に6時間保存） */
const usNameKey = v => String(v || '').normalize('NFKC').replace(/[\s　]+/g, '').toLowerCase().slice(0, 200);
async function usLoadCodes(){
  US.codeOf = {}; US.codeSrc = {};
  try {
    if (!US.master) { const md = await getDoc(doc(db, 'usItemMaster', state.us)); US.master = (md.exists() && md.data().items) || {}; }
  } catch (e) { console.warn('usItemMaster', e); US.master = US.master || {}; }
  Object.values(US.rows).forEach(r => {
    const k = usNameKey(r.item); if (!k) return;
    const m = US.master[k];
    if (m && m.code) { US.codeOf[r.no] = norm(m.code); US.codeSrc[r.no] = '登録済み' + (m.zname ? '：' + m.zname : ''); }
  });
}
async function usLearnCode(no, raw, zname){
  const r = US.rows[no]; if (!r) return false;
  const code = norm(raw), k = usNameKey(r.item);
  if (!code || !k) return false;
  if (!confirm((zname ? 'zaicoの商品「' + zname + '」（' + raw + '）' : '読んだバーコード ' + raw) + ' を、次の商品として登録しますか？\n\n' + (r.item || '') + '\n\n次からは、この商品名の注文はバーコードで照合できます。')) return false;
  try {
    const item = { code, zname: String(zname || '').slice(0, 120), name: String(r.item || '').slice(0, 200), by: (authUser && authUser.email) || '', at: new Date().toISOString() };
    await setDoc(doc(db, 'usItemMaster', state.us), { items: { [k]: item } }, { merge: true });
    US.master = US.master || {}; US.master[k] = item;
    Object.values(US.rows).forEach(x => { if (usNameKey(x.item) === k) { US.codeOf[x.no] = code; US.codeSrc[x.no] = '登録済み' + (item.zname ? '：' + item.zname : ''); } });
    return true;
  } catch (e) { alert('登録できませんでした：' + e.message); return false; }
}
// zaicoの在庫の写しから、画像を見て選ぶ
async function usPickZaico(no){
  const r = US.rows[no]; if (!r) return;
  let z;
  try { $('cacheNote').textContent = 'zaicoの在庫を読み込んでいます…'; z = await getZaicoMap([]); } catch (e) { alert('zaicoの在庫を読めませんでした：' + e.message); return; } finally { $('cacheNote').textContent = ''; }
  const all = Object.entries(z.map || {}).map(([code, v]) => ({ code, t: v.t || '', img: v.img || '' }));

async function usSetPack(no, done){

// 入荷日（空のときだけ）。書く直前にシートを読み直して、注文が変わっていないか確かめる。梱包の手を止めないよう裏で順番に
function usArriveBg(no){

    try{
      const r = US.rows[no];
      const j = await usGas('search', { mode:'no', values:[no] });
      const cur = (j.rows || []).find(x => x.no === no);
      if (!cur) throw new Error('シートにNo.' + no + 'がありません');
      if (keyOf(cur) !== keyOf(r)) throw new Error('No.' + no + 'の注文番号がシートで変わっています');
      if (cur.arrivedAt) { r.arrivedAt = cur.arrivedAt; return; }
      const date = todayStr();
      await usGas('write', { updates:[{ no, rowNumber:cur.rowNumber, fields:{ arrivedAt:date } }] });
      r.arrivedAt = date;
      await setDoc(ordRef(no), { arrivedAt:date, procOrderId:oidOf(r.orderId), procKey:keyOf(r), arrivedLoggedAt:serverTimestamp(), arrivedBy:(authUser && authUser.email) || '' }, { merge:true }).catch(e => console.warn(e));

// 倉庫追跡番号（荷物の配送伝票のバーコード）を読んだとき：シートで探して、あればその荷物を開く
function trkCode(raw){
  let c = String(raw || '').normalize('NFKC').toUpperCase().replace(/[^0-9A-Z]/g, '');
  if (/^[A-D]\d{6,}[A-D]$/.test(c)) c = c.slice(1, -1);   // ヤマト・佐川の伝票のバーコード（前後の英字）
  return /^[0-9A-Z]{8,30}$/.test(c) && /\d{6,}/.test(c) ? c : '';
}
const usClient = () => state.us || (() => { try{ return localStorage.getItem('pack_us_client'); }catch(e){ return null; } })() || '150';
async function usTryTracking(raw){

  const cid = usClient();
  await authReady;
  if (!authUser) { openOrder('u=' + encodeURIComponent(cid) + '&t=' + c); return true; }   // ログインの案内を出す
  try{
    if (!US.cfg || US.cfgId !== cid) { US.cfg = (await getDoc(doc(db, 'deliveryClients', cid))).data(); US.cfgId = cid; }
    if (!US.cfg || !US.cfg.gasUrl) return false;

}
// 送り状のバーコード（伝票番号）を、共有の発行済みデータ（shipments）で探す
//   どのアプリで取り込んだ発行済みCSVも shipments/{yamato|sagawa}_{伝票番号} に入っている。1回の照合で読み取り2回
async function usLabelLookup(raw){
  let c = String(raw || '').normalize('NFKC').toUpperCase().replace(/[^0-9A-Z]/g, '');
  if (/^[A-D]\d+[A-D]$/.test(c)) c = c.slice(1, -1);
  if (!/^\d{10,14}$/.test(c)) return null;
  // 直前に当たった配送会社から先に見る（見つかれば読み取り1回で済む）
  let first = 'yamato'; try { first = localStorage.getItem('pack_last_carrier') || 'yamato'; } catch (e) {}
  let hit = null, err = null;
  for (const k of [first, first === 'yamato' ? 'sagawa' : 'yamato']) {
    const x = await getDoc(doc(db, 'shipments', k + '_' + c)).catch(e => { err = e; return null; });
    if (x && x.exists()) { hit = x; try { localStorage.setItem('pack_last_carrier', k); } catch (e) {} break; }
  }
  if (!hit) return { trk:c, d:null, err };
  const d = hit.data();
  let nos = Array.isArray(d.nos) && d.nos.length ? d.nos.map(Number) : [];
  if (!nos.length) { const m = String(d.items || '').match(/No\.?\s*([\d,，、\s]+)\)/i); if (m) nos = m[1].split(/[,，、\s]+/).map(Number).filter(Boolean); }
  return { trk:c, d, nos };
}
// 送り状を読んだときの照合。処理したら true（送り状でなければ false）
async function usLabelCheck(raw){
  const L = await usLabelLookup(raw);
  if (!L) return false;
  if (!L.d) return false;   // 共有の記録にない（倉庫追跡番号かもしれないので、ほかの探し方に回す）
  if (L.d.canceled) {
    beep(false);
    flash(false, '✕ この送り状は取り消し済みです', (L.d.carrierName || '') + ' ' + L.trk + (L.nos.length ? '（No.' + L.nos.join('、No.') + '）' : '') + '\nキャンセルの依頼で取り消された送り状です。貼らないでください（タップ・Escで閉じる）');
    return true;
  }
  const fmt = n => 'No.' + n + (US.rows[n] && US.rows[n].name ? '（' + US.rows[n].name + '）' : '');
  const mine = L.nos.filter(n => US.rows[n]);
  if (US.sel) {
    const bd = usBundle(US.sel);
    if (L.nos.some(n => bd.nos.includes(n))) {
      bd.nos.forEach(n => US.labeled.add(n));
      const target = bd.nos.includes(US.sel) && !usPacked(US.sel) && !usStop(US.sel) ? US.sel : bd.nos.find(n => !usPacked(n) && !usStop(n));
      if (target) { await usPutIn(target, '✓ 送り状OK（' + (L.d.carrierName || '') + ' ' + L.trk + '）'); return true; }
      beep(true); flash(true, '✓ 送り状OK', 'No.' + bd.nos.join('、No.') + '\nこの箱の商品は入れ終わっています', 1300); usRender(); return true;
    }
    beep(false);
    flash(false, '✕ 別の注文の送り状です', 'この送り状：' + (L.nos.length ? L.nos.map(fmt).join('、') : (L.d.name || '') + ' ' + (L.d.orderNo || '')) + '\n開いている箱：' + bd.nos.map(fmt).join('、') + '\n貼る送り状を確かめてください（タップ・Escで閉じる）');
    return true;
  }
  if (mine.length) {
    // 箱を開いていないときに送り状を読んだ → その注文を開く
    US.sel = mine.find(n => !usPacked(n) && !usStop(n)) || mine[0];
    usBundle(US.sel).nos.forEach(n => US.labeled.add(n));
    usRender(); window.scrollTo({ top:0, behavior:'smooth' });
    if (usStop(US.sel)) { beep(false); flash(false, '⚠ No.' + US.sel + 'は' + usStop(US.sel), '箱に入れないでください\n（タップ・Escで閉じる）'); return true; }
    beep(true); flash(true, '送り状：' + fmt(US.sel), '商品を確かめて、PKGIDをスキャン（または「箱に入れた」）', 1500);
    return true;
  }
  beep(false);
  flash(false, '✕ この検品書の注文の送り状ではありません', '読んだ送り状：' + L.trk + (L.nos.length ? '（No.' + L.nos.join('、No.') + '）' : '') + '\n（タップ・Escで閉じる）');
  return true;
}
// 検品書モードで商品のバーコードを読んだとき：PKGIDで注文を探して開く
// 開いている注文と同じPKGIDをもう一度読むと「箱に入れた」にする（スキャナだけで進められる）
const pkgNorm = v => String(v || '').normalize('NFKC').toUpperCase().replace(/[^0-9A-Z]/g, '');
const pkgList = r => String(r.pkgId || '').split(/[\s,、，\/]+/).map(pkgNorm).filter(x => x.length >= 4);
const hasPkg = r => pkgList(r).length > 0;
function usFindPkg(code){
  const c = pkgNorm(code); if (!c) return [];
  let hits = Object.values(US.rows).filter(r => pkgList(r).includes(c));
  // バーコードに余分な文字が付いているとき（前後に文字が付くなど）は、含まれているかで探す
  if (!hits.length && c.length >= 8) hits = Object.values(US.rows).filter(r => pkgList(r).some(t => t.length >= 8 && (c.includes(t) || t.includes(c))));
  // PKGIDでなければ、商品のバーコード（覚えたコード・zaicoの商品名一致）で探す
  if (!hits.length) { const z = norm(code); if (z) hits = Object.values(US.rows).filter(r => US.codeOf[r.no] && US.codeOf[r.no] === z); }
  return hits.sort((a,b) => a.no - b.no);
}
function usCheck(raw){
  const m = String(raw).normalize('NFKC').trim().match(/^(?:No\.?)?\s*0*(\d{3,6})$/i);
  if (m && US.rows[Number(m[1])]) { US.sel = Number(m[1]); usRender(); window.scrollTo({ top:0, behavior:'smooth' }); return; }
  const hits = usFindPkg(raw);
  if (!hits.length) {
    // PKGIDでなければ、送り状 → 次の荷物の倉庫追跡番号 の順に探す
    // JANコード（8・13桁）で、選んでいる商品にバーコードがまだないときは、先に「覚えるか」を聞く（送り状・追跡番号の検索を待たない）
    const sel0 = US.sel && US.rows[US.sel], rt = String(raw).trim();
    if (sel0 && /^(\d{8}|\d{13})$/.test(rt) && !hasPkg(sel0) && !US.codeOf[sel0.no] && !usPacked(sel0.no) && !usStop(sel0.no)) {
      usLearnCode(sel0.no, raw).then(ok => { if (ok) usCheck(raw); else { beep(false); flash(false, '覚えませんでした', '目で確かめて「箱に入れた」を押してください（タップ・Escで閉じる）'); } });
      return;
    }
    usLabelCheck(raw).then(done => done || usTryTracking(raw)).then(async ok => {
      if (ok) return;
      // 選んでいる商品にバーコードがまだないときは、読んだコードをその商品のバーコードとして覚える
      const sel = US.sel && US.rows[US.sel];
      if (sel && !hasPkg(sel) && !US.codeOf[sel.no] && /^[0-9A-Za-z\-]{6,20}$/.test(String(raw).trim()) && !usPacked(sel.no) && !usStop(sel.no)) {
        if (await usLearnCode(sel.no, raw)) { usCheck(raw); return; }
      }
      beep(false);
      flash(false, '✕ この検品書の商品ではありません', '読んだコード：' + raw + '\nPKGID・送り状・倉庫追跡番号のどれにも見つかりません。'
        + (US.sel ? '送り状なら、発行済みデータがまだ取り込まれていないかもしれません（目で確かめて「箱に入れた」を押してください）' : 'バーコードがない商品は、画像のタイルから選んでください') + '\n（タップ・Escで閉じる）');
    });
    return;
  }
  // 開いている注文のPKGIDをもう一度読んだ → 箱に入れた

  const r = todo[0] || hits.find(x => usStop(x.no)) || hits[0];
  US.sel = r.no; usRender(); window.scrollTo({ top:0, behavior:'smooth' });
  if (usStop(r.no)) { beep(false); flash(false, '⚠ No.' + r.no + 'は' + usStop(r.no), '箱に入れないでください\n（タップ・Escで閉じる）'); return; }
  if (!todo.length) { beep(false); flash(false, 'この商品は梱包済みです', 'No.' + hits.map(x => x.no).join('、No.') + '\n二重に梱包していないか確かめてください（タップ・Escで閉じる）'); return; }
  const q = qtyNum(r.qty);
  beep(true);
  flash(true, 'No.' + r.no + '\n数量 ' + (q || 1) + '個' + (q >= 2 ? '（⚠ ' + q + '個入れる）' : ''), 'お届け先：' + (r.name || '') + (r.note ? '\n📝 備考：' + String(r.note).slice(0, 80) : '') + '\n送り状を貼って箱に入れたら、もう一度スキャン（または「箱に入れた」）', (q >= 2 || r.note) ? 2500 : 1500);
}

/* ---------- 音・振動・画面全体の表示 ---------- */
let actx = null;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const play = (freq, start, dur) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? 'sine' : 'square'; o.frequency.value = freq;
      g.gain.value = 0.25; o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur);
    };
    if (ok) play(1200, 0, 0.12); else { play(300, 0, 0.25); play(300, 0.32, 0.25); play(300, 0.64, 0.25); }
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(ok ? 60 : [300, 100, 300, 100, 300]); } catch (e) {}
}
let flashTimer = null;
function flash(ok, big, small, ms) {
  const f = $('flash');
  f.className = 'on ' + (ok ? 'ok' : 'ng');
  $('flashBig').textContent = big; $('flashSmall').textContent = small || '';
  clearTimeout(flashTimer);
  if (ok) flashTimer = setTimeout(() => f.className = '', ms || 700);
}
$('flash').onclick = () => { $('flash').className = ''; };   // 赤いエラーはタップで閉じる

/* ---------- 照合 ---------- */
function findItem(code) {
  const c = norm(code);
  const cands = [c];
  if (/^\d{13}$/.test(c) && c.startsWith('0')) cands.push(c.slice(1));   // UPC-A を EAN-13 として読んだとき
  if (/^\d{12}$/.test(c)) cands.push('0' + c);
  return state.items.find(x => !x.unknown && cands.includes(norm(x.code)));
}
function check(code) {
  const raw = String(code || '').trim();
  if (!raw) return;
  if (state.us) { usCheck(raw); return; }
  if (!state.items.length) {
    usTryTracking(raw).then(async ok => {
      if (ok) return;
      // 送り状を読んだ場合は、どの注文の送り状かを出す（照合は検品シートを開いてから）
      let msg = '';
      try { const L = authUser ? await usLabelLookup(raw) : null; if (L && L.d) msg = '\nこの送り状：' + (L.d.carrierName || '') + ' ' + L.trk + '（' + (L.d.name || '') + (L.d.orderNo ? '・' + L.d.orderNo : '') + '）' + (L.d.canceled ? '【取り消し済み】' : ''); else if (L && L.err) msg = '\n送り状の記録を読めませんでした：' + (L.err.code || L.err.message); else if (L) msg = '\n伝票番号 ' + L.trk + ' の送り状の記録はありません'; } catch (e) {}
      beep(false); flash(false, '先に検品シートのQRか、荷物の倉庫追跡番号を読んでください', '読んだコード：' + raw + msg + '\n（送り状の照合は、検品シートを開いてから読みます。タップ・Escで閉じる）');
    });
    return;
  }
  if (state.canceled) { beep(false); flash(false, '✕ キャンセル済みの注文です', '受注番号 ' + state.order + '\n梱包しないでください（次の検品シートのQRを読んでください）'); return; }
  if (holdOf()) { beep(false); flash(false, '⚠ 欠品で保留中の注文です', '受注番号 ' + state.order + '\n商品がそろったら、上のボタンで保留を解除してください（タップ・Escで閉じる）'); return; }
  const it = findItem(raw);
  if (!it) {
    // 商品でなければ、まず送り状として照合 → だめなら（梱包OKのあとなら）次の荷物の倉庫追跡番号として探す
    const allDone = state.items.every(x => x.scanned === x.qty);
    orderLabelCheck(raw).catch(() => false).then(ok => {
      if (ok) return;
      const next = allDone ? usTryTracking(raw) : Promise.resolve(false);
      return next.then(ok2 => {
        if (ok2) return;
        beep(false);
        const z = zmap[norm(raw)];
        const lg = !authUser && /^\D?\d{10,14}\D?$/.test(raw.replace(/\s/g, '')) ? '\n※ 送り状の照合にはログインが必要です（画面下の「ログイン」から）' : '';
        flash(false, '✕ この注文の商品ではありません', (z && z.t ? z.t + '　' : '') + '読んだコード：' + raw + lg + '\n（タップ・Escで閉じる）');
      });
    });
    return;
  }
  if (it.scanned >= it.qty) {
    it.scanned++;
    beep(false);
    flash(false, '✕ 数が多いです', `${zmap[norm(it.code)]?.t || it.code}\n必要 ${it.qty} 個 → ${it.scanned} 個読みました（タップ・Escで閉じる）`);
    afterChange();
    return;
  }
  it.scanned++;
  beep(true);
  const left = state.items.every(x => x.scanned === x.qty);
  flash(true, left ? '✓ 梱包OK' : '✓ OK', `${zmap[norm(it.code)]?.t || it.code}　${it.scanned}/${it.qty}`, left ? 1500 : 600);
  afterChange();
}
// まとまるくんの検品シートの注文：送り状を読んだら、その受注番号の送り状か確かめる
//   USくんの送り状：お客様管理番号＝受注番号。Robot-inのデータから作った送り状：ヤマトは記事、佐川は品名2「No:受注番号」
const ordKey = v => String(v || '').normalize('NFKC').replace(/^No[:：.]?\s*/i, '').replace(/[\s\-_‐－−ー―]/g, '').toUpperCase();
function shipOrderKeys(d){
  const ks = new Set([ordKey(d.orderNo)]);
  String(d.items || '').split(' / ').forEach(t => { t = t.trim(); if (/^(No[:：.]?\s*)?[0-9A-Za-z][0-9A-Za-z\-]{5,}$/i.test(t)) ks.add(ordKey(t)); });
  (d.keys || []).forEach(k => ks.add(String(k)));
  ks.delete(''); return ks;
}
async function orderLabelCheck(raw){
  let c = String(raw || '').normalize('NFKC').toUpperCase().replace(/[^0-9A-Z]/g, '');
  if (/^[A-D]\d+[A-D]$/.test(c)) c = c.slice(1, -1);
  if (!/^\d{10,14}$/.test(c)) return false;
  await authReady;
  if (!authUser) { beep(false); flash(false, '送り状の照合にはログインが必要です', '伝票番号 ' + c + '\n画面の「Googleでログイン」からログインしてください（タップ・Escで閉じる）'); return true; }
  const L = await usLabelLookup(c);
  if (!L) return false;
  if (!L.d) {
    if (L.err) { beep(false); flash(false, '送り状の記録を読めませんでした', '伝票番号 ' + c + '\n' + (L.err.code === 'permission-denied' ? 'Firestoreのルールで shipments の読み取りが許可されていません' : (L.err.message || L.err)) + '（タップ・Escで閉じる）'); return true; }
    if (state.items.every(x => x.scanned === x.qty)) return false;   // 梱包OKのあとは、次の荷物の倉庫追跡番号かもしれない
    beep(false); flash(false, '送り状の記録が見つかりません', '伝票番号 ' + c + '\nこの送り状の発行済みCSVが、まだまとまるくん（またはUSくん）に入っていないかもしれません（タップ・Escで閉じる）');
    return true;
  }
  const name = (L.d.carrierName || '') + ' ' + L.trk;
  if (L.d.canceled) { beep(false); flash(false, '✕ この送り状は取り消し済みです', name + '\n貼らないでください（タップ・Escで閉じる）'); return true; }
  if (shipOrderKeys(L.d).has(ordKey(state.order))) {
    state.label = name; beep(true);
    const allOk = state.items.every(x => x.scanned === x.qty);
    flash(true, '✓ 送り状OK', name + (allOk ? '\n梱包OK・次の検品シートへ' : '\n残りの商品を読んでください'), 1300);
    render(); return true;
  }
  beep(false);
  flash(false, '✕ 別の注文の送り状です', 'この送り状：' + name + '（' + (L.d.name || '') + (L.d.orderNo ? '・' + L.d.orderNo : '') + '）\n開いている注文：' + state.order + '\n貼る送り状を確かめてください（タップ・Escで閉じる）');
  return true;
}
// 依頼まとめ管理で「キャンセル済み」にした受注番号か（shipCancels/{受注番号を詰めたもの}・読み取り1回）
const cxKey = v => String(v || '').normalize('NFKC').replace(/[\s　\-‐－−ー―]/g, '').toUpperCase();
// キャンセル済みの一覧（settings/ship_cancels）は、開いたときに1回読み、変更があったときだけ届く
let CXMAP = null, cxWatching = false;
function watchCancels(){
  if (cxWatching || !authUser) return; cxWatching = true;
  onSnapshot(doc(db, 'settings', 'ship_holds'), snap => {
    HOLDS = (snap.exists() && snap.data().holds) || {};
    if (!state.us && state.items.length) render();
  }, e => console.warn('ship_holds', e));
  onSnapshot(doc(db, 'settings', 'ship_cancels'), snap => {
    CXMAP = (snap.exists() && snap.data().keys) || {};
    if (!state.us && state.order && !state.canceled) checkOrderCanceled();
  }, e => { console.warn('ship_cancels', e); cxWatching = false; });
}
/* ---------- 欠品で保留（settings/ship_holds） ----------
   holds.{受注番号}：保留中（出荷通知CSVに入らない）
   carry.{受注番号}：保留を解除した注文。送り状を作った日のあとでも、次の出荷通知CSVに自動で入る
     送り状が同じか作り直したかは、出荷通知のときに「取り消していない送り状のうち新しいほう」で決まる */
let HOLDS = {};
/* ---------- 今日の残り件数（packProgress/{日付}） ----------
   plan：まとまるくんで今日印刷した検品シートの注文／done：梱包OKになった注文（端末をまたいで共有）
   読み取り：開いたときに1回＋変更のたび。書き込み：梱包OKになった注文ごとに1回 */
let PROG = null, progWatching = false;
function watchProgress(){
  if (progWatching || !authUser) return; progWatching = true;
  onSnapshot(doc(db, 'packProgress', todayStr()), snap => { PROG = snap.exists() ? snap.data() : null; renderDayProg(); },
    e => { console.warn('packProgress', e); progWatching = false; });
}
function markPacked(){
  if (state.us || !state.order || state.canceled || holdOf() || !authUser) return;
  const k = cxKey(state.order);
  if (state.doneWritten === k || (PROG && PROG.done && PROG.done[k])) return;
  state.doneWritten = k;
  setDoc(doc(db, 'packProgress', todayStr()), { date: todayStr(), done: { [k]: { at: new Date().toISOString(), by: holdWho() } } }, { merge: true }).catch(e => { console.warn('packProgress', e); state.doneWritten = ''; });
}
function renderDayProg(){
  const el = $('dayProg'); if (!el) return;
  const plan = (PROG && PROG.plan) || {}, done = (PROG && PROG.done) || {};
  const keys = Object.keys(plan);
  if (state.us || !keys.length) { el.style.display = 'none'; return; }
  const cxm = CXMAP || {};
  const held = keys.filter(k => !done[k] && HOLDS[k]), cx = keys.filter(k => !done[k] && cxm[k]);
  const left = keys.filter(k => !done[k] && !HOLDS[k] && !cxm[k]);
  const n = keys.filter(k => done[k]).length;
  el.style.display = '';
  el.innerHTML = '<details style="background:' + (left.length ? '#eef4fa' : '#e4f3ea') + ';border-radius:8px;padding:8px 10px"><summary style="cursor:pointer;font-weight:700">'
    + (left.length ? '今日の残り <span style="font-size:20px">' + left.length + '</span> 件' : '✓ 今日の検品シートはすべて梱包済み')
    + '<span style="font-weight:400;font-size:12px">（全' + keys.length + '・済み' + n + (held.length ? '・欠品保留' + held.length : '') + (cx.length ? '・キャンセル' + cx.length : '') + '）</span></summary>'
    + (left.length ? '<div style="margin-top:6px;font-size:12px;line-height:1.7">' + left.map(k => esc(plan[k].orderNo) + (plan[k].shop ? '<span style="color:#66727c">（' + esc(plan[k].shop) + '）</span>' : '')).join('<br>') + '</div>' : '')
    + '</details>';
}
const holdOf = () => (!state.us && state.order) ? HOLDS[cxKey(state.order)] : null;
const holdWho = () => (authUser && authUser.email) || '';
function renderHold(allOk){
  const box = $('holdBox'); if (!box) return;
  const h = holdOf();
  if (state.us || !state.items.length || !authUser) { box.style.display = 'none'; return; }
  box.style.display = '';
  if (h) {
    const miss = (h.missing || []).map(m => esc(m.name || m.code) + ' ' + m.got + '/' + m.need).join('、');
    box.innerHTML = '<div style="background:#d68910;color:#fff;border-radius:8px;padding:10px;font-size:14px"><b>⚠ 欠品で保留中</b>（' + esc(String(h.at || '').slice(0, 16).replace('T', ' ')) + ' ' + esc(h.by || '') + '）' + (miss ? '<br>足りない商品：' + miss : '') +
      '<div style="margin-top:8px"><button type="button" id="holdOk" style="width:100%;padding:10px;border-radius:8px;border:0;font-weight:700">商品がそろった（保留を解除して梱包する）</button></div></div>';
    $('holdOk').onclick = () => holdRelease();
    return;
  }
  if (allOk) { box.style.display = 'none'; return; }
  box.innerHTML = '<button type="button" id="holdBtn" style="padding:8px 12px;border-radius:8px;border:1px solid #d68910;background:#fff8e8;color:#8a5a00;font-weight:700">⚠ 欠品で保留にする</button>';
  $('holdBtn').onclick = holdSet;
}
async function holdSet(){
  const k = cxKey(state.order);
  const missing = state.items.filter(x => x.scanned < x.qty).map(x => ({ code: x.code, name: (x.unknown ? x.name : (zmap[norm(x.code)] && zmap[norm(x.code)].t)) || x.code, need: x.qty, got: x.scanned }));
  if (!confirm('受注番号 ' + state.order + ' を欠品で保留にします。\n' + missing.map(m => '・' + m.name + '：' + m.got + '/' + m.need).join('\n') + '\n\n出荷通知CSVには入らなくなります。商品は箱から出して、送り状と一緒に保管してください。')) return;
  try {
    const now = new Date();
    await setDoc(doc(db, 'settings', 'ship_holds'), { holds: { [k]: { orderNo: state.order, at: now.toISOString(), atSec: Math.floor(now / 1000), by: holdWho(), date: todayStr(), missing } }, updatedAt: now.toISOString() }, { merge: true });
    beep(true); flash(true, '欠品で保留にしました', '受注番号 ' + state.order, 1500);
  } catch (e) { alert('保留にできませんでした：' + e.message); }
}
// 保留の解除（梱包者は「商品がそろった」を押すだけ。送り状が同じか作り直しかは気にしなくてよい）
//   出荷通知CSVでは、取り消していない送り状のうち、あとから取り込んだほうを使う
//   作り直したときは、まとまるくんの出荷通知の画面で「送り状が2つ以上ある注文」に出るので、そこで選べる
async function holdRelease(){
  const k = cxKey(state.order), h = holdOf(); if (!h) return;
  if (!confirm('商品がそろったので、保留を解除して梱包しますか？\n解除した注文は、次の出荷通知CSVに自動で入ります。')) return;
  try {
    const now = new Date();
    await setDoc(doc(db, 'settings', 'ship_holds'), { holds: { [k]: deleteField() }, carry: { [k]: { orderNo: state.order, at: now.toISOString(), by: holdWho(), date: h.date || todayStr() } }, updatedAt: now.toISOString() }, { merge: true });
    beep(true); flash(true, '保留を解除しました', '商品を読んで梱包し、送り状を貼ってください', 1800);
  } catch (e) { alert('解除できませんでした：' + e.message); }
}
async function checkOrderCanceled(){
  const order = state.order; if (!order || state.us) return;
  await authReady; if (!authUser) return;
  watchCancels();
  if (!CXMAP) return;   // 届いたら、もう一度確かめる
  try {
    const hit = CXMAP[cxKey(order)];
    if (state.order !== order || !hit) return;
    state.canceled = String(hit.at || '').slice(0, 16).replace('T', ' ') + ' ' + (hit.by || '');
    beep(false);
    flash(false, '✕ キャンセル済みの注文です', '受注番号 ' + order + '\n梱包しないでください。商品は棚に戻してください（タップ・Escで閉じる）');
    render();
  } catch (e) { console.warn('shipCancels', e); }
}
function afterChange() {
  render();
  // 梱包OKでもカメラは止めない（そのまま次の検品シートのQRを読めるように）
}

/* ---------- カメラ（html5-qrcode：iPhoneのSafariでも動く） ---------- */
let scanner = null, lastCode = '', lastAt = 0;
async function startCamera() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}   // 音を鳴らせるようにする
  $('readerWrap').classList.add('on');
  $('readerMsg').textContent = 'シールのバーコードを枠に入れてください';
  if (scanner) return;
  const F = window.Html5QrcodeSupportedFormats;
  scanner = new Html5Qrcode('reader', {
    verbose: false,
    formatsToSupport: [F.CODE_128, F.CODE_39, F.CODABAR, F.EAN_13, F.EAN_8, F.UPC_A, F.ITF, F.QR_CODE],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  });
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(Math.min(h, w) * 0.45) }) },
      text => {
        const now = Date.now();
        if ($('flash').classList.contains('ng')) return;          // 赤いエラーを閉じるまでは読まない
        if (text === lastCode && now - lastAt < 1500) return;   // 同じシールを続けて読まない
        lastCode = text; lastAt = now;
        if (/#o=.*&i=/.test(text) || /#u=.*&n=/.test(text)) { openOrder(text.slice(text.indexOf('#') + 1)); return; }   // 検品シートのQR → その注文を開く
        check(text);
      }, () => {});
  } catch (e) {
    $('readerMsg').textContent = 'カメラを起動できませんでした：' + (e && e.message ? e.message : e);
    scanner = null;
  }
}
async function stopCamera() {
  $('readerWrap').classList.remove('on');
  if (scanner) { try { await scanner.stop(); scanner.clear(); } catch (e) {} scanner = null; }
}
$('scanBtn').onclick = startCamera;
$('closeBtn').onclick = stopCamera;
$('resetBtn').onclick = () => { if (confirm('数え直しますか？')) { state.items.forEach(x => { x.scanned = 0; x.manual = 0; }); render(); } };
/* ---------- スキャナ（USB・Bluetooth）・手入力 ----------
   スキャナの配列設定（US）とパソコン（日本語配列）が違うと、記号が化けて入る（= → ^、& → '、* → ( など）。
   検品シートのQRっぽいのに #o= が見つからないときは、化けた記号を元に戻して読む */
function fixLayout(v) {
  if (/#o=.*&i=/.test(v) || /#u=.*&n=/.test(v)) return v;
  if (!/pack\.html/i.test(v) && !/#o\^/.test(v) && !/#u\^/.test(v)) return v;
  return v.replace(/\^/g, '=').replace(/'/g, '&').replace(/\(/g, '*').replace(/\+/g, ':');
}
function handleTyped(v) {
  v = String(v || '').trim();
  if (!v) return;
  const q = fixLayout(v);
  if (/#o=.*&i=/.test(q) || /#u=.*&n=/.test(q)) openOrder(q.slice(q.indexOf('#') + 1));
  else check(v);
}
$('manualInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); clearTimeout(SCAN.timer); const v = e.target.value; e.target.value = ''; SCAN.times = []; handleTyped(v); }
});
// Enterを送らない設定のスキャナー用：速く続けて入った文字（スキャナー）は、入力が止まったら自動で確定する
//   手で打つ速さでは確定しない（1文字あたり平均40ミリ秒未満・6文字以上のときだけ）
const SCAN = { times: [], timer: null };
$('manualInput').addEventListener('input', e => {
  const now = performance.now(), el = e.target;
  if (!el.value) { SCAN.times = []; return; }
  SCAN.times.push(now);
  clearTimeout(SCAN.timer);
  SCAN.timer = setTimeout(() => {
    const t = SCAN.times, v = el.value;
    SCAN.times = [];
    if (v.length < 6 || t.length < 6) return;
    const avg = (t[t.length - 1] - t[0]) / (t.length - 1);
    if (avg >= 40) return;   // 手入力はEnterで確定
    el.value = ''; handleTyped(v);
  }, 150);
});

// パソコン（マウスで操作する端末）では、入力欄にずっとカーソルを置いておく（クリック不要でスキャナが使える）
const isPC = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
function keepFocus() {
  if (!isPC || $('readerWrap').classList.contains('on')) return;
  const a = document.activeElement;
  if (a && a !== document.body && a !== $('manualInput') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  $('manualInput').focus({ preventScroll: true });
}
if (isPC) {
  document.addEventListener('click', () => setTimeout(keepFocus, 0));
  window.addEventListener('focus', () => setTimeout(keepFocus, 0));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') $('flash').className = '';   // 赤い表示を Esc で閉じる
    if (document.activeElement !== $('manualInput') && e.key.length === 1 && !e.ctrlKey && !e.metaKey) keepFocus();
  });
  setInterval(keepFocus, 1500);
}

// 端末に保存した商品名・画像を捨てて、zaicoから読み直す
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'reloadZaico') { e.preventDefault(); try { localStorage.removeItem(LS_KEY); } catch (_) {} location.reload(); }
});

/* ---------- 起動 ----------
   検品シートのQRから開いたとき：その注文を表示
   ポータルから開いたとき（QRの情報なし）：「検品シートのQRを読む」から始める。
   照合中のカメラで次の注文の検品シートQRを読むと、そのまま次の注文に切り替わる */
function openOrder(hash) {
  if (location.hash.replace(/^#/, '') === hash) return;
  location.hash = hash;   // hashchange で読み直す
}
window.addEventListener('hashchange', () => { state = parseHash(); start(); });

async function start() {
  if (state.us) { $('resetBtn').style.display = 'none'; return usStart(); }
  US.sel = null;
  if (!state.items.length) {
    $('orderNo').textContent = '梱包チェック';
    $('progress').textContent = '検品シートのQRを読んでください';
    $('bar').style.width = '0';
    $('allok').classList.remove('show');
    $('list').innerHTML = '<div class="note" style="font-size:14px;">' + (isPC ? 'スキャナで検品シートのQR、または荷物の配送伝票（倉庫追跡番号）のバーコードを読むと、その注文の商品が表示されます。バーコードのある商品はシール・PKGIDを読んで照合、ない商品は画像のタイルから選んで照合します。' : '下の「📷」ボタンでカメラを起動し、検品シートのQRを読むと、その注文の商品が表示されます。続けて商品のシールを読んで照合します。') + '</div>';
    $('scanBtn').textContent = '📷 検品シートのQRを読む';
    $('resetBtn').style.display = 'none';
    keepFocus();
    return;
  }
  $('scanBtn').textContent = '📷 商品のシールをスキャン';
  $('resetBtn').style.display = '';
  window.scrollTo(0, 0);
  render();
  checkOrderCanceled();
  authReady.then(() => {
    if (authUser || state.us) return;
    const n = $('loginNote') || document.createElement('div');
    n.id = 'loginNote'; n.style.cssText = 'margin:8px 0;font-size:13px';
    n.innerHTML = '送り状の照合には、社内のGoogleアカウントでのログインが必要です。<button type="button" id="loginBtnOld" style="margin-left:6px">ログイン</button>';
    $('list').after(n);
    $('loginBtnOld').onclick = () => { const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt:'select_account' }); signInWithPopup(auth, p).then(() => n.remove()).catch(err => { if (!/popup-closed|cancelled-popup/.test(err.code || '')) alert('ログインできませんでした：' + err.message); }); };
  });
  try {
    const z = await getZaicoMap(state.items.filter(x => !x.unknown).map(x => x.code));
    zmap = z.map || {};
    $('cacheNote').innerHTML = z.withImg ? '' : esc('※ 画像のURLを取得できませんでした（' + (z.imgError || '関数の設定が必要です') + '）') + ' <a href="#" id="reloadZaico">zaicoから読み直す</a>';
  } catch (e) {
    $('cacheNote').textContent = '※ zaicoの商品名・画像を読めませんでした：' + e.message + '（照合はできます）';
  }
  render();
  keepFocus();
}
start();
</script>

  <div style="background:#fff;color:#1f2a33;border-radius:14px;padding:26px 22px;max-width:360px;width:calc(100% - 32px);text-align:center">
    <div style="font-size:18px;font-weight:800;margin-bottom:8px">梱包くん</div>
    <p style="font-size:13px;color:#5d6b77;margin:0 0 16px">社内のGoogleアカウントでログインしてください。<br>キャンセル済みの注文の警告と、送り状の照合に必要です（この端末で最初の1回だけ）。</p>
    <button type="button" id="gateLoginBtn" style="width:100%;padding:12px;font-size:16px;font-weight:700;border-radius:10px;border:0;background:#1f5f8b;color:#fff">Googleでログイン</button>
    <p id="gateErr" style="font-size:12px;color:#c0392b;margin:10px 0 0"></p>
  </div>
</div>
