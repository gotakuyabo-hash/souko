<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>梱包チェック</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{ --ink:#1c2733; --muted:#5d6b77; --line:#d3d9d7; --ok:#1e8e4f; --ng:#c0392b; --warn:#d68910; --accent:#0f5f8a; }
*{ box-sizing:border-box; }
body{ margin:0; font-family:"BIZ UDPGothic","Hiragino Sans",sans-serif; color:var(--ink); background:#eef1f0; -webkit-text-size-adjust:100%; }
header{ position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:10px 14px; }
header .order{ font-size:13px; color:var(--muted); word-break:break-all; }
header .progress{ font-size:22px; font-weight:700; margin-top:2px; }
header .bar{ height:6px; background:#e6eae9; border-radius:3px; margin-top:6px; overflow:hidden; }
header .bar i{ display:block; height:100%; width:0; background:var(--ok); transition:width .2s; }
main{ padding:12px 12px 140px; }
.item{ display:flex; gap:12px; background:#fff; border:2px solid var(--line); border-radius:12px; padding:10px; margin-bottom:10px; align-items:center; }
.item img, .item .noimg{ width:96px; height:96px; object-fit:contain; border-radius:8px; background:#f5f6f6; flex:none; }
.item .noimg{ display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); text-align:center; }
.item .info{ flex:1; min-width:0; }
.item .title{ font-size:15px; font-weight:700; line-height:1.35; word-break:break-all; }
.item .code{ font-size:12px; color:var(--muted); margin-top:3px; word-break:break-all; }
.item .count{ font-size:26px; font-weight:700; margin-top:4px; }
.item .count small{ font-size:14px; color:var(--muted); font-weight:400; }
.item.done{ border-color:var(--ok); background:#eefaf2; }
.item.done .count{ color:var(--ok); }
.item.over{ border-color:var(--ng); background:#fdeeee; }
.item.unknown{ border-style:dashed; border-color:var(--warn); }
.item .manual.sub{ border-color:#9aa5ae; background:#fff; color:#3d4a55; font-size:13px; padding:6px 10px; }
.item .manual.undo{ border-color:#bbb; background:#fff; color:#777; font-size:13px; padding:6px 10px; }
.item .manual{ margin-top:6px; font-size:14px; padding:8px 12px; border-radius:8px; border:1px solid var(--warn); background:#fff8e8; color:#7a4d00; }
/* 資材指定のSKU */
.item.mat{ border-color:var(--warn); border-width:4px; }
.matbadge{ margin-top:6px; background:#fff3c4; border:2px solid var(--warn); border-radius:8px; padding:6px 10px; font-size:16px; font-weight:700; color:#7a4d00; white-space:pre-wrap; word-break:break-all; }

.matedit{ margin-top:6px; margin-left:auto; font-size:12px; padding:4px 8px; border-radius:6px; border:1px solid #ccc; background:#fff; color:#777; }
#flash.mat{ background:rgba(214,137,16,.95); }
/* 使った資材を選ぶ画面・使用枚数の集計 */
#matPick, #usageView{ display:none; position:fixed; inset:0; z-index:30; background:rgba(20,30,40,.7); align-items:flex-start; justify-content:center; padding:20px 12px; overflow:auto; }
#matPick.on, #usageView.on{ display:flex; }
.mp-box, .uv-box{ background:#fff; border-radius:14px; padding:16px; width:100%; max-width:560px; }

.foot{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); z-index:6; }

/* 配送管理アプリの検品書（タイルで選ぶ） */
.us-box{ background:#fff; border:3px solid var(--accent); border-radius:12px; margin-bottom:14px; overflow:hidden; }

.us-bhead{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 12px; }
.us-bhead b{ font-size:16px; flex:1; } .us-bhead .manual{ margin-top:0; }
.us-tag{ display:inline-block; font-size:11px; font-weight:700; background:var(--accent); color:#fff; border-radius:4px; padding:1px 6px; }

.us-msg{ padding:8px 12px; font-size:14px; font-weight:700; border-top:1px solid var(--line); }
.us-msg.ng{ background:#fdeeee; color:var(--ng); } .us-msg.ok{ background:#eefaf2; color:var(--ok); }
.us-it{ display:flex; gap:12px; padding:12px; border-top:1px solid var(--line); align-items:flex-start; }

.us-big{ width:130px; height:130px; object-fit:contain; border-radius:8px; background:#f5f6f6; flex:none; }
.us-noimg{ display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); text-align:center; }
.us-note{ background:#fff8e8; border-radius:6px; padding:4px 8px; font-size:13px; white-space:pre-wrap; margin-top:4px; }

.us-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
.us-tile{ position:relative; display:flex; flex-direction:column; gap:4px; padding:6px; border:2px solid var(--line); border-radius:10px; background:#fff; text-align:left; font:inherit; color:inherit; }
.us-timg{ width:100%; height:auto; aspect-ratio:1/1; object-fit:contain; border-radius:6px; background:#f5f6f6; }
.us-tile .tn{ font-size:12px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.us-tile .tm{ font-size:12px; color:var(--muted); }
.us-tile .tq{ position:absolute; top:4px; right:4px; background:var(--ink); color:#fff; border-radius:6px; padding:2px 8px; font-weight:700; font-size:18px; line-height:1.2; box-shadow:0 0 0 2px #fff; }
.us-tile .tq.many{ background:var(--ng); font-size:20px; }
.us-tile .tnote{ font-size:12px; line-height:1.35; background:#fff3c4; border:1px solid var(--warn); border-radius:4px; padding:2px 4px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-wrap; }
.us-qty{ display:inline-flex; align-items:baseline; gap:6px; margin:6px 0; padding:6px 14px; border-radius:8px; background:#e8eef2; font-weight:700; font-size:16px; }
.us-qty b{ font-size:34px; line-height:1; }
.us-qty.many{ background:var(--ng); color:#fff; }
.us-qty small{ font-size:12px; font-weight:400; }
.us-memo{ background:#fff3c4; border:2px solid var(--warn); border-radius:8px; padding:8px 10px; font-size:15px; font-weight:700; white-space:pre-wrap; margin-top:6px; word-break:break-all; }
.us-tile .tc{ position:absolute; top:4px; left:4px; background:var(--accent); color:#fff; border-radius:4px; padding:0 6px; font-weight:700; font-size:12px; }
.us-tile .tb{ font-size:11px; font-weight:700; color:#7a4d00; background:#fff8e8; border:1px solid var(--warn); border-radius:4px; padding:0 4px; width:max-content; }
.us-tile.done{ opacity:.45; border-color:var(--ok); } .us-tile.stop{ border-color:var(--ng); }
.us-tile.sel{ border-color:var(--accent); box-shadow:0 0 0 3px #f4c842; }
@media (max-width:480px){ .us-grid{ grid-template-columns:repeat(3,1fr); } .us-big{ width:96px; height:96px; } }
</style>
</head>
<body>
<header>
  <div class="order" id="orderNo">受注番号：</div>
  <div class="progress" id="progress">読み込み中…</div>
  <div class="bar"><i id="bar"></i></div>
</header>
<main>
  <div class="allok" id="allok">✓ 梱包OK<div id="allokSub" style="font-size:14px;font-weight:400;margin-top:6px;">次の検品シートのQRを読むと、次の注文に進みます</div><div id="allokMat" style="font-size:16px;margin-top:8px;"></div></div>
  <div id="labelTag" style="display:none;margin:6px 0;padding:8px 10px;border-radius:8px;font-weight:700;font-size:14px"></div>
  <div id="holdBox" style="display:none;margin:6px 0"></div>
  <div id="list"></div>
  <div class="note" id="cacheNote"></div>
</main>
<div class="foot">
  <div class="row">
    <button class="btn" id="scanBtn">📷 商品のシールをスキャン</button>
    <button class="btn ghost" id="resetBtn">やり直し</button>
    <button class="btn ghost" id="usageBtn" title="資材の使用枚数">📊</button>
  </div>

</div>

  <div id="reader"></div>

</div>
<div id="flash"><div class="big" id="flashBig"></div><div class="small" id="flashSmall"></div></div>
<!-- 梱包OKのあとに「使った資材」を選ぶ（全注文で記録して、使用枚数を集計する） -->
<div id="matPick"><div class="mp-box">
  <div class="mp-title" id="mpTitle">使った資材を選んでください</div>
  <div class="mp-sub" id="mpSub"></div>
  <input id="mpFilter" type="search" placeholder="ほかの資材を探す（例：120、封筒）" autocomplete="off" style="width:100%;margin-top:10px;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px">
  <div class="mp-grid" id="mpGrid"></div>
  <button type="button" class="mp-link" id="mpMore" style="display:none;margin-top:6px;font-size:14px"></button>
  <div class="mp-row">
    <button type="button" class="mp-btn mp-small" id="mpOther">その他（入力）</button>
    <button type="button" class="mp-btn mp-small" id="mpNone">資材を使っていない（再利用など）</button>
  </div>
  <div class="mp-row"><button type="button" class="mp-link" id="mpEdit">資材の一覧を編集</button><button type="button" class="mp-link" id="mpCancel" style="display:none">閉じる（変えない）</button></div>
  <div id="mpMsg"></div>
</div></div>
<!-- 資材の使用枚数（月ごと） -->
<div id="usageView"><div class="uv-box">
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <b style="font-size:17px;flex:1">📊 資材の使用枚数</b>
    <input type="month" id="uvMonth">
    <button type="button" class="mp-btn mp-small" id="uvCsv">CSV</button>
    <button type="button" class="mp-btn mp-small" id="uvClose">閉じる</button>
  </div>
  <div id="uvOrder" style="margin-top:10px"></div>
  <div id="uvBody" style="margin-top:10px"></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, query, where, documentId, serverTimestamp, onSnapshot, deleteField, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
  authDomain: "souko-2de57.firebaseapp.com",
  projectId: "souko-2de57",
  storageBucket: "souko-2de57.firebasestorage.app"
});
const db = getFirestore(app);

/* ---------- 共通 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const toHalf = s => String(s || '').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ');
const norm = s => toHalf(s).trim().toUpperCase();

/* ---------- QRの中身を読む： #o=受注番号&i=コード*数量,…
   ?コード:商品名*数量 ＝ マスタにあるがバーコードなし（おまけ等）、!コード:商品名*数量 ＝ マスタ未登録。どちらも目視で確認 ---------- */
function parseHash() {
  const h = location.hash.replace(/^#/, '');
  const out = { order: '', items: [], us: '', nos: [], trk: '' };
  h.split('&').forEach(part => {
    const eq = part.indexOf('=');
    if (eq < 0) return;
    const k = part.slice(0, eq), v = part.slice(eq + 1);
    if (k === 'o') out.order = safeDecode(v);
    if (k === 'u') out.us = safeDecode(v);
    if (k === 'n') out.nos = [...new Set(v.split(',').map(Number).filter(Boolean))];
    if (k === 't') out.trk = safeDecode(v);
    if (k === 'i') v.split(',').filter(Boolean).forEach(t => {
      const star = t.lastIndexOf('*');
      let code = star >= 0 ? t.slice(0, star) : t;
      const qty = star >= 0 ? (parseInt(t.slice(star + 1), 10) || 1) : 1;
      const kind = code.startsWith('?') ? 'nobc' : code.startsWith('!') ? 'unreg' : '';
      let name = '';
      if (kind) {
        code = code.slice(1);
        const c = code.indexOf(':');
        if (c >= 0) { name = safeDecode(code.slice(c + 1)); code = code.slice(0, c); }
      }
      out.items.push({ code: safeDecode(code), name, qty, kind, unknown: !!kind, scanned: 0 });
    });
  });
  return out;
}
function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }

/* ---------- zaicoの在庫の写し（まとまるくんと同じ zaico_inventory_cache）から 名前・画像 を引く ----------
   読み取り回数を抑えるため、端末に「コード → 名前・画像」を保存して使い回す。
   必要なコードが見つからないとき・6時間たったときだけ読み直す */
const LS_KEY = 'pack_zaico_map_v2';   // v1（画像なしで保存されたもの）は使わない
const MAX_AGE = 6 * 60 * 60 * 1000;
function readLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }
function writeLocal(o) { try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) { console.warn(e); } }
function imgOf(x) {
  const u = (x.item_image && x.item_image.url) || x.imageUrl || x.image_url || x.img || '';
  return typeof u === 'string' ? u : '';
}
async function fetchZaicoMap() {
  const ref = doc(db, 'zaico_inventory_cache', 'current');
  const meta = (await getDoc(ref)).data();
  if (!meta) throw new Error('在庫の写しがまだありません（まとまるくんを一度開いてください）');
  const ps = await getDocs(collection(ref, 'parts'));
  const parts = ps.docs.map(d => d.data()).filter(p => p.v === meta.v).sort((a, b) => a.i - b.i);
  if (parts.length !== meta.parts) throw new Error('在庫の写しを作り直している途中です。少し待ってから開き直してください');
  const base = JSON.parse(parts.map(p => p.s).join(''));
  const map = {};
  let withImg = 0;
  base.forEach(x => {
    const c = norm(x.code);
    if (!c) return;
    const img = imgOf(x);
    if (img) withImg++;
    map[c] = { t: String(x.title || ''), img };
  });
  const o = { at: Date.now(), v: meta.v, withImg, map, src: 'cache' };
  // 在庫の写しに画像のURLが入っていないときは、zaicoの在庫一覧を返す関数から画像だけ取り寄せる
  if (!withImg) {
    o.imgTried = Date.now();
    try { await fillImagesFromList(o); } catch (e) { console.warn('zaicoから画像を取り寄せられませんでした', e); o.imgError = e.message; }
  }
  writeLocal(o);
  return o;
}
const URL_LIST_ZAICO_INVENTORIES = "https://asia-northeast1-souko-2de57.cloudfunctions.net/apiListZaicoInventories";
async function fillImagesFromList(o) {
  let page = 1, n = 0, seen = 0;
  for (let guard = 0; page && guard < 200; guard++) {
    $('cacheNote').textContent = `zaicoから商品画像を読み込んでいます…（${seen.toLocaleString()}件）`;
    const res = await fetch(`${URL_LIST_ZAICO_INVENTORIES}?page=${page}&pages=10`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'zaicoの在庫一覧を取得できませんでした');
    (data.items || []).forEach(x => {
      seen++;
      const c = norm(x.code), img = imgOf(x);
      if (!c) return;
      if (!o.map[c]) o.map[c] = { t: String(x.title || ''), img: '' };
      if (img) { o.map[c].img = img; n++; }
    });
    page = data.nextPage || null;
  }
  o.withImg = n;
  o.src = n ? 'list' : 'cache';
  if (!n) o.imgError = 'zaicoの在庫一覧の関数も画像のURLを返していません';
}
async function getZaicoMap(codes) {
  const local = readLocal();
  const fresh = local && Date.now() - local.at < MAX_AGE;
  const allFound = local && codes.every(c => local.map[norm(c)]);
  // 画像が取れなかったときは、1時間たったらもう一度試す
  const imgRetry = local && !local.withImg && (!local.imgTried || Date.now() - local.imgTried > 60 * 60 * 1000);
  if (fresh && allFound && !imgRetry) return local;
  try { return await fetchZaicoMap(); }
  catch (e) { if (local) { console.warn(e); return local; } throw e; }
}


/* ===================================================================
   US吉田様など「配送管理アプリ」の検品書QR（#u=お客様ID&n=No.,…&t=追跡番号）
   商品のバーコードがないので、タイルで商品を選んで目で照合する。
   「箱に入れた」で梱包済み（orders/{No}.pack）と入荷日（シート・空のときだけ）を入れる
   =================================================================== */
const auth = getAuth(app);
let authUser = null, authReadyResolve;
const authReady = new Promise(r => authReadyResolve = r);
onAuthStateChanged(auth, u => {
  authUser = u; authReadyResolve(); if (state.us && US.needLogin && u) usStart();
  // ログイン必須：ログインしていなければ画面を覆う（キャンセル済みの警告・送り状の照合にログインが要るため）
  const g = document.getElementById('loginGate'); if (g) g.style.display = u ? 'none' : 'flex';
  if (u) { const n = document.getElementById('loginNote'); if (n) n.remove(); watchCancels(); if (!state.us && state.order) checkOrderCanceled(); }
});
document.getElementById('gateLoginBtn').onclick = () => {
  document.getElementById('gateErr').textContent = '';
  const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt:'select_account' });
  signInWithPopup(auth, p).catch(err => { if (!/popup-closed|cancelled-popup/.test(err.code || '')) document.getElementById('gateErr').textContent = 'ログインできませんでした：' + err.message; });
};
const US = { cfgId:'', pre:null, labeled:new Set(), cfg:null, rows:{}, flags:{}, sel:null, needLogin:false, pf:'', q:Promise.resolve() };
const ordRef = no => doc(db, 'deliveryClients', state.us, 'orders', String(no));
const oidOf = s => String(s == null ? '' : s).trim();
const NO_OID = o => !o || o === '有在庫用';
const squash = s => String(s == null ? '' : s).replace(/\s+/g, '').slice(0, 60);
const keyOf = r => { const o = oidOf(r && r.orderId); return NO_OID(o) ? (o || '空欄') + '|' + squash(r && r.name) + '|' + squash((r && r.asin) || (r && r.item)) : o; };
const hasProc = r => !!(r && (r.arrivedAt || r.shippedAt || r.tracking));
const matches = (r, want) => { want = oidOf(want); if (!want) return true; return want.indexOf('|') >= 0 ? keyOf(r) === want : oidOf(r && r.orderId) === want; };
const procOf = s => s ? oidOf(s.procKey || s.procOrderId || (hasProc(s) ? keyOf(s) : '')) : '';
const qtyNum = v => { const m = String(v == null ? '' : v).normalize('NFKC').match(/\d+(?:\.\d+)?/); return m ? Number(m[0]) : 0; };
const noteNos = n => (String(n || '').match(/(?<!\d)\d{5,6}(?!\d)/g) || []).map(Number);
const md = s => { const m = String(s || '').match(/^\d{4}-(\d{2})-(\d{2})$/); return m ? Number(m[1]) + '/' + Number(m[2]) : (s || ''); };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const usPacked = no => !!(US.flags[no] && US.flags[no].pack && US.flags[no].pack.done);
function usStop(no){
  const r = US.rows[no], f = US.flags[no] || {};
  const proc = procOf(f);
  if (proc && hasProc(r) && !matches(r, proc)) return '注文番号が処理したときと違う（シートを確認）';
  // 備考欄の「出荷保留」は、解除した記録（releaseReason）があれば止めない（USくんと同じ扱い）
  if ((f.hold && f.hold.active) || (/出荷保留/.test(r.note || '') && !(f.hold && f.hold.releaseReason))) return '出荷保留';
  if (f.inquiry && f.inquiry.active) return '問い合わせ中';
  return '';
}
const US_ERR = { 'unauthorized':'配送管理アプリの API_KEY が違います', 'sheet not found':'シートが見つかりません', 'unexpected header':'シートの列の並びが変わっています' };
async function usGas(action, extra){
  const c = US.cfg;
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 60000);
  let res;
  try{ res = await fetch(c.gasUrl, { method:'POST', body: JSON.stringify(Object.assign({ action, key:c.apiKey, sheetId:c.sheetId, sheetName:c.sheetName || '入力シート' }, extra || {})), signal: ctrl.signal }); }
  catch(e){ throw new Error(e.name === 'AbortError' ? 'シートから60秒応答がありませんでした' : 'シート（連携GAS）につながりませんでした'); }
  finally{ clearTimeout(timer); }
  let j; try{ j = await res.json(); }catch(e){ throw new Error('シート（連携GAS）の応答を読み取れませんでした'); }
  if (!j.ok) throw new Error(US_ERR[j.error] || ('エラー：' + j.error));
  return j;
}
async function usStart(){
  $('scanBtn').textContent = '📷 検品書のQRを読む';
  $('resetBtn').style.display = 'none';
  $('cacheNote').textContent = '';
  $('allok').classList.remove('show');
  $('orderNo').textContent = (state.nos.length ? '検品書：' : '荷物：') + (state.trk || '') + (state.nos.length ? '（' + state.nos.length + '件）' : '');
  $('progress').textContent = '読み込み中…';
  $('bar').style.width = '0';
  window.scrollTo(0, 0);
  await authReady;
  if (!authUser) {
    US.needLogin = true;
    $('progress').textContent = 'ログインしてください';
    $('list').innerHTML = '<div class="err" style="color:var(--ink)">配送管理アプリの検品書です。初回だけ、社内のGoogleアカウントでログインしてください（この端末で一度ログインすれば、次からは不要です）。<br><button class="btn" id="usLogin" style="margin-top:12px;width:100%">Googleでログイン</button></div>';
    return;
  }
  US.needLogin = false;
  try{
    try{ localStorage.setItem('pack_us_client', state.us); }catch(e){}
    if (!US.cfg || US.cfgId !== state.us) { US.cfg = (await getDoc(doc(db, 'deliveryClients', state.us))).data(); US.cfgId = state.us; }
    if (!US.cfg || !US.cfg.gasUrl) throw new Error('配送管理アプリの設定（お客様ID ' + state.us + '）が読めません');
    let list;
    if (state.nos.length) list = (await usGas('search', { mode:'no', values: state.nos })).rows || [];
    else {
      // 倉庫追跡番号をスキャンして開いたとき：その荷物の注文のうち、まだ出荷していないもの
      const all = (US.pre && US.pre.trk === state.trk) ? US.pre.rows : ((await usGas('search', { mode:'tracking', values:[state.trk] })).rows || []);
      US.pre = null;
      list = all.filter(r => !r.shippedAt);
      if (!list.length) throw new Error(all.length ? '倉庫追跡番号 ' + state.trk + ' の注文は、全部出荷済みです' : '倉庫追跡番号 ' + state.trk + ' の注文がシートにありません');
      state.nos = list.map(r => r.no).sort((a,b) => a - b);
      $('orderNo').textContent = '荷物：' + state.trk + '（' + state.nos.length + '件' + (all.length > list.length ? '・出荷済み ' + (all.length - list.length) + '件は除く' : '') + '）';
    }
    US.rows = {}; list.forEach(r => { US.rows[r.no] = r; });
    US.flags = {};
    const ids = Object.keys(US.rows);
    for (let i = 0; i < ids.length; i += 30) {
      const snap = await getDocs(query(collection(db, 'deliveryClients', state.us, 'orders'), where(documentId(), 'in', ids.slice(i, i + 30))));
      snap.forEach(d => { US.flags[Number(d.id)] = d.data(); });
    }
    US.sel = null; US.pf = ''; US.labeled = new Set();
    const lost = state.nos.filter(n => !US.rows[n]);
    $('cacheNote').textContent = lost.length ? '※ シートに見つからないNo.：' + lost.join('、') : '';
    usRender();
  }catch(e){
    $('progress').textContent = '読み込めませんでした';
    $('list').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
  }
  keepFocus();
}
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'usLogin') {
    const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt:'select_account' });
    signInWithPopup(auth, p).catch(err => { if (!/popup-closed|cancelled-popup/.test(err.code || '')) alert('ログインできませんでした：' + err.message); });
  }
});
// 同じ箱に入る注文（同じ注文番号・備考欄の「同梱」とNo.）
function usBundle(no){
  const all = Object.values(US.rows), seen = new Set([no]), missing = new Set(), q = [no];
  const add = n => { if (seen.has(n)) return; if (US.rows[n]) { seen.add(n); q.push(n); } else missing.add(n); };
  while (q.length) {
    const r = US.rows[q.shift()]; if (!r) continue;
    const oid = oidOf(r.orderId);
    if (!NO_OID(oid)) all.forEach(x => { if (oidOf(x.orderId) === oid) add(x.no); });
    if (/同梱/.test(r.note || '')) noteNos(r.note).forEach(add);
    all.forEach(x => { if (/同梱/.test(x.note || '') && noteNos(x.note).includes(r.no)) add(x.no); });
  }
  return { nos:[...seen].sort((a,b) => a - b), missing:[...missing].sort((a,b) => a - b) };
}
const usImg = (r, cls) => r.imageUrl ? '<img class="' + cls + '" src="' + esc(r.imageUrl) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;' + cls + ' us-noimg&quot;>画像なし</div>\'">' : '<div class="' + cls + ' us-noimg">画像なし</div>';
function usTiles(){
  const map = new Map();
  Object.values(US.rows).sort((a,b) => a.no - b.no).forEach(r => {
    const k = squash(r.item) + '|' + (r.imageUrl || '') + '|' + squash(r.note) + '|' + qtyNum(r.qty);   // 備考・数量が違う注文は別のタイルにする
    if (!map.has(k)) map.set(k, { key:k, rows:[] });
    map.get(k).rows.push(r);
  });
  const words = US.pf.trim().toLowerCase().split(/[\s　]+/).filter(Boolean);
  return [...map.values()].map(t => {
    t.todo = t.rows.filter(r => !usPacked(r.no) && !usStop(r.no));
    t.stop = t.rows.filter(r => usStop(r.no));
    t.qty = t.todo.reduce((s, r) => s + (qtyNum(r.qty) || 1), 0);
    return t;
  }).filter(t => !words.length || words.every(w => (t.rows[0].item + ' ' + t.rows.map(r => r.no + ' ' + r.name).join(' ')).toLowerCase().includes(w)))
    .sort((a,b) => (!a.todo.length) - (!b.todo.length) || (a.rows.every(hasPkg) - b.rows.every(hasPkg)) || a.rows[0].no - b.rows[0].no);
}
function usRender(){
  const rows = Object.values(US.rows);
  const stopN = rows.filter(r => usStop(r.no) && !usPacked(r.no)).length;
  const total = rows.length - stopN, done = rows.filter(r => usPacked(r.no)).length;
  $('progress').textContent = done + ' / ' + total + ' 件' + (stopN ? '（梱包しない ' + stopN + '件）' : '');
  $('bar').style.width = total ? Math.min(100, done / total * 100) + '%' : '0';
  $('allok').classList.toggle('show', !!rows.length && done >= total);
  // 開いている箱
  let box = '';
  if (US.sel) {
    const b = usBundle(US.sel), rs = b.nos.map(n => US.rows[n]);
    const stops = rs.filter(r => usStop(r.no));
    const allIn = rs.every(r => usPacked(r.no) || usStop(r.no)) && !b.missing.length;
    box = '<div class="us-box' + (stops.length ? ' stop' : allIn ? ' ok' : '') + '">'
      + '<div class="us-bhead"><b>📦 箱：No.' + b.nos.join('、No.') + '</b>' + (b.nos.length + b.missing.length > 1 ? '<span class="us-tag">同梱 ' + (b.nos.length + b.missing.length) + '件</span>' : '') + (b.nos.some(n => US.labeled.has(n)) ? '<span class="us-tag" style="background:var(--ok)">✓ 送り状照合済み</span>' : '<span class="us-tag" style="background:#9aa5ae">送り状 未照合</span>')
      + '<button class="manual undo" data-us="close">閉じる</button></div>'
      + stops.map(r => '<div class="us-msg ng">⚠ No.' + r.no + 'は' + esc(usStop(r.no)) + 'のため、箱に入れないでください</div>').join('')
      + (b.missing.length ? '<div class="us-msg ng">⚠ 同梱の相手 No.' + b.missing.join('、No.') + ' は別の検品書です。その商品もそろってから閉じてください</div>' : '')
      + (allIn && !stops.length ? '<div class="us-msg ok">✓ この箱は梱包OK</div>' : '')
      + rs.map(r => {
          const p = usPacked(r.no), stop = usStop(r.no), q = qtyNum(r.qty), f = US.flags[r.no] || {};
          const spec = (r.deliveryDate || r.deliveryTime) ? '<span class="us-tag warn">指定 ' + esc(md(r.deliveryDate)) + ' ' + esc(r.deliveryTime || '') + '</span>' : '';
          return '<div class="us-it' + (p ? ' done' : '') + '">' + usImg(r, 'us-big')
            + '<div class="info"><div class="code"><b style="font-size:16px;color:var(--ink)">No.' + r.no + '</b>　' + esc(r.shop || '') + ' ' + spec + '</div>'
            + '<div class="us-qty' + (q >= 2 ? ' many' : '') + '">数量 <b>' + (q || 1) + '</b> 個' + (q >= 2 ? '　⚠ ' + q + '個入れる' : '') + (String(r.qty || '').trim() && String(r.qty).trim() !== String(q) ? '<small>（シート：' + esc(r.qty) + '）</small>' : '') + '</div>'
            + '<div class="title">' + esc(r.item || '（商品名なし）') + '</div>'
            + '<div class="code">お届け先：<b style="color:var(--ink)">' + esc(r.name || '') + '</b>　' + (hasPkg(r) ? 'PKGID ' + esc(r.pkgId) + '　' : '<b style="color:var(--warn)">バーコードなし</b>　') + (r.arrivedAt ? '入荷 ' + esc(md(r.arrivedAt)) : '未入荷') + '</div>'
            + (f.storage && f.storage.active ? '<div class="us-note">📦 保管中' + (f.storage.memo ? '：' + esc(f.storage.memo) : '') + '</div>' : '')
            + (r.note ? '<div class="us-memo">📝 備考：' + esc(r.note) + '</div>' : '')
            + (stop ? '<div class="us-msg ng" style="margin:0">入れない</div>'
               + (/^注文番号/.test(stop) ? ''
                  : r.arrivedAt ? '<div class="code" style="margin-top:6px">入荷日：' + esc(md(r.arrivedAt)) + '（入力済み）</div>'
                  : '<button class="btn ghost" style="width:100%;margin-top:6px" data-us="arr" data-no="' + r.no + '">入荷日だけ入れる（' + esc(stop) + '）</button>')
               + (/^(出荷保留|問い合わせ中)$/.test(stop) ? '<button class="btn ghost" style="width:100%;margin-top:6px;border-color:var(--warn);color:var(--warn)" data-us="release" data-no="' + r.no + '">' + esc(stop) + 'を解除して箱に入れる</button>' : '')
               : p ? '<div style="display:flex;gap:8px;align-items:center"><b style="color:var(--ok)">✓ 入れた</b><button class="manual undo" data-us="undo" data-no="' + r.no + '">戻す</button></div>'
               : '<button class="btn" style="width:100%;margin-top:6px" data-us="in" data-no="' + r.no + '">箱に入れた</button>')
            + '</div></div>';
        }).join('') + '</div>';
  }
  const tiles = usTiles(), selSet = new Set(US.sel ? usBundle(US.sel).nos : []);
  const grid = '<div class="us-ghead"><b>' + (US.sel ? '送り状のバーコードを読むと照合して「箱に入れた」になります／次の商品' : '商品のPKGIDをスキャン（バーコードがない商品はタップ）') + '</b>'
    + (rows.length > 8 ? '<input id="usPf" type="search" placeholder="商品名・No.・お届け先で絞り込み" value="' + esc(US.pf) + '" autocomplete="off">' : '') + '</div>'
    + '<div class="us-grid">' + tiles.map(t => {
      const r = t.rows[0], done = !t.todo.length && !t.stop.length;
      const many = t.todo.length > 1 || t.todo.some(x => qtyNum(x.qty) >= 2);
      return '<button class="us-tile' + (done ? ' done' : '') + (t.stop.length ? ' stop' : '') + (t.rows.some(x => selSet.has(x.no)) ? ' sel' : '') + '" data-us="pick" data-key="' + esc(t.key) + '">'
        + usImg(r, 'us-timg')
        + (t.rows.length > 1 ? '<span class="tc">' + t.rows.length + '注文</span>' : '')
        + '<span class="tq' + (qtyNum(r.qty) >= 2 && !done ? ' many' : '') + '">' + (done ? '✓' : (qtyNum(r.qty) || 1) + '個') + '</span>'
        + '<span class="tn">' + esc(r.item || '（商品名なし）') + '</span>'
        + (r.note ? '<span class="tnote">📝 ' + esc(r.note) + '</span>' : '')
        + (t.rows.every(hasPkg) ? '' : '<span class="tb">バーコードなし</span>')
        + '<span class="tm">' + (t.rows.length > 1 ? t.rows.length + '注文（各' + (qtyNum(r.qty) || 1) + '個）' : 'No.' + r.no)
        + (t.stop.length ? ' <b style="color:var(--ng)">' + esc(usStop(t.stop[0].no)) + '</b>' : done ? ' 済' : t.rows.length > 1 ? ' 残り' + t.todo.length : '') + '</span></button>';
    }).join('') + '</div>';
  const hadPf = document.activeElement && document.activeElement.id === 'usPf';
  $('list').innerHTML = box + grid;
  if (hadPf && $('usPf')) { const i = $('usPf'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
$('list').addEventListener('input', e => { if (e.target.id === 'usPf') { US.pf = e.target.value; usRender(); } });
$('list').addEventListener('click', async e => {
  if (!state.us) return;
  const b = e.target.closest('[data-us]'); if (!b) return;
  const act = b.dataset.us, no = Number(b.dataset.no);
  if (act === 'close') { US.sel = null; usRender(); return; }
  if (act === 'pick') {
    const t = usTiles().find(x => x.key === b.dataset.key); if (!t) return;
    const r = t.todo[0] || t.stop[0] || t.rows[0];
    US.sel = r.no; usRender(); window.scrollTo({ top:0, behavior:'smooth' });
    if (usStop(r.no)) { beep(false); flash(false, '⚠ No.' + r.no + 'は' + usStop(r.no), '箱に入れないでください\n（タップ・Escで閉じる）'); }
    return;
  }
  if (act === 'arr') {
    // 出荷保留・問い合わせ中：箱には入れないが、届いているので入荷日だけ入れる
    b.disabled = true; b.textContent = '入荷日を入れています…';
    usArriveBg(no);
    US.q.then(() => usRender());
    return;
  }
  if (act === 'release') {
    // 出荷保留・問い合わせ中を、梱包くんから解除する（USくんの「問い合わせ・保留・保管」と同じ記録）
    const stop = usStop(no);
    if (!confirm('No.' + no + 'の「' + stop + '」を解除しますか？\n解除すると、箱に入れられるようになり、出荷通知CSVにも入ります。' + (/出荷保留/.test((US.rows[no] || {}).note || '') ? '\n（シートの備考欄の「出荷保留」はそのまま残ります。解除した記録が優先されます）' : ''))) return;
    b.disabled = true;
    const now = new Date().toISOString(), email = (authUser && authUser.email) || '';
    try {
      const f = US.flags[no] = US.flags[no] || {};
      if (stop === '出荷保留') {
        const hold = { active:false, releasedAt:now, releasedBy:email, releaseReason:'梱包くんで解除' };
        await setDoc(ordRef(no), { hold }, { merge:true });
        f.hold = Object.assign({}, f.hold || {}, hold);
      } else {
        const inquiry = { active:false, resolvedAt:serverTimestamp(), resolvedBy:email, resolution:'梱包くんで解除' };
        await setDoc(ordRef(no), { inquiry }, { merge:true });
        f.inquiry = Object.assign({}, f.inquiry || {}, { active:false });
      }
      beep(true); flash(true, 'No.' + no + 'の' + stop + 'を解除しました', '箱に入れてください', 1500);
      US.sel = no; usRender();
    } catch (e) { b.disabled = false; alert('解除できませんでした：' + e.message); }
    return;
  }
  if (act === 'undo') {
    if (!confirm('No.' + no + 'の「箱に入れた」を取り消しますか？（入荷日はそのまま残ります）')) return;
    b.disabled = true; await usSetPack(no, false); usRender(); return;
  }
  if (act === 'in') { b.disabled = true; if (!(await usPutIn(no))) b.disabled = false; }
});
async function usPutIn(no, note){
  if (!(await usSetPack(no, true))) return false;
  note = note ? note + '\n' : '';
  if (!US.rows[no].arrivedAt) usArriveBg(no);
  beep(true);
  const bd = usBundle(no);
  const full = !bd.missing.length && bd.nos.every(n => usPacked(n) || usStop(n));
  const left = Object.values(US.rows).filter(r => !usPacked(r.no) && !usStop(r.no)).length;
  if (full) {
    flash(true, left ? '✓ 梱包OK' : '✓ この検品書は全部OK', note + (bd.nos.length > 1 ? '同梱 ' + bd.nos.length + '件そろいました' : 'No.' + no) + (left ? '\n残り ' + left + '件' : '\n次の検品書のQRを読んでください'), 1300);
    US.sel = null;
    askMatUs(bd.nos);
  } else flash(true, '✓ No.' + no + ' 入れた', note + '同梱のほかの商品も入れてください', 1200);
  usRender(); keepFocus();
  return true;
}
async function usSetPack(no, done){
  const now = new Date().toISOString(), email = (authUser && authUser.email) || '';
  const v = done ? { done:true, at:now, by:email, from:'梱包くん' } : { done:false, undoneAt:now, undoneBy:email };
  try{ await setDoc(ordRef(no), { pack:v }, { merge:true }); }
  catch(e){ alert('保存できませんでした：' + e.message); return false; }
  US.flags[no] = Object.assign({}, US.flags[no] || {}, { pack:v });
  return true;
}
// 入荷日（空のときだけ）。書く直前にシートを読み直して、注文が変わっていないか確かめる。梱包の手を止めないよう裏で順番に
function usArriveBg(no){
  US.q = US.q.then(async () => {
    try{
      const r = US.rows[no];
      const j = await usGas('search', { mode:'no', values:[no] });
      const cur = (j.rows || []).find(x => x.no === no);
      if (!cur) throw new Error('シートにNo.' + no + 'がありません');
      if (keyOf(cur) !== keyOf(r)) throw new Error('No.' + no + 'の注文番号がシートで変わっています');
      if (cur.arrivedAt) { r.arrivedAt = cur.arrivedAt; return; }
      const date = todayStr();
      await usGas('write', { updates:[{ no, rowNumber:cur.rowNumber, fields:{ arrivedAt:date } }] });
      r.arrivedAt = date;
      await setDoc(ordRef(no), { arrivedAt:date, procOrderId:oidOf(r.orderId), procKey:keyOf(r), arrivedLoggedAt:serverTimestamp(), arrivedBy:(authUser && authUser.email) || '' }, { merge:true }).catch(e => console.warn(e));
      $('cacheNote').textContent = 'No.' + no + '：入荷日を入れました（' + md(date) + '）';
      if (US.sel) usRender();
    }catch(e){ $('cacheNote').textContent = '⚠ No.' + no + 'の入荷日を入れられませんでした：' + e.message + '（配送管理アプリの「入荷済みにする」で入れてください）'; }
  });
}
// 倉庫追跡番号（荷物の配送伝票のバーコード）を読んだとき：シートで探して、あればその荷物を開く
function trkCode(raw){
  let c = String(raw || '').normalize('NFKC').toUpperCase().replace(/[^0-9A-Z]/g, '');
  if (/^[A-D]\d{6,}[A-D]$/.test(c)) c = c.slice(1, -1);   // ヤマト・佐川の伝票のバーコード（前後の英字）
  return /^[0-9A-Z]{8,30}$/.test(c) && /\d{6,}/.test(c) ? c : '';
}
const usClient = () => state.us || (() => { try{ return localStorage.getItem('pack_us_client'); }catch(e){ return null; } })() || '150';
async function usTryTracking(raw){
  const c = trkCode(raw); if (!c) return false;
  const cid = usClient();
  await authReady;
  if (!authUser) { openOrder('u=' + encodeURIComponent(cid) + '&t=' + c); return true; }   // ログインの案内を出す
  try{
    if (!US.cfg || US.cfgId !== cid) { US.cfg = (await getDoc(doc(db, 'deliveryClients', cid))).data(); US.cfgId = cid; }
    if (!US.cfg || !US.cfg.gasUrl) return false;
    $('cacheNote').textContent = '倉庫追跡番号 ' + c + ' をシートで探しています…';
    const j = await usGas('search', { mode:'tracking', values:[c] });
    $('cacheNote').textContent = '';
    if (!j.rows || !j.rows.length) return false;
    US.pre = { trk:c, rows:j.rows };
    openOrder('u=' + encodeURIComponent(cid) + '&t=' + c);
    return true;
  }catch(e){ console.warn(e); $('cacheNote').textContent = ''; return false; }
}
// 送り状のバーコード（伝票番号）を、共有の発行済みデータ（shipments）で探す
//   どのアプリで取り込んだ発行済みCSVも shipments/{yamato|sagawa}_{伝票番号} に入っている。1回の照合で読み取り2回
async function usLabelLookup(raw){
  let c = String(raw || '').normalize('NFKC').toUpperCase().replace(/[^0-9A-Z]/g, '');
  if (/^[A-D]\d+[A-D]$/.test(c)) c = c.slice(1, -1);
  if (!/^\d{10,14}$/.test(c)) return null;
  // 直前に当たった配送会社から先に見る（見つかれば読み取り1回で済む）
  let first = 'yamato'; try { first = localStorage.getItem('pack_last_carrier') || 'yamato'; } catch (e) {}
  let hit = null;
  for (const k of [first, first === 'yamato' ? 'sagawa' : 'yamato']) {
    const x = await getDoc(doc(db, 'shipments', k + '_' + c)).catch(() => null);
    if (x && x.exists()) { hit = x; try { localStorage.setItem('pack_last_carrier', k); } catch (e) {} break; }
  }
  if (!hit) return { trk:c, d:null };
  const d = hit.data();
  let nos = Array.isArray(d.nos) && d.nos.length ? d.nos.map(Number) : [];
  if (!nos.length) { const m = String(d.items || '').match(/No\.?\s*([\d,，、\s]+)\)/i); if (m) nos = m[1].split(/[,，、\s]+/).map(Number).filter(Boolean); }
  return { trk:c, d, nos };
}
// 送り状を読んだときの照合。処理したら true（送り状でなければ false）
async function usLabelCheck(raw){
  const L = await usLabelLookup(raw);
  if (!L) return false;
  if (!L.d) return false;   // 共有の記録にない（倉庫追跡番号かもしれないので、ほかの探し方に回す）
  if (L.d.canceled) {
    beep(false);
    flash(false, '✕ この送り状は取り消し済みです', (L.d.carrierName || '') + ' ' + L.trk + (L.nos.length ? '（No.' + L.nos.join('、No.') + '）' : '') + '\nキャンセルの依頼で取り消された送り状です。貼らないでください（タップ・Escで閉じる）');
    return true;
  }
  const fmt = n => 'No.' + n + (US.rows[n] && US.rows[n].name ? '（' + US.rows[n].name + '）' : '');
  const mine = L.nos.filter(n => US.rows[n]);
  if (US.sel) {
    const bd = usBundle(US.sel);
    if (L.nos.some(n => bd.nos.includes(n))) {
      bd.nos.forEach(n => US.labeled.add(n));
      const target = bd.nos.includes(US.sel) && !usPacked(US.sel) && !usStop(US.sel) ? US.sel : bd.nos.find(n => !usPacked(n) && !usStop(n));
      if (target) { await usPutIn(target, '✓ 送り状OK（' + (L.d.carrierName || '') + ' ' + L.trk + '）'); return true; }
      beep(true); flash(true, '✓ 送り状OK', 'No.' + bd.nos.join('、No.') + '\nこの箱の商品は入れ終わっています', 1300); usRender(); return true;
    }
    beep(false);
    flash(false, '✕ 別の注文の送り状です', 'この送り状：' + (L.nos.length ? L.nos.map(fmt).join('、') : (L.d.name || '') + ' ' + (L.d.orderNo || '')) + '\n開いている箱：' + bd.nos.map(fmt).join('、') + '\n貼る送り状を確かめてください（タップ・Escで閉じる）');
    return true;
  }
  if (mine.length) {
    // 箱を開いていないときに送り状を読んだ → その注文を開く
    US.sel = mine.find(n => !usPacked(n) && !usStop(n)) || mine[0];
    usBundle(US.sel).nos.forEach(n => US.labeled.add(n));
    usRender(); window.scrollTo({ top:0, behavior:'smooth' });
    if (usStop(US.sel)) { beep(false); flash(false, '⚠ No.' + US.sel + 'は' + usStop(US.sel), '箱に入れないでください\n（タップ・Escで閉じる）'); return true; }
    beep(true); flash(true, '送り状：' + fmt(US.sel), '商品を確かめて、PKGIDをスキャン（または「箱に入れた」）', 1500);
    return true;
  }
  beep(false);
  flash(false, '✕ この検品書の注文の送り状ではありません', '読んだ送り状：' + L.trk + (L.nos.length ? '（No.' + L.nos.join('、No.') + '）' : '') + '\n（タップ・Escで閉じる）');
  return true;
}
// 検品書モードで商品のバーコードを読んだとき：PKGIDで注文を探して開く
// 開いている注文と同じPKGIDをもう一度読むと「箱に入れた」にする（スキャナだけで進められる）
const pkgNorm = v => String(v || '').normalize('NFKC').toUpperCase().replace(/[^0-9A-Z]/g, '');
const pkgList = r => String(r.pkgId || '').split(/[\s,、，\/]+/).map(pkgNorm).filter(x => x.length >= 4);
const hasPkg = r => pkgList(r).length > 0;
function usFindPkg(code){
  const c = pkgNorm(code); if (!c) return [];
  let hits = Object.values(US.rows).filter(r => pkgList(r).includes(c));
  // バーコードに余分な文字が付いているとき（前後に文字が付くなど）は、含まれているかで探す
  if (!hits.length && c.length >= 8) hits = Object.values(US.rows).filter(r => pkgList(r).some(t => t.length >= 8 && (c.includes(t) || t.includes(c))));
  return hits.sort((a,b) => a.no - b.no);
}
function usCheck(raw){
  const m = String(raw).normalize('NFKC').trim().match(/^(?:No\.?)?\s*0*(\d{3,6})$/i);
  if (m && US.rows[Number(m[1])]) { US.sel = Number(m[1]); usRender(); window.scrollTo({ top:0, behavior:'smooth' }); return; }
  const hits = usFindPkg(raw);
  if (!hits.length) {
    // PKGIDでなければ、送り状 → 次の荷物の倉庫追跡番号 の順に探す
    usLabelCheck(raw).then(done => done || usTryTracking(raw)).then(ok => {
      if (ok) return;
      beep(false);
      flash(false, '✕ この検品書の商品ではありません', '読んだコード：' + raw + '\nPKGID・送り状・倉庫追跡番号のどれにも見つかりません。'
        + (US.sel ? '送り状なら、発行済みデータがまだ取り込まれていないかもしれません（目で確かめて「箱に入れた」を押してください）' : 'バーコードがない商品は、画像のタイルから選んでください') + '\n（タップ・Escで閉じる）');
    });
    return;
  }
  // 開いている注文のPKGIDをもう一度読んだ → 箱に入れた
  const open = US.sel && hits.find(r => usBundle(US.sel).nos.includes(r.no) && !usPacked(r.no) && !usStop(r.no));
  if (open) { usPutIn(open.no); return; }
  const todo = hits.filter(r => !usPacked(r.no) && !usStop(r.no));
  const r = todo[0] || hits.find(x => usStop(x.no)) || hits[0];
  US.sel = r.no; usRender(); window.scrollTo({ top:0, behavior:'smooth' });
  if (usStop(r.no)) { beep(false); flash(false, '⚠ No.' + r.no + 'は' + usStop(r.no), '箱に入れないでください\n（タップ・Escで閉じる）'); return; }
  if (!todo.length) { beep(false); flash(false, 'この商品は梱包済みです', 'No.' + hits.map(x => x.no).join('、No.') + '\n二重に梱包していないか確かめてください（タップ・Escで閉じる）'); return; }
  const q = qtyNum(r.qty);
  beep(true);
  flash(true, 'No.' + r.no + '\n数量 ' + (q || 1) + '個' + (q >= 2 ? '（⚠ ' + q + '個入れる）' : ''), 'お届け先：' + (r.name || '') + (r.note ? '\n📝 備考：' + String(r.note).slice(0, 80) : '') + '\n送り状を貼って箱に入れたら、もう一度スキャン（または「箱に入れた」）', (q >= 2 || r.note) ? 2500 : 1500);
}

let state = parseHash();
let zmap = {};

function render() {
  $('orderNo').textContent = '受注番号：' + (state.order || '（不明）');
  const total = state.items.reduce((s, x) => s + x.qty, 0);
  const done = state.items.reduce((s, x) => s + Math.min(x.scanned, x.qty), 0);
  $('progress').textContent = `${done} / ${total} 点`;
  $('bar').style.width = total ? (done / total * 100) + '%' : '0';
  const allOk = state.items.length && state.items.every(x => x.scanned === x.qty);
  $('allok').classList.toggle('show', !!allOk);

  const lt = $('labelTag');
  lt.style.display = state.items.length ? '' : 'none';

    lt.textContent = '✕ この注文はキャンセル済みです。梱包しないでください（' + state.canceled + '）';

  }
  renderHold(allOk);
  if (holdOf()) $('allok').classList.remove('show');
  lt.style.background = state.label ? '#e4f3ea' : '#fff4d6'; lt.style.color = state.label ? '#1e7a46' : '#8a5a00';
  lt.textContent = state.label ? '✓ 送り状照合済み（' + state.label + '）' : '送り状 未照合：貼る送り状のバーコードを読むと、この注文の送り状か確かめます';
  const used = USED[orderUsageKey()];
  $('allokMat').innerHTML = used ? '📦 使った資材：' + esc(matFull(used.mat)) + (state.items.every(x => matOf(x.code) && matOf(x.code).mat === used.mat) ? '（資材指定）' : '') + '<button type="button" id="matChange">変更</button>' : '';
  if (used) $('matChange').onclick = () => openPick({ key: orderUsageKey(), codes: state.items.map(x => x.code), change: true, sub: '受注番号 ' + state.order + '\n今：' + used.mat + '\nこの注文の商品の資材指定も、選んだ資材に変わります', def: [used.mat], info: { order: state.order, src: 'sheet' } });
  $('allokSub').textContent = state.label ? '次の検品シートのQRを読むと、次の注文に進みます' : '送り状のバーコードを読んで照合してください（そのあと次の検品シートへ）';
  // 資材指定のSKUがある注文：上に注意を出し、開いたときに1回だけ画面全体で知らせる
  const mt = matText();
  if (mt && !state.matShown) { state.matShown = true; beep(false); flash(true, '📦 資材指定の商品があります', mt + '\n指定の資材で梱包してください', 1500, 'mat'); }

  $('list').innerHTML = (mt ? '<div class="matwarn">⚠ 資材指定あり：指定の資材で梱包してください\n' + esc(mt) + '</div>' : '') + state.items.map((x, i) => [x, i]).sort((a, b) => (a[0].unknown - b[0].unknown) || (a[1] - b[1])).map(([x, i]) => {
    const z = x.unknown ? null : zmap[norm(x.code)];
    const title = x.unknown ? (x.name || x.code) : (z && z.t ? z.t : '（zaicoに見つかりません）');
    const img = x.unknown
      ? `<div class="noimg" style="font-size:40px;">${x.kind === 'nobc' ? '🎁' : '❓'}</div>`
      : (z && z.img ? `<img src="${esc(z.img)}" alt="" loading="lazy">` : '<div class="noimg">画像なし</div>');
    const mat = matOf(x.code);
    const cls = ['item', x.scanned === x.qty ? 'done' : '', x.scanned > x.qty ? 'over' : '', x.unknown ? 'unknown' : '', mat ? 'mat' : ''].join(' ');
    const matHtml = (mat ? `<div class="matbadge" style="display:flex;gap:8px;align-items:center">${matImg(mat.mat) ? `<img src="${esc(matImg(mat.mat))}" alt="" style="width:56px;height:42px;object-fit:contain;background:#fff;border-radius:4px;flex:none" onerror="this.remove()">` : ''}<span>📦 資材指定：${esc(matFull(mat.mat))}</span></div>` : '')
      + (authUser ? `<div style="display:flex"><button type="button" class="matedit" data-mi="${i}">資材指定を${mat ? '変更・解除' : '登録'}</button></div>` : '');
    const left = x.qty - x.scanned;
    // どの商品も手で確認できる（シールが貼っていない・読めない商品があるため）。バーコードがある商品はスキャンが基本なので控えめなボタンにする
    const sub = x.unknown ? '' : ' sub';
    const plus = x.unknown ? '入れた' : '手で確認';
    const btns = [];
    if (left > 0) btns.push(`<button class="manual${sub}" data-i="${i}" data-n="1">${plus}（＋1）</button>`);
    if (left > 1) btns.push(`<button class="manual${sub}" data-i="${i}" data-n="${left}">まとめて（＋${left}）</button>`);
    if (x.scanned > 0) btns.push(`<button class="manual undo" data-i="${i}" data-n="-1">1つ戻す</button>`);
    const manual = btns.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;">${btns.join('')}</div>` : '';
    const manualNote = !x.unknown && x.manual ? `<div class="code">うち手で確認 ${x.manual} 個</div>` : '';
    const tag = x.kind === 'nobc' ? '<span style="display:inline-block;font-size:11px;font-weight:700;background:#d68910;color:#fff;border-radius:4px;padding:1px 6px;margin-bottom:3px;">バーコードなし・目で確認</span><br>'
              : x.kind === 'unreg' ? '<span style="display:inline-block;font-size:11px;font-weight:700;background:#c0392b;color:#fff;border-radius:4px;padding:1px 6px;margin-bottom:3px;">マスタ未登録・目で確認</span><br>' : '';
    return `<div class="${cls}">
      ${img}
      <div class="info">
        <div class="title">${tag}${esc(title)}</div>
        <div class="code">${x.unknown ? 'SKU' : 'コード'}：${esc(x.code)}</div>
        <div class="count">${x.scanned} <small>/ ${x.qty} 個</small>${x.scanned === x.qty ? ' ✓' : ''}${x.scanned > x.qty ? ' 多い！' : ''}</div>
        ${matHtml}
        ${manualNote}
        ${manual}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.matedit').forEach(b => b.onclick = () => matEdit(state.items[+b.dataset.mi]));
  document.querySelectorAll('.manual').forEach(b => b.onclick = () => {
    const it = state.items[+b.dataset.i], n = +b.dataset.n || 1;
    if (n > 0) {
      const add = Math.max(0, Math.min(n, it.qty - it.scanned));
      it.scanned += add; it.manual = (it.manual || 0) + add;
    } else {
      it.scanned = Math.max(0, it.scanned - 1);
      if (it.manual) it.manual--;
    }
    if (n > 0) {
      beep(true);
      const mt = matText();
      if (state.items.every(x => x.scanned === x.qty)) flash(true, '✓ 梱包OK', mt ? '📦 資材指定\n' + mt : '', mt ? 2500 : 1500, mt ? 'mat' : '');
      else if (matOf(it.code)) flash(true, '📦 資材指定：' + matOf(it.code).mat, matLabel(it) + '　' + it.scanned + '/' + it.qty, 1800, 'mat');
    }
    afterChange();
  });
}

/* ---------- 音・振動・画面全体の表示 ---------- */
let actx = null;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const play = (freq, start, dur) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? 'sine' : 'square'; o.frequency.value = freq;
      g.gain.value = 0.25; o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur);
    };
    if (ok) play(1200, 0, 0.12); else { play(300, 0, 0.25); play(300, 0.32, 0.25); play(300, 0.64, 0.25); }
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(ok ? 60 : [300, 100, 300, 100, 300]); } catch (e) {}
}
let flashTimer = null;
function flash(ok, big, small, ms, extra) {
  const f = $('flash');
  f.className = 'on ' + (ok ? 'ok' : 'ng') + (extra ? ' ' + extra : '');
  $('flashBig').textContent = big; $('flashSmall').textContent = small || '';
  clearTimeout(flashTimer);
  if (ok) flashTimer = setTimeout(() => f.className = '', ms || 700);
}
$('flash').onclick = () => { $('flash').className = ''; };   // 赤いエラーはタップで閉じる

/* ---------- 照合 ---------- */
function findItem(code) {
  const c = norm(code);
  const cands = [c];
  if (/^\d{13}$/.test(c) && c.startsWith('0')) cands.push(c.slice(1));   // UPC-A を EAN-13 として読んだとき
  if (/^\d{12}$/.test(c)) cands.push('0' + c);
  return state.items.find(x => !x.unknown && cands.includes(norm(x.code)));
}
function check(code) {
  const raw = String(code || '').trim();
  if (!raw) return;
  if (state.us) { usCheck(raw); return; }
  if (!state.items.length) {
    usTryTracking(raw).then(ok => { if (!ok) { beep(false); flash(false, '先に検品シートのQRか、荷物の倉庫追跡番号を読んでください', '読んだコード：' + raw + '\n（タップ・Escで閉じる）'); } });
    return;
  }
  if (state.canceled) { beep(false); flash(false, '✕ キャンセル済みの注文です', '受注番号 ' + state.order + '\n梱包しないでください（次の検品シートのQRを読んでください）'); return; }
  if (holdOf()) { beep(false); flash(false, '⚠ 欠品で保留中の注文です', '受注番号 ' + state.order + '\n商品がそろったら、上のボタンで保留を解除してください（タップ・Escで閉じる）'); return; }
  const it = findItem(raw);
  if (!it) {
    // 商品でなければ、まず送り状として照合 → だめなら（梱包OKのあとなら）次の荷物の倉庫追跡番号として探す
    const allDone = state.items.every(x => x.scanned === x.qty);
    orderLabelCheck(raw).catch(() => false).then(ok => {
      if (ok) return;
      const next = allDone ? usTryTracking(raw) : Promise.resolve(false);
      return next.then(ok2 => {
        if (ok2) return;
        beep(false);
        const z = zmap[norm(raw)];
        const lg = !authUser && /^\D?\d{10,14}\D?$/.test(raw.replace(/\s/g, '')) ? '\n※ 送り状の照合にはログインが必要です（画面下の「ログイン」から）' : '';
        flash(false, '✕ この注文の商品ではありません', (z && z.t ? z.t + '　' : '') + '読んだコード：' + raw + lg + '\n（タップ・Escで閉じる）');
      });
    });
    return;
  }

  if (!/^\d{10,14}$/.test(c)) return false;
  await authReady;
  if (!authUser) return false;
  const L = await usLabelLookup(c);
  if (!L || !L.d) return false;
  const name = (L.d.carrierName || '') + ' ' + L.trk;
  if (L.d.canceled) { beep(false); flash(false, '✕ この送り状は取り消し済みです', name + '\n貼らないでください（タップ・Escで閉じる）'); return true; }
  if (shipOrderKeys(L.d).has(ordKey(state.order))) {
    state.label = name; beep(true);
    const allOk = state.items.every(x => x.scanned === x.qty);
    flash(true, '✓ 送り状OK', name + (allOk ? '\n梱包OK・次の検品シートへ' : '\n残りの商品を読んでください'), 1300);

  }

  if (v === null) return;
  const list = [...new Set(v.split(/[,，、\n]/).map(s => s.trim()).filter(Boolean))];

// 選ぶ画面が出ているあいだ：数字キー1つ＝その資材。スキャナの入力（速い連続入力）は無視して注意する
let pkBuf = '', pkTimer = null;
window.addEventListener('keydown', e => {
  if (!PICK) return;
  if (document.activeElement && document.activeElement.id === 'mpFilter') { if (e.key === 'Escape') { $('mpFilter').value = ''; drawPick(); } return; }
  e.preventDefault(); e.stopPropagation();
  if (e.key === 'Escape' && PICK.change) { $('mpCancel').onclick(); return; }
  if (e.key === 'Enter') { if (pkBuf.length > 1) { beep(false); $('mpMsg').textContent = '先に使った資材を選んでください（スキャンは選んでから）'; } pkBuf = ''; clearTimeout(pkTimer); return; }
  if (e.key.length !== 1) return;
  pkBuf += e.key; clearTimeout(pkTimer);
  pkTimer = setTimeout(() => {
    const b = pkBuf; pkBuf = '';
    if (/^[1-9]$/.test(b)) { const btn = $('mpGrid').querySelectorAll('[data-mat]')[Number(b) - 1]; if (btn) pickMat(btn.dataset.mat); }
  }, 150);
}, true);
// 梱包OKになったときに呼ぶ（まとまるくんの検品シートの注文）
function maybeAskMat(){
  if (state.us || !state.items.length || state.canceled || holdOf() || PICK) return;
  if (!state.items.every(x => x.scanned === x.qty)) return;
  const key = orderUsageKey(); if (USED[key]) return;

  const info = { order: state.order, src: 'sheet' }, codes = state.items.map(x => x.code);
  const allSet = state.items.every(x => matOf(x.code));
  if (allSet && specs.length === 1) {   // どのSKUも資材指定があり、資材が1つ → そのまま記録（違ったら「変更」）
    saveUsage(key, specs[0], Object.assign({ auto: true }, info)).then(() => render())
      .catch(() => openPick({ key, codes, sub: '受注番号 ' + state.order + '\n資材指定：' + specs[0], def: specs, info }));
    return;
  }
  openPick({ key, codes, sub: '受注番号 ' + state.order + (specs.length > 1 ? '\n資材指定が' + specs.length + 'つあります：' + specs.join('、') + '（実際に使ったほう）' : specs.length ? '\n資材指定：' + specs[0] + '（資材指定のない商品もあります）' : '') + '\n選んだ資材は、この注文の商品の資材指定として登録されます', def: specs, info });

// 配送管理アプリの検品書：箱（同梱をまとめた単位）がそろったときに呼ぶ

// 使用枚数の集計（その月の日ごとの記録を読む：1日につき読み取り1回）
let UV = null;
async function showUsage(){
  $('usageView').classList.add('on');
  if (!$('uvMonth').value) $('uvMonth').value = todayStr().slice(0, 7);
  drawOrderBox();
  await loadUsage();
}
async function loadUsage(){
  const ym = $('uvMonth').value; if (!ym) return;
  const body = $('uvBody');
  await authReady;
  if (!authUser) { body.innerHTML = '<div class="err">ログインしてください</div>'; return; }
  body.textContent = '読み込み中…';
  const [y, m] = ym.split('-').map(Number), last = new Date(y, m, 0).getDate(), today = todayStr();
  const days = [];
  for (let d = 1; d <= last; d++) { const s = ym + '-' + String(d).padStart(2, '0'); if (s <= today) days.push(s); }
  try {
    const snaps = await Promise.all(days.map(d => getDoc(usageRef(d))));
    const per = {}, tot = {};
    snaps.forEach((s, i) => {
      const o = (s.exists() && s.data().orders) || {};
      Object.values(o).forEach(r => {
        const k = r.mat || '（不明）', n = Number(r.n) || 1;
        (per[days[i]] = per[days[i]] || {})[k] = (per[days[i]][k] || 0) + n;
        tot[k] = (tot[k] || 0) + n;
      });
    });
    const mats = Object.keys(tot).sort((a, b) => tot[b] - tot[a]);
    const ds = days.filter(d => per[d]);
    UV = { ym, mats, ds, per, tot };
    if (!mats.length) { body.innerHTML = '<div class="note" style="font-size:14px">この月の記録はまだありません</div>'; return; }
    const sum = mats.reduce((s, k) => s + tot[k], 0);
    body.innerHTML = '<div style="overflow-x:auto"><table class="uv-tbl"><thead><tr><th>資材</th><th>' + m + '月 合計</th></tr></thead><tbody>'
      + mats.map(k => '<tr><td>' + esc(matFull(k)) + '</td><td>' + tot[k].toLocaleString() + '</td></tr>').join('')
      + '<tr class="tot"><td>合計（梱包した箱）</td><td>' + sum.toLocaleString() + '</td></tr></tbody></table></div>'
      + '<div style="font-weight:700;margin:14px 0 6px">日ごと</div>'
      + '<div style="overflow-x:auto"><table class="uv-tbl"><thead><tr><th>日付</th>' + mats.map(k => '<th>' + esc(k) + '</th>').join('') + '<th>計</th></tr></thead><tbody>'
      + ds.map(d => '<tr><td>' + md(d) + '</td>' + mats.map(k => '<td>' + (per[d][k] || '') + '</td>').join('') + '<td>' + mats.reduce((s, k) => s + (per[d][k] || 0), 0) + '</td></tr>').join('')
      + '</tbody></table></div>';
  } catch (e) { body.innerHTML = '<div class="err">読み込めませんでした：' + esc(e.message) + '</div>'; }
}
$('usageBtn').onclick = showUsage;
$('uvMonth').onchange = loadUsage;
$('uvClose').onclick = () => { $('usageView').classList.remove('on'); keepFocus(); };
$('uvCsv').onclick = () => {
  if (!UV || !UV.mats.length) return;
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const lines = [['日付', ...UV.mats.map(matFull), '計'].map(q).join(',')]
    .concat(UV.ds.map(d => [d, ...UV.mats.map(k => UV.per[d][k] || 0), UV.mats.reduce((s, k) => s + (UV.per[d][k] || 0), 0)].map(q).join(',')))
    .concat([['合計', ...UV.mats.map(k => UV.tot[k]), UV.mats.reduce((s, k) => s + UV.tot[k], 0)].map(q).join(',')]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }));
  a.download = '資材使用枚数_' + UV.ym + '.csv'; a.click();
};
const holdOf = () => (!state.us && state.order) ? HOLDS[cxKey(state.order)] : null;
const holdWho = () => (authUser && authUser.email) || '';
function renderHold(allOk){
  const box = $('holdBox'); if (!box) return;
  const h = holdOf();
  if (state.us || !state.items.length || !authUser) { box.style.display = 'none'; return; }
  box.style.display = '';
  if (h) {
    const miss = (h.missing || []).map(m => esc(m.name || m.code) + ' ' + m.got + '/' + m.need).join('、');
    box.innerHTML = '<div style="background:#d68910;color:#fff;border-radius:8px;padding:10px;font-size:14px"><b>⚠ 欠品で保留中</b>（' + esc(String(h.at || '').slice(0, 16).replace('T', ' ')) + ' ' + esc(h.by || '') + '）' + (miss ? '<br>足りない商品：' + miss : '') +
      '<div style="margin-top:8px"><button type="button" id="holdOk" style="width:100%;padding:10px;border-radius:8px;border:0;font-weight:700">商品がそろった（保留を解除して梱包する）</button></div></div>';
    $('holdOk').onclick = () => holdRelease();
    return;
  }
  if (allOk) { box.style.display = 'none'; return; }
  box.innerHTML = '<button type="button" id="holdBtn" style="padding:8px 12px;border-radius:8px;border:1px solid #d68910;background:#fff8e8;color:#8a5a00;font-weight:700">⚠ 欠品で保留にする</button>';
  $('holdBtn').onclick = holdSet;
}
async function holdSet(){
  const k = cxKey(state.order);
  const missing = state.items.filter(x => x.scanned < x.qty).map(x => ({ code: x.code, name: (x.unknown ? x.name : (zmap[norm(x.code)] && zmap[norm(x.code)].t)) || x.code, need: x.qty, got: x.scanned }));
  if (!confirm('受注番号 ' + state.order + ' を欠品で保留にします。\n' + missing.map(m => '・' + m.name + '：' + m.got + '/' + m.need).join('\n') + '\n\n出荷通知CSVには入らなくなります。商品は箱から出して、送り状と一緒に保管してください。')) return;
  try {
    const now = new Date();
    await setDoc(doc(db, 'settings', 'ship_holds'), { holds: { [k]: { orderNo: state.order, at: now.toISOString(), atSec: Math.floor(now / 1000), by: holdWho(), date: todayStr(), missing } }, updatedAt: now.toISOString() }, { merge: true });
    beep(true); flash(true, '欠品で保留にしました', '受注番号 ' + state.order, 1500);
  } catch (e) { alert('保留にできませんでした：' + e.message); }
}
// 保留の解除（梱包者は「商品がそろった」を押すだけ。送り状が同じか作り直しかは気にしなくてよい）
//   出荷通知CSVでは、取り消していない送り状のうち、あとから取り込んだほうを使う
//   作り直したときは、まとまるくんの出荷通知の画面で「送り状が2つ以上ある注文」に出るので、そこで選べる
async function holdRelease(){
  const k = cxKey(state.order), h = holdOf(); if (!h) return;
  if (!confirm('商品がそろったので、保留を解除して梱包しますか？\n解除した注文は、次の出荷通知CSVに自動で入ります。')) return;
  try {
    const now = new Date();
    await setDoc(doc(db, 'settings', 'ship_holds'), { holds: { [k]: deleteField() }, carry: { [k]: { orderNo: state.order, at: now.toISOString(), by: holdWho(), date: h.date || todayStr() } }, updatedAt: now.toISOString() }, { merge: true });
    beep(true); flash(true, '保留を解除しました', '商品を読んで梱包し、送り状を貼ってください', 1800);
  } catch (e) { alert('解除できませんでした：' + e.message); }
}
async function checkOrderCanceled(){
  const order = state.order; if (!order || state.us) return;
  await authReady; if (!authUser) return;
  watchCancels();
  if (!CXMAP) return;   // 届いたら、もう一度確かめる
  try {
    const hit = CXMAP[cxKey(order)];
    if (state.order !== order || !hit) return;
    state.canceled = String(hit.at || '').slice(0, 16).replace('T', ' ') + ' ' + (hit.by || '');
    beep(false);
    flash(false, '✕ キャンセル済みの注文です', '受注番号 ' + order + '\n梱包しないでください。商品は棚に戻してください（タップ・Escで閉じる）');
    render();
  } catch (e) { console.warn('shipCancels', e); }
}
function afterChange() {
  render();
  maybeAskMat();
  // 梱包OKでもカメラは止めない（そのまま次の検品シートのQRを読めるように）
}

/* ---------- カメラ（html5-qrcode：iPhoneのSafariでも動く） ---------- */
let scanner = null, lastCode = '', lastAt = 0;
async function startCamera() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}   // 音を鳴らせるようにする
  $('readerWrap').classList.add('on');
  $('readerMsg').textContent = 'シールのバーコードを枠に入れてください';
  if (scanner) return;
  const F = window.Html5QrcodeSupportedFormats;
  scanner = new Html5Qrcode('reader', {
    verbose: false,
    formatsToSupport: [F.CODE_128, F.CODE_39, F.CODABAR, F.EAN_13, F.EAN_8, F.UPC_A, F.ITF, F.QR_CODE],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  });
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(Math.min(h, w) * 0.45) }) },
      text => {
        const now = Date.now();
        if ($('flash').classList.contains('ng')) return;          // 赤いエラーを閉じるまでは読まない
        if (PICK) { if (text !== lastCode || now - lastAt > 1500) { beep(false); $('mpMsg').textContent = '先に使った資材を選んでください'; } lastCode = text; lastAt = now; return; }
        if (text === lastCode && now - lastAt < 1500) return;   // 同じシールを続けて読まない
        lastCode = text; lastAt = now;
        if (/#o=.*&i=/.test(text) || /#u=.*&n=/.test(text)) { openOrder(text.slice(text.indexOf('#') + 1)); return; }   // 検品シートのQR → その注文を開く
        check(text);
      }, () => {});
  } catch (e) {
    $('readerMsg').textContent = 'カメラを起動できませんでした：' + (e && e.message ? e.message : e);
    scanner = null;
  }
}
async function stopCamera() {
  $('readerWrap').classList.remove('on');
  if (scanner) { try { await scanner.stop(); scanner.clear(); } catch (e) {} scanner = null; }
}
$('scanBtn').onclick = startCamera;
$('closeBtn').onclick = stopCamera;
$('resetBtn').onclick = () => { if (confirm('数え直しますか？')) { state.items.forEach(x => { x.scanned = 0; x.manual = 0; }); render(); } };
/* ---------- スキャナ（USB・Bluetooth）・手入力 ----------
   スキャナの配列設定（US）とパソコン（日本語配列）が違うと、記号が化けて入る（= → ^、& → '、* → ( など）。
   検品シートのQRっぽいのに #o= が見つからないときは、化けた記号を元に戻して読む */
function fixLayout(v) {
  if (/#o=.*&i=/.test(v) || /#u=.*&n=/.test(v)) return v;
  if (!/pack\.html/i.test(v) && !/#o\^/.test(v) && !/#u\^/.test(v)) return v;
  return v.replace(/\^/g, '=').replace(/'/g, '&').replace(/\(/g, '*').replace(/\+/g, ':');
}
function handleTyped(v) {
  v = String(v || '').trim();
  if (!v) return;
  const q = fixLayout(v);
  if (/#o=.*&i=/.test(q) || /#u=.*&n=/.test(q)) openOrder(q.slice(q.indexOf('#') + 1));
  else check(v);
}
$('manualInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const v = e.target.value; e.target.value = ''; handleTyped(v); }
});

// パソコン（マウスで操作する端末）では、入力欄にずっとカーソルを置いておく（クリック不要でスキャナが使える）
const isPC = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
function keepFocus() {
  if (!isPC || $('readerWrap').classList.contains('on')) return;
  const a = document.activeElement;
  if (a && a !== document.body && a !== $('manualInput') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  $('manualInput').focus({ preventScroll: true });
}
if (isPC) {
  document.addEventListener('click', () => setTimeout(keepFocus, 0));
  window.addEventListener('focus', () => setTimeout(keepFocus, 0));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') $('flash').className = '';   // 赤い表示を Esc で閉じる
    if (document.activeElement !== $('manualInput') && e.key.length === 1 && !e.ctrlKey && !e.metaKey) keepFocus();
  });
  setInterval(keepFocus, 1500);
}

// 端末に保存した商品名・画像を捨てて、zaicoから読み直す
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'reloadZaico') { e.preventDefault(); try { localStorage.removeItem(LS_KEY); } catch (_) {} location.reload(); }
});

/* ---------- 起動 ----------
   検品シートのQRから開いたとき：その注文を表示
   ポータルから開いたとき（QRの情報なし）：「検品シートのQRを読む」から始める。
   照合中のカメラで次の注文の検品シートQRを読むと、そのまま次の注文に切り替わる */
function openOrder(hash) {
  if (location.hash.replace(/^#/, '') === hash) return;
  location.hash = hash;   // hashchange で読み直す
}
window.addEventListener('hashchange', () => { state = parseHash(); start(); });

async function start() {
  if (state.us) { $('resetBtn').style.display = 'none'; return usStart(); }
  US.sel = null;
  if (!state.items.length) {
    $('orderNo').textContent = '梱包チェック';
    $('progress').textContent = '検品シートのQRを読んでください';
    $('bar').style.width = '0';
    $('allok').classList.remove('show');
    $('list').innerHTML = orderBoxHtml() + '<div class="note" style="font-size:14px;">' + (isPC ? 'スキャナで検品シートのQR、または荷物の配送伝票（倉庫追跡番号）のバーコードを読むと、その注文の商品が表示されます。バーコードのある商品はシール・PKGIDを読んで照合、ない商品は画像のタイルから選んで照合します。' : '下の「📷」ボタンでカメラを起動し、検品シートのQRを読むと、その注文の商品が表示されます。続けて商品のシールを読んで照合します。') + '</div><button type="button" class="btn ghost" style="margin-top:14px;width:100%" onclick="document.getElementById(\'usageBtn\').click()">📊 資材の使用枚数を見る</button>';
    $('scanBtn').textContent = '📷 検品シートのQRを読む';
    $('resetBtn').style.display = 'none';
    keepFocus();
    return;
  }
  $('scanBtn').textContent = '📷 商品のシールをスキャン';
  $('resetBtn').style.display = '';
  window.scrollTo(0, 0);
  render();
  checkOrderCanceled();
  authReady.then(() => {
    if (authUser || state.us) return;
    const n = $('loginNote') || document.createElement('div');
    n.id = 'loginNote'; n.style.cssText = 'margin:8px 0;font-size:13px';
    n.innerHTML = '送り状の照合には、社内のGoogleアカウントでのログインが必要です。<button type="button" id="loginBtnOld" style="margin-left:6px">ログイン</button>';
    $('list').after(n);
    $('loginBtnOld').onclick = () => { const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt:'select_account' }); signInWithPopup(auth, p).then(() => n.remove()).catch(err => { if (!/popup-closed|cancelled-popup/.test(err.code || '')) alert('ログインできませんでした：' + err.message); }); };
  });
  try {
    const z = await getZaicoMap(state.items.filter(x => !x.unknown).map(x => x.code));
    zmap = z.map || {};
    $('cacheNote').innerHTML = z.withImg ? '' : esc('※ 画像のURLを取得できませんでした（' + (z.imgError || '関数の設定が必要です') + '）') + ' <a href="#" id="reloadZaico">zaicoから読み直す</a>';
  } catch (e) {
    $('cacheNote').textContent = '※ zaicoの商品名・画像を読めませんでした：' + e.message + '（照合はできます）';
  }
  render();
  keepFocus();
}
start();
</script>
