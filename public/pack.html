<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>梱包チェック</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{ --ink:#1c2733; --muted:#5d6b77; --line:#d3d9d7; --ok:#1e8e4f; --ng:#c0392b; --warn:#d68910; --accent:#0f5f8a; }
*{ box-sizing:border-box; }
body{ margin:0; font-family:"BIZ UDPGothic","Hiragino Sans",sans-serif; color:var(--ink); background:#eef1f0; -webkit-text-size-adjust:100%; }
header{ position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:10px 14px; }
header .order{ font-size:13px; color:var(--muted); word-break:break-all; }
header .progress{ font-size:22px; font-weight:700; margin-top:2px; }
header .bar{ height:6px; background:#e6eae9; border-radius:3px; margin-top:6px; overflow:hidden; }
header .bar i{ display:block; height:100%; width:0; background:var(--ok); transition:width .2s; }
main{ padding:12px 12px 140px; }
.item{ display:flex; gap:12px; background:#fff; border:2px solid var(--line); border-radius:12px; padding:10px; margin-bottom:10px; align-items:center; }
.item img, .item .noimg{ width:96px; height:96px; object-fit:contain; border-radius:8px; background:#f5f6f6; flex:none; }
.item .noimg{ display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); text-align:center; }
.item .info{ flex:1; min-width:0; }
.item .title{ font-size:15px; font-weight:700; line-height:1.35; word-break:break-all; }
.item .code{ font-size:12px; color:var(--muted); margin-top:3px; word-break:break-all; }
.item .count{ font-size:26px; font-weight:700; margin-top:4px; }
.item .count small{ font-size:14px; color:var(--muted); font-weight:400; }
.item.done{ border-color:var(--ok); background:#eefaf2; }
.item.done .count{ color:var(--ok); }
.item.over{ border-color:var(--ng); background:#fdeeee; }
.item.unknown{ border-style:dashed; border-color:var(--warn); }
.item .manual.sub{ border-color:#9aa5ae; background:#fff; color:#3d4a55; font-size:13px; padding:6px 10px; }
.item .manual.undo{ border-color:#bbb; background:#fff; color:#777; font-size:13px; padding:6px 10px; }
.item .manual{ margin-top:6px; font-size:14px; padding:8px 12px; border-radius:8px; border:1px solid var(--warn); background:#fff8e8; color:#7a4d00; }
.allok{ display:none; text-align:center; background:var(--ok); color:#fff; border-radius:12px; padding:18px; font-size:26px; font-weight:700; margin-bottom:12px; }
.allok.show{ display:block; }
.foot{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); z-index:6; }
.foot .row{ display:flex; gap:8px; }
.btn{ flex:1; font-size:17px; font-weight:700; padding:14px; border-radius:10px; border:none; background:var(--accent); color:#fff; }
.btn.ghost{ background:#fff; color:var(--accent); border:2px solid var(--accent); flex:none; }
#manualInput{ width:100%; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:8px; margin-top:8px; }
#readerWrap{ display:none; position:fixed; left:0; right:0; bottom:0; top:0; background:rgba(0,0,0,.85); z-index:10; padding:12px; }
#readerWrap.on{ display:block; }
#reader{ width:100%; max-width:520px; margin:40px auto 0; background:#000; border-radius:10px; overflow:hidden; }
#readerWrap .close{ display:block; margin:14px auto 0; max-width:520px; width:100%; }
#readerMsg{ color:#fff; text-align:center; margin-top:10px; font-size:15px; min-height:22px; }
#flash{ position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; flex-direction:column; color:#fff; font-weight:700; text-align:center; padding:20px; }
#flash.on{ display:flex; }
#flash.ok{ background:rgba(30,142,79,.92); }
#flash.ng{ background:rgba(192,57,43,.95); }
#flash .big{ font-size:44px; white-space:pre-line; line-height:1.25; }
#flash .small{ font-size:17px; margin-top:10px; word-break:break-all; white-space:pre-line; }
.err{ background:#fdeeee; border:1px solid var(--ng); color:var(--ng); padding:14px; border-radius:10px; font-size:15px; }
.note{ font-size:12px; color:var(--muted); margin-top:6px; }
/* 配送管理アプリの検品書（タイルで選ぶ） */
.us-box{ background:#fff; border:3px solid var(--accent); border-radius:12px; margin-bottom:14px; overflow:hidden; }
.us-box.ok{ border-color:var(--ok); } .us-box.stop{ border-color:var(--ng); }
.us-bhead{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 12px; }
.us-bhead b{ font-size:16px; flex:1; } .us-bhead .manual{ margin-top:0; }
.us-tag{ display:inline-block; font-size:11px; font-weight:700; background:var(--accent); color:#fff; border-radius:4px; padding:1px 6px; }
.us-tag.warn{ background:var(--ng); }
.us-msg{ padding:8px 12px; font-size:14px; font-weight:700; border-top:1px solid var(--line); }
.us-msg.ng{ background:#fdeeee; color:var(--ng); } .us-msg.ok{ background:#eefaf2; color:var(--ok); }
.us-it{ display:flex; gap:12px; padding:12px; border-top:1px solid var(--line); align-items:flex-start; }
.us-it.done{ background:#eefaf2; }
.us-it .info{ flex:1; min-width:0; }
.us-big{ width:130px; height:130px; object-fit:contain; border-radius:8px; background:#f5f6f6; flex:none; }
.us-noimg{ display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); text-align:center; }
.us-note{ background:#fff8e8; border-radius:6px; padding:4px 8px; font-size:13px; white-space:pre-wrap; margin-top:4px; }
.us-many{ color:var(--ng); }
.us-ghead{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:4px 0 8px; }
.us-ghead input{ flex:1; min-width:160px; font-size:15px; padding:8px; border:1px solid var(--line); border-radius:8px; }
.us-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
.us-tile{ position:relative; display:flex; flex-direction:column; gap:4px; padding:6px; border:2px solid var(--line); border-radius:10px; background:#fff; text-align:left; font:inherit; color:inherit; }
.us-timg{ width:100%; height:auto; aspect-ratio:1/1; object-fit:contain; border-radius:6px; background:#f5f6f6; }
.us-tile .tn{ font-size:12px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.us-tile .tm{ font-size:12px; color:var(--muted); }
.us-tile .tq{ position:absolute; top:4px; right:4px; background:var(--ink); color:#fff; border-radius:6px; padding:2px 8px; font-weight:700; font-size:18px; line-height:1.2; box-shadow:0 0 0 2px #fff; }
.us-tile .tq.many{ background:var(--ng); font-size:20px; }
.us-tile .tnote{ font-size:12px; line-height:1.35; background:#fff3c4; border:1px solid var(--warn); border-radius:4px; padding:2px 4px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-wrap; }
.us-qty{ display:inline-flex; align-items:baseline; gap:6px; margin:6px 0; padding:6px 14px; border-radius:8px; background:#e8eef2; font-weight:700; font-size:16px; }
.us-qty b{ font-size:34px; line-height:1; }
.us-qty.many{ background:var(--ng); color:#fff; }
.us-qty small{ font-size:12px; font-weight:400; }
.us-memo{ background:#fff3c4; border:2px solid var(--warn); border-radius:8px; padding:8px 10px; font-size:15px; font-weight:700; white-space:pre-wrap; margin-top:6px; word-break:break-all; }
.us-tile .tc{ position:absolute; top:4px; left:4px; background:var(--accent); color:#fff; border-radius:4px; padding:0 6px; font-weight:700; font-size:12px; }
.us-tile .tb{ font-size:11px; font-weight:700; color:#7a4d00; background:#fff8e8; border:1px solid var(--warn); border-radius:4px; padding:0 4px; width:max-content; }
.us-tile.done{ opacity:.45; border-color:var(--ok); } .us-tile.stop{ border-color:var(--ng); }
.us-tile.sel{ border-color:var(--accent); box-shadow:0 0 0 3px #f4c842; }
@media (max-width:480px){ .us-grid{ grid-template-columns:repeat(3,1fr); } .us-big{ width:96px; height:96px; } }
</style>
</head>
<body>
<header>
  <div class="order" id="orderNo">受注番号：</div>
  <div class="progress" id="progress">読み込み中…</div>
  <div class="bar"><i id="bar"></i></div>
</header>
<main>
  <div class="allok" id="allok">✓ 梱包OK<div style="font-size:14px;font-weight:400;margin-top:6px;">次の検品シートのQRを読むと、次の注文に進みます</div></div>
  <div id="list"></div>
  <div class="note" id="cacheNote"></div>
</main>
<div class="foot">
  <div class="row">
    <button class="btn" id="scanBtn">📷 商品のシールをスキャン</button>
    <button class="btn ghost" id="resetBtn">やり直し</button>
  </div>
  <input id="manualInput" inputmode="text" autocomplete="off" placeholder="スキャナ・手入力はここ（Enterで照合）" autocapitalize="off" spellcheck="false">
</div>
<div id="readerWrap">
  <div id="reader"></div>
  <div id="readerMsg">シールのバーコードを枠に入れてください</div>
  <button class="btn ghost close" id="closeBtn">閉じる</button>
</div>
<div id="flash"><div class="big" id="flashBig"></div><div class="small" id="flashSmall"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, query, where, documentId, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
  authDomain: "souko-2de57.firebaseapp.com",
  projectId: "souko-2de57",
  storageBucket: "souko-2de57.firebasestorage.app"
});
const db = getFirestore(app);

/* ---------- 共通 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const toHalf = s => String(s || '').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ');
const norm = s => toHalf(s).trim().toUpperCase();

/* ---------- QRの中身を読む： #o=受注番号&i=コード*数量,…
   ?コード:商品名*数量 ＝ マスタにあるがバーコードなし（おまけ等）、!コード:商品名*数量 ＝ マスタ未登録。どちらも目視で確認 ---------- */
function parseHash() {
  const h = location.hash.replace(/^#/, '');
  const out = { order: '', items: [], us: '', nos: [], trk: '' };
  h.split('&').forEach(part => {
    const eq = part.indexOf('=');
    if (eq < 0) return;
    const k = part.slice(0, eq), v = part.slice(eq + 1);
    if (k === 'o') out.order = safeDecode(v);
    if (k === 'u') out.us = safeDecode(v);
    if (k === 'n') out.nos = [...new Set(v.split(',').map(Number).filter(Boolean))];
    if (k === 't') out.trk = safeDecode(v);
    if (k === 'i') v.split(',').filter(Boolean).forEach(t => {
      const star = t.lastIndexOf('*');
      let code = star >= 0 ? t.slice(0, star) : t;
      const qty = star >= 0 ? (parseInt(t.slice(star + 1), 10) || 1) : 1;
      const kind = code.startsWith('?') ? 'nobc' : code.startsWith('!') ? 'unreg' : '';
      let name = '';
      if (kind) {
        code = code.slice(1);
        const c = code.indexOf(':');
        if (c >= 0) { name = safeDecode(code.slice(c + 1)); code = code.slice(0, c); }
      }
      out.items.push({ code: safeDecode(code), name, qty, kind, unknown: !!kind, scanned: 0 });
    });
  });
  return out;
}
function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }

/* ---------- zaicoの在庫の写し（まとまるくんと同じ zaico_inventory_cache）から 名前・画像 を引く ----------
   読み取り回数を抑えるため、端末に「コード → 名前・画像」を保存して使い回す。
   必要なコードが見つからないとき・6時間たったときだけ読み直す */
const LS_KEY = 'pack_zaico_map_v2';   // v1（画像なしで保存されたもの）は使わない
const MAX_AGE = 6 * 60 * 60 * 1000;
function readLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }
function writeLocal(o) { try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) { console.warn(e); } }
function imgOf(x) {
  const u = (x.item_image && x.item_image.url) || x.imageUrl || x.image_url || x.img || '';
  return typeof u === 'string' ? u : '';
}
async function fetchZaicoMap() {
  const ref = doc(db, 'zaico_inventory_cache', 'current');
  const meta = (await getDoc(ref)).data();
  if (!meta) throw new Error('在庫の写しがまだありません（まとまるくんを一度開いてください）');
  const ps = await getDocs(collection(ref, 'parts'));
  const parts = ps.docs.map(d => d.data()).filter(p => p.v === meta.v).sort((a, b) => a.i - b.i);
  if (parts.length !== meta.parts) throw new Error('在庫の写しを作り直している途中です。少し待ってから開き直してください');
  const base = JSON.parse(parts.map(p => p.s).join(''));
  const map = {};
  let withImg = 0;
  base.forEach(x => {
    const c = norm(x.code);
    if (!c) return;
    const img = imgOf(x);
    if (img) withImg++;
    map[c] = { t: String(x.title || ''), img };
  });
  const o = { at: Date.now(), v: meta.v, withImg, map, src: 'cache' };
  // 在庫の写しに画像のURLが入っていないときは、zaicoの在庫一覧を返す関数から画像だけ取り寄せる
  if (!withImg) {
    o.imgTried = Date.now();
    try { await fillImagesFromList(o); } catch (e) { console.warn('zaicoから画像を取り寄せられませんでした', e); o.imgError = e.message; }
  }
  writeLocal(o);
  return o;
}
const URL_LIST_ZAICO_INVENTORIES = "https://asia-northeast1-souko-2de57.cloudfunctions.net/apiListZaicoInventories";
async function fillImagesFromList(o) {
  let page = 1, n = 0, seen = 0;
  for (let guard = 0; page && guard < 200; guard++) {
    $('cacheNote').textContent = `zaicoから商品画像を読み込んでいます…（${seen.toLocaleString()}件）`;
    const res = await fetch(`${URL_LIST_ZAICO_INVENTORIES}?page=${page}&pages=10`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'zaicoの在庫一覧を取得できませんでした');
    (data.items || []).forEach(x => {
      seen++;
      const c = norm(x.code), img = imgOf(x);
      if (!c) return;
      if (!o.map[c]) o.map[c] = { t: String(x.title || ''), img: '' };
      if (img) { o.map[c].img = img; n++; }
    });
    page = data.nextPage || null;
  }
  o.withImg = n;
  o.src = n ? 'list' : 'cache';
  if (!n) o.imgError = 'zaicoの在庫一覧の関数も画像のURLを返していません';
}
async function getZaicoMap(codes) {
  const local = readLocal();
  const fresh = local && Date.now() - local.at < MAX_AGE;
  const allFound = local && codes.every(c => local.map[norm(c)]);
  // 画像が取れなかったときは、1時間たったらもう一度試す
  const imgRetry = local && !local.withImg && (!local.imgTried || Date.now() - local.imgTried > 60 * 60 * 1000);
  if (fresh && allFound && !imgRetry) return local;
  try { return await fetchZaicoMap(); }
  catch (e) { if (local) { console.warn(e); return local; } throw e; }
}


/* ===================================================================
   US吉田様など「配送管理アプリ」の検品書QR（#u=お客様ID&n=No.,…&t=追跡番号）
   商品のバーコードがないので、タイルで商品を選んで目で照合する。
   「箱に入れた」で梱包済み（orders/{No}.pack）と入荷日（シート・空のときだけ）を入れる
   =================================================================== */
const auth = getAuth(app);
let authUser = null, authReadyResolve;
const authReady = new Promise(r => authReadyResolve = r);
onAuthStateChanged(auth, u => { authUser = u; authReadyResolve(); if (state.us && US.needLogin && u) usStart(); });
const US = { cfgId:'', pre:null, cfg:null, rows:{}, flags:{}, sel:null, needLogin:false, pf:'', q:Promise.resolve() };
const ordRef = no => doc(db, 'deliveryClients', state.us, 'orders', String(no));
const oidOf = s => String(s == null ? '' : s).trim();
const NO_OID = o => !o || o === '有在庫用';
const squash = s => String(s == null ? '' : s).replace(/\s+/g, '').slice(0, 60);
const keyOf = r => { const o = oidOf(r && r.orderId); return NO_OID(o) ? (o || '空欄') + '|' + squash(r && r.name) + '|' + squash((r && r.asin) || (r && r.item)) : o; };
const hasProc = r => !!(r && (r.arrivedAt || r.shippedAt || r.tracking));
const matches = (r, want) => { want = oidOf(want); if (!want) return true; return want.indexOf('|') >= 0 ? keyOf(r) === want : oidOf(r && r.orderId) === want; };
const procOf = s => s ? oidOf(s.procKey || s.procOrderId || (hasProc(s) ? keyOf(s) : '')) : '';
const qtyNum = v => { const m = String(v == null ? '' : v).normalize('NFKC').match(/\d+(?:\.\d+)?/); return m ? Number(m[0]) : 0; };
const noteNos = n => (String(n || '').match(/(?<!\d)\d{5,6}(?!\d)/g) || []).map(Number);
const md = s => { const m = String(s || '').match(/^\d{4}-(\d{2})-(\d{2})$/); return m ? Number(m[1]) + '/' + Number(m[2]) : (s || ''); };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const usPacked = no => !!(US.flags[no] && US.flags[no].pack && US.flags[no].pack.done);
function usStop(no){
  const r = US.rows[no], f = US.flags[no] || {};
  const proc = procOf(f);
  if (proc && hasProc(r) && !matches(r, proc)) return '注文番号が処理したときと違う（シートを確認）';
  if ((f.hold && f.hold.active) || /出荷保留/.test(r.note || '')) return '出荷保留';
  if (f.inquiry && f.inquiry.active) return '問い合わせ中';
  return '';
}
const US_ERR = { 'unauthorized':'配送管理アプリの API_KEY が違います', 'sheet not found':'シートが見つかりません', 'unexpected header':'シートの列の並びが変わっています' };
async function usGas(action, extra){
  const c = US.cfg;
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 60000);
  let res;
  try{ res = await fetch(c.gasUrl, { method:'POST', body: JSON.stringify(Object.assign({ action, key:c.apiKey, sheetId:c.sheetId, sheetName:c.sheetName || '入力シート' }, extra || {})), signal: ctrl.signal }); }
  catch(e){ throw new Error(e.name === 'AbortError' ? 'シートから60秒応答がありませんでした' : 'シート（連携GAS）につながりませんでした'); }
  finally{ clearTimeout(timer); }
  let j; try{ j = await res.json(); }catch(e){ throw new Error('シート（連携GAS）の応答を読み取れませんでした'); }
  if (!j.ok) throw new Error(US_ERR[j.error] || ('エラー：' + j.error));
  return j;
}
async function usStart(){
  $('scanBtn').textContent = '📷 検品書のQRを読む';
  $('resetBtn').style.display = 'none';
  $('cacheNote').textContent = '';
  $('allok').classList.remove('show');
  $('orderNo').textContent = (state.nos.length ? '検品書：' : '荷物：') + (state.trk || '') + (state.nos.length ? '（' + state.nos.length + '件）' : '');
  $('progress').textContent = '読み込み中…';
  $('bar').style.width = '0';
  window.scrollTo(0, 0);
  await authReady;
  if (!authUser) {
    US.needLogin = true;
    $('progress').textContent = 'ログインしてください';
    $('list').innerHTML = '<div class="err" style="color:var(--ink)">配送管理アプリの検品書です。初回だけ、社内のGoogleアカウントでログインしてください（この端末で一度ログインすれば、次からは不要です）。<br><button class="btn" id="usLogin" style="margin-top:12px;width:100%">Googleでログイン</button></div>';
    return;
  }
  US.needLogin = false;
  try{
    try{ localStorage.setItem('pack_us_client', state.us); }catch(e){}
    if (!US.cfg || US.cfgId !== state.us) { US.cfg = (await getDoc(doc(db, 'deliveryClients', state.us))).data(); US.cfgId = state.us; }
    if (!US.cfg || !US.cfg.gasUrl) throw new Error('配送管理アプリの設定（お客様ID ' + state.us + '）が読めません');
    let list;
    if (state.nos.length) list = (await usGas('search', { mode:'no', values: state.nos })).rows || [];
    else {
      // 倉庫追跡番号をスキャンして開いたとき：その荷物の注文のうち、まだ出荷していないもの
      const all = (US.pre && US.pre.trk === state.trk) ? US.pre.rows : ((await usGas('search', { mode:'tracking', values:[state.trk] })).rows || []);

function usBundle(no){
  const all = Object.values(US.rows), seen = new Set([no]), missing = new Set(), q = [no];
  const add = n => { if (seen.has(n)) return; if (US.rows[n]) { seen.add(n); q.push(n); } else missing.add(n); };
  while (q.length) {
    const r = US.rows[q.shift()]; if (!r) continue;
    const oid = oidOf(r.orderId);
    if (!NO_OID(oid)) all.forEach(x => { if (oidOf(x.orderId) === oid) add(x.no); });
    if (/同梱/.test(r.note || '')) noteNos(r.note).forEach(add);
    all.forEach(x => { if (/同梱/.test(x.note || '') && noteNos(x.note).includes(r.no)) add(x.no); });
  }
  return { nos:[...seen].sort((a,b) => a - b), missing:[...missing].sort((a,b) => a - b) };
}

// 入荷日（空のときだけ）。書く直前にシートを読み直して、注文が変わっていないか確かめる。梱包の手を止めないよう裏で順番に

      if (cur.arrivedAt) { r.arrivedAt = cur.arrivedAt; return; }

// 倉庫追跡番号（荷物の配送伝票のバーコード）を読んだとき：シートで探して、あればその荷物を開く
function trkCode(raw){
  let c = String(raw || '').normalize('NFKC').toUpperCase().replace(/[^0-9A-Z]/g, '');
  if (/^[A-D]\d{6,}[A-D]$/.test(c)) c = c.slice(1, -1);   // ヤマト・佐川の伝票のバーコード（前後の英字）
  return /^[0-9A-Z]{8,30}$/.test(c) && /\d{6,}/.test(c) ? c : '';
}

async function usTryTracking(raw){
  const c = trkCode(raw); if (!c) return false;
  const cid = usClient();
  await authReady;

// 検品書モードで商品のバーコードを読んだとき：PKGIDで注文を探して開く
// 開いている注文と同じPKGIDをもう一度読むと「箱に入れた」にする（スキャナだけで進められる）
const pkgNorm = v => String(v || '').normalize('NFKC').toUpperCase().replace(/[^0-9A-Z]/g, '');
const pkgList = r => String(r.pkgId || '').split(/[\s,、，\/]+/).map(pkgNorm).filter(x => x.length >= 4);
const hasPkg = r => pkgList(r).length > 0;
function usFindPkg(code){
  const c = pkgNorm(code); if (!c) return [];
  let hits = Object.values(US.rows).filter(r => pkgList(r).includes(c));
  // バーコードに余分な文字が付いているとき（前後に文字が付くなど）は、含まれているかで探す
  if (!hits.length && c.length >= 8) hits = Object.values(US.rows).filter(r => pkgList(r).some(t => t.length >= 8 && (c.includes(t) || t.includes(c))));
  return hits.sort((a,b) => a.no - b.no);
}
function usCheck(raw){
  const m = String(raw).normalize('NFKC').trim().match(/^(?:No\.?)?\s*0*(\d{3,6})$/i);
  if (m && US.rows[Number(m[1])]) { US.sel = Number(m[1]); usRender(); window.scrollTo({ top:0, behavior:'smooth' }); return; }
  const hits = usFindPkg(raw);
  if (!hits.length) {
    // PKGIDでなければ、次の荷物の倉庫追跡番号かもしれない
    usTryTracking(raw).then(ok => {
      if (ok) return;
      beep(false);
      flash(false, '✕ この検品書の商品ではありません', '読んだコード：' + raw + '\nPKGIDにも倉庫追跡番号にも見つかりません。バーコードがない商品は、画像のタイルから選んでください\n（タップ・Escで閉じる）');
    });
    return;
  }
  // 開いている注文のPKGIDをもう一度読んだ → 箱に入れた
  const open = US.sel && hits.find(r => usBundle(US.sel).nos.includes(r.no) && !usPacked(r.no) && !usStop(r.no));
  if (open) { usPutIn(open.no); return; }
  const todo = hits.filter(r => !usPacked(r.no) && !usStop(r.no));
  const r = todo[0] || hits.find(x => usStop(x.no)) || hits[0];
  US.sel = r.no; usRender(); window.scrollTo({ top:0, behavior:'smooth' });
  if (usStop(r.no)) { beep(false); flash(false, '⚠ No.' + r.no + 'は' + usStop(r.no), '箱に入れないでください\n（タップ・Escで閉じる）'); return; }
  if (!todo.length) { beep(false); flash(false, 'この商品は梱包済みです', 'No.' + hits.map(x => x.no).join('、No.') + '\n二重に梱包していないか確かめてください（タップ・Escで閉じる）'); return; }
  const q = qtyNum(r.qty);
  beep(true);
  flash(true, 'No.' + r.no + '\n数量 ' + (q || 1) + '個' + (q >= 2 ? '（⚠ ' + q + '個入れる）' : ''), 'お届け先：' + (r.name || '') + (r.note ? '\n📝 備考：' + String(r.note).slice(0, 80) : '') + '\n送り状を貼って箱に入れたら、もう一度スキャン（または「箱に入れた」）', (q >= 2 || r.note) ? 2500 : 1500);
}

      ${img}
      <div class="info">
        <div class="title">${tag}${esc(title)}</div>
        <div class="code">${x.unknown ? 'SKU' : 'コード'}：${esc(x.code)}</div>
        <div class="count">${x.scanned} <small>/ ${x.qty} 個</small>${x.scanned === x.qty ? ' ✓' : ''}${x.scanned > x.qty ? ' 多い！' : ''}</div>
        ${manualNote}
        ${manual}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.manual').forEach(b => b.onclick = () => {
    const it = state.items[+b.dataset.i], n = +b.dataset.n || 1;
    if (n > 0) {
      const add = Math.max(0, Math.min(n, it.qty - it.scanned));
      it.scanned += add; it.manual = (it.manual || 0) + add;
    } else {
      it.scanned = Math.max(0, it.scanned - 1);
      if (it.manual) it.manual--;
    }
    if (n > 0) {
      beep(true);
      if (state.items.every(x => x.scanned === x.qty)) flash(true, '✓ 梱包OK', '', 1500);
    }
    afterChange();
  });
}

/* ---------- 音・振動・画面全体の表示 ---------- */
let actx = null;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const play = (freq, start, dur) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? 'sine' : 'square'; o.frequency.value = freq;
      g.gain.value = 0.25; o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur);
    };
    if (ok) play(1200, 0, 0.12); else { play(300, 0, 0.25); play(300, 0.32, 0.25); play(300, 0.64, 0.25); }
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(ok ? 60 : [300, 100, 300, 100, 300]); } catch (e) {}
}
let flashTimer = null;
function flash(ok, big, small, ms) {
  const f = $('flash');
  f.className = 'on ' + (ok ? 'ok' : 'ng');
  $('flashBig').textContent = big; $('flashSmall').textContent = small || '';
  clearTimeout(flashTimer);
  if (ok) flashTimer = setTimeout(() => f.className = '', ms || 700);
}
$('flash').onclick = () => { $('flash').className = ''; };   // 赤いエラーはタップで閉じる

/* ---------- 照合 ---------- */
function findItem(code) {
  const c = norm(code);
  const cands = [c];
  if (/^\d{13}$/.test(c) && c.startsWith('0')) cands.push(c.slice(1));   // UPC-A を EAN-13 として読んだとき
  if (/^\d{12}$/.test(c)) cands.push('0' + c);
  return state.items.find(x => !x.unknown && cands.includes(norm(x.code)));
}
function check(code) {
  const raw = String(code || '').trim();
  if (!raw) return;
  if (state.us) { usCheck(raw); return; }
  if (!state.items.length) {
    usTryTracking(raw).then(ok => { if (!ok) { beep(false); flash(false, '先に検品シートのQRか、荷物の倉庫追跡番号を読んでください', '読んだコード：' + raw + '\n（タップ・Escで閉じる）'); } });
    return;
  }
  const it = findItem(raw);
  if (!it && state.items.every(x => x.scanned === x.qty)) {
    // 梱包OKのあとに、次の荷物の倉庫追跡番号を読んだとき
    usTryTracking(raw).then(ok => { if (!ok) { beep(false); flash(false, '✕ この注文の商品ではありません', '読んだコード：' + raw + '\n（タップ・Escで閉じる）'); } });
    return;
  }
  if (!it) {
    beep(false);
    const z = zmap[norm(raw)];
    flash(false, '✕ この注文の商品ではありません', (z && z.t ? z.t + '　' : '') + '読んだコード：' + raw + '\n（タップ・Escで閉じる）');
    return;
  }
  if (it.scanned >= it.qty) {
    it.scanned++;
    beep(false);
    flash(false, '✕ 数が多いです', `${zmap[norm(it.code)]?.t || it.code}\n必要 ${it.qty} 個 → ${it.scanned} 個読みました（タップ・Escで閉じる）`);
    afterChange();
    return;
  }
  it.scanned++;
  beep(true);
  const left = state.items.every(x => x.scanned === x.qty);
  flash(true, left ? '✓ 梱包OK' : '✓ OK', `${zmap[norm(it.code)]?.t || it.code}　${it.scanned}/${it.qty}`, left ? 1500 : 600);
  afterChange();
}
function afterChange() {
  render();
  // 梱包OKでもカメラは止めない（そのまま次の検品シートのQRを読めるように）
}

/* ---------- カメラ（html5-qrcode：iPhoneのSafariでも動く） ---------- */
let scanner = null, lastCode = '', lastAt = 0;
async function startCamera() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}   // 音を鳴らせるようにする
  $('readerWrap').classList.add('on');
  $('readerMsg').textContent = 'シールのバーコードを枠に入れてください';
  if (scanner) return;
  const F = window.Html5QrcodeSupportedFormats;
  scanner = new Html5Qrcode('reader', {
    verbose: false,
    formatsToSupport: [F.CODE_128, F.CODE_39, F.CODABAR, F.EAN_13, F.EAN_8, F.UPC_A, F.ITF, F.QR_CODE],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  });
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(Math.min(h, w) * 0.45) }) },
      text => {
        const now = Date.now();
        if ($('flash').classList.contains('ng')) return;          // 赤いエラーを閉じるまでは読まない
        if (text === lastCode && now - lastAt < 1500) return;   // 同じシールを続けて読まない
        lastCode = text; lastAt = now;
        if (/#o=.*&i=/.test(text) || /#u=.*&n=/.test(text)) { openOrder(text.slice(text.indexOf('#') + 1)); return; }   // 検品シートのQR → その注文を開く
        check(text);
      }, () => {});
  } catch (e) {
    $('readerMsg').textContent = 'カメラを起動できませんでした：' + (e && e.message ? e.message : e);
    scanner = null;
  }
}
async function stopCamera() {
  $('readerWrap').classList.remove('on');
  if (scanner) { try { await scanner.stop(); scanner.clear(); } catch (e) {} scanner = null; }
}
$('scanBtn').onclick = startCamera;
$('closeBtn').onclick = stopCamera;
$('resetBtn').onclick = () => { if (confirm('数え直しますか？')) { state.items.forEach(x => { x.scanned = 0; x.manual = 0; }); render(); } };
/* ---------- スキャナ（USB・Bluetooth）・手入力 ----------
   スキャナの配列設定（US）とパソコン（日本語配列）が違うと、記号が化けて入る（= → ^、& → '、* → ( など）。
   検品シートのQRっぽいのに #o= が見つからないときは、化けた記号を元に戻して読む */
function fixLayout(v) {
  if (/#o=.*&i=/.test(v) || /#u=.*&n=/.test(v)) return v;
  if (!/pack\.html/i.test(v) && !/#o\^/.test(v) && !/#u\^/.test(v)) return v;
  return v.replace(/\^/g, '=').replace(/'/g, '&').replace(/\(/g, '*').replace(/\+/g, ':');
}
function handleTyped(v) {
  v = String(v || '').trim();
  if (!v) return;
  const q = fixLayout(v);
  if (/#o=.*&i=/.test(q) || /#u=.*&n=/.test(q)) openOrder(q.slice(q.indexOf('#') + 1));
  else check(v);
}
$('manualInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const v = e.target.value; e.target.value = ''; handleTyped(v); }
});

// パソコン（マウスで操作する端末）では、入力欄にずっとカーソルを置いておく（クリック不要でスキャナが使える）
const isPC = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
function keepFocus() {
  if (!isPC || $('readerWrap').classList.contains('on')) return;
  const a = document.activeElement;
  if (a && a !== document.body && a !== $('manualInput') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  $('manualInput').focus({ preventScroll: true });
}
if (isPC) {
  document.addEventListener('click', () => setTimeout(keepFocus, 0));
  window.addEventListener('focus', () => setTimeout(keepFocus, 0));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') $('flash').className = '';   // 赤い表示を Esc で閉じる
    if (document.activeElement !== $('manualInput') && e.key.length === 1 && !e.ctrlKey && !e.metaKey) keepFocus();
  });
  setInterval(keepFocus, 1500);
}

// 端末に保存した商品名・画像を捨てて、zaicoから読み直す
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'reloadZaico') { e.preventDefault(); try { localStorage.removeItem(LS_KEY); } catch (_) {} location.reload(); }
});

/* ---------- 起動 ----------
   検品シートのQRから開いたとき：その注文を表示
   ポータルから開いたとき（QRの情報なし）：「検品シートのQRを読む」から始める。
   照合中のカメラで次の注文の検品シートQRを読むと、そのまま次の注文に切り替わる */
function openOrder(hash) {
  if (location.hash.replace(/^#/, '') === hash) return;
  location.hash = hash;   // hashchange で読み直す
}
window.addEventListener('hashchange', () => { state = parseHash(); start(); });

async function start() {
  if (state.us) { $('resetBtn').style.display = 'none'; return usStart(); }
  US.sel = null;
  if (!state.items.length) {
    $('orderNo').textContent = '梱包チェック';
    $('progress').textContent = '検品シートのQRを読んでください';
    $('bar').style.width = '0';
    $('allok').classList.remove('show');
    $('list').innerHTML = '<div class="note" style="font-size:14px;">' + (isPC ? 'スキャナで検品シートのQR、または荷物の配送伝票（倉庫追跡番号）のバーコードを読むと、その注文の商品が表示されます。バーコードのある商品はシール・PKGIDを読んで照合、ない商品は画像のタイルから選んで照合します。' : '下の「📷」ボタンでカメラを起動し、検品シートのQRを読むと、その注文の商品が表示されます。続けて商品のシールを読んで照合します。') + '</div>';
    $('scanBtn').textContent = '📷 検品シートのQRを読む';
    $('resetBtn').style.display = 'none';
    keepFocus();
    return;
  }
  $('scanBtn').textContent = '📷 商品のシールをスキャン';
  $('resetBtn').style.display = '';
  window.scrollTo(0, 0);
  render();
  try {
    const z = await getZaicoMap(state.items.filter(x => !x.unknown).map(x => x.code));
    zmap = z.map || {};
    $('cacheNote').innerHTML = z.withImg ? '' : esc('※ 画像のURLを取得できませんでした（' + (z.imgError || '関数の設定が必要です') + '）') + ' <a href="#" id="reloadZaico">zaicoから読み直す</a>';
  } catch (e) {
    $('cacheNote').textContent = '※ zaicoの商品名・画像を読めませんでした：' + e.message + '（照合はできます）';
  }
  render();
  keepFocus();
}
start();
</script>
