<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>統合ポータルアプリ</title>
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1C2733; --sub:#5B6877; --line:#D5DCE3;
  --blue:#1F5FAD; --blue-soft:#E6EEF8;
  --red:#C8362E; --red-soft:#FBEAE8;
  --amber:#B87A06; --amber-soft:#FBF2DF;
  --green:#2E7D4F; --green-soft:#E5F3EA;
  --gray-soft:#F3F5F7;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

/* ヘッダー */
.topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:16px;margin:0;flex:1;font-weight:700}
.me-chip{background:var(--gray-soft);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-chip.unset{background:var(--amber-soft);border-color:#E8CF94;color:var(--amber)}

/* 下部タブ */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{flex:1;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--sub);position:relative}
.nav-btn .ico{font-size:21px;line-height:1.2}
.nav-btn.active{color:var(--blue)}
.nav-btn.active::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.nav-badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;line-height:19px;text-align:center}

/* 共通レイアウト */
.tab-content{display:none;max-width:760px;margin:0 auto;padding:12px 12px 24px}
.tab-content.active{display:block}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:var(--radius);padding:0 12px;background:var(--surface)}
.btn{height:42px;padding:0 14px;border-radius:var(--radius);font-weight:700;font-size:14px;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-sub{background:var(--gray-soft);border:1px solid var(--line)}
.btn:disabled{opacity:.55}
.btn-sm{height:34px;padding:0 10px;font-size:13px;border-radius:8px;font-weight:700}
.btn-sm.edit{color:var(--amber);background:var(--amber-soft)}
.btn-sm.del{color:var(--red);background:var(--red-soft)}
.btn-sm.plain{background:var(--gray-soft);border:1px solid var(--line)}
.btn-sm.ok{background:var(--green);color:#fff}
.btn-sm.blue{background:var(--blue-soft);color:var(--blue)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{font-weight:400;margin-left:3px;opacity:.85}
.chip.warn .n{color:var(--red);font-weight:700;opacity:1}
.chip.on.warn .n{color:#FFB4AE}

.seg{display:flex;background:#DCE2E8;border-radius:var(--radius);padding:3px;margin-bottom:10px}
.seg button{flex:1;height:36px;border-radius:8px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--blue);box-shadow:0 1px 2px rgba(28,39,51,.15)}

.meta-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub);margin:2px 2px 8px;flex-wrap:wrap}
.meta-row select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 6px;font-size:12px}
.link-btn{color:var(--blue);font-weight:700;font-size:12px;padding:4px 0}

/* フォーム */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;border-top:4px solid var(--blue)}
.panel h2{font-size:15px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{margin-bottom:10px}
.field label,.lbl{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:3px}
.inp{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
textarea.inp{resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:6px 0}
.check input{width:20px;height:20px}
.prio{display:flex;gap:6px}
.prio button{flex:1;height:40px;border-radius:8px;border:1px solid var(--line);font-weight:700;font-size:13px;background:#fff;color:var(--sub)}
.prio button.on.normal{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.prio button.on.urgent{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.img-btns{display:flex;gap:6px;margin-bottom:6px}
.img-btns label{height:36px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;font-size:13px;font-weight:700;cursor:pointer;background:var(--gray-soft);border:1px solid var(--line)}
.previews{display:flex;flex-wrap:wrap;gap:8px}
.pv{position:relative}
.pv img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.pv button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;line-height:24px}
.form-actions{display:flex;gap:8px;margin-top:6px}
.form-actions .btn{flex:1}
.forward{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.forward .btn{width:100%;background:var(--blue-soft);color:var(--blue)}

/* カード */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.item.s-blue{border-left-color:var(--blue)}
.item.s-red{border-left-color:var(--red)}
.item.s-amber{border-left-color:#E0A526}
.item.s-green{border-left-color:var(--green)}
.item.done{background:#F7F8FA}
.item.unread{box-shadow:0 0 0 2px rgba(31,95,173,.25)}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--gray-soft);color:var(--sub);white-space:nowrap}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.new{background:var(--blue);color:#fff}
.when{font-size:11px;color:var(--sub);white-space:nowrap;text-align:right}
.item-title{font-weight:700;font-size:15px;margin:2px 0}
.body{font-size:14px;white-space:pre-wrap;word-break:break-word}
.body.clamp{max-height:4.7em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.more-link{font-size:12px;color:var(--blue);font-weight:700;padding:4px 0}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.readers{font-size:11px;color:var(--sub);margin-top:4px}
.done-box{background:var(--green-soft);color:#1E5536;border-radius:8px;padding:6px 10px;font-size:13px;margin:6px 0;white-space:pre-wrap}
.complete-row{display:flex;gap:6px;margin-top:8px}
.complete-row .inp{min-height:36px;padding:6px 10px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;border-top:1px solid #E9EDF1;margin-top:8px;padding-top:8px}
.actions .spacer{flex:1}
.mat-lines{margin:4px 0 0;padding:0;list-style:none;font-size:14px}
.mat-lines li{display:flex;gap:8px;padding:3px 0;border-bottom:1px dotted #E1E6EB}
.mat-lines li:last-child{border-bottom:none}
.mat-lines .q{margin-left:auto;font-weight:700;white-space:nowrap}
.mat-lines .m{color:var(--sub);font-size:12px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:28px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.more-btn{display:block;width:100%;margin-top:10px;height:42px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--blue)}

/* 資材行 */
.mat-row{display:flex;gap:6px;align-items:flex-start;background:var(--gray-soft);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px}
.mat-row.err{border-color:var(--red);background:var(--red-soft)}
.mat-row .rm{width:30px;height:36px;color:var(--red);font-weight:700}
.mat-row .cols{flex:1;display:flex;flex-direction:column;gap:4px}
.mat-row .sub{display:flex;gap:4px}
.mat-row .inp{min-height:36px;padding:6px 8px;font-size:14px}
.mat-row .m-unit{width:70px;flex:none}
.stepper{display:flex;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.stepper button{width:38px;height:38px;font-size:18px;font-weight:700;color:var(--blue);background:var(--blue-soft)}
.stepper .m-qty{width:52px;border:none;border-radius:0;text-align:center;min-height:38px;padding:0 2px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.pick{position:relative;min-height:46px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;text-align:left;line-height:1.3}
.pick small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.pick.in{border-color:var(--green);background:var(--green-soft)}
.pick .cnt{position:absolute;top:-7px;right:-5px;background:var(--green);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:18px}
.hint{font-size:12px;color:var(--sub);background:var(--gray-soft);border:1px dashed var(--line);border-radius:8px;padding:10px}
.wh-checks{display:flex;flex-wrap:wrap;gap:4px 14px}
.wh-checks label{display:flex;align-items:center;gap:6px;font-size:14px;padding:4px 0}
.wh-checks input{width:18px;height:18px}
.master-list{margin-top:12px;border-top:1px solid var(--line)}
.m-item{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #E9EDF1}
.m-item .info{flex:1;min-width:0}
.m-item .nm{font-weight:700;font-size:14px}
.m-item .ord{display:flex;flex-direction:column;gap:2px}
.m-item .ord button{width:30px;height:22px;border-radius:5px;background:var(--gray-soft);border:1px solid var(--line);font-size:11px}
.m-item .ord button:disabled{opacity:.3}
#mat-items:empty::before{content:"上のボタンから選ぶか、下の「手入力」で追加してください";display:block;font-size:12px;color:var(--sub);padding:10px;border:1px dashed var(--line);border-radius:8px;margin-bottom:6px}
.add-row{width:100%;height:40px;border:1px dashed #9DB6D6;border-radius:8px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:13px;margin-bottom:10px}

/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(20,28,38,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.overlay.show{display:flex}
.dialog{background:var(--surface);width:100%;max-width:360px;border-radius:12px;padding:18px}
.dialog h3{margin:0 0 10px;font-size:16px}
.dialog .form-actions{margin-top:12px}
.img-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.img-overlay.show{display:flex}
.img-overlay img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:3000;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<header class="topbar">
  <h1 id="page-title">📓 共有ノート</h1>
  <button id="me-btn" class="me-chip" onclick="openNameModal()">👤 名前を設定</button>
</header>

<!-- ==================== 1. 共有ノート ==================== -->
<section id="app-notes" class="tab-content active">
  <div class="toolbar">
    <input type="search" id="note-search" class="search" placeholder="🔍 キーワード検索">
    <button class="btn btn-primary" onclick="openNoteForm()">＋ ノート</button>
  </div>

  <div class="panel" id="note-panel" hidden>
    <h2 id="note-form-title">📢 新しいノート</h2>
    <form id="note-form">
      <input type="hidden" id="note-edit-id">
      <div class="grid2">
        <div class="field"><label for="note-date">日付</label><input type="date" id="note-date" class="inp" required></div>
        <div class="field"><label for="note-cat">カテゴリ</label>
          <select id="note-cat" class="inp">
            <option value="一般連絡">一般連絡</option><option value="重要・要確認">重要・要確認</option><option value="決定事項">決定事項</option>
          </select>
        </div>
      </div>
      <div class="field"><label for="note-title">タイトル</label><input type="text" id="note-title" class="inp" required></div>
      <div class="field"><label for="note-content">本文</label><textarea id="note-content" class="inp" rows="4" required></textarea></div>
      <label class="check"><input type="checkbox" id="note-pinned"> 📌 一覧の上に固定する</label>
      <div class="field">
        <span class="lbl">画像（複数可）</span>
        <div class="img-btns">
          <label>📷 撮影<input type="file" id="note-camera" accept="image/*" capture="environment" multiple hidden></label>
          <label>📁 選択<input type="file" id="note-file" accept="image/*" multiple hidden></label>
        </div>
        <div id="note-previews" class="previews"></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-sub" onclick="closeNoteForm()">閉じる</button>
        <button type="submit" id="note-submit-btn" class="btn btn-primary">保存する</button>
      </div>
    </form>
    <div class="forward"><button type="button" class="btn" onclick="openNoteToStaffModal()">🚀 この内容を「依頼・伝言」にも送る</button></div>
  </div>

  <div class="chips" id="note-chips"></div>
  <div class="meta-row"><span id="note-count"></span><button class="link-btn" id="note-readall" onclick="markAllNotesRead()">すべて確認済みにする</button></div>
  <div id="note-list" class="list"></div>
  <button id="note-more" class="more-btn" onclick="showMore('notes')" hidden>もっと見る</button>
</section>

<!-- ==================== 2. 依頼・伝言 ==================== -->
<section id="app-staff" class="tab-content">
  <div class="toolbar">
    <input type="search" id="staff-search" class="search" placeholder="🔍 キーワード検索">
    <button class="btn btn-primary" onclick="openStaffForm()">＋ 依頼</button>
  </div>

  <div class="panel" id="staff-panel" hidden>
    <h2 id="staff-form-title">✍️ 新しい依頼・伝言</h2>
    <form id="staff-form">
      <input type="hidden" id="staff-edit-id">
      <div class="grid2">
        <div class="field"><label for="staff-from">From（依頼者）</label><input type="text" id="staff-from" class="inp" required></div>
        <div class="field"><label for="staff-to">To（宛先）</label><input type="text" id="staff-to" class="inp" list="name-list" placeholder="名前 or 全員" required></div>
      </div>
      <div class="field"><label for="staff-task">内容</label><textarea id="staff-task" class="inp" rows="3" required></textarea></div>
      <div class="grid2">
        <div class="field"><span class="lbl">優先度</span>
          <div class="prio" id="staff-prio">
            <button type="button" data-v="normal" class="normal on">通常</button>
            <button type="button" data-v="urgent" class="urgent">🔥 急ぎ</button>
          </div>
        </div>
        <div class="field"><label for="staff-due">期限（任意）</label><input type="date" id="staff-due" class="inp"></div>
      </div>
      <div class="field">
        <span class="lbl">画像（複数可）</span>
        <div class="img-btns">
          <label>📷 撮影<input type="file" id="staff-camera" accept="image/*" capture="environment" multiple hidden></label>
          <label>📁 選択<input type="file" id="staff-file" accept="image/*" multiple hidden></label>
        </div>
        <div id="staff-previews" class="previews"></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-sub" onclick="closeStaffForm()">閉じる</button>
        <button type="submit" id="staff-submit-btn" class="btn btn-primary">送信する</button>
      </div>
    </form>
  </div>

  <div class="seg">
    <button id="staff-tab-active" class="on" onclick="switchStaffTab('active')">未完了</button>
    <button id="staff-tab-history" onclick="switchStaffTab('history')">完了履歴</button>
  </div>
  <div class="chips" id="staff-chips"></div>
  <div class="meta-row">
    <span id="staff-count"></span>
    <span>
      <select id="staff-sort" aria-label="並び順">
        <option value="priority">優先順</option><option value="new">新しい順</option><option value="old">古い順</option>
      </select>
      <select id="staff-period" aria-label="表示期間" hidden>
        <option value="7">完了から7日</option><option value="30">完了から30日</option><option value="all">すべての期間</option>
      </select>
    </span>
  </div>
  <div id="staff-list" class="list"></div>
  <button id="staff-more" class="more-btn" onclick="showMore('staff')" hidden>もっと見る</button>
</section>

<!-- ==================== 3. 資材発注 ==================== -->
<section id="app-mat" class="tab-content">
  <div class="toolbar">
    <select id="mat-wh-filter" class="search" aria-label="倉庫で絞り込み">
      <option value="">🏭 すべての倉庫</option><option value="調布1F">調布1F</option><option value="調布地下">調布地下</option><option value="本庄">本庄</option><option value="新潟">新潟</option>
    </select>
    <button class="btn btn-sub" onclick="openMaster()" aria-label="資材マスタ">⚙ 資材登録</button>
    <button class="btn btn-primary" onclick="openMatForm()">＋ 発注</button>
  </div>

  <div class="panel" id="master-panel" hidden style="border-top-color:var(--amber)">
    <h2 id="master-form-title">⚙ よく使う資材を登録</h2>
    <p style="font-size:12px;color:var(--sub);margin:-4px 0 10px">登録した資材は、発注依頼の画面にボタンで表示されます。全員で共通です。</p>
    <input type="hidden" id="master-edit-id">
    <div class="field"><label for="master-name">資材名</label><input type="text" id="master-name" class="inp" placeholder="例：60サイズ段ボール"></div>
    <div class="grid2">
      <div class="field"><label for="master-unit">単位</label><input type="text" id="master-unit" class="inp" list="unit-list" placeholder="個"></div>
      <div class="field"><label for="master-qty">1回の基本数量</label><input type="number" id="master-qty" class="inp" min="1" step="1" inputmode="numeric" value="1"></div>
    </div>
    <div class="field"><span class="lbl">使う倉庫（どれも選ばない＝全倉庫で表示）</span>
      <div class="wh-checks" id="master-wh">
        <label><input type="checkbox" value="調布1F"> 調布1F</label>
        <label><input type="checkbox" value="調布地下"> 調布地下</label>
        <label><input type="checkbox" value="本庄"> 本庄</label>
        <label><input type="checkbox" value="新潟"> 新潟</label>
      </div>
    </div>
    <div class="form-actions">

const pad = n => String(n).padStart(2, '0');

/* ==================== 画像（圧縮・アップロード・後片付け） ==================== */
async function compressImage(file, maxWidth = 1200, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => resolve(new File([blob], file.name, { type: 'image/jpeg' })), 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = event.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadAll(files, folder) {
  const urls = [];
  for (const file of files) {
    const compressed = await compressImage(file);
    const r = ref(storage, `${folder}/${Date.now()}_${Math.random().toString(36).substring(2)}`);
    await uploadBytes(r, compressed);
    urls.push(await getDownloadURL(r));
  }
  return urls;
}
// 他のノート・依頼でまだ使われている画像は消さない（ノート転送で同じ画像を共有しているため）
function isImageUsed(url, exclude) {
  const inNotes = allNotes.some(n => !(exclude.col === 'notes' && n.id === exclude.id) && (n.imageUrls || []).includes(url));
  const inStaff = allStaff.some(s => !(exclude.col === 'staff' && s.id === exclude.id) && (s.imageUrls || []).includes(url));
  return inNotes || inStaff;
}
async function cleanupImages(urls, exclude) {
  for (const url of urls || []) {
    if (isImageUsed(url, exclude)) continue;
    try { await deleteObject(ref(storage, url)); } catch (e) { console.warn('画像削除スキップ:', e.code || e.message); }
  }
}

// ノートを保存（新規 or 更新）し、使わなくなった画像を片付ける
async function saveNote(imageUrls) {
  const data = noteFormData(imageUrls);
  const editId = $('note-edit-id').value;
  const me = getMe();

    const before = allNotes.find(n => n.id === editId);

  } else {
    data.createdAt = serverTimestamp();
    data.author = me;
    data.readBy = me ? [me] : [];

  }
}

const NOTE_CAT = {
  '重要・要確認': { stripe: 's-red', tag: 'red' },

  '一般連絡': { stripe: 's-blue', tag: 'blue' }
};

function renderNoteChips() {
  const c = (f) => allNotes.filter(f).length;
  const chips = [
    ['all', 'すべて', allNotes.length],
    ['unread', '未確認', c(n => !isRead(n)), true],
    ['pinned', '📌 固定', c(n => n.pinned)],
    ['重要・要確認', '重要・要確認', c(n => n.category === '重要・要確認')],
    ['決定事項', '決定事項', c(n => n.category === '決定事項')],
    ['一般連絡', '一般連絡', c(n => n.category === '一般連絡')]
  ];
  $('note-chips').innerHTML = chips.map(([k, l, n, warn]) =>
    `<button class="chip ${noteFilter === k ? 'on' : ''} ${warn && n ? 'warn' : ''}" onclick="setNoteFilter('${k}')">${l}<span class="n">${n}</span></button>`).join('');
}
window.setNoteFilter = (k) => { noteFilter = k; resetLimit('notes'); renderNotes(); };

function renderNotes() {
  renderNoteChips();
  const me = getMe();
  const kw = $('note-search').value.trim().toLowerCase();
  let list = allNotes.filter(n => {
    if (noteFilter === 'unread' && isRead(n)) return false;
    if (noteFilter === 'pinned' && !n.pinned) return false;
    if (NOTE_CAT[noteFilter] && n.category !== noteFilter) return false;
    if (kw && !(`${n.title || ''} ${n.content || ''} ${n.category || ''}`).toLowerCase().includes(kw)) return false;
    return true;
  });
  // 固定 → 新しい順
  list.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || ms(b.createdAt) - ms(a.createdAt));

  const unreadCount = allNotes.filter(n => !isRead(n)).length;
  $('note-readall').hidden = !me || !unreadCount;
  $('note-count').textContent = `${list.length}件`;

  const shown = list.slice(0, limits.notes);
  $('note-more').hidden = list.length <= limits.notes;
  $('note-list').innerHTML = shown.map(n => {
    const cat = NOTE_CAT[n.category] || NOTE_CAT['一般連絡'];
    const read = isRead(n);
    const readers = (n.readBy || []);
    return `
    <article class="item ${cat.stripe} ${read ? '' : 'unread'}">
      <div class="item-head">
        <div class="tags">
          ${read ? '' : '<span class="tag new">未確認</span>'}
          ${n.pinned ? '<span class="tag amber">📌 固定</span>' : ''}
          <span class="tag ${cat.tag}">${esc(n.category)}</span>
        </div>
        <div class="when">${esc(md(n.date))}${n.author ? `<br>${esc(n.author)}` : ''}</div>
      </div>
      <div class="item-title">${esc(n.title)}</div>
      ${bodyHtml('n' + n.id, n.content)}
      ${thumbsHtml(n.imageUrls)}
      ${readers.length ? `<div class="readers">✓ 確認済み（${readers.length}人）：${esc(readers.join('、'))}</div>` : ''}
      <div class="actions">
        ${me && !read ? `<button class="btn-sm ok" onclick="markNoteRead('${n.id}')">✓ 確認しました</button>` : ''}
        <span class="spacer"></span>
        <button class="btn-sm plain" onclick="togglePin('${n.id}')">${n.pinned ? '固定を外す' : '📌 固定'}</button>
        <button class="btn-sm edit" onclick="editNote('${n.id}')">編集</button>
        <button class="btn-sm del" onclick="delNote('${n.id}')">削除</button>

function dueState(s) {
  if (!s.due || s.status === 'completed') return '';
  const t = todayStr();
  if (s.due < t) return 'over';
  if (s.due === t) return 'today';
  return 'later';
}
const isHot = s => s.status !== 'completed' && (s.priority === 'urgent' || dueState(s) === 'over' || dueState(s) === 'today');
const isStale = s => s.status !== 'completed' && daysSince(s.createdAt) >= 3;

function inPeriod(s) {
  const p = $('staff-period').value;
  if (p === 'all') return true;
  const done = ms(s.completedAt);
  if (!done) return true;
  return Date.now() - done <= Number(p) * 86400000;
}

function renderStaffChips(base) {
  const me = getMe();
  const chips = [['all', 'すべて', base.length]];
  if (me) {
    chips.push(['mine', '自分宛て', base.filter(isForMe).length]);
    chips.push(['sent', '自分が依頼', base.filter(s => s.from === me).length]);
  }
  if (staffTab === 'active') {
    if (me) chips.push(['unread', '未確認', base.filter(s => isForMe(s) && !isRead(s)).length, true]);
    chips.push(['hot', '🔥 急ぎ・期限', base.filter(isHot).length, true]);
    chips.push(['stale', '⏳ 3日以上', base.filter(isStale).length, true]);
  }
  if (!chips.some(c => c[0] === staffScope)) staffScope = 'all';
  $('staff-chips').innerHTML = chips.map(([k, l, n, warn]) =>
    `<button class="chip ${staffScope === k ? 'on' : ''} ${warn && n ? 'warn' : ''}" onclick="setStaffScope('${k}')">${l}<span class="n">${n}</span></button>`).join('');
}

function staffRank(s) {
  if (s.priority === 'urgent') return 0;
  const d = dueState(s);
  if (d === 'over') return 1;
  if (d === 'today') return 2;
  if (isForMe(s) && !isRead(s)) return 3;
  if (isStale(s)) return 4;
  return 5;
}

function renderStaff() {
  const me = getMe();
  const kw = $('staff-search').value.trim().toLowerCase();
  let base = allStaff.filter(s => staffTab === 'active' ? s.status !== 'completed' : (s.status === 'completed' && inPeriod(s)));
  if (kw) base = base.filter(s => `${s.from || ''} ${s.to || ''} ${s.task || ''} ${s.completedNote || ''}`.toLowerCase().includes(kw));
  renderStaffChips(base);

  let list = base.filter(s => {
    switch (staffScope) {
      case 'mine': return isForMe(s);
      case 'sent': return s.from === me;
      case 'unread': return isForMe(s) && !isRead(s);
      case 'hot': return isHot(s);
      case 'stale': return isStale(s);
      default: return true;
    }
  });

  if (staffTab === 'history') {
    list.sort((a, b) => ms(b.completedAt) - ms(a.completedAt));
  } else {
    const sort = $('staff-sort').value;
    if (sort === 'new') list.sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
    else if (sort === 'old') list.sort((a, b) => ms(a.createdAt) - ms(b.createdAt));
    else list.sort((a, b) => staffRank(a) - staffRank(b) || (a.due || '9999') .localeCompare(b.due || '9999') || ms(b.createdAt) - ms(a.createdAt));
  }

  $('staff-count').textContent = `${list.length}件`;
  const shown = list.slice(0, limits.staff);
  $('staff-more').hidden = list.length <= limits.staff;

  $('staff-list').innerHTML = shown.map(s => {
    const comp = s.status === 'completed';
    const d = dueState(s);
    const forMe = isForMe(s);
    const read = isRead(s);
    const age = daysSince(s.createdAt);
    let stripe = 's-blue';
    if (comp) stripe = 's-green';
    else if (s.priority === 'urgent' || d === 'over') stripe = 's-red';
    else if (d === 'today' || isStale(s)) stripe = 's-amber';
    const readers = (s.readBy || []).filter(n => n !== s.from);

    const tags = [
      forMe && !read && !comp ? '<span class="tag new">未確認</span>' : '',
      s.priority === 'urgent' && !comp ? '<span class="tag red">🔥 急ぎ</span>' : '',
      d === 'over' ? `<span class="tag red">期限切れ ${esc(md(s.due))}</span>` : '',
      d === 'today' ? '<span class="tag amber">今日まで</span>' : '',
      d === 'later' ? `<span class="tag">期限 ${esc(md(s.due))}</span>` : '',
      !comp && age >= 3 ? `<span class="tag amber">⏳ ${age}日経過</span>` : ''
    ].join('');

    return `
    <article class="item ${stripe} ${comp ? 'done' : ''} ${forMe && !read && !comp ? 'unread' : ''}">
      <div class="item-head">
        <div class="tags">
          <span class="tag blue">F: ${esc(s.from)}</span>
          <span class="tag" style="background:#E9E6F7;color:#4A3F99">T: ${esc(s.to)}</span>
        </div>
        <div class="when">${esc(fmtTs(s.createdAt))}</div>
      </div>
      ${tags ? `<div class="tags" style="margin-bottom:4px">${tags}</div>` : ''}
      ${bodyHtml('s' + s.id, s.task)}
      ${thumbsHtml(s.imageUrls)}
      ${readers.length ? `<div class="readers">✓ 確認済み：${esc(readers.join('、'))}</div>` : ''}
      ${comp ? `
        <div class="done-box">✅ 完了${s.completedBy ? `（${esc(s.completedBy)}）` : ''} ${esc(fmtTs(s.completedAt))}${s.completedNote ? `\n${esc(s.completedNote)}` : ''}</div>
        <div class="actions">
          <button class="btn-sm plain" onclick="staffStatus('${s.id}','pending')">未完了に戻す</button>
          <button class="btn-sm del" onclick="delStaff('${s.id}')">削除</button>
        </div>` : `
        <div class="complete-row">
          <input type="text" id="snote_${s.id}" class="inp" placeholder="対応メモ（任意）">
          <button class="btn-sm ok" onclick="staffStatus('${s.id}','completed')">完了</button>
        </div>
        <div class="actions">
          ${me && !read ? `<button class="btn-sm blue" onclick="markStaffRead('${s.id}')">👀 確認しました</button>` : ''}
          <span class="spacer"></span>
          <button class="btn-sm edit" onclick="editStaff('${s.id}')">編集</button>
          <button class="btn-sm del" onclick="delStaff('${s.id}')">削除</button>
        </div>`}
    </article>`;
  }).join('') || `<div class="empty">${staffTab === 'active' ? '未完了の依頼はありません 👍' : 'この期間の完了履歴はありません。期間を「すべての期間」にすると古い履歴も見られます。'}</div>`;
}

        </div>
      </div>
      <button class="btn-sm edit" onclick="editMaster('${m.id}')">編集</button>
      <button class="btn-sm del" onclick="delMaster('${m.id}')">削除</button>
    </div>`).join('') || '<div class="hint" style="margin-top:10px">まだ登録がありません。上のフォームから追加するか、下のボタンで過去の発注から取り込めます。</div>';
}

window.saveMaster = async () => {
  const name = $('master-name').value.trim();
  const unit = $('master-unit').value.trim() || '個';
  const qty = Number($('master-qty').value);
  const editId = $('master-edit-id').value;
  if (!name) return toast('資材名を入力してください');
  if (!Number.isInteger(qty) || qty < 1) return toast('基本数量は1以上の整数で入力してください');
  if (allMaster.some(m => m.name === name && m.id !== editId)) return toast('同じ名前の資材がすでに登録されています');
  const warehouses = [...document.querySelectorAll('#master-wh input:checked')].map(c => c.value);
  const data = { name, unit, defaultQty: qty, warehouses };
  try {
    if (editId) {
      await updateDoc(doc(db, 'material_master', editId), data);
      toast('資材を更新しました');
    } else {
      data.sort = allMaster.length ? Math.max(...allMaster.map(m => m.sort ?? 0)) + 1 : 0;
      await addDoc(collection(db, 'material_master'), data);
      toast(`「${name}」を登録しました`);
    }
    resetMasterForm();
    $('master-name').focus();
  } catch (e) { alert('エラー: ' + e.message); }
};
window.editMaster = (id) => {
  const m = allMaster.find(x => x.id === id);
  if (!m) return;
  $('master-edit-id').value = id;
  $('master-name').value = m.name;
  $('master-unit').value = m.unit || '個';
  $('master-qty').value = m.defaultQty || 1;
  document.querySelectorAll('#master-wh input').forEach(c => c.checked = (m.warehouses || []).includes(c.value));
  $('master-form-title').textContent = '✏️ 資材を編集';
  $('master-submit-btn').textContent = '更新する';
  window.scrollTo(0, 0);
};
window.delMaster = (id) => {
  const m = allMaster.find(x => x.id === id);
  showConfirm(`「${m?.name}」を登録から外しますか？（過去の発注履歴は消えません）`, async () => {
    await deleteDoc(doc(db, 'material_master', id));
    toast('登録から外しました');
  }, '外す');
};
window.moveMaster = async (i, d) => {
  const arr = [...allMaster];
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  const batch = writeBatch(db);
  arr.forEach((m, idx) => { if (m.sort !== idx) batch.update(doc(db, 'material_master', m.id), { sort: idx }); });
  try { await batch.commit(); } catch (e) { alert('エラー: ' + e.message); }
};
window.importMasterFromHistory = () => {
  const have = new Set(allMaster.map(m => m.name));
  const found = new Map();
  allMat.forEach(o => (o.itemsData || []).forEach(it => {
    const n = String(it.name || '').trim();
    if (!n || have.has(n)) return;
    const f = found.get(n) || { count: 0, unit: it.unit || '個', whs: new Set() };
    f.count++; if (o.warehouse) f.whs.add(o.warehouse);
    found.set(n, f);
  }));
  if (!found.size) return toast('取り込める新しい資材はありません');
  // よく使われている順に並べる
  const list = [...found.entries()].sort((a, b) => b[1].count - a[1].count);
  showConfirm(`過去の発注から${list.length}件の資材が見つかりました。まとめて登録しますか？（あとで編集・削除できます）`, async () => {
    let sort = allMaster.length ? Math.max(...allMaster.map(m => m.sort ?? 0)) + 1 : 0;
    const batch = writeBatch(db);
    list.slice(0, 400).forEach(([name, f]) => {
      batch.set(doc(collection(db, 'material_master')), { name, unit: f.unit, defaultQty: 1, warehouses: [], sort: sort++ });
    });
    await batch.commit();
    toast(`${Math.min(list.length, 400)}件を登録しました`);
  }, '登録する', false);
};

/* 過去の発注と同じ内容で、新しく依頼を作る */
window.reorderMat = (id) => {
  const m = allMat.find(x => x.id === id);
  if (!m) return;
  closeMaster();
  resetMatForm();
  $('mat-req').value = m.warehouse || '調布1F';
  $('mat-items').innerHTML = '';
  (m.itemsData && m.itemsData.length ? m.itemsData : [{}]).forEach(it => addMatRow(it.name ? it : null));
  $('mat-form-title').textContent = '📦 発注依頼を作成（前回の内容をコピー）';
  $('mat-panel').hidden = false;
  renderPicks();
  window.scrollTo(0, 0);
  toast('内容をコピーしました。数量を確認して保存してください');
};

window.saveMatOrder = async () => {
  const warehouse = $('mat-req').value;
  const editId = $('mat-edit-id').value;
  const itemsText = [], itemsData = [];
  let hasError = false;
  document.querySelectorAll('.mat-row').forEach(r => {
    r.classList.remove('err');
    const name = r.querySelector('.m-name').value.trim();
    const qtyRaw = r.querySelector('.m-qty').value.trim();
    const memo = r.querySelector('.m-memo').value.trim();
    const unit = r.querySelector('.m-unit').value.trim() || '個';
    if (!name) return;
    const qty = Number(qtyRaw);
    if (!qtyRaw || !Number.isInteger(qty) || qty < 1) { r.classList.add('err'); hasError = true; return; }
    itemsText.push(`・${name} : ${qty}${unit}` + (memo ? ` (${memo})` : ''));
    itemsData.push({ name, qty, unit, memo });
  });
  if (hasError) return toast('数量は1以上の整数で入力してください（赤枠の行）');
  if (itemsData.length === 0) return toast('資材名を入力してください');

  const btn = $('mat-submit-btn');
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    const data = {
      date: $('mat-date').value || todayStr(),
      warehouse,
      text: `■倉庫名: ${warehouse}\n` + itemsText.join('\n'),
      itemsData
    };
    if (editId) {
      data.updatedAt = serverTimestamp();
      await updateDoc(doc(db, 'material_orders', editId), data);
      toast('発注依頼を更新しました');
    } else {
      data.createdAt = serverTimestamp();
      data.status = '未発注';
      data.createdBy = getMe();
      await addDoc(collection(db, 'material_orders'), data);
      toast('発注依頼を保存しました');
    }
    closeMatForm();   // ここでボタン表示も「保存する」に戻る
  } catch (e) {
    alert('エラー: ' + e.message);
    btn.textContent = editId ? '💾 更新する' : '💾 保存する';
  }
  btn.disabled = false;
};

onSnapshot(query(collection(db, 'material_orders'), orderBy('createdAt', 'desc')), snap => {
  allMat = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
  renderMat(); refreshBadges();   // 選んでいる絞り込みはそのまま維持
});

window.setMatPeriod = (k) => { matPeriod = k; resetLimit('mat'); renderMat(); };
window.setMatStatus = (k) => { matStatus = k; resetLimit('mat'); renderMat(); };
$('mat-wh-filter').addEventListener('change', () => { resetLimit('mat'); renderMat(); });

function renderMat() {
  const wh = $('mat-wh-filter').value;
  const today = todayStr();
  const past7 = daysAgoStr(7);
  const byWh = allMat.filter(m => !wh || (m.warehouse || m.requester) === wh);
  const inPer = m => matPeriod === 'today' ? m.date === today : matPeriod === '7days' ? (m.date >= past7 && m.date <= today) : true;
  const base = byWh.filter(inPer);

  const st = [['all', 'すべて', base.length], ['未発注', '未発注', base.filter(m => m.status === '未発注').length, true], ['発注済み', '発注済み', base.filter(m => m.status === '発注済み').length]];
  $('mat-status-chips').innerHTML = st.map(([k, l, n, warn]) => `<button class="chip ${matStatus === k ? 'on' : ''} ${warn && n ? 'warn' : ''}" onclick="setMatStatus('${k}')">${l}<span class="n">${n}</span></button>`).join('');
  const pr = [['today', '今日'], ['7days', '過去7日'], ['all', '全期間']];
  $('mat-period-chips').innerHTML = pr.map(([k, l]) => `<button class="chip ${matPeriod === k ? 'on' : ''}" onclick="setMatPeriod('${k}')">📅 ${l}</button>`).join('');

  let list = base.filter(m => matStatus === 'all' || m.status === matStatus);
  // 未発注を上に、その中は古い順（放置を防ぐ）／発注済みは新しい順
  list.sort((a, b) => {
    const pa = a.status === '未発注' ? 0 : 1, pb = b.status === '未発注' ? 0 : 1;
    if (pa !== pb) return pa - pb;
    return pa === 0 ? ms(a.createdAt) - ms(b.createdAt) : ms(b.createdAt) - ms(a.createdAt);
  });

  $('mat-count').textContent = `${list.length}件`;
  const shown = list.slice(0, limits.mat);
  $('mat-more').hidden = list.length <= limits.mat;

  $('mat-list').innerHTML = shown.map(m => {
    const done = m.status === '発注済み';
    const whName = m.warehouse || m.requester || '未設定';
    const age = daysSince(m.createdAt);
    const stale = !done && age >= 2;
    const lines = (m.itemsData && m.itemsData.length)
      ? `<ul class="mat-lines">${m.itemsData.map(it => `<li><span>${esc(it.name)}${it.memo ? `<br><span class="m">${esc(it.memo)}</span>` : ''}</span><span class="q">${esc(it.qty)}${esc(it.unit || '個')}</span></li>`).join('')}</ul>`
      : `<div class="body">${esc(m.text)}</div>`;
    return `
    <article class="item ${done ? 's-green done' : stale ? 's-amber' : 's-red'}">
      <div class="item-head">
        <div class="tags">
          <span class="tag ${done ? 'green' : 'red'}">${esc(m.status)}</span>
          <span class="tag">🏭 ${esc(whName)}</span>
          ${stale ? `<span class="tag amber">⏳ ${age}日経過</span>` : ''}
        </div>
        <div class="when">📅 ${esc(md(m.date))}${m.createdBy ? `<br>${esc(m.createdBy)}` : ''}</div>
      </div>
      ${lines}
      ${done && (m.orderedBy || m.orderedAt) ? `<div class="readers">発注済み：${esc(m.orderedBy || '')} ${esc(fmtTs(m.orderedAt))}</div>` : ''}
      <div class="actions">
        ${done
          ? `<button class="btn-sm plain" onclick="revertMat('${m.id}')">↩ 未発注に戻す</button>`
          : `<button class="btn-sm ok" onclick="updateMatStatus('${m.id}')">✅ 発注済みにする</button>`}
        <span class="spacer"></span>
        <button class="btn-sm blue" onclick="reorderMat('${m.id}')">📋 同じ内容で依頼</button>
        <button class="btn-sm edit" onclick="editMat('${m.id}')">編集</button>
        <button class="btn-sm del" onclick="delMat('${m.id}')">削除</button>
      </div>
    </article>`;
  }).join('') || '<div class="empty">該当する発注依頼はありません。絞り込みを変えるか、「＋ 発注依頼」から作成できます。</div>';
}

window.editMat = (id) => {
  const m = allMat.find(x => x.id === id);
  if (!m) return;
  $('mat-edit-id').value = id;
  $('mat-date').value = m.date || todayStr();
  $('mat-req').value = m.warehouse || '調布1F';
  $('mat-items').innerHTML = '';
  if (m.itemsData && m.itemsData.length) m.itemsData.forEach(item => addMatRow(item));
  else addMatRow();
  $('mat-form-title').textContent = '✏️ 発注依頼を編集';
  $('mat-submit-btn').textContent = '💾 更新する';
  closeMaster();
  $('mat-panel').hidden = false;
  renderPicks();
  window.scrollTo(0, 0);
};
window.updateMatStatus = async (id) => {
  await updateDoc(doc(db, 'material_orders', id), { status: '発注済み', orderedAt: serverTimestamp(), orderedBy: getMe() });
  toast('発注済みにしました');
};
window.revertMat = (id) => showConfirm('この依頼を「未発注」に戻しますか？', async () => {
  await updateDoc(doc(db, 'material_orders', id), { status: '未発注', orderedAt: null, orderedBy: '' });
  toast('未発注に戻しました');
}, '未発注に戻す', false);
window.delMat = (id) => showConfirm('発注履歴を削除しますか？', async () => {
  await deleteDoc(doc(db, 'material_orders', id));
  toast('削除しました');
});

/* ==================== 起動 ==================== */
function renderAll() { renderNotes(); renderStaff(); renderMat(); refreshBadges(); refreshNameList(); }
renderMe();
$('staff-from').value = getMe();
const lastTab = localStorage.getItem('app_last_tab');
if (lastTab && TITLES[lastTab]) switchAppTab(lastTab);
if (!getMe()) setTimeout(openNameModal, 400);

// 日付をまたいで開きっぱなしでも「今日」「期限」の判定がずれないよう、1分ごとに再判定
let lastDay = todayStr();
setInterval(() => {
  if (todayStr() !== lastDay) {
    lastDay = todayStr();
    if (!$('note-edit-id').value) $('note-date').value = lastDay;
    if (!$('mat-edit-id').value) $('mat-date').value = lastDay;
    renderAll();
  }
}, 60000);
</script>
</body>
</html>
