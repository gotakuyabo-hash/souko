<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新規お申込み</title>
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1C2631; --sub:#5E6B78; --line:#D3DAE1;
  --blue:#1E5A84; --blue-soft:#E3EEF6; --stamp:#C2412D; --warn:#A86A00;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.04em}
.top .synced{font-size:12px;opacity:.75;margin-left:auto}
.top .syncbtn{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:3px 10px;font-size:12.5px;white-space:nowrap}
.top .syncbtn:disabled{opacity:.5}

.wrap{max-width:720px;margin:0 auto;padding:12px 12px 40px}
.filters{display:grid;gap:10px;margin-bottom:12px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:8px 0;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--blue);color:#fff}
input[type=search],.field input{width:100%;padding:9px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--sub)}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:600}
.count{font-size:13px;color:var(--sub);margin:0 2px 6px}

.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:8px}
.item-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:700;font-size:16px}
.no{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue);white-space:nowrap}
.no.none{color:var(--warn);font-weight:600;font-size:13px}
.item-sub{font-size:12.5px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.flag{font-size:12px;font-weight:600;color:var(--warn)}
.flag.err{color:var(--stamp)}
.opt{font-size:12px;font-weight:700;color:#fff;background:#6B4FA0;border-radius:999px;padding:0 9px}
.optbox{margin:0 0 12px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:700}
.optbox.yes{background:#EFEAF8;color:#4A3378;border:1px solid #CFC3E8}
.optbox.no{background:var(--surface);color:var(--sub);border:1px solid var(--line);font-weight:600}
.dots{display:flex;gap:5px;margin-top:8px}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px dashed #A9B4BF}
.dot.done{border:0;background:var(--stamp)}
.dot.note{border:1.5px solid var(--warn)}
.empty{text-align:center;color:var(--sub);padding:40px 0}

#detail{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10}
.dhead{position:sticky;top:0;z-index:2;background:var(--ink);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.dhead button{background:transparent;border:0;color:#fff;font-size:14px;padding:4px 6px}
.dhead .t{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhead .src{font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:1px 10px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.sec h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:700}
.info{display:grid;grid-template-columns:7.5em 1fr;gap:4px 10px;font-size:14px;margin:0}
.info dt{color:var(--sub)}
.info dd{margin:0;word-break:break-all}
.question{margin-top:10px;padding:10px;background:#FFF7E6;border-radius:8px;font-size:13.5px;white-space:pre-wrap}
.status{margin:0 0 12px;padding:10px 12px;border-radius:8px;font-size:13.5px;background:#FFF7E6;color:#6B4600}
.status.err{background:#FBEAE7;color:#8A2617}

.field{margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:3px}
.field .row{display:flex;gap:6px}
.field .row input{flex:1}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px;font-size:13px;white-space:nowrap}
.hint{font-size:12px;color:var(--warn);margin-top:2px}
.pw{font-family:"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:.06em}

.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.step{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);padding:8px 10px;text-align:left}
.stamp{flex:none;width:38px;height:38px;border-radius:50%;border:2px dashed #B5C0CA;
  display:grid;place-items:center;font-weight:700;font-size:15px;color:transparent}
.step.done .stamp{border:2.5px solid var(--stamp);color:var(--stamp);transform:rotate(-12deg);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.step.skip .stamp{border:2px solid #9AA6B2;color:#7A8794;font-size:11px;transform:rotate(-12deg)}
.step.note .stamp{border:2px solid var(--warn)}
.step .lb{font-size:13px;line-height:1.35}
.step .val{display:block;font-size:11.5px;color:var(--warn)}
@media (prefers-reduced-motion:no-preference){
  .step.just .stamp{animation:press .28s ease-out}
  @keyframes press{0%{transform:scale(1.5) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px;font-size:13px}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
pre.out{margin:0;white-space:pre-wrap;word-break:break-all;background:#F6F8FA;border:1px solid var(--line);
  border-radius:8px;padding:12px;font-size:13px;line-height:1.55;max-height:320px;overflow:auto;font-family:inherit}
.copy{margin-top:8px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--blue-soft);color:var(--blue);font-weight:700}

.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:16px 12px 14px}
.save{display:block;width:100%;max-width:696px;margin:0 auto;padding:13px;border:0;border-radius:10px;
  background:var(--blue);color:#fff;font-weight:700;font-size:16px}
.save:disabled{opacity:.55}

#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1}
#toast.err{background:#9B2C1E}
</style>
</head>
<body>
<header class="top">
  <h1>新規お申込み</h1>
  <span class="synced" id="synced"></span>
  <button type="button" class="syncbtn" id="syncNow">今すぐ同期</button>
</header>

<div class="wrap">
  <div class="filters">
    <div class="seg">
      <button type="button" data-mode="open" class="on">対応中</button>
      <button type="button" data-mode="all">すべて</button>
    </div>
    <input id="q" type="search" placeholder="名前・メール・管理番号で検索">
    <div id="srcChips" class="chips"></div>
  </div>
  <p id="count" class="count"></p>
  <main id="list"><p class="empty">読み込み中…</p></main>
</div>

<section id="detail" hidden></section>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, serverTimestamp, deleteField }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
  authDomain: "souko-2de57.firebaseapp.com",
  projectId: "souko-2de57",
  storageBucket: "souko-2de57.firebasestorage.app",
  messagingSenderId: "642116656086",
  appId: "1:642116656086:web:139cc5558a4ef6ebda6277",
  measurementId: "G-8WG8GWQGCR"
};
const db = getFirestore(initializeApp(firebaseConfig));
const COLLECTION = 'onboarding_apps';

// 保存後すぐシートへ反映させるためのGAS WebアプリURL（空欄なら1分ごとの自動同期のみ）
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbwI9j4uLISOr_saOgDbq-P8XesDX8HaluXa7OfwPSsIBCOVK66544HuZQpmmAsqh1zQQw/exec';

const SOURCES = [
  { key: 'IP',  label: '通常' },
  { key: 'SMC', label: 'SMC様' },
  { key: 'SP',  label: 'ショピ助様' },
  { key: 'WBC', label: 'WBC様' },
];
const STEP_LABEL = {
  cwGroup: 'Chatworkグループ作成', contract: '契約書送付', deposit: '保証金振込', square: 'Square月額請求',
  system: 'システム登録', systemReport: 'システム登録完了報告', unpaid: '未入金リスト',
  userSheet: 'ユーザー管理シート', mf: 'マネーフォワード登録', start: '利用開始'
};

// ===== コピー用テキスト =====
// 差し込み：{{toId}} {{name}} {{no}} {{prefix}} {{loginId}} {{pw}}
const TEMPLATES = {
  welcome:
`[To:{{toId}}]{{name}}さん
【サービス開始に伴うお手続きのお願い】
この度はサービスにお申込みいただき、誠にありがとうございます。
サービス開始にあたり、以下の通りお手続きをお願いいたします。

1.マニュアルのご確認
まずは、こちらの導入マニュアルを最初にご一読ください。
https://docs.google.com/document/d/15JFBodsZMgAbAYmwC_QHd_2Y0786UJqIA_9QXW6C_Lo/edit?usp=sharing

2.各種お支払いとご契約
費用と契約に関するお手続きをお願いいたします。

■月額利用料のお支払い
Squareより月額利用料（5,500円・税込）を請求させていただきます。
メールが届きましたら、クレジットカードにてお支払いをお願いいたします。

■契約書へのご署名
電子契約サービス「マネーフォワードクラウド契約」より契約書をお送りします。
内容をご確認のうえ、電子署名をお願いいたします。

■保証金のお振込み
保証金として「1万円」を下記口座へお振込みください。

【振込先口座】
銀行名：GMOあおぞらネット銀行
支店名：法人営業部
口座種別：普通
口座番号：1517380
口座名義：カ）ロジックス

3.配送システムの連携設定
配送システムをご利用いただくため、以下の2ステップの設定をお願いいたします。

①ShopeeAPIの申請
以下よりAPI申請をお願いいたします。

②ツールでの連携作業
アプリのステータスが「Online」になりましたら、下記システムへログインし、
マニュアル「3.ツールによるAPI連携作業」に沿って、各出品国アカウントとの連携をお願いします。

ログインURL：https://crossborder-auto.magitech-tool-lab.com/daikoUserLogin/
ID：{{loginId}}
Pass：{{pw}}

4.商品の発送先について
今後、商品を弊社へ発送いただく際は、以下の住所宛にお送りください。
※「管理番号」および「OrderID」の記載が必須となります。

氏名：株式会社LOGEX（{{no}}）※{{prefix}}から始まる管理番号
郵便番号：〒182-0004
住所：東京都調布市入間町2-29-29エステートハイムB棟1F
建物名欄：OrderID（例：123456UWX0789N）を記入してください
電話番号：ユーザー様ご自身の電話番号

ご不明な点がございましたら、チャットにてお気軽にご連絡ください。
これからどうぞよろしくお願い申し上げます。`,

  overview:
`▼配送管理依頼フォーム
https://forms.gle/CN18H3WeEvRGkhtS6

▼マニュアル
https://docs.google.com/document/d/15JFBodsZMgAbAYmwC_QHd_2Y0786UJqIA_9QXW6C_Lo/edit?usp=sharing

▼配送先について
ご発送の際は、以下の住所宛にお送りください。
また、「管理番号」および「Order ID」の記載が必須となりますので、
お手数ですが、必ずご記載いただけますようお願いいたします。

【配送先住所】
氏名：株式会社LOGEX（{{no}}）※（　　　）内は管理番号
（管理番号はチャットワークグループ名に記載しています）
郵便番号：〒182-0004
住所：東京都調布市入間町2-29-29 エステートハイムB棟1F
建物名：Order ID（例：123456UWX0789N）
電話番号：ユーザー様の電話番号`,

  subject: '【Shopee発送代行】{{no}}_{{name}}様',
};

let APPS = [], mode = 'open', srcFilter = '', query = '', cur = null, tab = 'welcome';
const DONE_RE = /^(○|〇|済|契約済|締結済|-|－)/;
const SKIP_RE = /^(不要|なし)/;
const COUNTRY = {'シンガポール':'SGP','台湾':'TWN','マレーシア':'MYS','ベトナム':'VNM','フィリピン':'PHL','タイ':'THA','ブラジル':'BRA'};
const TAB_LABEL = { welcome:'ご案内文', overview:'概要欄', codes:'国別コード', subject:'グループ名', login:'ログイン情報' };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stateOf(v){ v = String(v || '').trim();
  if (!v) return 'todo'; if (SKIP_RE.test(v)) return 'skip'; if (DONE_RE.test(v)) return 'done'; return 'note'; }
const labelOf = k => (SOURCES.find(s => s.key === k) || {}).label || k;
const noOf = a => a.fields.account || a.fields.rowNo || '';
function tsNum(s){ const m = String(s || '').match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):(\d+)/);
  return m ? new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5], +m[6]).getTime() : 0; }
const wantsVideo = a => /^(はい|利用する)/.test(String(a.fields.video || '').trim());
const hasPending = a => a.pending && (Object.keys(a.pending.fields || {}).length || Object.keys(a.pending.steps || {}).length);
function isOpen(a){
  return hasPending(a) || a.stepKeys.some(k => k !== 'start' && ['todo','note'].includes(stateOf(a.steps[k])));
}
function nextNo(source, prefix){
  const re = new RegExp('^' + prefix + '(\\d+)$', 'i');
  let max = 0;
  APPS.filter(a => a.source === source).forEach(a => {
    [a.fields.account, a.fields.rowNo].forEach(v => { const m = String(v || '').trim().match(re); if (m) max = Math.max(max, +m[1]); });
  });
  return prefix + String(max ? max + 1 : 101).padStart(3, '0');
}
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(() => { t.className = ''; }, 2800); }

// ===== Firestore（リアルタイム） =====
let lastSync = 0;
onSnapshot(doc(db, 'onboarding_meta', 'status'), d => {
  const x = d.data() || {};
  if (!x.lastSync || !x.lastSync.toDate) return;
  const t = x.lastSync.toDate();
  lastSync = t.getTime();
  $('#synced').textContent = 'シート同期 ' + t.getHours() + ':' + String(t.getMinutes()).padStart(2, '0') + ':' + String(t.getSeconds()).padStart(2, '0');
});

onSnapshot(collection(db, COLLECTION), snap => {
  APPS = snap.docs.map(d => {
    const x = d.data();
    return { id: d.id, source: x.source, prefix: x.prefix, row: x.row, hasRowNo: !!x.hasRowNo,
      stepKeys: x.stepKeys || [], fields: x.info || {}, steps: x.steps || {},
      pending: x.pending || null, syncError: x.syncError || '' };
  });
  renderChips(); renderList();
  if (cur){ const a = APPS.find(x => x.id === cur.a.id); if (a){ cur.a = a; renderStatus(); } }
}, err => {
  $('#list').innerHTML = '<p class="empty">読み込めませんでした。' + esc(err.message) + '</p>';
});

function renderChips(){
  let h = '<button type="button" class="chip' + (srcFilter ? '' : ' on') + '" data-src="">すべてのフォーム</button>';
  SOURCES.forEach(s => { h += '<button type="button" class="chip' + (srcFilter === s.key ? ' on' : '') + '" data-src="' + s.key + '">' + esc(s.label) + '</button>'; });
  $('#srcChips').innerHTML = h;
}

function renderList(){
  if (!APPS.length){
    $('#count').textContent = '';
    $('#list').innerHTML = '<p class="empty">まだデータがありません。GASの syncAll を一度実行してください。</p>';
    return;
  }
  const q = query.toLowerCase();
  const rows = APPS.filter(a => {
    if (srcFilter && a.source !== srcFilter) return false;
    if (mode === 'open' && !isOpen(a)) return false;
    if (q && ![a.fields.name, a.fields.email, noOf(a), a.fields.shop, a.fields.toolNo].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort((x, y) => tsNum(y.fields.timestamp) - tsNum(x.fields.timestamp));

  $('#count').textContent = rows.length + '件';
  if (!rows.length){
    $('#list').innerHTML = '<p class="empty">' + (mode === 'open' ? '対応中のお申込みはありません。「すべて」で過去分を表示できます。' : '該当するお申込みはありません。') + '</p>';
    return;
  }
  $('#list').innerHTML = rows.map(a => {
    const no = noOf(a);
    const dots = a.stepKeys.map(k => { const s = stateOf(a.steps[k]);
      return '<span class="dot ' + (s === 'done' || s === 'skip' ? 'done' : s === 'note' ? 'note' : '') + '" title="' + esc(STEP_LABEL[k]) + '"></span>'; }).join('');
    const flag = a.syncError ? '<span class="flag err">シートに反映できませんでした</span>'
      : hasPending(a) ? '<span class="flag">シート反映待ち</span>' : '';
    return '<button type="button" class="item" data-id="' + esc(a.id) + '">' +
      '<div class="item-top"><span class="nm">' + esc(a.fields.name) + ' 様</span>' +
      (no ? '<span class="no">' + esc(no) + '</span>' : '<span class="no none">番号未設定</span>') + '</div>' +
      '<div class="item-sub"><span>' + esc(labelOf(a.source)) + '</span><span>' + esc(String(a.fields.timestamp || '').split(' ')[0]) + '</span>' +
      (a.fields.countries ? '<span>' + esc(a.fields.countries) + '</span>' : '') + (wantsVideo(a) ? '<span class="opt">🎥 撮影オプション</span>' : '') + flag + '</div>' +
      '<div class="dots">' + dots + '</div></button>';
  }).join('');
}

// ===== 詳細 =====
function genPw(){
  const U = 'ABCDEFGHJKLMNPQRSTUVWXYZ', L = 'abcdefghijkmnpqrstuvwxyz', D = '23456789', ALL = U + L + D;
  const r = new Uint32Array(8); crypto.getRandomValues(r);
  const p = [U[r[0] % U.length], L[r[1] % L.length], D[r[2] % D.length]];
  for (let i = 3; i < 8; i++) p.push(ALL[r[i] % ALL.length]);
  for (let j = p.length - 1; j > 0; j--){ const k = r[j] % (j + 1); [p[j], p[k]] = [p[k], p[j]]; }
  return p.join('');
}

function openDetail(id){
  const a = APPS.find(x => x.id === id); if (!a) return;
  const notRegistered = stateOf(a.steps.system) === 'todo';
  const no = noOf(a);
  cur = {
    a, base: JSON.parse(JSON.stringify({ fields: a.fields, steps: a.steps })), toId: '', just: '',
    suggested: { no: !no && notRegistered, pw: !a.fields.pw && notRegistered },
    form: {
      no: no || (notRegistered ? nextNo(a.source, a.prefix) : ''),
      loginId: a.fields.loginId || (notRegistered ? (a.fields.email || '') : ''),
      pw: a.fields.pw || (notRegistered ? genPw() : ''),
      toolNo: a.fields.toolNo || ''
    },
    steps: JSON.parse(JSON.stringify(a.steps))
  };
  renderDetail();
  $('#detail').hidden = false;
  $('#detail').scrollTop = 0;
}

function countries(){
  const out = [];
  String(cur.a.fields.countries || '').split(/[,、，\s／\/]+/).forEach(t => {
    t = t.trim(); if (!t) return;
    const c = COUNTRY[t] || (/^[A-Za-z]{3}$/.test(t) ? t.toUpperCase() : '');
    if (c && !out.includes(c)) out.push(c);
  });
  return out;
}

function fill(tpl){
  const f = cur.form;
  const map = { toId: cur.toId || '　', name: cur.a.fields.name || '', no: f.no || '（管理番号）',
    prefix: cur.a.prefix, loginId: f.loginId || '（ID）', pw: f.pw || '（パスワード）' };
  return tpl.replace(/\{\{(\w+)\}\}/g, (_, k) => map[k] != null ? map[k] : '');
}

function texts(){
  const f = cur.form;
  return {
    welcome: fill(TEMPLATES.welcome),
    overview: fill(TEMPLATES.overview),
    codes: countries().map(c => (f.no || '（管理番号）') + '_' + c).join('\n') || '（出品国が未入力です）',
    subject: fill(TEMPLATES.subject),
    login: 'ログインURL：https://crossborder-auto.magitech-tool-lab.com/daikoUserLogin/\nID：' + (f.loginId || '') + '\nPass：' + (f.pw || '')
  };
}

function statusHtml(){
  const a = cur.a;
  if (a.syncError) return '<p class="status err">シートに反映できませんでした：' + esc(a.syncError) + '</p>';
  if (hasPending(a)) return '<p class="status">保存済みです。シートへ反映しています（数秒〜十数秒）。</p>';
  return '';
}
function renderStatus(){ const el = $('#status'); if (el) el.innerHTML = statusHtml(); }

function renderDetail(){
  const a = cur.a, f = cur.form, F = a.fields;
  const info = [['ショップ名', F.shop], ['ショップID', F.shopId], ['企業名', F.company], ['メール', F.email],
    ['電話番号', F.phone], ['Chatwork ID', F.chatworkId], ['出品国', F.countries], ['動画撮影', F.video],
    ['レビューカード', F.review], ['月間出荷', F.monthly], ['申込日時', F.timestamp]]
    .filter(r => r[1]).map(r => '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>').join('');

  const steps = a.stepKeys.map(key => {
    const v = cur.steps[key] || '', k = stateOf(v);
    const face = k === 'done' ? '済' : k === 'skip' ? '不要' : '';
    return '<button type="button" class="step ' + k + (cur.just === key ? ' just' : '') + '" data-step="' + key + '">' +
      '<span class="stamp">' + face + '</span><span class="lb">' + esc(STEP_LABEL[key] || key) +
      (k === 'note' || (k === 'done' && v !== '○' && v !== '〇') ? '<span class="val">' + esc(v) + '</span>' : '') +
      '</span></button>';
  }).join('');

  const T = texts();
  const tabs = Object.keys(TAB_LABEL).map(k =>
    '<button type="button" class="tab' + (tab === k ? ' on' : '') + '" data-tab="' + k + '">' + TAB_LABEL[k] + '</button>').join('');

  $('#detail').innerHTML =
    '<div class="dhead"><button type="button" id="back">‹ 一覧</button><span class="t">' + esc(F.name) + ' 様</span><span class="src">' + esc(labelOf(a.source)) + '</span></div>' +
    '<div class="wrap"><div id="status">' + statusHtml() + '</div>' +
    (F.video ? (wantsVideo(a) ? '<p class="optbox yes">🎥 撮影オプション希望（' + esc(F.video) + '）</p>' : '<p class="optbox no">撮影オプションなし</p>') : '<p class="optbox no">撮影オプション：未回答</p>') +
    '<div class="sec"><h2>お申込み内容</h2><dl class="info">' + info + '</dl>' +
      (F.question ? '<div class="question">' + esc(F.question) + '</div>' : '') + '</div>' +

    '<div class="sec"><h2>登録情報</h2>' +
      '<div class="field"><label for="f-no">管理番号（アカウント名）</label><div class="row">' +
        '<input id="f-no" data-f="no" value="' + esc(f.no) + '"><button type="button" class="mini" id="sugNo">次の番号</button></div>' +
        (cur.suggested.no ? '<div class="hint">次の空き番号を入れています。まだ保存されていません。</div>' : '') + '</div>' +
      '<div class="field"><label for="f-id">システムのログインID</label><input id="f-id" data-f="loginId" value="' + esc(f.loginId) + '"></div>' +
      '<div class="field"><label for="f-pw">パスワード</label><div class="row">' +
        '<input id="f-pw" class="pw" data-f="pw" value="' + esc(f.pw) + '"><button type="button" class="mini" id="newPw">作り直す</button></div>' +
        (cur.suggested.pw ? '<div class="hint">自動で作成しました。まだ保存されていません。</div>' : '') + '</div>' +
      '<div class="field"><label for="f-tool">ツール管理番号</label><input id="f-tool" data-f="toolNo" placeholder="例：y0380" value="' + esc(f.toolNo) + '"></div>' +
      '<div class="field"><label for="f-to">ご案内文の [To:] に入れるID（保存されません）</label><input id="f-to" data-to="1" inputmode="numeric" value="' + esc(cur.toId) + '"></div>' +
    '</div>' +

    '<div class="sec"><h2>手続き（タップで 済 → 不要 → 空欄）</h2><div class="steps">' + steps + '</div></div>' +

    '<div class="sec"><h2>コピー用テキスト</h2><div class="tabs">' + tabs + '</div>' +
      '<pre class="out" id="out">' + esc(T[tab]) + '</pre><button type="button" class="copy" id="copy">コピー</button></div>' +
    '</div>' +
    '<div class="savebar"><button type="button" class="save" id="save">保存</button></div>';
  cur.just = '';
}

function refreshOut(){ const o = $('#out'); if (o) o.textContent = texts()[tab]; }

function cycleStep(key){
  const k = stateOf(cur.steps[key]);
  cur.steps[key] = (k === 'todo' || k === 'note') ? '○' : (k === 'done' ? '不要' : '');
  cur.just = cur.steps[key] ? key : '';
  renderDetail();
}

function copyText(t, btn){
  const ok = () => { btn.textContent = 'コピーしました'; setTimeout(() => { btn.textContent = 'コピー'; }, 1500); };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    try { document.execCommand('copy'); ok(); } catch (e) { toast('コピーできませんでした。長押しで選択してください', true); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, fallback); else fallback();
}

async function save(){
  const a = cur.a, f = cur.form, B = cur.base;
  const fields = {}, steps = {};
  if (f.no !== (B.fields.account || '')) fields.account = f.no;
  if (a.hasRowNo && f.no !== (B.fields.rowNo || '')) fields.rowNo = f.no;
  if (f.loginId !== (B.fields.loginId || '')) fields.loginId = f.loginId;
  if (f.pw !== (B.fields.pw || '')) fields.pw = f.pw;
  if (f.toolNo !== (B.fields.toolNo || '')) fields.toolNo = f.toolNo;
  Object.keys(cur.steps).forEach(k => { if ((cur.steps[k] || '') !== (B.steps[k] || '')) steps[k] = cur.steps[k] || ''; });
  if (!Object.keys(fields).length && !Object.keys(steps).length){ toast('変更はありません'); return; }

  if (f.no){
    const dup = APPS.find(x => x.id !== a.id && x.source === a.source && noOf(x) === f.no);
    if (dup){ toast('管理番号 ' + f.no + ' は ' + dup.fields.name + ' 様で使われています', true); return; }
  }

  const upd = { pendingAt: serverTimestamp(), syncError: deleteField() };
  Object.keys(fields).forEach(k => { upd['info.' + k] = fields[k]; upd['pending.fields.' + k] = fields[k]; });
  Object.keys(steps).forEach(k => { upd['steps.' + k] = steps[k]; upd['pending.steps.' + k] = steps[k]; });

  const btn = $('#save'); btn.disabled = true; btn.textContent = '保存中…';
  try {
    await updateDoc(doc(db, COLLECTION, a.id), upd);
    cur.base = JSON.parse(JSON.stringify({ fields: Object.assign({}, B.fields, fields), steps: Object.assign({}, B.steps, steps) }));
    cur.suggested = { no: false, pw: false };
    triggerSync();
    renderDetail();
    toast('保存しました。シートへ反映しています');
  } catch (e) {
    btn.disabled = false; btn.textContent = '保存';
    toast('保存できませんでした：' + e.message, true);
  }
}

// ===== 今すぐ同期 =====
function triggerSync(){
  if (SYNC_URL) fetch(SYNC_URL, { method: 'POST', mode: 'no-cors' }).catch(() => {});
}
function syncNow(btn){
  if (!SYNC_URL){ toast('SYNC_URL が設定されていません', true); return; }
  const before = lastSync;
  btn.disabled = true; btn.textContent = '同期中…';
  triggerSync();
  const started = Date.now();
  const timer = setInterval(() => {
    if (lastSync > before){ clearInterval(timer); btn.disabled = false; btn.textContent = '今すぐ同期'; toast('シートと同期しました'); }
    else if (Date.now() - started > 60000){ clearInterval(timer); btn.disabled = false; btn.textContent = '今すぐ同期';
      toast('同期の完了を確認できませんでした。少し待って再読み込みしてください', true); }
  }, 500);
}

// ===== イベント =====
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'syncNow') return syncNow(t);
  if (t.dataset.mode){ mode = t.dataset.mode;
    document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b === t));
    return renderList(); }
  if (t.dataset.src != null && t.classList.contains('chip')){ srcFilter = t.dataset.src; renderChips(); return renderList(); }
  if (t.dataset.id) return openDetail(t.dataset.id);
  if (t.id === 'back'){ $('#detail').hidden = true; cur = null; return; }
  if (t.dataset.step) return cycleStep(t.dataset.step);
  if (t.dataset.tab){ tab = t.dataset.tab; return renderDetail(); }
  if (t.id === 'copy') return copyText(texts()[tab], t);
  if (t.id === 'newPw'){ cur.form.pw = genPw(); cur.suggested.pw = true; return renderDetail(); }
  if (t.id === 'sugNo'){ cur.form.no = nextNo(cur.a.source, cur.a.prefix); cur.suggested.no = true; return renderDetail(); }
  if (t.id === 'save') return save();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q'){ query = el.value.trim(); return renderList(); }
  if (!cur) return;
  if (el.dataset.f){ cur.form[el.dataset.f] = el.value.trim(); refreshOut(); }
  if (el.dataset.to){ cur.toId = el.value.trim(); refreshOut(); }
});
</script>
</body>
