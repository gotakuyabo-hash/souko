<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>倉庫管理システム 総合ポータル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #0f172a; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px 10px; 
            color: #f8fafc;
            min-height: 100vh;
        }
        .app-icon {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 14px 10px;
            text-align: center;
            transition: transform 0.1s ease, background 0.2s;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            position: relative;
        }
        .app-icon:active { transform: scale(0.94); }
        .app-icon:hover { background: rgba(255, 255, 255, 0.18); }
        
        .app-emoji {
            font-size: 2.2rem;
            margin-bottom: 6px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .app-title {
            font-size: 0.7rem;
            font-weight: 500;
            color: #f1f5f9;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
    </style>
</head>
<body>
    <div style="max-width: 600px; margin: 0 auto;">
        <header class="mb-6 px-2 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold text-slate-100 flex items-center gap-2">📱 倉庫ポータル</h1>
                <p class="text-[11px] text-slate-400">スマホホーム画面風レイアウト（ローカル保存）</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openAddCategoryModal()" class="bg-emerald-600/80 hover:bg-emerald-600 text-white text-[11px] font-bold px-3 py-1.5 rounded-full backdrop-blur transition shadow">
                    ＋ カテゴリ
                </button>
                <button onclick="resetDefault()" class="bg-slate-700/60 hover:bg-slate-700 text-slate-300 text-[11px] px-3 py-1.5 rounded-full backdrop-blur transition" title="初期配置に戻す">
                    初期化
                </button>
            </div>
        </header>

        <div id="portal-container"></div>
    </div>

    <!-- カテゴリ追加モーダル -->
    <div id="categoryModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl text-slate-100">
            <h3 class="font-bold text-sm mb-3">新規カテゴリの追加</h3>
            <input type="text" id="newCategoryName" placeholder="カテゴリ名（例: 特殊ツール）" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs mb-4 text-slate-100 focus:outline-none focus:border-blue-500">
            <div class="flex justify-end gap-2">
                <button onclick="closeAddCategoryModal()" class="px-3 py-1.5 bg-slate-800 text-slate-300 text-xs rounded-lg hover:bg-slate-700">キャンセル</button>
                <button onclick="addCategory()" class="px-3 py-1.5 bg-blue-600 text-white text-xs rounded-lg hover:bg-blue-500 font-bold">追加する</button>
            </div>
        </div>
    </div>

    <!-- カテゴリ移動モーダル -->
    <div id="moveModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl text-slate-100">
            <h3 class="font-bold text-sm mb-3">移動先のカテゴリを選択</h3>
            <input type="hidden" id="moveCardId">
            <select id="targetCategorySelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs mb-4 text-slate-100 focus:outline-none focus:border-blue-500"></select>
            <div class="flex justify-end gap-2">
                <button onclick="closeMoveModal()" class="px-3 py-1.5 bg-slate-800 text-slate-300 text-xs rounded-lg hover:bg-slate-700">キャンセル</button>
                <button onclick="executeMoveCard()" class="px-3 py-1.5 bg-blue-600 text-white text-xs rounded-lg hover:bg-blue-500 font-bold">移動する</button>
            </div>
        </div>
    </div>

    <!-- ツール詳細・編集モーダル -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl text-slate-100">
            <input type="hidden" id="detailCardId">
            <div class="text-center mb-4">
                <div id="modalAppEmoji" class="text-4xl mb-2"></div>
                <h3 id="modalAppTitle" class="font-bold text-base mb-1"></h3>
                <p id="modalAppDesc" class="text-xs text-slate-400 leading-relaxed"></p>
            </div>
            <div class="space-y-2 mb-4">
                <a id="modalAppLink" href="#" class="block w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-center rounded-xl font-bold text-xs shadow transition">
                    アプリを開く 🚀
                </a>
                <button onclick="openMoveModalFromDetail()" class="block w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-center rounded-xl text-xs transition">
                    📁 カテゴリを移動
                </button>
            </div>
            <div class="flex justify-between items-center pt-3 border-t border-slate-800 text-xs text-slate-400">
                <div class="flex gap-1">
                    <button onclick="moveCardOrderFromDetail(-1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300">◀️ 左へ</button>
                    <button onclick="moveCardOrderFromDetail(1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300">右へ ▶️</button>
                </div>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-200 text-xs">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        const defaultData = {
            categories: [
                { id: "shipping", name: "🚚 送り状・報告ツール" },
                { id: "communication", name: "💬 連絡アプリ" },
                { id: "others", name: "🛠️ その他ツール" }
            ],
            cards: [
                { id: "denpyo-post", category: "shipping", title: "伝票ポスト", desc: "スマホカメラで着払いバーコードを読み取り、金額・メモと共にFirebaseへ記録＆Chatwork送信", href: "denpyo-post.html" },
                { id: "fumeihin-post", category: "shipping", title: "不明品・セラー報告ポスト", desc: "不明品やイレギュラー事項をセラーへChatwork自動報告 ＆ クラウド履歴管理", href: "fumeihin-post.html" },
                { id: "shipping-format", category: "shipping", title: "出荷・送り状自動整形", desc: "受注CSV・ヤマト・佐川CSV整形、検品シート印刷", href: "shipping-format.html" },
                { id: "shipping-link", category: "shipping", title: "追跡番号紐づけ", desc: "発行済みCSVと受注CSVの突合・Shift-JIS出力", href: "shipping-link.html" },
                { id: "shipping-simulator", category: "shipping", title: "受注データ処理シミュレーター", desc: "ステータス変更（220更新）、不要行除外・抽出（振り分けくん）", href: "shipping-simulator.html" },

                { id: "request", category: "communication", title: "スタッフ間 依頼・伝言", desc: "From・To・タスク内容を指定した依頼・伝言の共有（Firestore同期・完了/削除対応）", href: "request.html" },
                { id: "notes", category: "communication", title: "チーム共有ノート", desc: "カテゴリ分け投稿、キーワード検索、連絡事項の共有", href: "notes.html" },
                { id: "meeting", category: "communication", title: "議事録 ＆ 出荷実績", desc: "定例会議の議事録・共有事項・議題管理および前週出荷実績（Firestore同期）", href: "meeting.html" },
                { id: "chat-reply", category: "communication", title: "Chatwork 未読バースト", desc: "未読ルーム一斉表示", href: "chat-reply.html" },

                { id: "zaico", category: "others", title: "zaico連携・受注解析", desc: "zaico在庫同期、バーコード抽出、倍率・棚番設定、出庫指示送信", href: "zaico.html" },
                { id: "timer", category: "others", title: "作業タイム計測", desc: "タイム計測、日別・サービス別・担当者別集計、履歴管理", href: "timer.html" },
                { id: "label", category: "others", title: "処理済みラベル管理", desc: "サーマル用紙（100mm×150mm）印刷、セラー・担当者管理", href: "label.html" },
                { id: "material", category: "others", title: "資材発注依頼", desc: "資材の発注希望依頼、日付検索・ステータス管理", href: "material.html" },
                { id: "checklist", category: "others", title: "日次報告チェックリスト", desc: "出勤時〜終業時までの管理者チェックリスト（Firestore同期）", href: "checklist.html" },
                { id: "shukka", category: "others", title: "出荷件数 日別集計", desc: "サービス別の出荷件数入力・総合計算出・サービス管理", href: "shukka.html" },
                { id: "skill", category: "others", title: "スキル棚卸し管理", desc: "メンバー別の業務スキル評価・チェックリスト管理（印刷対応）", href: "skill.html" },
                { id: "brainstorm", category: "others", title: "オンラインブレイン", desc: "リアルタイムで付箋を追加・共有できるアイデア出しボード（Firestore同期）", href: "brainstorm.html" }
            ]
        };

        function loadData() {
            const saved = localStorage.getItem('warehouse_portal_phone_data');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { }
            }
            return JSON.parse(JSON.stringify(defaultData));
        }

        function saveData(data) {
            localStorage.setItem('warehouse_portal_phone_data', JSON.stringify(data));
            render();
        }

        // タイトルから絵文字を分離するヘルパー
        function parseTitle(title) {
            const match = title.match(/^([\p{Emoji}\u2600-\u27BF]+)\s*(.*)$/u);
            if (match) {
                return { emoji: match[1], name: match[2] };
            }
            return { emoji: "📦", name: title };
        }

        function render() {
            const data = loadData();
            const container = document.getElementById('portal-container');
            container.innerHTML = '';

            data.categories.forEach((cat, catIndex) => {
                const section = document.createElement('section');
                section.className = 'mb-6 bg-slate-900/50 border border-slate-800/80 rounded-2xl p-3.5 backdrop-blur';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'flex justify-between items-center mb-3 px-1';

                const titleHeading = document.createElement('h2');
                titleHeading.className = 'text-xs font-bold text-slate-300 tracking-wide';
                titleHeading.textContent = cat.name;
                headerDiv.appendChild(titleHeading);

                const catControls = document.createElement('div');
                catControls.className = 'flex items-center gap-1';

                if (catIndex > 0) catControls.appendChild(createSmallButton('▲', () => moveCategory(catIndex, -1)));
                if (catIndex < data.categories.length - 1) catControls.appendChild(createSmallButton('▼', () => moveCategory(catIndex, 1)));
                if (data.categories.length > 1) catControls.appendChild(createSmallButton('×', () => deleteCategory(cat.id), 'text-rose-400 hover:bg-rose-950/50'));

                headerDiv.appendChild(catControls);
                section.appendChild(headerDiv);

                const gridDiv = document.createElement('div');
                gridDiv.className = 'grid grid-cols-4 gap-2.5 sm:gap-3';

                const catCards = data.cards.filter(card => card.category === cat.id);

                if (catCards.length === 0) {
                    const emptyMsg = document.createElement('p');
                    emptyMsg.className = 'text-[11px] text-slate-500 col-span-4 py-3 text-center';
                    emptyMsg.textContent = 'アプリがありません';
                    gridDiv.appendChild(emptyMsg);
                } else {
                    catCards.forEach((card) => {
                        const parsed = parseTitle(card.title);
                        const appEl = document.createElement('div');
                        appEl.className = 'app-icon';
                        appEl.onclick = () => openDetailModal(card.id);
                        appEl.innerHTML = `
                            <div class="app-emoji">${parsed.emoji}</div>
                            <div class="app-title">${parsed.name}</div>
                        `;
                        gridDiv.appendChild(appEl);
                    });
                }

                section.appendChild(gridDiv);
                container.appendChild(section);
            });
        }

        function createSmallButton(text, onClick, className = 'text-[10px] w-6 h-6 flex items-center justify-center bg-slate-800 hover:bg-slate-700 rounded text-slate-300') {
            const btn = document.createElement('button');
            btn.className = className;
            btn.textContent = text;
            btn.onclick = (e) => { e.stopPropagation(); onClick(); };
            return btn;
        }

        function moveCategory(index, direction) {
            const data = loadData();
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= data.categories.length) return;
            const temp = data.categories[index];
            data.categories[index] = data.categories[targetIndex];
            data.categories[targetIndex] = temp;
            saveData(data);
        }

        function deleteCategory(catId) {
            const data = loadData();
            if (data.cards.some(c => c.category === catId)) {
                alert('このカテゴリに属するツールが存在するため削除できません。');
                return;
            }
            if (confirm('このカテゴリを削除しますか？')) {
                data.categories = data.categories.filter(c => c.id !== catId);
                saveData(data);
            }
        }

        // 詳細モーダル関連
        function openDetailModal(cardId) {
            const data = loadData();
            const card = data.cards.find(c => c.id === cardId);
            if (!card) return;
            const parsed = parseTitle(card.title);

            document.getElementById('detailCardId').value = card.id;
            document.getElementById('modalAppEmoji').textContent = parsed.emoji;
            document.getElementById('modalAppTitle').textContent = parsed.name;
            document.getElementById('modalAppDesc').textContent = card.desc;
            document.getElementById('modalAppLink').href = card.href;

            document.getElementById('detailModal').classList.remove('hidden');
        }
        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }

        function moveCardOrderFromDetail(direction) {
            const cardId = document.getElementById('detailCardId').value;
            const data = loadData();
            const card = data.cards.find(c => c.id === cardId);
            if (!card) return;
            const catCards = data.cards.filter(c => c.category === card.category);
            const indexInCat = catCards.findIndex(c => c.id === cardId);
            const targetIndexInCat = indexInCat + direction;
            if (targetIndexInCat < 0 || targetIndexInCat >= catCards.length) return;
            const targetCard = catCards[targetIndexInCat];
            const gIdx1 = data.cards.findIndex(c => c.id === cardId);
            const gIdx2 = data.cards.findIndex(c => c.id === targetCard.id);
            const temp = data.cards[gIdx1];
            data.cards[gIdx1] = data.cards[gIdx2];
            data.cards[gIdx2] / temp; // syntax fix
            // proper swap:
            data.cards[gIdx1] = data.cards[gIdx2];
            data.cards[gIdx2] = temp;
            saveData(data);
            // keep modal open with updated state
            openDetailModal(cardId);
        }

        function openAddCategoryModal() {
            document.getElementById('newCategoryName').value = '';
            document.getElementById('categoryModal').classList.remove('hidden');
        }
        function closeAddCategoryModal() { document.getElementById('categoryModal').classList.add('hidden'); }
        function addCategory() {
            const name = document.getElementById('newCategoryName').value.trim();
            if (!name) return;
            const data = loadData();
            data.categories.push({ id: 'cat_' + Date.now(), name: name });
            saveData(data);
            closeAddCategoryModal();
        }

        function openMoveModalFromDetail() {
            closeDetailModal();
            const cardId = document.getElementById('detailCardId').value;
            openMoveModal(cardId);
        }

        function openMoveModal(cardId) {
            const data = loadData();
            document.getElementById('moveCardId').value = cardId;
            const select = document.getElementById('targetCategorySelect');
            select.innerHTML = '';
            data.categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id; opt.textContent = cat.name;
                select.appendChild(opt);
            });
            document.getElementById('moveModal').classList.remove('hidden');
        }
        function closeMoveModal() { document.getElementById('moveModal').classList.add('hidden'); }
        function executeMoveCard() {
            const cardId = document.getElementById('moveCardId').value;
            const targetCatId = document.getElementById('targetCategorySelect').value;
            const data = loadData();
            const card = data.cards.find(c => c.id === cardId);
            if (card) { card.category = targetCatId; saveData(data); }
            closeMoveModal();
        }

        function resetDefault() {
            if (confirm('初期状態に戻しますか？')) {
                localStorage.removeItem('warehouse_portal_phone_data');
                render();
            }
        }

        render();
    </script>
</body>
</html>
