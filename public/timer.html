<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業タイム計測・実績ログ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f4f6f8; font-family: -apple-system, sans-serif; color: #333; margin: 0; padding: 15px; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); max-width: 800px; margin: 0 auto 20px auto; }
        .back-link { display: inline-block; margin-bottom: 12px; color: #2563eb; text-decoration: none; font-weight: bold; font-size: 14px; }
        .time-val { font-family: monospace; font-size: 38px; font-weight: bold; color: #2ecc71; text-align: center; margin: 15px 0; }
        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fff; }

        .sub-tab-container { display: flex; gap: 5px; margin-bottom: 12px; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; overflow-x: auto; }
        .sub-tab-btn { padding: 6px 12px; font-size: 12px; font-weight: bold; background: #e2e8f0; color: #4a5568; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .sub-tab-btn.active { background: #2980b9; color: white; }

        .filter-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; background: #edf2f7; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
        .stat-summary-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; text-align: center; }
        .stat-box .stat-label { font-size: 10px; color: #64748b; margin-bottom: 2px; }
        .stat-box .stat-value { font-size: 14px; font-weight: bold; color: #1e293b; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table.log-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 500px; }
        table.log-table th, table.log-table td { border: 1px solid #e2e8f0; padding: 6px 8px; text-align: left; white-space: nowrap; }
        table.log-table th { background-color: #f7fafc; color: #4a5568; }
        .num-col { text-align: right !important; }
        .btn-del-row { background: #e74c3c; color: white; border: none; border-radius: 3px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>
    <div style="max-width: 800px; margin: 0 auto;">
        <a href="index.html" class="back-link">← ポータルサイトに戻る</a>

        <!-- 計測カード -->
        <div class="card">
            <h2 class="text-lg font-bold mb-4">⏱️ 作業タイム計測</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div class="form-group"><label class="text-xs font-bold">担当者</label><input type="text" id="worker" placeholder="例: 山田"></div>
                <div class="form-group"><label class="text-xs font-bold">サービス名</label><input type="text" id="service" placeholder="例: FBA, メルカリ" list="service-list">
                    <datalist id="service-list"><option value="US 自己配送"><option value="中国輸入"><option value="メルカリ"><option value="FBA"></datalist>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div class="form-group"><label class="text-xs font-bold">作業内容</label><input type="text" id="task" placeholder="例: ピッキング" list="task-list">
                    <datalist id="task-list"><option value="入荷・検品"><option value="ピッキング"><option value="梱包"><option value="ラベル作成"></datalist>
                </div>
                <div class="form-group"><label class="text-xs font-bold">処理件数</label><input type="number" id="count" value="1" min="1"></div>
            </div>
            <div class="form-group"><label class="text-xs font-bold">備考・メモ</label><input type="text" id="memo" placeholder="例: 特になし"></div>

            <div class="time-val" id="time-display">00:00:00</div>
            <div class="grid grid-cols-3 gap-2 mb-4">
                <button id="btn-start" class="bg-emerald-600 hover:bg-emerald-700 text-white p-2.5 rounded font-bold text-sm">開始</button>
                <button id="btn-stop" class="bg-rose-600 hover:bg-rose-700 text-white p-2.5 rounded font-bold text-sm" disabled>ストップ</button>
                <button id="btn-reset" class="bg-slate-500 hover:bg-slate-600 text-white p-2.5 rounded font-bold text-sm">リセット</button>
            </div>
            <button id="btn-save-timer" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded font-bold text-sm">作業実績をクラウド保存</button>
        </div>

        <!-- ログ・集計カード -->
        <div class="card">
            <h3 class="font-bold mb-3 text-base">📊 実績表示・絞り込み集計</h3>
            <div class="sub-tab-container">
                <button class="sub-tab-btn active" data-subtab="view-filter">絞り込み・詳細</button>
                <button class="sub-tab-btn" data-subtab="view-date">日別集計</button>
                <button class="sub-tab-btn" data-subtab="view-service">サービス別</button>
                <button class="sub-tab-btn" data-subtab="view-worker">担当者別</button>
                <button class="sub-tab-btn" data-subtab="view-raw">全履歴</button>
            </div>

            <!-- ① 絞り込み・詳細 -->
            <div id="view-filter" class="sub-tab-content">
                <div class="filter-bar">
                    <div class="form-group"><label class="text-[11px] font-bold">📅 日付</label><select id="filter-date"><option value="ALL">すべて</option></select></div>
                    <div class="form-group"><label class="text-[11px] font-bold">🏷️ サービス</label><select id="filter-service"><option value="ALL">すべて</option></select></div>
                    <div class="form-group"><label class="text-[11px] font-bold">👤 担当者</label><select id="filter-worker"><option value="ALL">すべて</option></select></div>
                </div>
                <div class="stat-summary-box">
                    <div class="stat-box"><div class="stat-label">総件数</div><div class="stat-value" id="stat-total-count">0 件</div></div>
                    <div class="stat-box"><div class="stat-label">総時間</div><div class="stat-value" id="stat-total-time">00:00:00</div></div>
                    <div class="stat-box"><div class="stat-label">平均</div><div class="stat-value" id="stat-avg-sec">0.0 秒/件</div></div>
                </div>
                <div class="table-responsive">
                    <table class="log-table">
                        <thead><tr><th>日時</th><th>担当</th><th>サービス</th><th>内容</th><th class="num-col">件数</th><th class="num-col">時間</th><th class="num-col">平均</th><th>備考</th></tr></thead>
                        <tbody id="filtered-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- ② 日別集計 -->
            <div id="view-date" class="sub-tab-content" style="display: none;">
                <div class="table-responsive"><table class="log-table"><thead><tr><th>日付</th><th class="num-col">総件数</th><th class="num-col">総時間</th><th class="num-col">平均</th><th class="num-col">回数</th></tr></thead><tbody id="summary-date-tbody"></tbody></table></div>
            </div>

            <!-- ③ サービス別 -->
            <div id="view-service" class="sub-tab-content" style="display: none;">
                <div class="table-responsive"><table class="log-table"><thead><tr><th>サービス</th><th class="num-col">総件数</th><th class="num-col">総時間</th><th class="num-col">平均</th><th class="num-col">回数</th></tr></thead><tbody id="summary-service-tbody"></tbody></table></div>
            </div>

            <!-- ④ 担当者別 -->
            <div id="view-worker" class="sub-tab-content" style="display: none;">
                <div class="table-responsive"><table class="log-table"><thead><tr><th>担当者</th><th class="num-col">総件数</th><th class="num-col">総時間</th><th class="num-col">平均</th><th class="num-col">回数</th></tr></thead><tbody id="summary-worker-tbody"></tbody></table></div>
            </div>

            <!-- ⑤ 全履歴 -->
            <div id="view-raw" class="sub-tab-content" style="display: none;">
                <div class="flex justify-between items-center mb-2"><span class="text-xs text-gray-500">全ログ一覧</span><button id="btn-clear-timer" class="bg-rose-600 text-white px-2.5 py-1 rounded text-xs font-bold">全ログ消去</button></div>
                <div class="table-responsive"><table class="log-table"><thead><tr><th>日時</th><th>担当</th><th>サービス</th><th>内容</th><th class="num-col">件数</th><th class="num-col">時間</th><th class="num-col">平均</th><th>備考</th><th>削除</th></tr></thead><tbody id="log-tbody"></tbody></table></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0", authDomain: "souko-2de57.firebaseapp.com", projectId: "souko-2de57" }));

        // サブタブ切り替え
        document.querySelectorAll('.sub-tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const target = btn.getAttribute('data-subtab');
                document.querySelectorAll('.sub-tab-content').forEach(c => { c.style.display = c.id === target ? 'block' : 'none'; });
            });
        });

        let timerInterval = null, startTime = 0, elapsedTime = 0, isRunning = false, timerRecords = [];
        const display = document.getElementById('time-display');

        function formatTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            const secs = String(totalSec % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        document.getElementById('btn-start').onclick = () => {
            if (!isRunning) { isRunning = true; startTime = Date.now() - elapsedTime; timerInterval = setInterval(() => { elapsedTime = Date.now() - startTime; display.textContent = formatTime(elapsedTime); }, 200); document.getElementById('btn-start').disabled = true; document.getElementById('btn-stop').disabled = false; }
        };
        document.getElementById('btn-stop').onclick = () => { isRunning = false; clearInterval(timerInterval); document.getElementById('btn-start').disabled = false; document.getElementById('btn-stop').disabled = true; };
        document.getElementById('btn-reset').onclick = () => { document.getElementById('btn-stop').click(); elapsedTime = 0; display.textContent = "00:00:00"; };

        document.getElementById('btn-save-timer').onclick = async () => {
            const worker = document.getElementById('worker').value.trim() || "未設定";
            const service = document.getElementById('service').value.trim() || "共通";
            const task = document.getElementById('task').value.trim() || "作業";
            const count = parseInt(document.getElementById('count').value, 10) || 1;
            const memo = document.getElementById('memo').value.trim() || "-";
            const now = new Date();
            const dateOnlyStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
            const timeStr = `${dateOnlyStr} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            const totalSec = Math.floor(elapsedTime / 1000);
            const avgSec = count > 0 ? (totalSec / count).toFixed(1) : 0;

            await addDoc(collection(db, "timer_logs"), {
                createdAt: serverTimestamp(), date: timeStr, dateOnly: dateOnlyStr, worker, service, task, count, timeMs: elapsedTime, timeFormatted: formatTime(elapsedTime), avgSec: `${avgSec}秒/件`, memo
            });
            document.getElementById('memo').value = ''; document.getElementById('btn-reset').click(); alert("作業実績を保存しました！");
        };

        onSnapshot(query(collection(db, "timer_logs"), orderBy("createdAt", "desc")), (snapshot) => {
            timerRecords = [];
            snapshot.forEach(docSnap => timerRecords.push({ id: docSnap.id, ...docSnap.data() }));
            renderAllViews();
        });

        function renderAllViews() {
            const dates = [...new Set(timerRecords.map(r => r.dateOnly))].sort().reverse();
            const services = [...new Set(timerRecords.map(r => r.service))].sort();
            const workers = [...new Set(timerRecords.map(r => r.worker))].sort();

            const fDate = document.getElementById('filter-date').value;
            const fServ = document.getElementById('filter-service').value;
            const fWork = document.getElementById('filter-worker').value;

            document.getElementById('filter-date').innerHTML = '<option value="ALL">すべて</option>' + dates.map(d => `<option value="${d}" ${d===fDate?'selected':''}>${d}</option>`).join('');
            document.getElementById('filter-service').innerHTML = '<option value="ALL">すべて</option>' + services.map(s => `<option value="${s}" ${s===fServ?'selected':''}>${s}</option>`).join('');
            document.getElementById('filter-worker').innerHTML = '<option value="ALL">すべて</option>' + workers.map(w => `<option value="${w}" ${w===fWork?'selected':''}>${w}</option>`).join('');

            const filtered = timerRecords.filter(r => (document.getElementById('filter-date').value === 'ALL' || r.dateOnly === document.getElementById('filter-date').value) && (document.getElementById('filter-service').value === 'ALL' || r.service === document.getElementById('filter-service').value) && (document.getElementById('filter-worker').value === 'ALL' || r.worker === document.getElementById('filter-worker').value));

            // 1. 絞り込み詳細
            let tCount = 0, tMs = 0;
            const fTbody = document.getElementById('filtered-tbody'); fTbody.innerHTML = '';
            filtered.forEach(r => {
                tCount += Number(r.count) || 0; tMs += r.timeMs || 0;
                fTbody.innerHTML += `<tr><td>${r.date}</td><td>${r.worker}</td><td>${r.service}</td><td>${r.task}</td><td class="num-col">${r.count}</td><td class="num-col">${r.timeFormatted}</td><td class="num-col">${r.avgSec}</td><td>${r.memo}</td></tr>`;
            });
            document.getElementById('stat-total-count').textContent = `${tCount} 件`;
            document.getElementById('stat-total-time').textContent = formatTime(tMs);
            document.getElementById('stat-avg-sec').textContent = `${tCount > 0 ? (Math.floor(tMs/1000)/tCount).toFixed(1) : 0} 秒/件`;

            // 2. 全履歴
            const logTbody = document.getElementById('log-tbody'); logTbody.innerHTML = '';
            timerRecords.forEach(r => {
                logTbody.innerHTML += `<tr><td>${r.date}</td><td>${r.worker}</td><td>${r.service}</td><td>${r.task}</td><td class="num-col">${r.count}</td><td class="num-col">${r.timeFormatted}</td><td class="num-col">${r.avgSec}</td><td>${r.memo}</td><td><button class="btn-del-row" onclick="delRecord('${r.id}')">×</button></td></tr>`;
            });

            // 3. 集計テーブルの生成ヘルパー
            renderSummaryTable('dateOnly', 'summary-date-tbody');
            renderSummaryTable('service', 'summary-service-tbody');
            renderSummaryTable('worker', 'summary-worker-tbody');
        }

        function renderSummaryTable(key, tbodyId) {
            const map = {};
            timerRecords.forEach(r => {
                const k = r[key] || '未設定';
                if (!map[k]) map[k] = { count: 0, ms: 0, times: 0 };
                map[k].count += Number(r.count) || 0;
                map[k].ms += r.timeMs || 0;
                map[k].times += 1;
            });
            const tbody = document.getElementById(tbodyId); tbody.innerHTML = '';
            Object.keys(map).sort().reverse().forEach(k => {
                const d = map[k];
                const avg = d.count > 0 ? (Math.floor(d.ms/1000)/d.count).toFixed(1) : 0;
                tbody.innerHTML += `<tr><td class="font-bold">${k}</td><td class="num-col">${d.count} 件</td><td class="num-col">${formatTime(d.ms)}</td><td class="num-col">${avg} 秒/件</td><td class="num-col">${d.times} 回</td></tr>`;
            });
        }

        document.getElementById('filter-date').onchange = renderAllViews;
        document.getElementById('filter-service').onchange = renderAllViews;
        document.getElementById('filter-worker').onchange = renderAllViews;

        window.delRecord = async (id) => { if(confirm('このログを削除しますか？')) await deleteDoc(doc(db, "timer_logs", id)); };
        document.getElementById('btn-clear-timer').onclick = async () => {
            if(confirm('すべての作業ログを削除しますか？')) {
                for(const r of timerRecords) { await deleteDoc(doc(db, "timer_logs", r.id)); }
            }
        };
    </script>
</body>
</html>
