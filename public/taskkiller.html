<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatwork タスクデバッグ画面</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4">
    <div class="max-w-xl mx-auto space-y-4">
        <h1 class="text-lg font-bold">🔍 Chatwork タスク取得デバッグ</h1>
        
        <div class="bg-white p-4 rounded-xl shadow space-y-3">
            <select id="accountSelect" class="w-full border rounded p-2 text-sm font-bold">
                <option value="57d74ea2e63325c5306b594c3bb231af">松下アカウント</option>
                <option value="5435a05ddd195c46ca688d021e45bbce">ラクロジスタッフアカウント</option>
            </select>
            <button onclick="fetchDebugTasks()" class="w-full bg-indigo-600 text-white font-bold py-2 rounded shadow">
                🔄 タスクを強制取得して中身を確認する
            </button>
        </div>

        <div class="bg-white p-4 rounded-xl shadow space-y-2">
            <h2 class="text-sm font-bold text-slate-700">📋 取得結果（生データ）:</h2>
            <pre id="debugOutput" class="bg-slate-900 text-green-400 p-3 rounded text-xs overflow-auto h-96">ここに取得したJSONが表示されます...</pre>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxeD41KZUj5DOumg5Zmnb7GQM1UNeayFHsVSJLs-xVVvDCAx96VxYPL89wl9NF0d_zb/exec";

        async function fetchDebugTasks() {
            const token = document.getElementById('accountSelect').value;
            const output = document.getElementById('debugOutput');
            output.textContent = "通信中...";

            try {
                const res = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "get_tasks", token: token })
                });
                const text = await res.text();
                
                // そのまま綺麗に整形して画面に表示
                try {
                    const json = JSON.parse(text);
                    output.textContent = JSON.stringify(json, null, 2);
                } catch (e) {
                    output.textContent = "JSONパース失敗 (テキストレスポンス):\n" + text;
                }
            } catch (e) {
                output.textContent = "通信エラー: " + e.message;
            }
        }
    </script>
</body>
</html>
