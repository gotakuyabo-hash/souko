<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ラベル管理＆コード作成ポータル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRコード生成ライブラリ (QRCode.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- 1次元バーコード生成ライブラリ (JsBarcode) -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        body { 
            background: #0f172a; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 15px 10px; 
            color: #f8fafc;
            min-height: 100vh;
        }

        /* タブのスタイル */
        .tab-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
        }

        /* 52mm × 29mm のラベルコンテナ（画面プレビュー用） */
        .label-container {
            width: 52mm;
            height: 29mm;
            background: #fff;
            box-sizing: border-box;
            padding: 1.5mm 2.5mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px dashed #64748b;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            color: #1e293b;
        }

        /* 商品名エリア（上部・複数行対応） */
        .product-name-area {
            font-size: 7.5pt;
            font-weight: bold;
            line-height: 1.15;
            width: 100%;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 0.5mm;
            margin-bottom: 0.5mm;
            text-align: center;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-all;
        }

        /* コード表示エリア（全幅に広げる） */
        .code-full-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 100%;
        }

        .qr-area-large {
            width: 17mm; 
            height: 17mm;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-area-large img {
            width: 100% !important;
            height: 100% !important;
        }

        .barcode-area-large {
            width: 48mm;
            height: 17mm;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .barcode-area-large svg {
            width: 100% !important;
            height: 100% !important;
            max-width: 100%;
            max-height: 100%;
        }

        /* 処理済みラベルのカードスタイル */
        .card { background: white; padding: 15px; border-radius: 12px; color: #333; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        /* ================= 印刷設定 ================= */
        @media print {
            body {
                background: none !important;
                padding: 0 !important;
                margin: 0 !important;
                color: #000;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <div id="appContainer" style="max-width: 500px; margin: 0 auto;">
        <!-- ヘッダー ＆ タブ切り替え -->
        <header class="mb-4 no-print">
            <div class="flex justify-between items-center mb-3 px-1">
                <h1 class="text-base font-bold text-slate-100 flex items-center gap-2">🏷️ ラベル管理＆コード作成ポータル</h1>
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg transition">
                    ← ポータルへ
                </a>
            </div>
            <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800 gap-1 text-[11px]">
                <button id="btnProcessedTab" onclick="switchTab('processed')" class="tab-btn active flex-1 py-2 font-bold rounded-lg transition text-slate-400">
                    📋 処理済み
                </button>
                <button id="btnQrTab" onclick="switchTab('qr')" class="tab-btn flex-1 py-2 font-bold rounded-lg transition text-slate-400">
                    🔲 QRコード
                </button>
                <button id="btnBarcodeTab" onclick="switchTab('barcode')" class="tab-btn flex-1 py-2 font-bold rounded-lg transition text-slate-400">
                    📊 バーコード
                </button>
            </div>
        </header>

        <!-- ================= 1. 処理済みラベル管理タブ ================= -->
        <div id="processedTabContent" class="tab-content">
            <div class="card mb-6">
                <h2 class="text-base font-bold mb-3 text-slate-800">🏷️ 処理済みラベル管理</h2>
                <div class="mb-2">
                    <label class="text-xs font-bold text-slate-700">処理日</label>
                    <input type="date" id="p-date" class="w-full p-1.5 border rounded mt-0.5 text-sm text-slate-800" onchange="saveProcessedData()">
                </div>
                <div class="mb-2">
                    <label class="text-xs font-bold text-slate-700">セラー名</label>
                    <input type="text" id="p-seller" class="w-full p-1.5 border rounded mt-0.5 text-sm text-slate-800" oninput="saveProcessedData()" placeholder="セラー名を入力">
                </div>
                <div class="mb-3">
                    <label class="text-xs font-bold text-slate-700">担当者</label>
                    <input type="text" id="p-staff" class="w-full p-1.5 border rounded mt-0.5 text-sm text-slate-800" oninput="saveProcessedData()" placeholder="担当者名を入力">
                </div>

                <div class="text-xs font-bold text-slate-700 mb-1">処理内容（チェック項目）</div>
                <div id="items-list" class="space-y-1.5 mb-4">
                    <div class="item-row flex items-center gap-2">
                        <input type="checkbox" class="c w-4 h-4 accent-green-600" onchange="saveProcessedData()">
                        <input type="text" class="t flex-1 p-1.5 border rounded text-sm text-slate-800" value="検品完了" oninput="saveProcessedData()">
                    </div>
                    <div class="item-row flex items-center gap-2">
                        <input type="checkbox" class="c w-4 h-4 accent-green-600" onchange="saveProcessedData()">
                        <input type="text" class="t flex-1 p-1.5 border rounded text-sm text-slate-800" value="バーコード読取確認" oninput="saveProcessedData()">
                    </div>
                    <div class="item-row flex items-center gap-2">
                        <input type="checkbox" class="c w-4 h-4 accent-green-600" onchange="saveProcessedData()">
                        <input type="text" class="t flex-1 p-1.5 border rounded text-sm text-slate-800" value="梱包・資材確認" oninput="saveProcessedData()">
                    </div>
                </div>

                <div class="no-print">
                    <button onclick="printAndSaveProcessed()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded font-bold text-sm transition shadow-sm">🖨️ 印刷 ＆ 履歴保存 (100×150)</button>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl no-print">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-slate-300">☁️ 最近の処理済みラベル履歴</h3>
                    <button onclick="loadProcessedHistory()" class="text-[10px] text-slate-400 hover:text-slate-200 bg-slate-800 px-2 py-1 rounded">更新</button>
                </div>
                <div id="processedHistoryList" class="space-y-2 max-h-48 overflow-y-auto text-xs text-slate-400">
                    <p class="text-center py-3 text-slate-500">履歴を読み込み中...</p>
                </div>
            </div>
        </div>

        <!-- ================= 2. QRコードラベル作成タブ ================= -->
        <div id="qrTabContent" class="tab-content" style="display: none;">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-6 space-y-3 no-print">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">商品名 (ラベル上段に表示)</label>
                    <input type="text" id="qrProductName" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-slate-100 focus:outline-none focus:border-blue-500" placeholder="例: 特選ギフトセット A">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">QRコードデータ (URLやコード)</label>
                    <textarea id="inputText" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500 resize-none" placeholder="rs0009 などのコードやURL">rs0009</textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">印刷枚数</label>
                    <input type="number" id="printCount" value="1" min="1" max="100" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-slate-100 focus:outline-none focus:border-blue-500 text-center font-bold">
                </div>

                <div class="flex gap-2 pt-1">
                    <button onclick="updatePreview()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2 px-3 rounded-xl text-xs transition border border-slate-700">
                        プレビュー更新
                    </button>
                    <button onclick="printAndSaveQr()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-3 rounded-xl text-xs transition shadow-lg shadow-blue-600/20">
                        🖨️ 印刷 ＆ 履歴保存
                    </button>
                </div>
            </div>

            <div class="no-print">
                <div class="mb-3 flex justify-between items-center px-1">
                    <span class="text-xs font-bold text-slate-400">リアルタイムプレビュー (1枚分)</span>
                    <span id="previewCountLabel" class="text-[11px] text-slate-500">印刷枚数: 1枚</span>
                </div>
                <div class="flex justify-center bg-slate-950/60 border border-slate-800/80 rounded-2xl p-6 mb-6">
                    <div class="label-container" id="previewLabel">
                        <div class="product-name-area" id="previewProductName">商品名サンプル</div>
                        <div class="code-full-area">
                            <div class="qr-area-large" id="previewQrcode"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl no-print">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-slate-300">☁️ 最近のラベル発行履歴</h3>
                    <button onclick="loadHistory()" class="text-[10px] text-slate-400 hover:text-slate-200 bg-slate-800 px-2 py-1 rounded">更新</button>
                </div>
                <div id="historyList" class="space-y-2 max-h-48 overflow-y-auto text-xs text-slate-400">
                    <p class="text-center py-3 text-slate-500">履歴を読み込み中...</p>
                </div>
            </div>
        </div>

        <!-- ================= 3. 1次元バーコードラベル作成タブ ================= -->
        <div id="barcodeTabContent" class="tab-content" style="display: none;">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-6 space-y-3 no-print">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">商品名 (ラベル上段に表示)</label>
                    <input type="text" id="bcProductName" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-slate-100 focus:outline-none focus:border-blue-500" placeholder="例: ハンディスキャナー B">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">バーコードデータ</label>
                    <input type="text" id="bcInputText" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500" value="RS-2026-001" placeholder="バーコードにする文字列">
                </div>

                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-300 mb-1">バーコード規格</label>
                        <select id="bcFormat" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-slate-100 focus:outline-none focus:border-blue-500 font-bold" onchange="updateBarcodePreview()">
                            <option value="CODE128">CODE128 (標準)</option>
                            <option value="CODE39">CODE39</option>
                            <option value="EAN13">EAN-13 (JAN)</option>
                            <option value="UPC">UPC</option>
                        </select>
                    </div>
                    <div class="w-28">
                        <label class="block text-xs font-bold text-slate-300 mb-1">印刷枚数</label>
                        <input type="number" id="bcPrintCount" value="1" min="1" max="100" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-slate-100 focus:outline-none focus:border-blue-500 text-center font-bold">
                    </div>
                </div>

                <div class="flex gap-2 pt-1">
                    <button onclick="updateBarcodePreview()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2 px-3 rounded-xl text-xs transition border border-slate-700">
                        プレビュー更新
                    </button>
                    <button onclick="printAndSaveBarcode()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-3 rounded-xl text-xs transition shadow-lg shadow-blue-600/20">
                        🖨️ 印刷 ＆ 履歴保存
                    </button>
                </div>
            </div>

            <div class="no-print">
                <div class="mb-3 flex justify-between items-center px-1">
                    <span class="text-xs font-bold text-slate-400">リアルタイムプレビュー (1枚分)</span>
                    <span id="bcPreviewCountLabel" class="text-[11px] text-slate-500">印刷枚数: 1枚</span>
                </div>
                <div class="flex justify-center bg-slate-950/60 border border-slate-800/80 rounded-2xl p-6 mb-6">
                    <div class="label-container" id="bcPreviewLabel">
                        <div class="product-name-area" id="bcPreviewProductName">商品名サンプル</div>
                        <div class="code-full-area">
                            <div class="barcode-area-large">
                                <svg id="previewBarcodeSvg"></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl no-print">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-slate-300">☁️ 最近のバーコード発行履歴</h3>
                    <button onclick="loadBarcodeHistory()" class="text-[10px] text-slate-400 hover:text-slate-200 bg-slate-800 px-2 py-1 rounded">更新</button>
                </div>
                <div id="barcodeHistoryList" class="space-y-2 max-h-48 overflow-y-auto text-xs text-slate-400">
                    <p class="text-center py-3 text-slate-500">履歴を読み込み中...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 印刷用コンテナ -->
    <div id="printArea" style="display: none;"></div>

    <style id="dynamicPrintStyle"></style>

    <!-- 統合制御スクリプト -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
            authDomain: "souko-2de57.firebaseapp.com",
            projectId: "souko-2de57",
            storageBucket: "souko-2de57.firebasestorage.app",
            messagingSenderId: "642116656086",
            appId: "1:642116656086:web:139cc5558a4ef6ebda6277",
            measurementId: "G-8WG8GWQGCR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const getTodayStr = () => {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        window.switchTab = function(tabName) {
            const processedTab = document.getElementById('processedTabContent');
            const qrTab = document.getElementById('qrTabContent');
            const barcodeTab = document.getElementById('barcodeTabContent');
            
            const btnProcessed = document.getElementById('btnProcessedTab');
            const btnQr = document.getElementById('btnQrTab');
            const btnBarcode = document.getElementById('btnBarcodeTab');

            processedTab.style.display = 'none';
            qrTab.style.display = 'none';
            barcodeTab.style.display = 'none';
            btnProcessed.classList.remove('active');
            btnQr.classList.remove('active');
            btnBarcode.classList.remove('active');

            if (tabName === 'processed') {
                processedTab.style.display = 'block';
                btnProcessed.classList.add('active');
                const dateInput = document.getElementById('p-date');
                if (!dateInput.value) {
                    dateInput.value = getTodayStr();
                    saveProcessedData();
                }
            } else if (tabName === 'qr') {
                qrTab.style.display = 'block';
                btnQr.classList.add('active');
                window.updatePreview();
            } else if (tabName === 'barcode') {
                barcodeTab.style.display = 'block';
                btnBarcode.classList.add('active');
                window.updateBarcodePreview();
            }
        };

        const PROCESSED_STORAGE_KEY = 'processed_label_local_data';

        window.saveProcessedData = () => {
            const items = [];
            document.querySelectorAll('.item-row').forEach(r => {
                items.push({
                    text: r.querySelector('.t').value,
                    checked: r.querySelector('.c').checked
                });
            });
            const data = {
                processDate: document.getElementById('p-date').value,
                sellerName: document.getElementById('p-seller').value,
                staffName: document.getElementById('p-staff').value,
                items: items
            };
            localStorage.setItem(PROCESSED_STORAGE_KEY, JSON.stringify(data));
        };

        function executePrint(mode, pageWidth, pageHeight) {
            const appContainer = document.getElementById('appContainer');
            const printArea = document.getElementById('printArea');
            const dynamicStyle = document.getElementById('dynamicPrintStyle');

            dynamicStyle.innerHTML = `
                @media print {
                    @page { size: ${pageWidth} ${pageHeight}; margin: 0 !important; }
                    body { background: none !important; padding: 0 !important; margin: 0 !important; }
                }
            `;

            appContainer.style.display = 'none';
            printArea.style.display = 'block';

            if (mode === 'processed') {
                const processedContent = document.getElementById('processedTabContent').cloneNode(true);
                processedContent.querySelectorAll('.no-print').forEach(el => el.remove());
                printArea.innerHTML = '';
                printArea.appendChild(processedContent);
                const card = printArea.querySelector('.card');
                if (card) {
                    card.style.cssText = "box-shadow: none !important; border: none !important; padding: 4mm 5mm !important; width: 100mm !important; height: 150mm !important; box-sizing: border-box !important; background: white !important; margin: 0 !important;";
                }
            }

            setTimeout(() => {
                window.print();
                setTimeout(() => {
                    appContainer.style.display = 'block';
                    printArea.style.display = 'none';
                    printArea.innerHTML = '';
                    dynamicStyle.innerHTML = '';
                }, 500);
            }, 100);
        }

        window.printAndSaveProcessed = async function() {
            window.saveProcessedData();
            const seller = document.getElementById('p-seller').value.trim();
            const staff = document.getElementById('p-staff').value.trim();
            const processDate = document.getElementById('p-date').value;
            
            try {
                const items = [];
                document.querySelectorAll('.item-row').forEach(r => {
                    items.push({
                        text: r.querySelector('.t').value,
                        checked: r.querySelector('.c').checked
                    });
                });

                await addDoc(collection(db, "processed_label_history"), {
                    processDate: processDate,
                    sellerName: seller,
                    staffName: staff,
                    items: items,
                    createdAt: serverTimestamp()
                });
                loadProcessedHistory();
            } catch (e) {
                console.error("処理済みラベル保存エラー: ", e);
            }

            executePrint('processed', '100mm', '150mm');
        };

        window.loadProcessedHistory = async function() {
            const historyListEl = document.getElementById("processedHistoryList");
            if (!historyListEl) return;
            historyListEl.innerHTML = '<p class="text-center py-2 text-slate-500">読み込み中...</p>';

            try {
                const q = query(collection(db, "processed_label_history"), orderBy("createdAt", "desc"), limit(10));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    historyListEl.innerHTML = '<p class="text-center py-3 text-slate-500">履歴がありません</p>';
                    return;
                }

                historyListEl.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const dateStr = data.processDate || "日付不明";
                    const seller = data.sellerName || "セラー名なし";
                    const staff = data.staffName || "担当者なし";

                    const itemDiv = document.createElement("div");
                    itemDiv.className = "bg-slate-800/60 hover:bg-slate-800 p-2.5 rounded-xl flex justify-between items-center cursor-pointer transition border border-slate-700/50";
                    itemDiv.onclick = () => {
                        document.getElementById("p-date").value = data.processDate || getTodayStr();
                        document.getElementById("p-seller").value = data.sellerName || "";
                        document.getElementById("p-staff").value = data.staffName || "";

                        const rows = document.querySelectorAll('.item-row');
                        if (data.items && Array.isArray(data.items)) {
                            data.items.forEach((item, idx) => {
                                if (rows[idx]) {
                                    rows[idx].querySelector('.t').value = item.text || "";
                                    rows[idx].querySelector('.c').checked = !!item.checked;
                                }
                            });
                        }
                        window.saveProcessedData();
                    };

                    itemDiv.innerHTML = `
                        <div class="truncate mr-2">
                            <p class="font-bold text-slate-200 truncate">${escapeHtml(seller)} (${escapeHtml(staff)})</p>
                            <p class="text-[10px] text-slate-400">処理日: ${dateStr}</p>
                        </div>
                        <span class="text-[11px] bg-blue-600/30 text-blue-400 px-2 py-1 rounded flex-shrink-0">再利用</span>
                    `;
                    processedHistoryList.appendChild(itemDiv);
                });
            } catch (e) {
                console.error("処理済み履歴取得エラー: ", e);
                historyListEl.innerHTML = '<p class="text-center py-3 text-rose-400">履歴の取得に失敗しました</p>';
            }
        };

        window.updatePreview = function() {
            const productName = document.getElementById("qrProductName").value.trim() || "商品名サンプル";
            const val = document.getElementById("inputText").value.trim() || "rs0009";
            const count = parseInt(document.getElementById("printCount").value) || 1;

            document.getElementById("previewProductName").innerText = productName;
            document.getElementById("previewCountLabel").innerText = `印刷枚数: ${count}枚`;

            const qrContainer = document.getElementById("previewQrcode");
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: val,
                width: 80,
                height: 80,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });

            const printArea = document.getElementById("printArea");
            printArea.innerHTML = "";

            for (let i = 0; i < count; i++) {
                const labelDiv = document.createElement("div");
                labelDiv.className = "label-container";
                labelDiv.style.cssText = "width: 52mm; height: 29mm; background: #fff; box-sizing: border-box; padding: 1.5mm 2.5mm; display: flex; flex-direction: column; justify-content: space-between; page-break-after: always; break-after: page; color: #1e293b;";

                const pNameDiv = document.createElement("div");
                pNameDiv.className = "product-name-area";
                pNameDiv.style.cssText = "font-size: 7.5pt; font-weight: bold; line-height: 1.15; width: 100%; border-bottom: 1px solid #cbd5e1; padding-bottom: 0.5mm; margin-bottom: 0.5mm; text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all;";
                pNameDiv.innerText = productName;
                labelDiv.appendChild(pNameDiv);

                const codeFullArea = document.createElement("div");
                codeFullArea.className = "code-full-area";
                codeFullArea.style.cssText = "flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; width: 100%;";

                const qrArea = document.createElement("div");
                qrArea.className = "qr-area-large";
                qrArea.style.cssText = "width: 17mm; height: 17mm; display: flex; align-items: center; justify-content: center;";
                codeFullArea.appendChild(qrArea);

                labelDiv.appendChild(codeFullArea);
                printArea.appendChild(labelDiv);

                new QRCode(qrArea, {
                    text: val,
                    width: 80,
                    height: 80,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.M
                });
            }
        };

        window.printAndSaveQr = async function() {
            const productName = document.getElementById("qrProductName").value.trim();
            const val = document.getElementById("inputText").value.trim();
            const count = parseInt(document.getElementById("printCount").value) || 1;

            if (!val) {
                alert("テキストまたはURLを入力してください。");
                return;
            }

            window.updatePreview();

            try {
                await addDoc(collection(db, "qr_label_history"), {
                    productName: productName,
                    text: val,
                    count: count,
                    createdAt: serverTimestamp()
                });
                loadHistory();
            } catch (e) {
                console.error("Firestore保存エラー: ", e);
            }

            executePrint('qr', '52mm', '29mm');
        };

        window.loadHistory = async function() {
            const historyListEl = document.getElementById("historyList");
            if (!historyListEl) return;
            historyListEl.innerHTML = '<p class="text-center py-2 text-slate-500">読み込み中...</p>';

            try {
                const q = query(collection(db, "qr_label_history"), orderBy("createdAt", "desc"), limit(10));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    historyListEl.innerHTML = '<p class="text-center py-3 text-slate-500">履歴がありません</p>';
                    return;
                }

                historyListEl.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const dateStr = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : "日時不明";
                    const pName = data.productName ? `[${data.productName}] ` : "";

                    const itemDiv = document.createElement("div");
                    itemDiv.className = "bg-slate-800/60 hover:bg-slate-800 p-2.5 rounded-xl flex justify-between items-center cursor-pointer transition border border-slate-700/50";
                    itemDiv.onclick = () => {
                        document.getElementById("qrProductName").value = data.productName || "";
                        document.getElementById("inputText").value = data.text;
                        document.getElementById("printCount").value = data.count || 1;
                        window.updatePreview();
                    };

                    itemDiv.innerHTML = `
                        <div class="truncate mr-2">
                            <p class="font-bold text-slate-200 truncate">${escapeHtml(pName + data.text)}</p>
                            <p class="text-[10px] text-slate-400">${dateStr} / ${data.count}枚</p>
                        </div>
                        <span class="text-[11px] bg-blue-600/30 text-blue-400 px-2 py-1 rounded flex-shrink-0">再利用</span>
                    `;
                    historyListEl.appendChild(itemDiv);
                });
            } catch (e) {
                console.error("履歴取得エラー: ", e);
                historyListEl.innerHTML = '<p class="text-center py-3 text-rose-400">履歴の取得に失敗しました</p>';
            }
        };

        window.updateBarcodePreview = function() {
            const productName = document.getElementById("bcProductName").value.trim() || "商品名サンプル";
            const val = document.getElementById("bcInputText").value.trim() || "RS-2026-001";
            const format = document.getElementById("bcFormat").value;
            const count = parseInt(document.getElementById("bcPrintCount").value) || 1;

            document.getElementById("bcPreviewProductName").innerText = productName;
            document.getElementById("bcPreviewCountLabel").innerText = `印刷枚数: ${count}枚`;

            try {
                JsBarcode("#previewBarcodeSvg", val, {
                    format: format,
                    lineColor: "#000",
                    width: 1.4,
                    height: 34,
                    displayValue: true,
                    fontSize: 9,
                    margin: 0
                });
            } catch (e) {
                console.error("プレビューバーコード生成エラー:", e);
            }

            const printArea = document.getElementById("printArea");
            printArea.innerHTML = "";

            for (let i = 0; i < count; i++) {
                const labelDiv = document.createElement("div");
                labelDiv.className = "label-container";
                labelDiv.style.cssText = "width: 52mm; height: 29mm; background: #fff; box-sizing: border-box; padding: 1.5mm 2.5mm; display: flex; flex-direction: column; justify-content: space-between; page-break-after: always; break-after: page; color: #1e293b;";

                const pNameDiv = document.createElement("div");
                pNameDiv.className = "product-name-area";
                pNameDiv.style.cssText = "font-size: 7.5pt; font-weight: bold; line-height: 1.15; width: 100%; border-bottom: 1px solid #cbd5e1; padding-bottom: 0.5mm; margin-bottom: 0.5mm; text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all;";
                pNameDiv.innerText = productName;
                labelDiv.appendChild(pNameDiv);

                const codeFullArea = document.createElement("div");
                codeFullArea.className = "code-full-area";
                codeFullArea.style.cssText = "flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; width: 100%;";

                const bcArea = document.createElement("div");
                bcArea.className = "barcode-area-large";
                bcArea.style.cssText = "width: 48mm; height: 17mm; display: flex; align-items: center; justify-content: center; overflow: hidden;";
                const svgEl = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                bcArea.appendChild(svgEl);
                codeFullArea.appendChild(bcArea);

                labelDiv.appendChild(codeFullArea);
                printArea.appendChild(labelDiv);

                try {
                    JsBarcode(svgEl, val, {
                        format: format,
                        lineColor: "#000",
                        width: 1.4,
                        height: 34,
                        displayValue: true,
                        fontSize: 9,
                        margin: 0
                    });
                } catch (e) {
                    console.error("印刷用バーコード生成エラー:", e);
                }
            }
        };

        window.printAndSaveBarcode = async function() {
            const productName = document.getElementById("bcProductName").value.trim();
            const val = document.getElementById("bcInputText").value.trim();
            const format = document.getElementById("bcFormat").value;
            const count = parseInt(document.getElementById("bcPrintCount").value) || 1;

            if (!val) {
                alert("バーコードデータを入力してください。");
                return;
            }

            window.updateBarcodePreview();

            try {
                await addDoc(collection(db, "barcode_label_history"), {
                    productName: productName,
                    text: val,
                    format: format,
                    count: count,
                    createdAt: serverTimestamp()
                });
                loadBarcodeHistory();
            } catch (e) {
                console.error("Firestoreバーコード保存エラー: ", e);
            }

            executePrint('barcode', '52mm', '29mm');
        };

        window.loadBarcodeHistory = async function() {
            const historyListEl = document.getElementById("barcodeHistoryList");
            if (!historyListEl) return;
            historyListEl.innerHTML = '<p class="text-center py-2 text-slate-500">読み込み中...</p>';

            try {
                const q = query(collection(db, "barcode_label_history"), orderBy("createdAt", "desc"), limit(10));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    historyListEl.innerHTML = '<p class="text-center py-3 text-slate-500">履歴がありません</p>';
                    return;
                }

                historyListEl.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const dateStr = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : "日時不明";
                    const pName = data.productName ? `[${data.productName}] ` : "";

                    const itemDiv = document.createElement("div");
                    itemDiv.className = "bg-slate-800/60 hover:bg-slate-800 p-2.5 rounded-xl flex justify-between items-center cursor-pointer transition border border-slate-700/50";
                    itemDiv.onclick = () => {
                        document.getElementById("bcProductName").value = data.productName || "";
                        document.getElementById("bcInputText").value = data.text;
                        document.getElementById("bcFormat").value = data.format || "CODE128";
                        document.getElementById("bcPrintCount").value = data.count || 1;
                        window.updateBarcodePreview();
                    };

                    itemDiv.innerHTML = `
                        <div class="truncate mr-2">
                            <p class="font-bold text-slate-200 truncate">${escapeHtml(pName + data.text)} <span class="text-[10px] text-slate-400">(${escapeHtml(data.format || 'CODE128')})</span></p>
                            <p class="text-[10px] text-slate-400">${dateStr} / ${data.count}枚</p>
                        </div>
                        <span class="text-[11px] bg-blue-600/30 text-blue-400 px-2 py-1 rounded flex-shrink-0">再利用</span>
                    `;
                    barcodeHistoryList.appendChild(itemDiv);
                });
            } catch (e) {
                console.error("バーコード履歴取得エラー: ", e);
                historyListEl.innerHTML = '<p class="text-center py-3 text-rose-400">履歴の取得に失敗しました</p>';
            }
        };

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        document.getElementById("bcProductName").addEventListener("input", window.updateBarcodePreview);
        document.getElementById("bcInputText").addEventListener("input", window.updateBarcodePreview);
        document.getElementById("bcPrintCount").addEventListener("input", window.updateBarcodePreview);
        document.getElementById("qrProductName").addEventListener("input", window.updatePreview);
        document.getElementById("inputText").addEventListener("input", window.updatePreview);
        document.getElementById("printCount").addEventListener("input", window.updatePreview);

        window.addEventListener('DOMContentLoaded', () => {
            const savedJson = localStorage.getItem(PROCESSED_STORAGE_KEY);
            const todayStr = getTodayStr();

            if (savedJson) {
                try {
                    const d = JSON.parse(savedJson);
                    const targetDate = (d.processDate && d.processDate >= todayStr) ? d.processDate : todayStr;
                    document.getElementById('p-date').value = targetDate;
                    document.getElementById('p-seller').value = d.sellerName || "";
                    document.getElementById('p-staff').value = d.staffName || "";

                    const rows = document.querySelectorAll('.item-row');
                    (d.items || []).forEach((i, idx) => {
                        if (rows[idx]) {
                            rows[idx].querySelector('.c').checked = !!i.checked;
                            rows[idx].querySelector('.t').value = i.text || "";
                        }
                    });
                } catch (e) {
                    console.error("データ読み込みエラー", e);
                    document.getElementById('p-date').value = todayStr;
                }
            } else {
                document.getElementById('p-date').value = todayStr;
            }

            window.saveProcessedData();
            window.loadHistory();
            window.loadProcessedHistory();
            window.loadBarcodeHistory();
            window.updatePreview();
            window.updateBarcodePreview();
        });
    </script>
</body>
</html>
