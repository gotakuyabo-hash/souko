<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatwork AI返信アシスタント</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">
    <!-- ヘッダー -->
    <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto">
            <h1 class="text-base font-bold flex items-center justify-between">
                <span>💬 Chatwork AI アシスタント</span>
                <span id="loadStatus" class="text-xs bg-indigo-500 px-2 py-0.5 rounded-full text-indigo-100">読込中...</span>
            </h1>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="max-w-md mx-auto p-3 space-y-3">
        <!-- セラー選択カード -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <label class="block text-xs font-bold text-slate-600 mb-1.5">セラー（ルーム）を選択</label>
            <div class="space-y-2">
                <select id="roomSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white shadow-inner focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="">セラー一覧を読み込み中...</option>
                </select>
                <div class="flex gap-2">
                    <button onclick="loadRoomMessages()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition text-white text-sm font-bold py-2.5 rounded-lg shadow">
                        メッセージを見る
                    </button>
                    <button onclick="togglePinCurrentRoom()" id="pinBtn" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-2.5 rounded-lg font-bold border border-amber-300 shrink-0" title="お気に入り登録">
                        ⭐ ピン留め
                    </button>
                </div>
            </div>
        </div>

        <!-- ローディング・メッセージ表示エリア -->
        <div id="messageLoading" class="text-center text-xs text-slate-500 py-6" style="display:none;">
            <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-600 border-t-transparent mb-1"></div>
            <div>メッセージを取得中...</div>
        </div>
        
        <div id="messageListContainer" class="space-y-3"></div>
    </div>

    <script>
        // ご自身のGASのウェブアプリURL
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxuO_lObsnGyfQjNjplXAKPBtTNyhNlOWfquFyTSW1G2jAApymUXlMSP8J63ZDlloH-xQ/exec";
        
        let allRoomsCache = [];
        let currentRoomMembers = []; // ルームのメンバー一覧（メンション用）
        const FAVORITE_KEY = "chatwork_favorite_rooms_v1";

        window.addEventListener('DOMContentLoaded', () => {
            fetchRooms();
        });

        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem(FAVORITE_KEY)) || [];
            } catch(e) {
                return [];
            }
        }

        function togglePinCurrentRoom() {
            const selectEl = document.getElementById('roomSelect');
            const roomId = selectEl.value;
            if (!roomId) {
                alert('ピン留めするセラーを選択してください。');
                return;
            }

            let favorites = getFavorites();
            const index = favorites.indexOf(roomId);
            
            if (index > -1) {
                favorites.splice(index, 1);
                alert('お気に入り（ピン留め）を解除しました');
            } else {
                favorites.push(roomId);
                alert('このセラーをお気に入り（ピン留め）に登録しました！');
            }
            
            localStorage.setItem(FAVORITE_KEY, JSON.stringify(favorites));
            renderRoomOptions(allRoomsCache);
            selectEl.value = roomId;
            updatePinButtonState();
        }

        function updatePinButtonState() {
            const selectEl = document.getElementById('roomSelect');
            const pinBtn = document.getElementById('pinBtn');
            const roomId = selectEl.value;
            const favorites = getFavorites();

            if (favorites.includes(roomId)) {
                pinBtn.className = "bg-amber-500 text-white text-xs px-3 py-2.5 rounded-lg font-bold shadow-sm shrink-0";
                pinBtn.textContent = "⭐ 登録中";
            } else {
                pinBtn.className = "bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-2.5 rounded-lg font-bold border border-amber-300 shrink-0";
                pinBtn.textContent = "⭐ ピン留め";
            }
        }

        async function fetchRooms() {
            const statusEl = document.getElementById('loadStatus');
            statusEl.textContent = "読込中...";
            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "get_rooms" })
                });
                const data = await response.json();
                if (data.status !== "success") throw new Error(data.message);

                allRoomsCache = data.rooms;
                renderRoomOptions(allRoomsCache);
                statusEl.textContent = "準備完了";
                statusEl.className = "text-xs bg-emerald-500 px-2 py-0.5 rounded-full text-white";
            } catch (e) {
                document.getElementById('roomSelect').innerHTML = '<option value="">ルームの取得に失敗しました</option>';
                statusEl.textContent = "エラー";
                statusEl.className = "text-xs bg-red-500 px-2 py-0.5 rounded-full text-white";
            }
        }

        function renderRoomOptions(rooms) {
            const selectEl = document.getElementById('roomSelect');
            const favorites = getFavorites();

            let favList = [];
            let normalList = [];

            rooms.forEach(room => {
                if (favorites.includes(String(room.room_id))) {
                    favList.push(room);
                } else {
                    normalList.push(room);
                }
            });

            let html = '<option value="">-- セラーを選択してください --</option>';

            if (favList.length > 0) {
                html += '<optgroup label="⭐ お気に入り（よく使うセラー）">';
                favList.forEach(room => {
                    const unreadText = room.unread_num > 0 ? ` (🔴未読 ${room.unread_num})` : '';
                    html += `<option value="${room.room_id}">⭐ ${escapeHtml(room.name)}${unreadText}</option>`;
                });
                html += '</optgroup>';
            }

            if (normalList.length > 0) {
                html += '<optgroup label="📁 その他のセラー">';
                normalList.forEach(room => {
                    const unreadText = room.unread_num > 0 ? ` (🔴未読 ${room.unread_num})` : '';
                    html += `<option value="${room.room_id}">${escapeHtml(room.name)}${unreadText}</option>`;
                });
                html += '</optgroup>';
            }

            selectEl.innerHTML = html;
            selectEl.onchange = updatePinButtonState;
        }

        async function loadRoomMessages() {
            const roomId = document.getElementById('roomSelect').value;
            if (!roomId) {
                alert('セラーを選択してください。');
                return;
            }

            const container = document.getElementById('messageListContainer');
            document.getElementById('messageLoading').style.display = 'block';
            container.innerHTML = '';

            try {
                // メッセージとメンバー（メンション用）を同時に取得
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "get_room_data", room_id: roomId })
                });

                const data = await response.json();
                if (data.status !== "success") throw new Error(data.message);

                currentRoomMembers = data.members || [];
                const messages = data.messages || [];

                if (messages.length === 0) {
                    container.innerHTML = '<div class="text-xs text-slate-500 p-4 bg-white rounded-xl shadow-sm border border-slate-200 text-center">メッセージが見つかりませんでした。</div>';
                    return;
                }

                let html = '';
                messages.forEach(msg => {
                    const safeMessage = encodeURIComponent(msg.body);
                    const senderName = msg.account && msg.account.name ? msg.account.name : '不明';
                    const senderId = msg.account && msg.account.account_id ? msg.account.account_id : '';
                    
                    html += `
                        <div class="bg-white border border-slate-200 p-3.5 rounded-xl shadow-sm space-y-2" data-sender-id="${senderId}" data-sender-name="${escapeHtml(senderName)}">
                            <div class="text-xs text-indigo-600 font-bold flex items-center justify-between">
                                <span>👤 ${escapeHtml(senderName)}</span>
                            </div>
                            <div class="text-sm whitespace-pre-wrap text-slate-700 bg-slate-50 p-2.5 rounded-lg border border-slate-100">${escapeHtml(msg.body)}</div>
                            <button onclick="generateReplyForMessage('${safeMessage}', this)" class="w-full bg-slate-800 hover:bg-slate-900 active:scale-95 transition text-white text-xs py-2 rounded-lg font-bold shadow-sm">
                                ✨ この返信案を作る
                            </button>
                            <div class="ai-reply-area mt-2 space-y-2" style="display:none;"></div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (e) {
                alert('取得エラー: ' + e.message);
            } finally {
                document.getElementById('messageLoading').style.display = 'none';
            }
        }

        async function generateReplyForMessage(encodedMessageText, btnEl) {
            const messageText = decodeURIComponent(encodedMessageText);
            const parentCard = btnEl.closest('div');
            const replyArea = parentCard.querySelector('.ai-reply-area');
            replyArea.style.display = 'block';
            replyArea.innerHTML = '<div class="flex items-center gap-2 text-xs text-indigo-600 p-2"><div class="animate-spin rounded-full h-3 w-3 border-2 border-indigo-600 border-t-transparent"></div>AIが返信案を生成中...</div>';

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "generate_reply", message: messageText })
                });
                
                const rawText = await response.text();
                let data = JSON.parse(rawText);
                if (data.status !== "success") throw new Error(data.message || "不明なエラー");

                // 送信者情報を取得して初期の返信案にメンションを自動付与または選択できるようにする
                const senderId = parentCard.getAttribute('data-sender-id');
                const senderName = parentCard.getAttribute('data-sender-name');
                const initialReply = data.reply;

                renderReplyEditor(replyArea, initialReply, messageText, senderId, senderName);
            } catch (e) {
                replyArea.innerHTML = `<span class="text-xs text-red-500 font-bold p-2">生成失敗: ${escapeHtml(e.message)}</span>`;
            }
        }

        // 編集・メンション選択UIの描画
        function renderReplyEditor(container, replyText, originalMessage, senderId, senderName) {
            // メンション用のドロップダウン選択肢作成
            let memberOptions = '<option value="">-- メンション（宛先）を追加 --</option>';
            if (senderId && senderName) {
                memberOptions += `<option value="${senderId}" data-name="${senderName}">👤 発言者: ${senderName}</option>`;
            }
            currentRoomMembers.forEach(m => {
                if (String(m.account_id) !== String(senderId)) {
                    memberOptions += `<option value="${m.account_id}" data-name="${m.name}">${escapeHtml(m.name)}</option>`;
                }
            });

            container.innerHTML = `
                <div class="bg-indigo-50/60 p-3 rounded-lg border border-indigo-100 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-xs text-indigo-800">🤖 AI返信案（編集可能）:</span>
                        <select onchange="insertMention(this)" class="text-xs border border-indigo-200 rounded p-1 bg-white text-indigo-900 focus:outline-none">
                            ${memberOptions}
                        </select>
                    </div>
                    <textarea class="reply-textarea w-full h-28 text-sm p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">${escapeHtml(replyText)}</textarea>
                    
                    <div class="flex gap-2">
                        <button onclick="sendReplyToChatwork(this)" class="flex-1 bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition text-white text-xs py-2 rounded-lg font-bold shadow-sm">
                            📤 Chatworkに送信
                        </button>
                        <button onclick="saveSpecificTrainingFromCard(this, \`${encodeURIComponent(originalMessage)}\`)" class="bg-slate-700 hover:bg-slate-800 text-white text-xs px-3 py-2 rounded-lg font-bold">
                            💾 学習に保存
                        </button>
                    </div>
                </div>
            `;
        }

        // メンション挿入処理
        function insertMention(selectEl) {
            const accountId = selectEl.value;
            const selectedOpt = selectEl.options[selectEl.selectedIndex];
            const name = selectedOpt.getAttribute('data-name');
            if (!accountId) return;

            const card = selectEl.closest('.ai-reply-area');
            const textarea = card.querySelector('.reply-textarea');
            const mentionTag = `[to:${accountId}] ${name}さん\n`;

            textarea.value = mentionTag + textarea.value;
            selectEl.selectedIndex = 0; // 選択をリセット
        }

        // Chatworkへメッセージ送信
        async function sendReplyToChatwork(btnEl) {
            const roomId = document.getElementById('roomSelect').value;
            const card = btnEl.closest('.ai-reply-area');
            const bodyText = card.querySelector('.reply-textarea').value.trim();

            if (!bodyText) {
                alert('送信するメッセージが空です。');
                return;
            }

            if (!confirm('この内容でChatworkに送信しますか？')) return;

            btnEl.disabled = true;
            btnEl.textContent = "送信中...";

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "send_message", room_id: roomId, body: bodyText })
                });

                const data = await response.json();
                if (data.status !== "success") throw new Error(data.message);

                btnEl.textContent = "✅ 送信完了！";
                btnEl.className = "flex-1 bg-slate-300 text-white text-xs py-2 rounded-lg cursor-default";
            } catch (e) {
                alert('送信失敗: ' + e.message);
                btnEl.disabled = false;
                btnEl.textContent = "📤 Chatworkに送信";
            }
        }

        async function saveSpecificTrainingFromCard(btnEl, encodedOriginalMessage) {
            const card = btnEl.closest('.ai-reply-area');
            const outputText = card.querySelector('.reply-textarea').value.trim();
            const inputMessage = decodeURIComponent(encodedOriginalMessage);

            await saveToFirestore(inputMessage, outputText);
            btnEl.textContent = '✅ 保存完了！';
            btnEl.disabled = true;
            btnEl.className = 'bg-slate-300 text-white text-xs px-3 py-2 rounded-lg cursor-default';
        }

        async function saveToFirestore(input, output) {
            console.log("Firestore保存:", { input, output });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`<>"]/g, match => ({
                '&': '&amp;',
                "'": '&#x27;',
                '`': '&#x60;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
            })[match]);
        }
    </script>
</body>
</html>
