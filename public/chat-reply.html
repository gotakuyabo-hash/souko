<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatwork 未読バーストコックピット (完全版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
            authDomain: "souko-2de57.firebaseapp.com",
            projectId: "souko-2de57",
            storageBucket: "souko-2de57.firebasestorage.app",
            messagingSenderId: "642116656086",
            appId: "1:642116656086:web:139cc5558a4ef6ebda6277"
        });
        const db = getFirestore(app);
        window.db = db;

        // 🚀 スタッフ間連絡アプリへの登録（Firestore: staff_requests）
        window.registerToStaffApp = async function(btnEl) {
            const roomId = document.getElementById('linkRoomId').value;
            const roomName = document.getElementById('linkRoomName').value;
            const senderName = document.getElementById('linkSenderName').value;
            const messageBody = document.getElementById('linkMessageBody').value;
            const fromVal = document.getElementById('linkFromInput').value;
            const toVal = document.getElementById('linkToInput').value;
            const memoVal = document.getElementById('linkMemoInput').value;
            const imageInput = document.getElementById('linkImageInput');

            let taskContent = `【Chatwork連携依頼】\nルーム名: ${roomName}\n\n👤 発言者: ${senderName}\n💬 メッセージ本文:\n${messageBody}`;
            if (memoVal) taskContent += `\n\n📝 連絡メモ:\n${memoVal}`;

            btnEl.disabled = true;
            btnEl.textContent = "登録中...";

            try {
                let imageUrl = null;
                if (imageInput && imageInput.files && imageInput.files[0]) {
                    const file = imageInput.files[0];
                    imageUrl = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                }

                await addDoc(collection(db, "staff_requests"), {
                    from: fromVal || '未設定',
                    to: toVal || '未設定',
                    task: taskContent,
                    imageUrl: imageUrl,
                    status: 'pending',
                    createdAt: serverTimestamp()
                });
                alert('スタッフ間連絡アプリに登録しました！');
                closeAllModals();
            } catch (error) {
                alert("登録失敗: " + error.message);
            } finally {
                btnEl.disabled = false;
                btnEl.textContent = "🚀 スタッフ間連絡アプリに登録する";
            }
        };

        // 🤖 AI返信フィードバックログ保存（Firestore: ai_feedback_logs）
        window.saveAiFeedbackLog = async function(rcv, draft, final) {
            if (!rcv || !final) return;
            try {
                await addDoc(collection(db, "ai_feedback_logs"), {
                    receivedMessage: rcv,
                    aiDraft: draft || "",
                    finalMessage: final,
                    createdAt: serverTimestamp()
                });
            } catch (e) { console.error(e); }
        };
    </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-16">
    <!-- ヘッダー -->
    <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-20">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <h1 class="text-base font-bold">🚀 未読バーストコックピット</h1>
            <div class="flex items-center gap-2">
                <span id="loadStatus" class="text-xs bg-indigo-500 px-2 py-0.5 rounded-full text-indigo-100">読込中...</span>
                <button onclick="refreshCurrentView()" class="bg-indigo-700 text-xs px-2.5 py-1.5 rounded font-bold cursor-pointer">🔄 更新</button>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="max-w-md mx-auto p-3 space-y-3">
        <!-- アカウント選択 ＆ タブ切り替え -->
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
            <select id="accountSelect" onchange="refreshCurrentView()" class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-indigo-50 font-bold text-indigo-950">
                <option value="5435a05ddd195c46ca688d021e45bbce" selected>ラクロジスタッフアカウント</option>
                <option value="57d74ea2e63325c5306b594c3bb231af">松下アカウント</option>
            </select>
            
            <div class="grid grid-cols-4 bg-slate-100 p-1 rounded-lg gap-1">
                <button id="tabBurst" onclick="switchMode('burst')" class="py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm cursor-pointer">⚡ 未読</button>
                <button id="tabUnreplied" onclick="switchMode('unreplied')" class="py-1.5 text-[11px] font-bold rounded-md text-slate-600 cursor-pointer">⚠️ 未対応</button>
                <button id="tabLater" onclick="switchMode('later')" class="py-1.5 text-[11px] font-bold rounded-md text-slate-600 cursor-pointer">⏳ 後で (<span id="laterCountBadge">0</span>)</button>
                <button id="tabNormal" onclick="switchMode('normal')" class="py-1.5 text-[11px] font-bold rounded-md text-slate-600 cursor-pointer">📁 通常</button>
            </div>
        </div>

        <!-- 各モードコンテナ -->
        <div id="burstModeContainer" class="space-y-3"></div>
        <div id="unrepliedModeContainer" class="space-y-2.5" style="display:none;"></div>
        <div id="laterModeContainer" class="space-y-3" style="display:none;"></div>
        <div id="normalModeContainer" class="space-y-3" style="display:none;">
            <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
                <input type="text" id="roomSearchInput" oninput="filterNormalRooms()" placeholder="🔍 ルーム名検索..." class="w-full border rounded-lg p-2 text-xs bg-slate-50">
                <select id="roomSelect" onchange="loadSingleRoomMessages()" class="w-full border rounded-lg p-2.5 text-xs bg-white shadow-inner font-bold">
                    <option value="">-- ルームを選択 --</option>
                </select>
            </div>
            <div id="singleRoomMessageContainer" class="space-y-3"></div>
        </div>
    </div>

    <!-- モーダル群 -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-40 hidden" onclick="closeAllModals()"></div>

    <!-- 🔑 セラー情報モーダル -->
    <div id="modalSellerInfo" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-sm bg-white rounded-xl shadow-2xl z-50 hidden flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-indigo-50 rounded-t-xl">
            <h2 class="font-bold text-indigo-900">🔑 紐づくセラー情報</h2>
            <button onclick="closeAllModals()" class="text-xl px-2 cursor-pointer">&times;</button>
        </div>
        <div class="p-4 space-y-3 text-sm">
            <div><span class="text-xs text-slate-500 font-bold block">管理番号</span><span id="sellerModalKanriNo" class="font-bold">-</span></div>
            <div><span class="text-xs text-slate-500 font-bold block">お名前 / ショップ名</span><span id="sellerModalName" class="font-bold">-</span> (<span id="sellerModalShopName">-</span>)</div>
            <div class="bg-slate-50 p-3 rounded-lg border space-y-2">
                <div><span class="text-xs text-indigo-600 font-bold block">ログインID</span><span id="sellerModalId" class="font-mono text-xs select-all">-</span></div>
                <div><span class="text-xs text-indigo-600 font-bold block">パスワード</span><span id="sellerModalPass" class="font-mono text-xs select-all">-</span></div>
            </div>
            <button onclick="closeAllModals()" class="w-full bg-slate-200 py-2 rounded-lg text-xs font-bold cursor-pointer">閉じる</button>
        </div>
    </div>

    <!-- 🔗 スタッフ間連絡モーダル -->
    <div id="modalLinkCopy" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-md bg-white rounded-xl shadow-2xl z-50 hidden flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-indigo-50 rounded-t-xl">
            <h2 class="font-bold text-indigo-900">🔗 スタッフ間連絡に登録</h2>
            <button onclick="closeAllModals()" class="text-xl px-2 cursor-pointer">&times;</button>
        </div>
        <div class="p-4 space-y-3 text-xs">
            <input type="hidden" id="linkRoomId"><input type="hidden" id="linkRoomName"><input type="hidden" id="linkSenderName"><input type="hidden" id="linkMessageBody">
            <div><label class="block font-bold text-slate-600 mb-1">👤 From</label><input type="text" id="linkFromInput" value="松下" class="w-full border rounded p-2 text-sm"></div>
            <div><label class="block font-bold text-slate-600 mb-1">🎯 To</label><input type="text" id="linkToInput" value="スタッフ全員" class="w-full border rounded p-2 text-sm"></div>
            <div><label class="block font-bold text-slate-600 mb-1">📷 カメラ撮影 / 画像アップロード</label><input type="file" id="linkImageInput" accept="image/*" capture="environment" class="w-full border rounded p-1.5 bg-slate-50"></div>
            <div><label class="block font-bold text-slate-600 mb-1">📝 軽いメモ</label><textarea id="linkMemoInput" class="w-full h-16 border rounded p-2 text-sm"></textarea></div>
            <button onclick="registerToStaffApp(this)" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg shadow cursor-pointer text-sm">🚀 スタッフ間連絡アプリに登録する</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzbGircW91tKx9NIihoWRMCiyIYnVbJJoeJZ9IoUf5s6vI71zNVnqJOo38vSOqfeMYzzA/exec";
        let allRoomsCache = [];
        let unreadRoomsCache = [];
        let currentMode = 'burst';
        const LATER_KEY = "chatwork_later_rooms_v1";
        let aiDraftMemory = {};

        window.addEventListener('DOMContentLoaded', () => {
            updateLaterBadge();
            fetchAllUnreadRooms();
        });

        function getToken() { return document.getElementById('accountSelect').value; }
        function esc(str) { return !str ? '' : String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function closeAllModals() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('modalSellerInfo').style.display = 'none';
            document.getElementById('modalLinkCopy').style.display = 'none';
        }

        async function callApi(action, params = {}) {
            params.action = action;
            params.token = getToken();
            const res = await fetch(`${GAS_URL}?${new URLSearchParams(params)}`);
            const data = await res.json();
            if (data.status !== "success") throw new Error(data.message || "エラー");
            return data;
        }

        function refreshCurrentView() {
            if (currentMode === 'burst') fetchAllUnreadRooms();
            else if (currentMode === 'unreplied') fetchUnrepliedRooms();
            else if (currentMode === 'later') renderLaterRooms();
            else fetchNormalRooms();
        }

        function switchMode(mode) {
            currentMode = mode;
            ['tabBurst', 'tabUnreplied', 'tabLater', 'tabNormal'].forEach(id => {
                document.getElementById(id).className = "py-1.5 text-[11px] font-bold rounded-md text-slate-600 cursor-pointer";
            });
            ['burstModeContainer', 'unrepliedModeContainer', 'laterModeContainer', 'normalModeContainer'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });

            if (mode === 'burst') {
                document.getElementById('tabBurst').className = "py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm cursor-pointer";
                document.getElementById('burstModeContainer').style.display = 'block';
                fetchAllUnreadRooms();
            } else if (mode === 'unreplied') {
                document.getElementById('tabUnreplied').className = "py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm cursor-pointer";
                document.getElementById('unrepliedModeContainer').style.display = 'block';
                fetchUnrepliedRooms();
            } else if (mode === 'later') {
                document.getElementById('tabLater').className = "py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm cursor-pointer";
                document.getElementById('laterModeContainer').style.display = 'block';
                renderLaterRooms();
            } else {
                document.getElementById('tabNormal').className = "py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm cursor-pointer";
                document.getElementById('normalModeContainer').style.display = 'block';
                fetchNormalRooms();
            }
        }

        // ⏳ 後で対応機能
        function getLaterRooms() { try { return JSON.parse(localStorage.getItem(LATER_KEY)) || {}; } catch(e) { return {}; } }
        function updateLaterBadge() {
            const later = getLaterRooms();
            document.getElementById('laterCountBadge').textContent = (later[getToken()] || []).length;
        }
        window.toggleLaterRoom = function(roomId) {
            const later = getLaterRooms();
            const token = getToken();
            if (!later[token]) later[token] = [];
            const idx = later[token].indexOf(String(roomId));
            if (idx > -1) { 
                later[token].splice(idx, 1); 
                alert("「後で対応」から外しました。"); 
            } else { 
                later[token].push(String(roomId)); 
                alert("「後で対応」に追加しました！"); 
            }
            localStorage.setItem(LATER_KEY, JSON.stringify(later));
            updateLaterBadge();
            if (currentMode === 'later') renderLaterRooms();
        };

        function renderLaterRooms() {
            const container = document.getElementById('laterModeContainer');
            const list = getLaterRooms()[getToken()] || [];
            if (list.length === 0) {
                container.innerHTML = '<div class="bg-white p-8 rounded-xl text-center text-sm font-bold text-slate-700 shadow-sm border">☕ 「後で対応」に保存されたルームはありません。</div>';
                return;
            }
            container.innerHTML = '';
            list.forEach(roomId => {
                const roomObj = allRoomsCache.find(r => String(r.room_id) === String(roomId));
                const roomName = roomObj ? roomObj.name : `ルームID: ${roomId}`;
                renderBurstCard(container, roomId, roomName, "⏳ 後で対応", "border-amber-200");
            });
        }

        // ⚠️ 未対応ルーム（GAS経由で Firestore の unreplied_rooms を取得してアコーディオン表示）
        async function fetchUnrepliedRooms() {
            const container = document.getElementById('unrepliedModeContainer');
            const statusEl = document.getElementById('loadStatus');
            container.innerHTML = '<div class="text-center text-xs text-slate-500 py-8 bg-white rounded-xl shadow-sm border">未対応ルームを読み込み中...</div>';
            statusEl.textContent = "未対応読込中...";

            try {
                const data = await callApi("get_unreplied_rooms");
                const unrepliedList = data.rooms || [];

                if (unrepliedList.length === 0) {
                    container.innerHTML = '<div class="bg-white p-8 rounded-xl text-center text-sm font-bold text-slate-700 shadow-sm border">🎉 未対応のルームはありません！</div>';
                    statusEl.textContent = "未対応ゼロ";
                    statusEl.className = "text-xs bg-emerald-500 px-2 py-0.5 rounded-full text-white";
                    return;
                }

                container.innerHTML = '';
                unrepliedList.forEach(r => {
                    renderAccordionCard(container, r.roomId, r.roomName, `⚠️ 未対応 (${r.senderName})`, "border-rose-200");
                });

                statusEl.textContent = `未対応 ${unrepliedList.length}件`;
                statusEl.className = "text-xs bg-rose-500 px-2 py-0.5 rounded-full text-white";
            } catch (e) {
                container.innerHTML = `<div class="text-xs text-red-500 text-center p-4 bg-white rounded-xl shadow-sm border">エラー: ${e.message}</div>`;
                statusEl.textContent = "エラー";
            }
        }

        // ⚡ 未読タブ用：最初から開きっぱなし（バースト）のカード描画関数
        async function renderBurstCard(container, roomId, roomName, badgeText, borderColor, unreadBadge = null) {
            const cardDiv = document.createElement('div');
            cardDiv.className = `bg-white border-2 ${borderColor} rounded-xl p-3.5 shadow-sm space-y-3`;
            cardDiv.innerHTML = `
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                    <div class="flex items-center gap-2 min-w-0 mr-2">
                        <span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0">${unreadBadge || badgeText}</span>
                        <h3 class="font-bold text-sm text-slate-900 truncate">${esc(roomName)}</h3>
                    </div>
                </div>
                <div class="msg-loading text-xs text-slate-400 text-center py-2">メッセージ読込中...</div>
            `;
            container.appendChild(cardDiv);

            try {
                const roomData = await callApi("get_room_data", { room_id: roomId });
                const msgs = roomData.messages || [];
                if (msgs.length === 0) {
                    cardDiv.querySelector('.msg-loading').innerHTML = 'メッセージなし';
                    return;
                }
                const latest = msgs[msgs.length - 1];
                cardDiv.innerHTML = `
                    <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                        <div class="flex items-center gap-2 min-w-0 mr-2">
                            <span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0">${unreadBadge || badgeText}</span>
                            <h3 class="font-bold text-sm text-slate-900 truncate">${esc(roomName)}</h3>
                        </div>
                    </div>
                    ${buildCardContent(roomId, roomName, latest, 1)}
                `;
            } catch (e) {
                cardDiv.querySelector('.msg-loading').innerHTML = '<span class="text-red-500">メッセージ取得失敗</span>';
            }
        }

        // ⚠️ 未対応タブ専用：アコーディオンカード描画ヘルパー
        function renderAccordionCard(container, roomId, roomName, badgeText, borderColor) {
            const cardDiv = document.createElement('div');
            cardDiv.className = `bg-white border-2 ${borderColor} rounded-xl shadow-sm overflow-hidden transition`;
            cardDiv.innerHTML = `
                <div onclick="toggleAccordion('${roomId}', '${container.id}')" class="p-3.5 flex items-center justify-between cursor-pointer bg-slate-50 hover:bg-slate-100 transition">
                    <div class="flex items-center gap-2 min-w-0 mr-2">
                        <span class="bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0">${badgeText}</span>
                        <h3 class="font-bold text-sm text-slate-900 truncate">${esc(roomName)}</h3>
                    </div>
                    <div class="text-indigo-600 font-bold text-xs shrink-0 flex items-center gap-1">
                        <span id="accordion_icon_${container.id}_${roomId}">▼ 開く</span>
                    </div>
                </div>
                <div id="accordion_body_${container.id}_${roomId}" class="p-3.5 border-t border-slate-100 space-y-3" style="display:none;" data-loaded="false">
                    <div class="text-center text-xs text-slate-400 py-4">メッセージを読み込み中...</div>
                </div>
            `;
            container.appendChild(cardDiv);
        }

        // アコーディオンの開閉とメッセージの遅延読み込み
        window.toggleAccordion = async function(roomId, containerId) {
            const bodyEl = document.getElementById(`accordion_body_${containerId}_${roomId}`);
            const iconEl = document.getElementById(`accordion_icon_${containerId}_${roomId}`);
            
            if (bodyEl.style.display === 'none') {
                bodyEl.style.display = 'block';
                iconEl.textContent = '▲ 閉じる';

                if (bodyEl.getAttribute('data-loaded') === 'false') {
                    try {
                        const roomData = await callApi("get_room_data", { room_id: roomId });
                        const msgs = roomData.messages || [];
                        const roomObj = allRoomsCache.find(r => String(r.room_id) === String(roomId));
                        const roomName = roomObj ? roomObj.name : "ルーム";

                        if (msgs.length === 0) {
                            bodyEl.innerHTML = '<div class="text-xs text-slate-500 text-center py-4">メッセージはありません</div>';
                            return;
                        }

                        const latest = msgs[msgs.length - 1];
                        bodyEl.innerHTML = buildCardContent(roomId, roomName, latest, 1);
                        bodyEl.setAttribute('data-loaded', 'true');
                    } catch (e) {
                        bodyEl.innerHTML = `<div class="text-xs text-red-500 text-center py-4">メッセージ取得失敗: ${e.message}</div>`;
                    }
                }
            } else {
                bodyEl.style.display = 'none';
                iconEl.textContent = '▼ 開く';
            }
        };

        // 🚀 スタッフ間連絡モーダルを開く
        window.openStaffAppModal = function(roomId, roomName, senderName, messageBody) {
            document.getElementById('linkRoomId').value = roomId;
            document.getElementById('linkRoomName').value = roomName;
            document.getElementById('linkSenderName').value = senderName;
            document.getElementById('linkMessageBody').value = messageBody;
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalLinkCopy').style.display = 'flex';
        };

        // セラー情報取得
        window.fetchSellerInfo = async function(keyword) {
            if (!keyword) return;
            document.getElementById('sellerModalKanriNo').textContent = "読込中...";
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalSellerInfo').style.display = 'flex';
            try {
                const data = await callApi("get_seller_info", { chatwork_id: keyword });
                if (!data.seller || data.seller.error) {
                    document.getElementById('sellerModalKanriNo').textContent = "見つかりませんでした";
                    return;
                }
                const s = data.seller;
                document.getElementById('sellerModalKanriNo').textContent = s.kanriNo || 'なし';
                document.getElementById('sellerModalName').textContent = s.name || 'なし';
                document.getElementById('sellerModalShopName').textContent = s.shopName || 'なし';
                document.getElementById('sellerModalId').textContent = s.id || '未登録';
                document.getElementById('sellerModalPass').textContent = s.pass || '未登録';
            } catch (e) {
                alert("取得失敗: " + e.message);
                closeAllModals();
            }
        };

        // 📁 通常タブ
        async function fetchNormalRooms() {
            const selectEl = document.getElementById('roomSelect');
            selectEl.innerHTML = '<option value="">-- ルーム一覧読み込み中... --</option>';
            try {
                if (allRoomsCache.length === 0) {
                    const data = await callApi("get_rooms");
                    allRoomsCache = data.rooms || [];
                }
                renderRoomOptions(allRoomsCache);
            } catch (e) { selectEl.innerHTML = `<option value="">取得失敗: ${e.message}</option>`; }
        }
        function renderRoomOptions(rooms) {
            const selectEl = document.getElementById('roomSelect');
            let html = '<option value="">-- ルームを選択 --</option>';
            rooms.forEach(r => {
                html += `<option value="${r.room_id}">${esc(r.name)}${r.unread_num > 0 ? ` [未読 ${r.unread_num}件]` : ''}</option>`;
            });
            selectEl.innerHTML = html;
        }
        function filterNormalRooms() {
            const kw = document.getElementById('roomSearchInput').value.toLowerCase();
            renderRoomOptions(allRoomsCache.filter(r => r.name.toLowerCase().includes(kw)));
        }
        async function loadSingleRoomMessages() {
            const roomId = document.getElementById('roomSelect').value;
            const container = document.getElementById('singleRoomMessageContainer');
            if (!roomId) { container.innerHTML = ''; return; }
            container.innerHTML = '<div class="text-center text-xs text-slate-500 py-6 bg-white rounded-xl shadow-sm border">メッセージ取得中...</div>';
            try {
                const roomData = await callApi("get_room_data", { room_id: roomId });
                const msgs = roomData.messages || [];
                if (msgs.length === 0) { container.innerHTML = '<div class="bg-white p-6 rounded-xl text-center text-xs shadow-sm border">メッセージなし</div>'; return; }
                const latest = msgs[msgs.length - 1];
                const roomObj = allRoomsCache.find(r => String(r.room_id) === String(roomId));
                container.innerHTML = buildCardContent(roomId, roomObj?.name || "ルーム", latest, roomObj?.unread_num || 0);
            } catch (e) { container.innerHTML = `<div class="text-xs text-red-500 bg-white p-4 rounded-xl shadow-sm border">エラー: ${e.message}</div>`; }
        }

        // 📎 ファイルリンクパーサー ＆ 🌐 公式ボタン
        function parseFiles(body, files, roomId) {
            let rendered = esc(body);
            rendered = rendered.replace(/[info]([\s\S]*?)\[\/info\]/g, (match, inner) => {
                let fileId = "";
                const fm = inner.match(/preview id=(\d+)/) || inner.match(/\[download:(\d+)\]/);
                if (fm) fileId = fm[1];

                let rawFileName = "添付ファイル"; 
                const dm = inner.match(/\[download:\d+\]([\s\S]*?)\[\/download\]/); 
                if (dm) rawFileName = dm[1].trim();

                let fileName = rawFileName;
                let fileSize = "";
                const sizeMatch = rawFileName.match(/^(.+?)\s*(\([\d\.]+\s*[KMG]B\))$/i);
                if (sizeMatch) {
                    fileName = sizeMatch[1].trim();
                    fileSize = sizeMatch[2].trim();
                }

                const chatworkOfficialUrl = `https://www.chatwork.com/#!rid${roomId}`;
                return `<div class="my-2.5 p-3 bg-indigo-50/80 rounded-xl border border-indigo-200 space-y-2 shadow-sm">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-indigo-900">📎 ファイル添付</span>
                        ${fileSize ? `<span class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold">${fileSize}</span>` : ''}
                    </div>
                    <div class="text-xs font-semibold text-slate-800 break-all">${esc(fileName)}</div>
                    <a href="${chatworkOfficialUrl}" target="_blank" class="bg-sky-500 hover:bg-sky-600 text-white text-[11px] font-bold py-1.5 px-3 rounded text-center shadow-sm transition block">
                        🌐 Chatwork公式ルームで確認・ダウンロード
                    </a>
                </div>`;
            });

            const chatworkRoomUrl = `https://www.chatwork.com/#!rid${roomId}`;
            return `
                <div class="whitespace-pre-wrap">${rendered}</div>
                <div class="pt-2">
                    <a href="${chatworkRoomUrl}" target="_blank" class="inline-block bg-sky-500 hover:bg-sky-600 text-white text-[11px] font-bold py-1.5 px-3 rounded shadow-sm transition">
                        🌐 Chatwork公式ルームを開く
                    </a>
                </div>
            `;
        }

        // ⚡ 未読ルーム一覧スキャン（最初から開きっぱなしで並ぶバースト表示）
        async function fetchAllUnreadRooms() {
            const container = document.getElementById('burstModeContainer');
            const statusEl = document.getElementById('loadStatus');
            container.innerHTML = '<div class="text-center text-xs text-slate-500 py-8 bg-white rounded-xl shadow-sm border">未読ルームをスキャン中...</div>';
            statusEl.textContent = "スキャン中...";

            try {
                const data = await callApi("get_rooms");
                allRoomsCache = data.rooms || [];
                unreadRoomsCache = allRoomsCache.filter(r => r.unread_num > 0);
                updateLaterBadge();

                if (unreadRoomsCache.length === 0) {
                    container.innerHTML = '<div class="bg-white p-8 rounded-xl text-center text-sm font-bold text-slate-700 shadow-sm border">🎉 未読のルームはありません！</div>';
                    statusEl.textContent = "未読ゼロ";
                    statusEl.className = "text-xs bg-emerald-500 px-2 py-0.5 rounded-full text-white";
                    return;
                }

                container.innerHTML = '';
                unreadRoomsCache.forEach(room => {
                    renderBurstCard(container, room.room_id, room.name, "未読", "border-indigo-100", `未読 ${room.unread_num}件`);
                });

                statusEl.textContent = `未読 ${unreadRoomsCache.length}件`;
                statusEl.className = "text-xs bg-amber-500 px-2 py-0.5 rounded-full text-white";

            } catch (e) {
                container.innerHTML = `<div class="text-xs text-red-500 text-center p-4 bg-white rounded-xl shadow-sm border">エラー: ${e.message}</div>`;
                statusEl.textContent = "エラー";
            }
        }

        // カード内部のHTML生成
        function buildCardContent(roomId, roomName, latestMsg, unreadNum) {
            const body = latestMsg.body || "";
            const sender = latestMsg.account ? latestMsg.account.name : "相手";
            const content = parseFiles(body, latestMsg.files, roomId);
            const safeBody = JSON.stringify(body);

            return `
                <div class="space-y-2 pb-2 border-b border-slate-100 flex items-center gap-2">
                    <button onclick="fetchSellerInfo('${esc(roomName)}')" class="flex-1 text-xs bg-indigo-50 text-indigo-700 py-2 rounded-lg border border-indigo-200 font-bold cursor-pointer">🔑 セラー情報</button>
                    <button onclick="toggleLaterRoom('${roomId}')" class="text-xs bg-amber-100 text-amber-900 px-3 py-2 rounded-lg font-bold cursor-pointer">⏳ 後で対応</button>
                </div>
                <div class="text-xs text-slate-700 p-2.5 bg-slate-50 rounded space-y-2">
                    <div class="font-bold text-[11px] text-indigo-900">👤 ${esc(sender)} の発言:</div>
                    ${content}
                </div>
                <button onclick="openStaffAppModal('${roomId}', '${esc(roomName)}', '${esc(sender)}', ${safeBody})" class="w-full text-xs bg-emerald-50 text-emerald-800 py-2 rounded-lg border border-emerald-200 font-bold cursor-pointer">🚀 スタッフ間連絡アプリに登録する</button>
                <div class="space-y-2 pt-1 bg-indigo-50/40 p-2.5 rounded-lg border border-indigo-100">
                    <input type="text" id="ai_prompt_${roomId}" placeholder="AIへの指示（例：明日返信する）..." class="w-full text-xs border rounded p-1.5 bg-white">
                    <button onclick="generateAiDraft('${roomId}')" class="w-full text-xs bg-indigo-600 text-white font-bold py-1.5 rounded cursor-pointer">✨ AI返信案を作成</button>
                    <textarea id="reply_text_${roomId}" data-received="${esc(body)}" placeholder="返信案..." class="w-full h-20 text-xs border rounded p-2 bg-white"></textarea>
                    
                    <!-- 📷 カメラ撮影 ＆ 📁 ファイル選択コントロール -->
                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold py-2 px-2 rounded text-center shadow-sm transition flex items-center justify-center gap-1">
                            <span>📷 カメラ撮影</span>
                            <input type="file" accept="image/*" capture="environment" id="reply_camera_${roomId}" onchange="handleFileSelect('${roomId}', this)" class="hidden">
                        </label>
                        <label class="cursor-pointer bg-slate-600 hover:bg-slate-700 text-white text-[11px] font-bold py-2 px-2 rounded text-center shadow-sm transition flex items-center justify-center gap-1">
                            <span>📁 ファイル選択</span>
                            <input type="file" id="reply_file_${roomId}" onchange="handleFileSelect('${roomId}', this)" class="hidden">
                        </label>
                    </div>
                    <div id="file_preview_${roomId}" class="text-[11px] text-indigo-700 font-bold bg-white p-2 rounded border border-indigo-200 hidden"></div>

                    <div class="flex gap-2 pt-1">
                        <button onclick="sendReplyMessage('${roomId}', '${latestMsg.message_id || ''}', this)" class="flex-1 bg-emerald-600 text-white text-xs font-bold py-2 rounded cursor-pointer">📤 返信して既読</button>
                        <button onclick="markRead('${roomId}', '${latestMsg.message_id || ''}')" class="bg-slate-200 text-slate-700 text-xs font-bold px-3 py-2 rounded cursor-pointer">📖 既読のみ</button>
                    </div>
                </div>
            `;
        }

        window.handleFileSelect = function(roomId, inputEl) {
            const previewEl = document.getElementById(`file_preview_${roomId}`);
            if (inputEl.files && inputEl.files[0]) {
                const file = inputEl.files[0];
                previewEl.textContent = `📎 添付予定: ${file.name} (${Math.round(file.size / 1024)} KB)`;
                previewEl.style.display = 'block';
            } else {
                previewEl.style.display = 'none';
            }
        };

        // 🤖 AI返信案生成
        window.generateAiDraft = function(roomId) {
            const textarea = document.getElementById(`reply_text_${roomId}`);
            const promptInput = document.getElementById(`ai_prompt_${roomId}`);
            if (!textarea) return;

            const instruction = promptInput ? promptInput.value.trim() : "";
            textarea.value = "🤖 AI返信案を作成中...";
            setTimeout(() => {
                let draft = instruction ? `お世話になっております。\n${instruction}\n\n引き続きよろしくお願いいたします。` : "お世話になっております。ご連絡ありがとうございます。\n内容を確認いたしました。引き続きよろしくお願いいたします。";
                textarea.value = draft;
                aiDraftMemory[roomId] = draft;
            }, 400);
        };

        // 📤 返信送信 ＆ 既読化
        window.sendReplyMessage = async function(roomId, lastChatId, btn) {
            const textarea = document.getElementById(`reply_text_${roomId}`);
            if (!textarea || !textarea.value.trim()) { alert("返信文を入力してください。"); return; }
            const finalMsg = textarea.value.trim();
            const receivedMsg = textarea.dataset.received || "";
            btn.disabled = true; btn.textContent = "送信中...";
            try {
                await callApi("send_message", { room_id: roomId, body: finalMsg });
                if (window.saveAiFeedbackLog) await window.saveAiFeedbackLog(receivedMsg, aiDraftMemory[roomId] || "", finalMsg);
                await callApi("mark_read", { room_id: roomId, last_chat_id: lastChatId || "" });
                await callApi("update_room_status", { room_id: roomId, status: "done" });

                alert("送信しました！");
                refreshCurrentView();
            } catch (e) {
                alert("送信失敗: " + e.message);
                btn.disabled = false; btn.textContent = "📤 返信して既読";
            }
        };

        // 📖 既読のみボタン
        window.markRead = async function(roomId, lastChatId) {
            try {
                await callApi("mark_read", { room_id: roomId, last_chat_id: lastChatId || "" });
                await callApi("update_room_status", { room_id: roomId, status: "done" });
                alert("既読にしました！");
                refreshCurrentView();
            } catch (e) { alert("既読化失敗: " + e.message); }
        };
    </script>
</body>
</html>
