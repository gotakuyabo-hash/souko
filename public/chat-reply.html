<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatwork 未読バーストコックピット</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-16">
    <!-- ヘッダー -->
    <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-20">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <h1 class="text-base font-bold flex items-center gap-2">
                <span>🚀 未読バーストコックピット</span>
            </h1>
            <div class="flex items-center gap-2">
                <span id="loadStatus" class="text-xs bg-indigo-500 px-2 py-0.5 rounded-full text-indigo-100">読込中...</span>
                <button onclick="fetchAllUnreadRooms()" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-2.5 py-1.5 rounded font-bold shadow active:scale-95 transition">
                    🔄 更新
                </button>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="max-w-md mx-auto p-3 space-y-3">
        <!-- アカウント＆モード切替カード -->
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
            <div class="flex items-center gap-2">
                <select id="accountSelect" onchange="changeAccount()" class="flex-1 border border-slate-300 rounded-lg p-2 text-xs bg-indigo-50/50 font-bold text-indigo-950 focus:outline-none">
                    <option value="57d74ea2e63325c5306b594c3bb231af">松下アカウント</option>
                    <option value="5435a05ddd195c46ca688d021e45bbce">ラクロジスタッフアカウント</option>
                </select>
            </div>
            
            <!-- タブ切り替え（未読バースト vs 通常ルーム個別選択） -->
            <div class="flex bg-slate-100 p-1 rounded-lg">
                <button id="tabBurst" onclick="switchMode('burst')" class="flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-indigo-600 shadow-sm transition">
                    ⚡ 未読バースト（一括処理）
                </button>
                <button id="tabNormal" onclick="switchMode('normal')" class="flex-1 py-1.5 text-xs font-bold rounded-md text-slate-600 transition">
                    📁 通常ルーム個別
                </button>
            </div>
        </div>

        <!-- 【モードA】未読バーストフィード表示エリア -->
        <div id="burstModeContainer" class="space-y-3">
            <div class="text-center text-xs text-slate-500 py-8">
                <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-600 border-t-transparent mb-1"></div>
                <div>未読ルームをスキャン中...</div>
            </div>
        </div>

        <!-- 【モードB】通常ルーム個別選択エリア（初期非表示） -->
        <div id="normalModeContainer" class="space-y-3" style="display:none;">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
                <input type="text" id="roomSearchInput" oninput="filterNormalRooms()" placeholder="🔍 ルーム名検索..." class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50 focus:outline-none">
                <select id="roomSelect" onchange="onNormalRoomSelected()" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white shadow-inner focus:outline-none">
                    <option value="">-- セラーを選択 --</option>
                </select>
                <button onclick="loadSingleRoomMessages()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-2.5 rounded-lg shadow active:scale-95 transition">
                    選択したルームのメッセージを見る
                </button>
            </div>
            <div id="singleRoomMessageContainer" class="space-y-3"></div>
        </div>
    </div>

    <!-- ================= モーダル（定型文管理・編集 ＆ セラーメモ） ================= -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-40 hidden" onclick="closeAllModals()"></div>

    <!-- セラーメモ・タグ編集モーダル -->
    <div id="modalRoomMemo" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-md bg-white rounded-xl shadow-2xl z-50 hidden flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-amber-50 rounded-t-xl">
            <h2 class="font-bold text-amber-900">📌 セラーのメモ・タグ設定</h2>
            <button onclick="closeAllModals()" class="text-slate-500 hover:text-slate-800 font-bold text-xl px-2">&times;</button>
        </div>
        <div class="p-4 space-y-3">
            <input type="hidden" id="memoRoomId">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">🏷️ ステータス・タグ（例：要確認、FBA、トラブル中）</label>
                <input type="text" id="memoTagInput" placeholder="カンマ区切りなどで入力" class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">📝 一言メモ・注意点</label>
                <textarea id="memoContentInput" placeholder="このセラーに関する特記事項やルールを記入..." class="w-full h-28 border border-slate-300 rounded p-2 text-sm focus:outline-none"></textarea>
            </div>
            <button onclick="saveRoomMemoSubmit()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-lg shadow mt-2 active:scale-95 transition">
                メモを保存する
            </button>
        </div>
    </div>

    <!-- 定型文「管理」モーダル -->
    <div id="modalTemplateManager" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-md bg-white rounded-xl shadow-2xl z-50 hidden flex-col max-h-[85vh]">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-xl">
            <h2 class="font-bold text-slate-800">⚙️ 定型文の管理</h2>
            <button onclick="closeAllModals()" class="text-slate-500 hover:text-slate-800 font-bold text-xl px-2">&times;</button>
        </div>
        <div id="templateManagerList" class="p-4 overflow-y-auto space-y-4"></div>
    </div>

    <!-- 定型文「編集・保存」モーダル -->
    <div id="modalTemplateEditor" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-md bg-white rounded-xl shadow-2xl z-50 hidden flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-indigo-50 rounded-t-xl">
            <h2 class="font-bold text-indigo-900" id="editorModalTitle">💾 定型文を保存・編集</h2>
            <button onclick="closeAllModals()" class="text-slate-500 hover:text-slate-800 font-bold text-xl px-2">&times;</button>
        </div>
        <div class="p-4 space-y-3">
            <input type="hidden" id="editTmplId">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">📂 カテゴリ</label>
                <input type="text" id="editTmplCategory" list="categoryList" class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none">
                <datalist id="categoryList"></datalist>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">🏷️ タイトル</label>
                <input type="text" id="editTmplTitle" class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">📝 本文</label>
                <textarea id="editTmplText" class="w-full h-32 border border-slate-300 rounded p-2 text-sm focus:outline-none"></textarea>
            </div>
            <button onclick="saveTemplateSubmit()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow mt-2">
                保存する
            </button>
        </div>
    </div>
    <!-- ========================================================= -->

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzbGircW91tKx9NIihoWRMCiyIYnVbJJoeJZ9IoUf5s6vI71zNVnqJOo38vSOqfeMYzzA/exec";
        
        let allRoomsCache = [];
        let currentMode = 'burst';
        const TEMPLATE_KEY = "chatwork_custom_templates_v2";
        const MEMO_KEY = "chatwork_room_memos_v1";

        window.addEventListener('DOMContentLoaded', () => {
            fetchAllUnreadRooms();
        });

        function getCurrentToken() { return document.getElementById('accountSelect').value; }
        
        function changeAccount() {
            if (currentMode === 'burst') fetchAllUnreadRooms();
            else fetchNormalRooms();
        }

        function switchMode(mode) {
            currentMode = mode;
            const btnBurst = document.getElementById('tabBurst');
            const btnNormal = document.getElementById('tabNormal');
            const burstCont = document.getElementById('burstModeContainer');
            const normalCont = document.getElementById('normalModeContainer');

            if (mode === 'burst') {
                btnBurst.className = "flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-indigo-600 shadow-sm transition";
                btnNormal.className = "flex-1 py-1.5 text-xs font-bold rounded-md text-slate-600 transition";
                burstCont.style.display = 'block';
                normalCont.style.display = 'none';
                fetchAllUnreadRooms();
            } else {
                btnNormal.className = "flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-indigo-600 shadow-sm transition";
                btnBurst.className = "flex-1 py-1.5 text-xs font-bold rounded-md text-slate-600 transition";
                normalCont.style.display = 'block';
                burstCont.style.display = 'none';
                fetchNormalRooms();
            }
        }

        /* ======== 📌 セラーメモ・タグ管理機能 ======== */
        function getRoomMemos() {
            try { return JSON.parse(localStorage.getItem(MEMO_KEY)) || {}; } catch(e) { return {}; }
        }

        function openRoomMemoModal(roomId, roomName) {
            const memos = getRoomMemos();
            const memoData = memos[roomId] || { tag: '', content: '' };

            document.getElementById('memoRoomId').value = roomId;
            document.getElementById('memoTagInput').value = memoData.tag || '';
            document.getElementById('memoContentInput').value = memoData.content || '';

            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalRoomMemo').style.display = 'flex';
        }

        function saveRoomMemoSubmit() {
            const roomId = document.getElementById('memoRoomId').value;
            const tag = document.getElementById('memoTagInput').value.trim();
            const content = document.getElementById('memoContentInput').value.trim();

            let memos = getRoomMemos();
            if (!tag && !content) delete memos[roomId];
            else memos[roomId] = { tag, content };

            localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
            closeAllModals();
            if (currentMode === 'burst') fetchAllUnreadRooms();
            else fetchNormalRooms();
        }
        /* =========================================== */

        /* ======== ⚡ 未読バースト処理コア ======== */
        async function fetchAllUnreadRooms() {
            const statusEl = document.getElementById('loadStatus');
            const burstCont = document.getElementById('burstModeContainer');
            statusEl.textContent = "スキャン中...";
            
            burstCont.innerHTML = `
                <div class="text-center text-xs text-slate-500 py-8 bg-white rounded-xl shadow-sm border border-slate-200">
                    <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-600 border-t-transparent mb-1"></div>
                    <div>未読ルームのメッセージを一括スキャン中...</div>
                </div>
            `;

            try {
                const res = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "get_rooms", token: getCurrentToken() })
                });
                const data = await res.json();
                if (data.status !== "success") throw new Error(data.message);

                allRoomsCache = data.rooms || [];
                const unreadRooms = allRoomsCache.filter(r => r.unread_num > 0);

                if (unreadRooms.length === 0) {
                    burstCont.innerHTML = `
                        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center space-y-2">
                            <div class="text-2xl">🎉</div>
                            <div class="text-sm font-bold text-slate-700">未読のルームはありません！すべて完了しています。</div>
                        </div>
                    `;
                    statusEl.textContent = "未読ゼロ";
                    statusEl.className = "text-xs bg-emerald-500 px-2 py-0.5 rounded-full text-white";
                    return;
                }

                burstCont.innerHTML = '';
                const memos = getRoomMemos();

                for (const room of unreadRooms) {
                    const roomId = room.room_id;
                    const memo = memos[roomId] || {};
                    const cardId = `burst_card_${roomId}`;

                    let cardHtml = `
                        <div id="${cardId}" class="bg-white border-2 border-indigo-100 rounded-xl p-3.5 shadow-sm space-y-2.5">
                            <div class="flex justify-between items-start gap-2">
                                <div>
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        <span class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">未読 ${room.unread_num}件</span>
                                        <h3 class="font-bold text-sm text-slate-800">${escapeHtml(room.name)}</h3>
                                    </div>
                                    ${memo.tag ? `<div class="mt-1"><span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-bold border border-amber-200">🏷️ ${escapeHtml(memo.tag)}</span></div>` : ''}
                                    ${memo.content ? `<div class="text-xs text-slate-500 bg-amber-50/50 p-1.5 rounded mt-1 border border-amber-100">📌 ${escapeHtml(memo.content)}</div>` : ''}
                                </div>
                                <button onclick="openRoomMemoModal('${roomId}', '${escapeHtml(room.name)}')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded border border-slate-300 shrink-0 font-bold">
                                    📝 メモ
                                </button>
                            </div>
                            <div class="burst-msg-area text-xs text-slate-500 p-2 bg-slate-50 rounded">メッセージを読み込み中...</div>
                        </div>
                    `;
                    burstCont.innerHTML += cardHtml;
                }

                unreadRooms.forEach(async (room) => {
                    const roomId = room.room_id;
                    const cardEl = document.getElementById(`burst_card_${roomId}`);
                    if (!cardEl) return;
                    const msgArea = cardEl.querySelector('.burst-msg-area');

                    try {
                        const roomRes = await fetch(GAS_WEB_APP_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: "get_room_data", token: getCurrentToken(), room_id: roomId })
                        });
                        const roomData = await roomRes.json();
                        if (roomData.status !== "success") throw new Error();

                        let messages = roomData.messages || [];
                        messages.sort((a, b) => b.send_time - a.send_time);

                        if (messages.length === 0) {
                            msgArea.innerHTML = '<span class="text-slate-400">メッセージなし</span>';
                            return;
                        }

                        const latestMsg = messages[0];
                        const senderName = latestMsg.account && latestMsg.account.name ? latestMsg.account.name : '不明';
                        const senderId = latestMsg.account && latestMsg.account.account_id ? latestMsg.account.account_id : '';
                        let sendDateStr = latestMsg.send_time ? new Date(latestMsg.send_time * 1000).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
                        const uniqueTextareaId = `burst_txt_${roomId}`;
                        const encodedBody = encodeURIComponent(latestMsg.body);

                        let membersOpts = '<option value="">👤 宛先(To)を追加</option>';
                        if (senderId) membersOpts += `<option value="${senderId}" data-name="${senderName}">発言者: ${senderName}</option>`;
                        (roomData.members || []).forEach(m => {
                            if (String(m.account_id) !== String(senderId)) {
                                membersOpts += `<option value="${m.account_id}" data-name="${escapeHtml(m.name)}">${escapeHtml(m.name)}</option>`;
                            }
                        });

                        msgArea.outerHTML = `
                            <div class="space-y-2">
                                <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg space-y-1">
                                    <div class="text-[11px] text-indigo-600 font-bold flex justify-between">
                                        <span>👤 ${escapeHtml(senderName)}</span>
                                        <span class="text-slate-400 font-normal">${sendDateStr}</span>
                                    </div>
                                    <div class="text-xs text-slate-700 whitespace-pre-wrap">${escapeHtml(latestMsg.body)}</div>
                                </div>

                                <div class="space-y-2 pt-1">
                                    <div class="flex gap-1.5">
                                        <select onchange="insertMention(this, '${uniqueTextareaId}')" class="flex-1 text-xs border border-slate-300 rounded p-1.5 bg-white font-bold focus:outline-none">
                                            ${membersOpts}
                                        </select>
                                        <button onclick="insertQuoteToTextarea('${uniqueTextareaId}', '${escapeHtml(senderName)}', '${encodedBody}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1.5 rounded font-bold border border-indigo-200 shrink-0">
                                            💬 引用
                                        </button>
                                    </div>
                                    <div class="flex gap-1.5">
                                        <select onchange="insertTemplate(this, '${uniqueTextareaId}')" class="flex-1 template-dropdown text-xs border border-indigo-300 rounded p-1.5 bg-white text-indigo-950 font-bold focus:outline-none">
                                            <option value="">📥 定型文を呼び出す</option>
                                        </select>
                                        <button onclick="openTemplateEditorForSave('${uniqueTextareaId}')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 text-xs px-2 py-1.5 rounded font-bold border border-indigo-300 shrink-0">
                                            💾 登録
                                        </button>
                                    </div>
                                    <textarea id="${uniqueTextareaId}" class="w-full h-20 text-xs p-2 border border-slate-300 rounded bg-white focus:outline-none" placeholder="返信内容を入力..."></textarea>
                                    <button onclick="sendBurstReply('${roomId}', '${uniqueTextareaId}', this)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2 rounded font-bold shadow-sm active:scale-95 transition">
                                        📤 このルームに返信する
                                    </button>
                                </div>
                            </div>
                        `;
                        renderTemplateSelects();
                    } catch (err) {
                        msgArea.innerHTML = '<span class="text-red-500">取得失敗</span>';
                    }
                });

                statusEl.textContent = `未読 ${unreadRooms.length}件`;
                statusEl.className = "text-xs bg-amber-500 px-2 py-0.5 rounded-full text-white";

            } catch (e) {
                burstCont.innerHTML = `<div class="text-xs text-red-500 text-center p-4">エラー: ${e.message}</div>`;
                statusEl.textContent = "エラー";
            }
        }

        async function sendBurstReply(roomId, textareaId, btnEl) {
            const bodyText = document.getElementById(textareaId).value.trim();
            if (!bodyText) { alert('メッセージが空です。'); return; }
            if (!confirm('この内容で送信しますか？')) return;

            btnEl.disabled = true;
            btnEl.textContent = "送信中...";

            try {
                const res = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "send_message", token: getCurrentToken(), room_id: roomId, body: bodyText })
                });
                const data = await res.json();
                if (data.status !== "success") throw new Error(data.message);

                btnEl.textContent = "✅ 送信完了！";
                btnEl.className = "w-full bg-slate-300 text-white text-xs py-2 rounded cursor-default";
                btnEl.closest('.bg-white').style.opacity = '0.6';
            } catch (e) {
                alert('送信失敗: ' + e.message);
                btnEl.disabled = false;
                btnEl.textContent = "📤 このルームに返信する";
            }
        }
        /* =========================================== */

        /* ======== 📁 通常ルーム個別モード ======== */
        async function fetchNormalRooms() {
            try {
                const res = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "get_rooms", token: getCurrentToken() })
                });
                const data = await res.json();
                if (data.status !== "success") throw new Error();
                allRoomsCache = data.rooms || [];
                filterNormalRooms();
            } catch(e) {}
        }

        function filterNormalRooms() {
            const keyword = document.getElementById('roomSearchInput').value.toLowerCase();
            const filtered = allRoomsCache.filter(r => r.name.toLowerCase().includes(keyword));
            const memos = getRoomMemos();
            
            let html = '<option value="">-- セラーを選択 --</option>';
            filtered.forEach(r => {
                const memo = memos[r.room_id];
                const tagStr = memo && memo.tag ? ` [🏷️ ${memo.tag}]` : '';
                const unreadStr = r.unread_num > 0 ? ` (🔴未読 ${r.unread_num})` : '';
                html += `<option value="${r.room_id}">${escapeHtml(r.name)}${tagStr}${unreadStr}</option>`;
            });
            document.getElementById('roomSelect').innerHTML = html;
        }

        function onNormalRoomSelected() {}
        function loadSingleRoomMessages() {}
        /* =========================================== */

        /* ======== 定型文管理機能（追加・編集・削除） ======== */
        function getTemplates() {
            try { return JSON.parse(localStorage.getItem(TEMPLATE_KEY)) || []; } catch(e) { return []; }
        }

        function insertTemplate(selectEl, textareaId) {
            const templateId = selectEl.value;
            if (!templateId) return;
            if (templateId === "manage") { openTemplateManager(); selectEl.selectedIndex = 0; return; }

            const tmpl = getTemplates().find(t => t.id === templateId);
            if (tmpl) {
                const ta = document.getElementById(textareaId);
                ta.value += (ta.value ? '\n' : '') + tmpl.text;
            }
            selectEl.selectedIndex = 0;
        }

        function renderTemplateSelects() {
            const templates = getTemplates();
            const grouped = templates.reduce((acc, t) => {
                const cat = t.category || '未分類';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(t);
                return acc;
            }, {});

            let opts = '<option value="">📥 定型文を呼び出す</option>';
            for (const [cat, tmpls] of Object.entries(grouped)) {
                opts += `<optgroup label="📂 ${escapeHtml(cat)}">`;
                tmpls.forEach(t => opts += `<option value="${t.id}">📄 ${escapeHtml(t.title)}</option>`);
                opts += `</optgroup>`;
            }
            if (templates.length > 0) {
                opts += `<option disabled>──────────</option><option value="manage">⚙️ 定型文の管理 (編集・削除)</option>`;
            }
            document.querySelectorAll('.template-dropdown').forEach(sel => sel.innerHTML = opts);
        }

        function insertMention(selectEl, textareaId) {
            const accId = selectEl.value;
            if (!accId) return;
            const name = selectEl.options[selectEl.selectedIndex].getAttribute('data-name');
            const ta = document.getElementById(textareaId);
            ta.value = `[to:${accId}] ${name}さん\n` + ta.value;
            selectEl.selectedIndex = 0;
        }

        function insertQuoteToTextarea(textareaId, senderName, encodedBody) {
            const body = decodeURIComponent(encodedBody);
            const ta = document.getElementById(textareaId);
            ta.value = `[info][title]${senderName}さんのメッセージ[/title]${body}[/info]\n` + ta.value;
        }

        function closeAllModals() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('modalRoomMemo').style.display = 'none';
            document.getElementById('modalTemplateManager').style.display = 'none';
            document.getElementById('modalTemplateEditor').style.display = 'none';
        }

        // 💾 新規保存モーダルを開く
        function openTemplateEditorForSave(textareaId) {
            const text = document.getElementById(textareaId).value.trim();
            if (!text) { alert('保存する文章が入力されていません。'); return; }
            document.getElementById('editorModalTitle').textContent = '💾 新しい定型文を登録';
            document.getElementById('editTmplId').value = '';
            document.getElementById('editTmplCategory').value = '未分類';
            document.getElementById('editTmplTitle').value = '';
            document.getElementById('editTmplText').value = text;
            
            const cats = [...new Set(getTemplates().map(t => t.category || '未分類'))];
            document.getElementById('categoryList').innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');
            
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalTemplateEditor').style.display = 'flex';
        }

        // ✏️ 既存編集モーダルを開く（修正済み）
        function openTemplateEditorForEdit(id) {
            const templates = getTemplates();
            const tmpl = templates.find(t => String(t.id) === String(id));
            if (!tmpl) {
                alert('対象の定型文が見つかりませんでした。');
                return;
            }

            document.getElementById('editorModalTitle').textContent = '✏️ 定型文を編集';
            document.getElementById('editTmplId').value = tmpl.id;
            document.getElementById('editTmplCategory').value = tmpl.category || '未分類';
            document.getElementById('editTmplTitle').value = tmpl.title;
            document.getElementById('editTmplText').value = tmpl.text;
            
            const cats = [...new Set(templates.map(t => t.category || '未分類'))];
            document.getElementById('categoryList').innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');
            
            // 一旦管理画面を隠し、編集モーダルだけを最前面に表示
            document.getElementById('modalTemplateManager').style.display = 'none';
            document.getElementById('modalTemplateEditor').style.display = 'flex';
        }

        // 💾 保存ボタン（新規・上書き共通）
        function saveTemplateSubmit() {
            const id = document.getElementById('editTmplId').value;
            const category = document.getElementById('editTmplCategory').value.trim() || '未分類';
            const title = document.getElementById('editTmplTitle').value.trim();
            const text = document.getElementById('editTmplText').value.trim();

            if (!title || !text) { alert('タイトルと本文を入力してください。'); return; }

            let templates = getTemplates();
            if (id) {
                const idx = templates.findIndex(t => String(t.id) === String(id));
                if (idx > -1) {
                    templates[idx] = { id, category, title, text };
                }
            } else {
                templates.push({ id: Date.now().toString(), category, title, text });
            }
            localStorage.setItem(TEMPLATE_KEY, JSON.stringify(templates));
            renderTemplateSelects();
            
            if (id) {
                // 編集だった場合は管理画面を再描画して開く
                openTemplateManager();
            } else {
                closeAllModals();
                alert('保存しました！');
            }
        }

        // ⚙️ 管理画面を開く
        function openTemplateManager() {
            const templates = getTemplates();
            const container = document.getElementById('templateManagerList');
            container.innerHTML = templates.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">定型文はありません。</p>' : '';
            
            const grouped = templates.reduce((acc, t) => {
                const cat = t.category || '未分類';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(t);
                return acc;
            }, {});

            for (const [cat, tmpls] of Object.entries(grouped)) {
                let html = `<div class="mb-4"><h3 class="text-xs font-bold text-slate-500 border-b border-slate-200 pb-1 mb-2">📂 ${escapeHtml(cat)}</h3><div class="space-y-2">`;
                tmpls.forEach(t => {
                    html += `
                        <div class="bg-white border rounded p-2.5 flex justify-between items-center shadow-sm">
                            <span class="font-bold text-sm text-slate-700 truncate pr-2">${escapeHtml(t.title)}</span>
                            <div class="flex gap-1 shrink-0">
                                <button onclick="openTemplateEditorForEdit('${t.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2 py-1.5 rounded border border-slate-300">✏️ 編集</button>
                                <button onclick="deleteTemplate('${t.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs px-2 py-1.5 rounded border border-red-200">🗑️ 削除</button>
                            </div>
                        </div>`;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            }
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalTemplateManager').style.display = 'flex';
        }

        // 🗑️ 削除（確認ダイアログ付き）
        function deleteTemplate(id) {
            const templates = getTemplates();
            const tmpl = templates.find(t => String(t.id) === String(id));
            const titleName = tmpl ? tmpl.title : 'この定型文';

            if (!confirm(`「${titleName}」を本当に削除しますか？`)) return;

            const filtered = templates.filter(t => String(t.id) !== String(id));
            localStorage.setItem(TEMPLATE_KEY, JSON.stringify(filtered));
            renderTemplateSelects();
            openTemplateManager(); // 管理画面をリフレッシュ
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&'`<>"]/g, m => ({'&':'&amp;',"'":'&#x27;','`':'&#x60;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
        }
    </script>
</body>
</html>
