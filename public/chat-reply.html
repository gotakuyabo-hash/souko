<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>未読バーストコックピット</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .btn { height: 44px; border-radius: 12px; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 12px; cursor: pointer; transition: transform .1s; white-space: nowrap; }
        .btn:active { transform: scale(.97); }
        .btn:disabled { opacity: .5; }
        .btn-sub  { background: #f1f5f9; color: #334155; }
        .btn-main { background: #4f46e5; color: #fff; }
        .btn-ok   { background: #059669; color: #fff; }
        .btn-ai   { background: linear-gradient(90deg, #7c3aed, #4f46e5); color: #fff; }
        /* 16px以上にしてiPhoneの自動ズームを防ぐ */
        .inp { width: 100%; border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px 12px; font-size: 16px; background: #fff; }
        .inp:focus { outline: 2px solid #818cf8; outline-offset: 0; border-color: transparent; }
        .clamp { display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
        .msg-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.7; }
        .tab-btn { height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: #94a3b8; cursor: pointer; }
        .tab-btn .ico { font-size: 22px; line-height: 1; filter: grayscale(1); opacity: .6; }
        .tab-btn.active { color: #4f46e5; }
        .tab-btn.active .ico { filter: none; opacity: 1; }
        .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 28rem; margin: 0 auto; background: #fff; border-radius: 20px 20px 0 0; max-height: 88vh; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); display: none; box-shadow: 0 -8px 30px rgba(0,0,0,.15); }
        .sheet-head { position: sticky; top: 0; background: #fff; padding: 10px 20px 12px; border-bottom: 1px solid #f1f5f9; z-index: 1; }
        .sheet-head::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 9px; background: #cbd5e1; margin: 0 auto 10px; }
        .sheet-row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 20px; font-size: 16px; font-weight: 600; text-align: left; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .sheet-row:active { background: #f8fafc; }
        .field-label { font-size: 12px; color: #64748b; font-weight: 700; display: block; margin-bottom: 2px; }
        #toast { transition: opacity .2s; }
    </style>

</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-30 bg-indigo-600 text-white shadow" style="padding-top: env(safe-area-inset-top, 0px);">
        <div class="max-w-md mx-auto px-3 py-2.5 flex items-center gap-2">
            <select id="accountSelect" onchange="onAccountChange()" class="flex-1 min-w-0 bg-indigo-500 text-white font-bold rounded-xl px-3 h-11 text-[16px] border-0">
                <option value="staff" selected>ラクロジスタッフ</option>
                <option value="matsushita">松下</option>
            </select>
            <span id="loadStatus" class="shrink-0 text-xs font-bold bg-indigo-500 px-2.5 py-1 rounded-full">読込中</span>
            <button onclick="refreshCurrentView(true)" class="shrink-0 w-11 h-11 rounded-xl bg-indigo-700 text-lg cursor-pointer" aria-label="更新">🔄</button>
        </div>
    </header>

    <!-- トースト通知 -->
    <div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[60] bg-slate-900 text-white text-sm font-bold px-4 py-2.5 rounded-full shadow-lg pointer-events-none opacity-0" style="top: calc(70px + env(safe-area-inset-top, 0px));"></div>

    <main class="max-w-md mx-auto px-3 pt-3" style="padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px));">

        <!-- 一覧用ツールバー（未読・後で） -->
        <div id="listToolbar" class="flex items-center justify-between mb-2 px-1">
            <label class="flex items-center gap-2 text-sm font-bold text-slate-600 py-2 cursor-pointer">
                <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)" class="w-5 h-5 accent-indigo-600"> すべて選択
            </label>
            <button onclick="copyAllUnreadChats(this)" class="text-sm font-bold text-indigo-700 py-2 px-2 cursor-pointer">📋 全部コピー</button>
        </div>

        <div id="burstModeContainer" class="space-y-3"></div>
        <div id="laterModeContainer" class="space-y-3" style="display:none;"></div>

        <div id="normalModeContainer" style="display:none;">
            <div class="bg-white p-3 rounded-2xl shadow-sm space-y-2">
                <input type="search" id="roomSearchInput" oninput="filterNormalRooms()" placeholder="🔍 ルーム名で絞り込み" class="inp bg-slate-50">
                <select id="roomSelect" onchange="loadSingleRoomMessages()" class="inp font-bold">
                    <option value="">ルームを選択してください</option>
                </select>
            </div>
            <div id="singleRoomMessageContainer" class="space-y-3 mt-3"></div>
        </div>
    </main>

    <!-- 選択中バー -->
    <div id="selectionBar" class="fixed inset-x-0 z-30" style="display:none; bottom: calc(60px + env(safe-area-inset-bottom, 0px));">
        <div class="max-w-md mx-auto px-3 pb-2">
            <div class="bg-slate-900 text-white rounded-2xl flex items-center justify-between pl-4 pr-2 py-2 shadow-lg">
                <span class="text-sm font-bold"><span id="selectedCount">0</span>件 選択中</span>
                <button onclick="batchMarkAsRead()" class="btn btn-ok">✓ 既読にする</button>
            </div>
        </div>
    </div>

    <!-- 下部タブ -->
    <nav class="fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
        <div class="max-w-md mx-auto grid grid-cols-3">
            <button id="tabBurst" class="tab-btn active" onclick="switchMode('burst')"><span class="ico">⚡</span>未読</button>
            <button id="tabLater" class="tab-btn" onclick="switchMode('later')"><span class="ico">⏳</span>後で (<span id="laterCountBadge">0</span>)</button>
            <button id="tabNormal" class="tab-btn" onclick="switchMode('normal')"><span class="ico">📁</span>ルーム</button>
        </div>
    </nav>

    <!-- シート類 -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/50 z-40" style="display:none;" onclick="closeAllModals()"></div>

    <div id="sheetActions" class="sheet">
        <div class="sheet-head"><div id="sheetActionsTitle" class="font-bold text-base truncate text-center"></div></div>
        <div id="sheetActionsBody"></div>
        <button onclick="closeAllModals()" class="sheet-row justify-center text-slate-500">閉じる</button>
    </div>

    <div id="modalSellerInfo" class="sheet">
        <div class="sheet-head"><div class="font-bold text-base text-center">🔑 セラー情報</div></div>
        <div class="p-5 space-y-4">
            <div><span class="field-label">管理番号</span><span id="sellerModalKanriNo" class="font-bold text-base">-</span> <span id="sellerModalSheet" class="text-xs text-slate-400"></span></div>
            <div><span class="field-label">お名前 / ショップ名</span><span id="sellerModalName" class="font-bold text-base">-</span><div id="sellerModalShopName" class="text-sm text-slate-600">-</div></div>
            <div class="bg-indigo-50 p-4 rounded-xl space-y-3">
                <div><span class="field-label text-indigo-700">ログインID</span><span id="sellerModalId" class="font-mono text-base select-all break-all">-</span></div>
                <div><span class="field-label text-indigo-700">パスワード</span><span id="sellerModalPass" class="font-mono text-base select-all break-all">-</span></div>
            </div>
            <div id="sellerModalExtras" class="space-y-3"></div>
            <button onclick="closeAllModals()" class="btn btn-sub w-full">閉じる</button>
        </div>
    </div>

    <div id="modalLinkCopy" class="sheet">
        <div class="sheet-head"><div class="font-bold text-base text-center">🚀 スタッフ連絡に登録</div></div>
        <div class="p-5 space-y-3">
            <input type="hidden" id="linkRoomId"><input type="hidden" id="linkRoomName"><input type="hidden" id="linkSenderName"><input type="hidden" id="linkMessageBody">
            <div class="grid grid-cols-2 gap-2">
                <div><label class="field-label">From</label><input type="text" id="linkFromInput" value="松下" class="inp"></div>
                <div><label class="field-label">To</label><input type="text" id="linkToInput" value="スタッフ全員" class="inp"></div>
            </div>
            <div><label class="field-label">メモ（任意）</label><textarea id="linkMemoInput" rows="3" class="inp"></textarea></div>
            <div><label class="field-label">画像（任意）</label><input type="file" id="linkImageInput" accept="image/*" class="inp text-sm bg-slate-50"></div>
            <button onclick="registerToStaffApp(this)" class="btn btn-main w-full">🚀 登録する</button>
        </div>
    </div>

    <!-- 画像ビューア -->
    <div id="imageViewer" class="fixed inset-0 z-[70] bg-black/95 flex-col" style="display:none;">
        <div class="flex items-center gap-2 px-3 text-white" style="padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px;">
            <div id="viewerName" class="flex-1 min-w-0 truncate text-sm font-bold"></div>
            <button onclick="closeViewer()" class="w-11 h-11 text-2xl shrink-0 cursor-pointer" aria-label="閉じる">✕</button>
        </div>
        <div class="flex-1 min-h-0 flex items-center justify-center overflow-auto p-2" onclick="if(event.target===this) closeViewer()">
            <div id="viewerLoading" class="text-white text-base">読み込み中…</div>
            <div id="viewerError" class="text-white text-base text-center px-6 leading-relaxed" style="display:none;"></div>
            <img id="viewerImg" alt="" class="max-w-full max-h-full object-contain" style="display:none;">
        </div>
        <div class="px-3" style="padding-top: 8px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));">
            <button id="viewerDownloadBtn" class="btn btn-sub w-full">⬇ ダウンロード</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzbGircW91tKx9NIihoWRMCiyIYnVbJJoeJZ9IoUf5s6vI71zNVnqJOo38vSOqfeMYzzA/exec";
        const LATER_KEY = "chatwork_later_rooms_v2";
        const SECRET_KEY = "chatwork_cockpit_secret_v1";
        const BUNDLE_CACHE_KEY = "cw_unread_bundle_v1_";

        // ===== Firestore（使う時だけ読み込む＝初回表示を軽く） =====
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
            authDomain: "souko-2de57.firebaseapp.com",
            projectId: "souko-2de57",
            storageBucket: "souko-2de57.firebasestorage.app",
            messagingSenderId: "642116656086",
            appId: "1:642116656086:web:139cc5558a4ef6ebda6277"
        };
        const FS_TS = "__SERVER_TIMESTAMP__"; // この値はサーバー時刻に置き換えて保存
        let _fsPromise = null;
        function loadFirestore() {
            if (!_fsPromise) {
                _fsPromise = Promise.all([
                    import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"),
                    import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js")
                ]).then(([appMod, fsMod]) => {
                    const app = appMod.initializeApp(FIREBASE_CONFIG);
                    return { db: fsMod.getFirestore(app), collection: fsMod.collection, addDoc: fsMod.addDoc, serverTimestamp: fsMod.serverTimestamp };
                }).catch(err => { _fsPromise = null; throw err; });
            }
            return _fsPromise;
        }
        async function fsAdd(collectionName, data) {
            const f = await loadFirestore();
            const doc = {};
            Object.keys(data).forEach(k => { doc[k] = data[k] === FS_TS ? f.serverTimestamp() : data[k]; });
            return f.addDoc(f.collection(f.db, collectionName), doc);
        }

        // 画像を縮小してから保存（Firestoreは1件1MBまでのため）
        function compressImage(file, maxSize = 1280, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
                img.src = url;
            });
        }

        window.registerToStaffApp = async function(btnEl) {
            const roomName = document.getElementById('linkRoomName').value;
            const senderName = document.getElementById('linkSenderName').value;
            const messageBody = document.getElementById('linkMessageBody').value;
            const fromVal = document.getElementById('linkFromInput').value;
            const toVal = document.getElementById('linkToInput').value;
            const memoVal = document.getElementById('linkMemoInput').value;
            const imageInput = document.getElementById('linkImageInput');

            let taskContent = `【Chatwork連携依頼】\nルーム名: ${roomName}\n\n👤 発言者: ${senderName}\n💬 メッセージ本文:\n${messageBody}`;
            if (memoVal) taskContent += `\n\n📝 連絡メモ:\n${memoVal}`;

            btnEl.disabled = true;
            btnEl.textContent = "登録中...";
            try {
                let imageUrl = null;
                if (imageInput && imageInput.files && imageInput.files[0]) {
                    imageUrl = await compressImage(imageInput.files[0]);
                }
                await fsAdd("staff_requests", {
                    from: fromVal || '未設定',
                    to: toVal || '未設定',
                    task: taskContent,
                    imageUrl: imageUrl,
                    status: 'pending',
                    createdAt: FS_TS
                });
                document.getElementById('linkMemoInput').value = '';
                imageInput.value = '';
                closeAllModals();
                showToast('スタッフ連絡に登録しました');
            } catch (error) {
                alert("登録失敗: " + error.message);
            } finally {
                btnEl.disabled = false;
                btnEl.textContent = "🚀 登録する";
            }
        };

        let allRoomsCache = [];
        let unreadRoomsCache = [];
        let roomMembersCache = {};
        let currentMode = 'burst';
        window.messageStore = {};   // msgKey → { body, sender, roomId, roomName }
        window.roomNameMap = {};    // roomId → ルーム名

        window.addEventListener('DOMContentLoaded', () => {
            updateLaterBadge();
            fetchAllUnreadRooms();
        });

        // チェックボックスが変わったら選択バーを更新
        document.addEventListener('change', e => {
            if (e.target.classList && e.target.classList.contains('room-checkbox')) updateSelectionBar();
        });

        // ===== 共通 =====
        function getAccount() { return document.getElementById('accountSelect').value; }
        function esc(str) {
            return (str === undefined || str === null) ? '' : String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function safeId(id) { return String(id || '').replace(/[^0-9]/g, ''); }
        function getUnread(r) { return Number(r.unread_num !== undefined ? r.unread_num : (r.unread_count || 0)); }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = 1;
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.style.opacity = 0, 1800);
        }
        window.showToast = showToast;

        function fmtTime(sec) {
            if (!sec) return '';
            const d = new Date(sec * 1000);
            const hm = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
            return d.toDateString() === new Date().toDateString() ? `今日 ${hm}` : `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
        }

        // Chatworkのタグを読みやすく整形
        function cleanBody(b) {
            return String(b || '')
                .replace(/\[To:\d+\]/g, '@')
                .replace(/\[toall\]/gi, '@全員 ')
                .replace(/\[rp aid=\d+ to=\d+-\d+\]/g, '↩ ')
                .replace(/\[(piconname|picon):\d+\]/g, '')
                .replace(/\[qt\]\[qtmeta[^\]]*\]/g, '＞ ')
                .replace(/\[\/qt\]/g, '\n')
                .replace(/\[\/?info\]/g, '')
                .replace(/\[title\]/g, '【').replace(/\[\/title\]/g, '】\n')
                .replace(/\[hr\]/g, '──────')
                .replace(/\[download:\d+\][\s\S]*?\[\/download\]/g, '')
                .replace(/\[preview[^\]]*\]/g, '')
                .replace(/\[dtext:[^\]]*\]/g, '')
                .replace(/\[\/?code\]/g, '')
                .replace(/【\s*】\n?/g, '')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        // ===== 添付ファイル =====
        const fileNameMap = {};   // fileId → 表示名
        const fileUrlCache = {};  // fileId → { url, t }
        const URL_CACHE_MS = 3 * 60 * 1000;

        // 本文中の [download:ID]ファイル名 (サイズ)[/download] を取り出す
        function parseFiles(raw) {
            const files = [];
            const re = /\[download:(\d+)\]([\s\S]*?)\[\/download\]/g;
            let m;
            while ((m = re.exec(String(raw || ''))) !== null) {
                const name = m[2].trim();
                const base = name.replace(/\s*\([\d.,]+\s*[KMGT]?B\)\s*$/i, '');
                files.push({ id: m[1], name: name, base: base });
                fileNameMap[m[1]] = base;
            }
            return files;
        }
        function isImageFile(name) { return /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(name || ''); }

        function attachmentsHtml(roomId, files) {
            if (!files || files.length === 0) return '';
            const rid = safeId(roomId);
            return `<div class="mt-2 space-y-2">` + files.map(f => {
                const img = isImageFile(f.base);
                return `
                    <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl p-2 pl-3">
                        <span class="text-xl shrink-0">${img ? '🖼️' : '📄'}</span>
                        <span class="flex-1 min-w-0 text-sm truncate">${esc(f.name)}</span>
                        ${img ? `<button onclick="previewImage('${rid}', '${safeId(f.id)}')" class="btn btn-main shrink-0" style="height:38px">見る</button>` : ''}
                        <button onclick="downloadFile('${rid}', '${safeId(f.id)}')" class="btn btn-sub shrink-0" style="height:38px" aria-label="ダウンロード">⬇ 保存</button>
                    </div>`;
            }).join('') + `</div>`;
        }

        // ダウンロード用URLを取得（数分間は使い回す）
        async function getFileUrl(roomId, fileId) {
            const c = fileUrlCache[fileId];
            if (c && Date.now() - c.t < URL_CACHE_MS) return c.url;
            const data = await callApi("get_room_file", { room_id: roomId, file_id: fileId });
            const url = data.file && data.file.download_url;
            if (!url) throw new Error("ファイルのURLを取得できませんでした");
            fileUrlCache[fileId] = { url: url, t: Date.now() };
            return url;
        }

        window.previewImage = async function(roomId, fileId) {
            const viewer = document.getElementById('imageViewer');
            const img = document.getElementById('viewerImg');
            const loading = document.getElementById('viewerLoading');
            const err = document.getElementById('viewerError');
            document.getElementById('viewerName').textContent = fileNameMap[fileId] || '';
            document.getElementById('viewerDownloadBtn').onclick = () => downloadFile(roomId, fileId);
            img.style.display = 'none';
            img.removeAttribute('src');
            err.style.display = 'none';
            loading.style.display = 'block';
            viewer.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            try {
                const url = await getFileUrl(roomId, fileId);
                img.onload = () => { loading.style.display = 'none'; img.style.display = 'block'; };
                img.onerror = () => {
                    loading.style.display = 'none';
                    err.textContent = 'この端末では画像を表示できませんでした（HEIC形式など）。下の「ダウンロード」から開いてください。';
                    err.style.display = 'block';
                };
                img.src = url;
            } catch (e) {
                loading.style.display = 'none';
                err.textContent = '読み込みに失敗しました：' + e.message;
                err.style.display = 'block';
            }
        };

        window.closeViewer = function() {
            document.getElementById('imageViewer').style.display = 'none';
            document.getElementById('viewerImg').removeAttribute('src');
            document.body.style.overflow = '';
        };

        // スマホのポップアップブロック対策：先に空タブを開いてからURLを入れる
        window.downloadFile = async function(roomId, fileId) {
            const c = fileUrlCache[fileId];
            if (c && Date.now() - c.t < URL_CACHE_MS) { window.open(c.url, '_blank'); return; }
            const w = window.open('', '_blank');
            if (w) w.document.write('<p style="font-family:sans-serif;font-size:18px;padding:24px">ファイルを準備中…</p>');
            try {
                const url = await getFileUrl(roomId, fileId);
                if (w) w.location.href = url; else location.href = url;
            } catch (e) {
                if (w) w.close();
                alert("ダウンロードに失敗しました: " + e.message);
            }
        };

        function openSheet(id) {
            ['sheetActions', 'modalSellerInfo', 'modalLinkCopy'].forEach(s => document.getElementById(s).style.display = 'none');
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById(id).style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        function closeAllModals() {
            ['modalOverlay', 'sheetActions', 'modalSellerInfo', 'modalLinkCopy'].forEach(s => document.getElementById(s).style.display = 'none');
            document.body.style.overflow = '';
        }

        function getSecret() {
            let s = localStorage.getItem(SECRET_KEY);
            if (!s) {
                s = (prompt("合言葉を入力してください") || "").trim();
                if (s) localStorage.setItem(SECRET_KEY, s);
            }
            return s;
        }

        async function callApi(action, params = {}) {
            const body = Object.assign({}, params, { action: action, account: getAccount(), secret: getSecret() });
            const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(body) });
            const data = await res.json();
            if (data.code === "auth") {
                localStorage.removeItem(SECRET_KEY);
                throw new Error("合言葉が違います。🔄を押して入力し直してください");
            }
            if (data.status !== "success") throw new Error(data.message || "エラー");
            return data;
        }

        function setStatus(text, cls) {
            const el = document.getElementById('loadStatus');
            el.textContent = text;
            el.className = `shrink-0 text-xs font-bold px-2.5 py-1 rounded-full ${cls || 'bg-indigo-500'}`;
        }

        function emptyBox(text) {
            return `<div class="bg-white p-10 rounded-2xl text-center text-base font-bold text-slate-500 shadow-sm">${text}</div>`;
        }

        // ===== 画面切替 =====
        function onAccountChange() {
            allRoomsCache = [];
            unreadRoomsCache = [];
            roomMembersCache = {};
            document.getElementById('roomSearchInput').value = '';
            document.getElementById('singleRoomMessageContainer').innerHTML = '';
            updateLaterBadge();
            refreshCurrentView();
        }

        function refreshCurrentView(force) {
            document.getElementById('selectAllCheckbox').checked = false;
            updateSelectionBar();
            if (currentMode === 'burst') fetchAllUnreadRooms(force);
            else if (currentMode === 'later') renderLaterRooms();
            else fetchNormalRooms(true);
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('selectAllCheckbox').checked = false;
            ['tabBurst', 'tabLater', 'tabNormal'].forEach(id => document.getElementById(id).classList.remove('active'));
            ['burstModeContainer', 'laterModeContainer', 'normalModeContainer'].forEach(id => document.getElementById(id).style.display = 'none');
            const isList = mode !== 'normal';
            document.getElementById('listToolbar').style.display = isList ? 'flex' : 'none';

            if (mode === 'burst') {
                document.getElementById('tabBurst').classList.add('active');
                document.getElementById('burstModeContainer').style.display = 'block';
                fetchAllUnreadRooms();
            } else if (mode === 'later') {
                document.getElementById('tabLater').classList.add('active');
                document.getElementById('laterModeContainer').style.display = 'block';
                renderLaterRooms();
            } else {
                document.getElementById('tabNormal').classList.add('active');
                document.getElementById('normalModeContainer').style.display = 'block';
                fetchNormalRooms(false);
            }
            updateSelectionBar();
            window.scrollTo(0, 0);
        }

        // ===== 選択 =====
        function updateSelectionBar() {
            const n = currentMode === 'normal' ? 0 : document.querySelectorAll('.room-checkbox:checked').length;
            document.getElementById('selectedCount').textContent = n;
            document.getElementById('selectionBar').style.display = n > 0 ? 'block' : 'none';
        }
        window.toggleSelectAll = function(master) {
            const container = currentMode === 'burst' ? 'burstModeContainer' : 'laterModeContainer';
            document.querySelectorAll(`#${container} .room-checkbox`).forEach(cb => cb.checked = master.checked);
            updateSelectionBar();
        };

        window.batchMarkAsRead = async function() {
            const checked = document.querySelectorAll('.room-checkbox:checked');
            if (checked.length === 0) return;
            if (!confirm(`${checked.length} 件のルームを既読にしますか？`)) return;
            const ids = Array.from(checked).map(cb => cb.getAttribute('data-room-id'));
            setStatus('処理中…');
            try {
                const r = await callApi("mark_read_batch", { room_ids: ids });
                markReadInCache(ids);
                showToast(`${r.ok} 件を既読にしました` + (r.ng ? `（${r.ng} 件失敗）` : ''));
            } catch (e) {
                alert("既読エラー: " + e.message);
            }
            refreshCurrentView(true);
        };

        // ===== 後で対応 =====
        function getLaterRooms() { try { return JSON.parse(localStorage.getItem(LATER_KEY)) || {}; } catch (e) { return {}; } }
        function isLater(roomId) { return (getLaterRooms()[getAccount()] || []).indexOf(String(roomId)) > -1; }
        function updateLaterBadge() {
            document.getElementById('laterCountBadge').textContent = (getLaterRooms()[getAccount()] || []).length;
        }
        window.toggleLaterRoom = function(roomId) {
            const later = getLaterRooms();
            const acc = getAccount();
            if (!later[acc]) later[acc] = [];
            const idx = later[acc].indexOf(String(roomId));
            if (idx > -1) { later[acc].splice(idx, 1); showToast("「後で対応」から外しました"); }
            else { later[acc].push(String(roomId)); showToast("「後で対応」に入れました"); }
            localStorage.setItem(LATER_KEY, JSON.stringify(later));
            updateLaterBadge();
            if (currentMode === 'later') renderLaterRooms();
        };

        async function renderLaterRooms() {
            const container = document.getElementById('laterModeContainer');
            const list = getLaterRooms()[getAccount()] || [];
            if (list.length === 0) {
                container.innerHTML = emptyBox('☕ 「後で対応」のルームはありません');
                return;
            }
            if (allRoomsCache.length === 0) {
                try { allRoomsCache = (await callApi("get_rooms")).rooms || []; } catch (e) {}
            }
            const nameOf = id => (allRoomsCache.find(r => String(r.room_id) === String(id)) || {}).name || `ルームID: ${id}`;
            const draw = latest => {
                container.innerHTML = list.map(id =>
                    burstCardHtml(id, nameOf(id), "後で", "bg-amber-100 text-amber-800", latest ? (latest[String(id)] || { error: '取得できませんでした' }) : null)
                ).join('');
            };
            draw(null);
            try {
                const data = await callApi("get_latest_messages", { room_ids: list });
                if (currentMode === 'later') draw(data.latest || {});
            } catch (e) {
                if (currentMode === 'later') draw(Object.fromEntries(list.map(id => [String(id), { error: e.message }])));
            }
        }

        // ===== メッセージ部品 =====
        function memberOptionsHtml(members) {
            let html = '<option value="">＋ To を追加</option>';
            (Array.isArray(members) ? members : []).forEach(mem => {
                html += `<option value="${safeId(mem.account_id)}">${esc(mem.name)}</option>`;
            });
            return html;
        }

        function messageHtml(msgKey, m) {
            const sender = m.account ? m.account.name : "相手";
            const avatarUrl = m.account && m.account.avatar_image_url;
            const avatar = avatarUrl
                ? `<img src="${esc(avatarUrl)}" alt="" class="w-9 h-9 rounded-full shrink-0 bg-slate-200 object-cover">`
                : `<div class="w-9 h-9 rounded-full shrink-0 bg-slate-200"></div>`;
            const st = window.messageStore[msgKey];
            const body = st.displayBody;
            const isLong = body.length > 280 || body.split('\n').length > 8;
            return `
                <div class="flex items-center gap-2.5">
                    ${avatar}
                    <div class="min-w-0">
                        <div class="font-bold text-sm truncate">${esc(sender)}</div>
                        <div class="text-xs text-slate-400">${fmtTime(m.send_time)}</div>
                    </div>
                </div>
                <div id="body_${msgKey}" class="chat-msg-body-text msg-body mt-2 ${isLong ? 'clamp' : ''}" ${body ? '' : 'style="display:none"'}>${esc(body)}</div>
                ${isLong ? `<button onclick="expandBody('${msgKey}', this)" class="text-indigo-600 text-sm font-bold py-1.5 cursor-pointer">続きを読む</button>` : ''}
                ${attachmentsHtml(st.roomId, st.files)}`;
        }

        window.expandBody = function(msgKey, btn) {
            document.getElementById(`body_${msgKey}`).classList.remove('clamp');
            btn.remove();
        };

        function replyPanelHtml(msgKey, members) {
            return `
                <div id="reply_panel_${msgKey}" class="mt-3 pt-3 border-t border-slate-100 space-y-2" style="display:none;">
                    <input type="text" id="custom_prompt_${msgKey}" placeholder="AIへの指示（任意）例：丁寧にお断り" class="inp bg-slate-50">
                    <button onclick="generateAiReplyForMessage('${msgKey}', this)" class="btn btn-ai w-full">✨ AIで返信を作成</button>
                    <textarea id="reply_text_${msgKey}" rows="5" placeholder="返信文" class="inp"></textarea>
                    <div class="flex gap-2">
                        <select id="member_select_${msgKey}" ${members ? 'data-loaded="1"' : ''} onchange="insertMentionForMsg('${msgKey}')" class="inp flex-1 min-w-0 text-[16px]">${memberOptionsHtml(members)}</select>
                        <button onclick="sendReplyForMessage('${msgKey}', this)" class="btn btn-ok shrink-0 px-5">📤 送信</button>
                    </div>
                </div>`;
        }

        window.toggleReply = function(msgKey, btn) {
            const panel = document.getElementById(`reply_panel_${msgKey}`);
            const open = panel.style.display === 'none';
            panel.style.display = open ? 'block' : 'none';
            btn.textContent = open ? '✕ 閉じる' : '💬 返信';
            if (open) {
                ensureMembers(msgKey);
                setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
            }
        };

        async function ensureMembers(msgKey) {
            const st = window.messageStore[msgKey] || {};
            const sel = document.getElementById(`member_select_${msgKey}`);
            if (!sel || sel.dataset.loaded) return;
            sel.dataset.loaded = '1';
            let members = roomMembersCache[st.roomId];
            if (!members) {
                sel.innerHTML = '<option value="">メンバー読込中…</option>';
                try {
                    members = (await callApi("get_members", { room_id: st.roomId })).members || [];
                    roomMembersCache[st.roomId] = members;
                } catch (e) {
                    members = [];
                    sel.dataset.loaded = '';
                }
            }
            sel.innerHTML = memberOptionsHtml(members);
        }

        function storeMessage(roomId, roomName, m, idx) {
            const rid = safeId(roomId);
            const msgKey = `msg_${rid}_${idx}_${Math.random().toString(36).slice(2, 8)}`;
            const files = parseFiles(m.body);
            const display = cleanBody(m.body);
            // コピー・AI・スタッフ連絡用の本文には添付ファイル名も含める
            const body = display + (files.length ? (display ? '\n' : '') + files.map(f => '📎 ' + f.name).join('\n') : '');
            window.messageStore[msgKey] = { body, displayBody: display, files, sender: m.account ? m.account.name : "相手", roomId: rid, roomName };
            return msgKey;
        }

        // ===== 未読・後でのカード =====
        function cardHeadHtml(roomId, roomName, badge, badgeCls) {
            return `
                <div class="flex items-center gap-2">
                    <label class="p-2 -m-2 shrink-0 cursor-pointer"><input type="checkbox" class="room-checkbox w-5 h-5 accent-indigo-600" data-room-id="${safeId(roomId)}"></label>
                    <h3 class="font-bold text-base truncate flex-1 min-w-0 ml-1">${esc(roomName)}</h3>
                    <span class="shrink-0 text-xs font-bold px-2.5 py-1 rounded-full ${badgeCls}">${esc(badge)}</span>
                </div>`;
        }

        // entry = { messages: [...] } / { error } / null(読込中)
        function burstCardHtml(roomId, roomName, badge, badgeCls, entry) {
            const rid = safeId(roomId);
            window.roomNameMap[rid] = roomName;
            let inner;
            if (!entry) {
                inner = '<div class="mt-3 text-sm text-slate-400">読込中…</div>';
            } else if (entry.error) {
                inner = `<div class="mt-3 text-sm text-red-500">取得失敗：${esc(entry.error)}</div>`;
            } else if (!entry.messages || entry.messages.length === 0) {
                inner = '<div class="mt-3 text-sm text-slate-400">メッセージなし</div>';
            } else {
                const latest = entry.messages[entry.messages.length - 1];
                const msgKey = storeMessage(rid, roomName, latest, 0);
                inner = `
                    <div class="card-body mt-3">
                        ${messageHtml(msgKey, latest)}
                        <div class="flex gap-2 mt-3">
                            <button onclick="toggleReply('${msgKey}', this)" class="btn btn-sub flex-1">💬 返信</button>
                            <button onclick="markAsRead('${rid}', '${safeId(latest.message_id)}', this)" class="btn btn-sub flex-1">✓ 既読</button>
                            <button onclick="openMsgActions('${msgKey}')" class="btn btn-sub w-12 shrink-0 text-lg" aria-label="その他">⋯</button>
                        </div>
                        ${replyPanelHtml(msgKey)}
                    </div>`;
            }
            return `<div class="burst-card bg-white rounded-2xl shadow-sm p-4" data-room-name="${esc(roomName)}">${cardHeadHtml(roomId, roomName, badge, badgeCls)}${inner}</div>`;
        }

        // ===== その他メニュー =====
        function sheetBtn(icon, label, onclick) {
            return `<button onclick="${onclick}" class="sheet-row"><span class="text-xl w-7 text-center">${icon}</span><span>${label}</span></button>`;
        }

        window.openMsgActions = function(msgKey) {
            const m = window.messageStore[msgKey] || {};
            const rid = m.roomId;
            const later = isLater(rid);
            document.getElementById('sheetActionsTitle').textContent = m.roomName || '';
            document.getElementById('sheetActionsBody').innerHTML =
                sheetBtn('🔑', 'セラー情報を見る', `fetchSellerInfo('${rid}')`) +
                sheetBtn(later ? '↩️' : '⏳', later ? '「後で対応」から外す' : '「後で対応」に入れる', `toggleLaterRoom('${rid}'); closeAllModals();`) +
                sheetBtn('🚀', 'スタッフ連絡に登録', `openStaffAppModal('${msgKey}')`) +
                sheetBtn('📋', '本文をコピー', `copyMessageText('${msgKey}')`) +
                `<a href="https://www.chatwork.com/#!rid${rid}" target="_blank" rel="noopener" class="sheet-row"><span class="text-xl w-7 text-center">🌐</span><span>Chatworkで開く</span></a>`;
            openSheet('sheetActions');
        };

        window.copyMessageText = function(msgKey) {
            const text = (window.messageStore[msgKey] || {}).body || "";
            navigator.clipboard.writeText(text)
                .then(() => { closeAllModals(); showToast('コピーしました'); })
                .catch(err => alert("コピーに失敗しました: " + err));
        };

        window.copyAllUnreadChats = function() {
            const container = currentMode === 'burst' ? 'burstModeContainer' : 'laterModeContainer';
            const cards = document.querySelectorAll(`#${container} .burst-card`);
            if (cards.length === 0) { showToast("コピーするチャットがありません"); return; }
            let text = "【未読チャット一覧】\n\n";
            cards.forEach((card, idx) => {
                const bodyEl = card.querySelector('.chat-msg-body-text');
                text += `■ [${idx + 1}] ルーム: ${card.getAttribute('data-room-name') || "ルーム"}\n${bodyEl ? bodyEl.textContent : ""}\n\n--------------------\n\n`;
            });
            navigator.clipboard.writeText(text.trim())
                .then(() => showToast(`${cards.length} 件をコピーしました`))
                .catch(err => alert("コピーに失敗しました: " + err));
        };

        window.copyAllRoomMessages = function(roomId) {
            const roomName = window.roomNameMap[roomId] || "ルーム";
            const els = document.querySelectorAll('#singleRoomMessageContainer .chat-msg-body-text');
            if (els.length === 0) { showToast("コピーするメッセージがありません"); return; }
            let text = `【ルーム名: ${roomName}】\n\n`;
            els.forEach((el, idx) => { text += `--- メッセージ ${idx + 1} ---\n${el.textContent}\n\n`; });
            navigator.clipboard.writeText(text.trim())
                .then(() => showToast(`${els.length} 件をコピーしました`))
                .catch(err => alert("コピーに失敗しました: " + err));
        };

        window.openStaffAppModal = function(msgKey) {
            const m = window.messageStore[msgKey] || {};
            document.getElementById('linkRoomId').value = m.roomId || "";
            document.getElementById('linkRoomName').value = m.roomName || "";
            document.getElementById('linkSenderName').value = m.sender || "";
            document.getElementById('linkMessageBody').value = m.body || "";
            openSheet('modalLinkCopy');
        };

        window.fetchSellerInfo = async function(roomId) {
            const keyword = window.roomNameMap[roomId];
            if (!keyword) return;
            ['sellerModalName', 'sellerModalShopName', 'sellerModalId', 'sellerModalPass'].forEach(id => document.getElementById(id).textContent = '-');
            document.getElementById('sellerModalSheet').textContent = '';
            document.getElementById('sellerModalExtras').innerHTML = '';
            document.getElementById('sellerModalKanriNo').textContent = "読込中…";
            openSheet('modalSellerInfo');
            try {
                const data = await callApi("get_seller_info", { chatwork_id: keyword });
                if (!data.seller || data.seller.error) {
                    document.getElementById('sellerModalKanriNo').textContent = "見つかりませんでした";
                    return;
                }
                const s = data.seller;
                document.getElementById('sellerModalKanriNo').textContent = s.kanriNo || 'なし';
                document.getElementById('sellerModalSheet').textContent = s.sheetLabel ? `（${s.sheetLabel}）` : '';
                document.getElementById('sellerModalName').textContent = s.name || 'なし';
                document.getElementById('sellerModalShopName').textContent = s.shopName || 'なし';
                document.getElementById('sellerModalId').textContent = s.id || '未登録';
                document.getElementById('sellerModalPass').textContent = s.pass || '未登録';
                document.getElementById('sellerModalExtras').innerHTML = (s.extras || []).map(ex => `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                        <span class="text-sm text-slate-600 font-bold">${esc(ex.label)}</span>
                        <span class="text-base font-bold select-all">${esc(ex.value)}</span>
                    </div>`).join('');
            } catch (e) {
                alert("取得失敗: " + e.message);
                closeAllModals();
            }
        };

        // ===== ルームタブ =====
        async function fetchNormalRooms(forceReload) {
            const selectEl = document.getElementById('roomSelect');
            selectEl.innerHTML = '<option value="">ルーム一覧を読み込み中…</option>';
            try {
                if (forceReload || allRoomsCache.length === 0) {
                    allRoomsCache = (await callApi("get_rooms")).rooms || [];
                }
                filterNormalRooms();
                setStatus(`${allRoomsCache.length} ルーム`);
            } catch (e) {
                selectEl.innerHTML = `<option value="">取得失敗: ${esc(e.message)}</option>`;
            }
        }
        function filterNormalRooms() {
            const kw = document.getElementById('roomSearchInput').value.toLowerCase();
            const current = document.getElementById('roomSelect').value;
            let html = '<option value="">ルームを選択してください</option>';
            allRoomsCache.filter(r => String(r.name).toLowerCase().includes(kw)).forEach(r => {
                const unread = getUnread(r);
                html += `<option value="${safeId(r.room_id)}">${unread > 0 ? `🔴${unread} ` : ''}${esc(r.name)}</option>`;
            });
            const sel = document.getElementById('roomSelect');
            sel.innerHTML = html;
            if (current) sel.value = current;
        }

        async function loadSingleRoomMessages() {
            const roomId = document.getElementById('roomSelect').value;
            const container = document.getElementById('singleRoomMessageContainer');
            if (!roomId) { container.innerHTML = ''; return; }
            container.innerHTML = emptyBox('読み込み中…');
            try {
                const roomData = await callApi("get_room_data", { room_id: roomId });
                const msgs = roomData.messages || [];
                const members = roomData.members || [];
                roomMembersCache[roomId] = members;
                const roomObj = allRoomsCache.find(r => String(r.room_id) === String(roomId));
                const roomName = roomObj ? roomObj.name : "ルーム";
                window.roomNameMap[roomId] = roomName;

                const latest = msgs[msgs.length - 1] || {};
                const recent = msgs.slice(-20);

                let html = `
                    <div class="bg-white rounded-2xl shadow-sm p-4">
                        <div class="font-bold text-base">${esc(roomName)}</div>
                        <div class="grid grid-cols-3 gap-2 mt-3">
                            <button onclick="fetchSellerInfo('${safeId(roomId)}')" class="btn btn-sub">🔑 セラー</button>
                            <button onclick="copyAllRoomMessages('${safeId(roomId)}')" class="btn btn-sub">📋 コピー</button>
                            <button onclick="markAsRead('${safeId(roomId)}', '${safeId(latest.message_id)}', this)" class="btn btn-sub">✓ 既読</button>
                        </div>
                    </div>`;

                if (recent.length === 0) {
                    html += emptyBox('まだメッセージがありません');
                } else {
                    html += `<div class="text-xs font-bold text-slate-400 px-1">直近 ${recent.length} 件（下が最新）</div>`;
                    recent.forEach((m, idx) => {
                        const msgKey = storeMessage(roomId, roomName, m, idx);
                        html += `
                            <div class="bg-white rounded-2xl shadow-sm p-4">
                                ${messageHtml(msgKey, m)}
                                <div class="flex gap-2 mt-3">
                                    <button onclick="toggleReply('${msgKey}', this)" class="btn btn-sub flex-1">💬 返信</button>
                                    <button onclick="openMsgActions('${msgKey}')" class="btn btn-sub w-12 shrink-0 text-lg" aria-label="その他">⋯</button>
                                </div>
                                ${replyPanelHtml(msgKey, members)}
                            </div>`;
                    });
                }

                html += buildComposeBox(roomId, roomName, msgs, members);
                container.innerHTML = html;
                // 最新メッセージと発信欄が見えるよう一番下へ
                setTimeout(() => container.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' }), 50);
            } catch (e) {
                container.innerHTML = `<div class="text-sm text-red-500 bg-white p-4 rounded-2xl shadow-sm">エラー: ${esc(e.message)}</div>`;
            }
        }

        // ===== 新規発信 =====
        function buildComposeBox(roomId, roomName, messages, members) {
            const rid = safeId(roomId);
            const key = `compose_${rid}`;
            const recent = messages.slice(-10).map(m => `${m.account ? m.account.name : "相手"}: ${cleanBody(m.body)}`).join("\n\n");
            window.messageStore[key] = { body: recent, sender: "", roomId: rid, roomName };

            return `
                <div class="bg-white border-2 border-emerald-300 rounded-2xl shadow-sm p-4 space-y-2">
                    <div class="font-bold text-base text-emerald-800">✏️ 新しく発信する</div>
                    <textarea id="custom_prompt_${key}" rows="2" placeholder="伝えたい内容をざっくり（例：明日の出荷は14時締め切り）" class="inp bg-slate-50"></textarea>
                    <button onclick="generateComposeAi('${key}', this)" class="btn btn-ai w-full">✨ AIで文章を作成</button>
                    <textarea id="reply_text_${key}" rows="6" placeholder="送信するメッセージ（直接入力もOK）" class="inp"></textarea>
                    <div class="flex gap-2">
                        <select id="member_select_${key}" onchange="insertMentionForMsg('${key}')" class="inp flex-1 min-w-0">${memberOptionsHtml(members)}</select>
                        <button onclick="sendComposeMessage('${key}', this)" class="btn btn-ok shrink-0 px-5">📤 送信</button>
                    </div>
                </div>`;
        }

        window.generateComposeAi = async function(key, btnEl) {
            const m = window.messageStore[key] || {};
            const textarea = document.getElementById(`reply_text_${key}`);
            const intent = document.getElementById(`custom_prompt_${key}`).value.trim();
            if (!intent) { showToast("伝えたい内容を入力してください"); return; }
            const toLines = (textarea.value.match(/^\[To:\d+\][^\n]*\n/gm) || []).join("");

            btnEl.disabled = true;
            btnEl.textContent = "AI作成中…";
            try {
                const data = await callApi("generate_ai_reply", {
                    mode: "compose", room_id: m.roomId, room_name: m.roomName || "ルーム",
                    context: m.body || "", custom_prompt: intent
                });
                const text = data.ai_reply || "";
                if (!text) { showToast("AIの結果が空でした"); return; }
                textarea.value = toLines + text;
                fsAdd("ai_reply_logs", {
                    roomId: String(m.roomId), roomName: m.roomName || "", context: m.body || "",
                    aiGeneratedText: text, customPrompt: intent, type: 'compose', status: 'generated',
                    createdAt: FS_TS
                }).catch(err => console.error("AIログ保存失敗:", err));
            } catch (e) {
                alert("AI作成エラー: " + e.message);
            } finally {
                btnEl.disabled = false;
                btnEl.textContent = "✨ AIで文章を作成";
            }
        };

        window.sendComposeMessage = async function(key, btn) {
            const m = window.messageStore[key] || {};
            const finalMsg = document.getElementById(`reply_text_${key}`).value.trim();
            if (!finalMsg) { showToast("メッセージを入力してください"); return; }
            if (!confirm(`「${m.roomName}」に送信しますか？`)) return;
            btn.disabled = true;
            btn.textContent = "送信中…";
            try {
                await callApi("send_message", { room_id: m.roomId, body: finalMsg });
                saveAutoFeedback(m.roomId, finalMsg);
                showToast("送信しました");
                loadSingleRoomMessages();
            } catch (e) {
                alert("送信失敗: " + e.message);
                btn.disabled = false;
                btn.textContent = "📤 送信";
            }
        };

        // ===== 未読タブ =====
        function unreadOf(data) {
            return (data.rooms || []).filter(r => getUnread(r) > 0)
                .sort((a, b) => (b.last_update_time || 0) - (a.last_update_time || 0));
        }
        function setUnreadStatus(n) {
            if (n === 0) setStatus('未読ゼロ', 'bg-emerald-500');
            else setStatus(`未読 ${n}`, 'bg-amber-500');
        }
        function renderUnreadBundle(data) {
            const container = document.getElementById('burstModeContainer');
            allRoomsCache = data.rooms || [];
            unreadRoomsCache = unreadOf(data);
            setUnreadStatus(unreadRoomsCache.length);
            if (unreadRoomsCache.length === 0) {
                container.innerHTML = emptyBox('🎉 未読はありません');
                return;
            }
            const latest = data.latest || {};
            container.innerHTML = unreadRoomsCache.map(r =>
                burstCardHtml(r.room_id, r.name, `未読 ${getUnread(r)}`, "bg-red-500 text-white", latest[String(r.room_id)] || { error: '取得できませんでした' })
            ).join('');
            updateSelectionBar();
        }
        // 表示内容が変わったかどうかの判定用
        function bundleSignature(data) {
            const latest = data.latest || {};
            return unreadOf(data).map(r => {
                const ms = (latest[String(r.room_id)] || {}).messages || [];
                return `${r.room_id}:${getUnread(r)}:${ms.length ? ms[ms.length - 1].message_id : ''}`;
            }).join('|');
        }
        // 返信を書いている途中などは、勝手に画面を書き換えない
        function isUserBusy(container) {
            const panelOpen = Array.from(container.querySelectorAll('[id^="reply_panel_"]')).some(p => p.style.display !== 'none');
            const typed = Array.from(container.querySelectorAll('textarea, input[type="text"]')).some(t => t.value.trim());
            return panelOpen || typed || !!container.querySelector('.room-checkbox:checked');
        }
        function readBundleCache(acc) {
            try { return JSON.parse(localStorage.getItem(BUNDLE_CACHE_KEY + acc)); } catch (e) { return null; }
        }
        function markReadInCache(ids) {
            const key = BUNDLE_CACHE_KEY + getAccount();
            const c = readBundleCache(getAccount());
            if (!c || !c.data) return;
            const set = new Set(ids.map(String));
            (c.data.rooms || []).forEach(r => { if (set.has(String(r.room_id))) r.unread_num = 0; });
            try { localStorage.setItem(key, JSON.stringify(c)); } catch (e) {}
        }

        let bundleSeq = 0;
        async function fetchAllUnreadRooms(force) {
            const container = document.getElementById('burstModeContainer');
            const acc = getAccount();
            const seq = ++bundleSeq;

            // ① 前回の結果があれば、まずそれを一瞬で表示
            let shownSig = null;
            const cached = readBundleCache(acc);
            if (cached && cached.data) {
                renderUnreadBundle(cached.data);
                shownSig = bundleSignature(cached.data);
                setStatus('更新中…');
            } else {
                container.innerHTML = emptyBox('未読ルームを確認中…');
                setStatus('確認中…');
            }

            // ② 裏で最新を1回の通信でまとめて取得
            try {
                const data = await callApi("get_unread_bundle");
                try { localStorage.setItem(BUNDLE_CACHE_KEY + acc, JSON.stringify({ t: Date.now(), data: data })); } catch (e) {}
                if (seq !== bundleSeq || acc !== getAccount() || currentMode !== 'burst') return;

                allRoomsCache = data.rooms || [];
                updateLaterBadge();
                const sig = bundleSignature(data);
                if (shownSig !== null && sig === shownSig) {          // 変化なし
                    setUnreadStatus(unreadOf(data).length);
                    return;
                }
                if (shownSig !== null && !force && isUserBusy(container)) {   // 作業中は書き換えない
                    setUnreadStatus(unreadOf(data).length);
                    showToast('新着があります。🔄で更新できます');
                    return;
                }
                renderUnreadBundle(data);
            } catch (e) {
                if (seq !== bundleSeq) return;
                if (shownSig === null) {
                    container.innerHTML = `<div class="text-sm text-red-500 text-center p-4 bg-white rounded-2xl shadow-sm">エラー: ${esc(e.message)}</div>`;
                } else {
                    showToast('最新の取得に失敗しました（前回の内容を表示中）');
                }
                setStatus('エラー', 'bg-red-500');
            }
        }

        // ===== 返信 =====
        window.generateAiReplyForMessage = async function(msgKey, btnEl) {
            const m = window.messageStore[msgKey] || {};
            const textarea = document.getElementById(`reply_text_${msgKey}`);
            const promptInput = document.getElementById(`custom_prompt_${msgKey}`);
            const customPrompt = promptInput ? promptInput.value.trim() : "";
            const toLines = (textarea.value.match(/^\[To:\d+\][^\n]*\n/gm) || []).join("");

            btnEl.disabled = true;
            btnEl.textContent = "AI作成中…";
            try {
                const data = await callApi("generate_ai_reply", {
                    room_id: m.roomId, room_name: m.roomName || "ルーム",
                    context: m.body || "", custom_prompt: customPrompt
                });
                const aiReply = data.ai_reply || "";
                if (!aiReply) { showToast("AIの結果が空でした"); return; }
                textarea.value = toLines + aiReply;
                fsAdd("ai_reply_logs", {
                    roomId: String(m.roomId), roomName: m.roomName || "", context: m.body || "",
                    aiGeneratedText: aiReply, customPrompt: customPrompt, status: 'generated',
                    createdAt: FS_TS
                }).catch(err => console.error("AIログ保存失敗:", err));
            } catch (e) {
                alert("AI作成エラー: " + e.message);
            } finally {
                btnEl.disabled = false;
                btnEl.textContent = "✨ AIで返信を作成";
            }
        };

        async function saveAutoFeedback(roomId, text) {
            if (!text || !text.trim()) return;
            try {
                await fsAdd("ai_brushup_feedback", {
                    roomId: String(roomId), userEditedText: text.trim(), updatedAt: FS_TS
                });
            } catch (e) { console.error("自動添削保存失敗:", e); }
        }

        // To はプルダウンで選んだ瞬間に挿入
        window.insertMentionForMsg = function(msgKey) {
            const selectEl = document.getElementById(`member_select_${msgKey}`);
            const textarea = document.getElementById(`reply_text_${msgKey}`);
            if (!selectEl || !textarea || !selectEl.value) return;
            const memberName = selectEl.options[selectEl.selectedIndex].text;
            textarea.value = `[To:${selectEl.value}] ${memberName}さん\n` + textarea.value;
            selectEl.value = '';
            showToast(`${memberName}さんを宛先に追加しました`);
        };

        window.markAsRead = async function(roomId, lastChatId, btn) {
            btn.disabled = true;
            btn.textContent = "処理中…";
            try {
                await callApi("mark_read", { room_id: roomId, last_chat_id: lastChatId });
                showToast("既読にしました");
                if (currentMode !== 'burst') {
                    btn.disabled = false;
                    btn.textContent = "✓ 既読";
                } else {
                    // カードだけ消して、画面全体の再読込を避ける
                    const card = btn.closest('.burst-card');
                    if (card) card.remove();
                    markReadInCache([roomId]);
                    const left = document.querySelectorAll('#burstModeContainer .burst-card').length;
                    setUnreadStatus(left);
                    if (left === 0) document.getElementById('burstModeContainer').innerHTML = emptyBox('🎉 未読はありません');
                    updateSelectionBar();
                }
            } catch (e) {
                alert("既読エラー: " + e.message);
                btn.disabled = false;
                btn.textContent = "✓ 既読";
            }
        };

        window.sendReplyForMessage = async function(msgKey, btn) {
            const m = window.messageStore[msgKey] || {};
            const textarea = document.getElementById(`reply_text_${msgKey}`);
            const finalMsg = textarea.value.trim();
            if (!finalMsg) { showToast("返信文を入力してください"); return; }
            btn.disabled = true;
            btn.textContent = "送信中…";
            try {
                await callApi("send_message", { room_id: m.roomId, body: finalMsg });
                saveAutoFeedback(m.roomId, finalMsg);
                textarea.value = '';
                showToast("送信しました");
                if (currentMode === 'normal') loadSingleRoomMessages();
            } catch (e) {
                alert("送信失敗: " + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "📤 送信";
            }
        };
    </script>
</body>
</html>
