<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatwork 未読対応アシスタント（新着順対応版）</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">
    <!-- ヘッダー -->
    <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto">
            <h1 class="text-base font-bold flex items-center justify-between">
                <span>💬 Chatwork 爆速返信アシスタント</span>
                <span id="loadStatus" class="text-xs bg-indigo-500 px-2 py-0.5 rounded-full text-indigo-100">読込中...</span>
            </h1>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="max-w-md mx-auto p-3 space-y-3">
        <!-- アカウント選択 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-1.5">
            <label class="block text-xs font-bold text-slate-600">👤 アカウント</label>
            <select id="accountSelect" onchange="changeAccount()" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-indigo-50/50 font-bold text-indigo-950 focus:outline-none">
                <option value="57d74ea2e63325c5306b594c3bb231af">松下アカウント</option>
                <option value="5435a05ddd195c46ca688d021e45bbce">ラクロジスタッフアカウント</option>
            </select>
        </div>

        <!-- ルーム選択 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
            <div class="flex justify-between items-center">
                <label class="block text-xs font-bold text-slate-600">📁 セラー（ルーム）選択</label>
                <label class="flex items-center gap-1.5 cursor-pointer text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-200">
                    <input type="checkbox" id="unreadOnlyToggle" onchange="filterRooms()" class="rounded text-indigo-600">
                    🔴 未読のみ
                </label>
            </div>
            <input type="text" id="roomSearchInput" oninput="filterRooms()" placeholder="🔍 ルーム名検索..." class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50 focus:outline-none">
            <div class="space-y-2">
                <select id="roomSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white shadow-inner focus:outline-none">
                    <option value="">読込中...</option>
                </select>
                <div class="flex gap-2">
                    <button onclick="loadRoomMessages()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-2.5 rounded-lg shadow active:scale-95 transition">
                        メッセージを見る
                    </button>
                    <button onclick="togglePinCurrentRoom()" id="pinBtn" class="bg-amber-100 text-amber-800 text-xs px-3 py-2.5 rounded-lg font-bold border border-amber-300 shrink-0">
                        ⭐ ピン留め
                    </button>
                </div>
            </div>
        </div>

        <!-- 新規発信 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <label class="block text-xs font-bold text-slate-600">✍️ 選択中のルームへ新規発信</label>
            <div class="flex gap-2 mb-1">
                <select id="directTemplateSelect" onchange="insertTemplate(this, 'newDirectMessage')" class="flex-1 text-xs border border-indigo-300 rounded p-1.5 bg-white text-indigo-950 font-bold focus:outline-none shadow-sm template-dropdown">
                    <option value="">📥 定型文を呼び出す</option>
                </select>
                <button onclick="openTemplateEditorForSave('newDirectMessage')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 text-xs px-2 py-1.5 rounded font-bold border border-indigo-300 shrink-0 shadow-sm active:scale-95 transition">
                    💾 登録
                </button>
            </div>
            <textarea id="newDirectMessage" placeholder="ここに送信するメッセージを入力..." class="w-full h-20 text-sm p-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:outline-none"></textarea>
            <button onclick="sendDirectMessage(this)" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs py-2.5 rounded-lg font-bold shadow-sm active:scale-95 transition">
                📤 直接メッセージを送信する
            </button>
        </div>

        <!-- メッセージ表示エリア -->
        <div id="messageLoading" class="text-center text-xs text-slate-500 py-6" style="display:none;">
            <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-600 border-t-transparent mb-1"></div>
            <div>取得中...</div>
        </div>
        <div id="messageListContainer" class="space-y-3"></div>
    </div>

    <!-- ================= モーダル（ポップアップUI） ================= -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-40 hidden" onclick="closeAllModals()"></div>

    <!-- 定型文「管理」モーダル -->
    <div id="modalTemplateManager" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-md bg-white rounded-xl shadow-2xl z-50 hidden flex-col max-h-[85vh]">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-xl">
            <h2 class="font-bold text-slate-800">⚙️ 定型文の管理</h2>
            <button onclick="closeAllModals()" class="text-slate-500 hover:text-slate-800 font-bold text-xl px-2">&times;</button>
        </div>
        <div id="templateManagerList" class="p-4 overflow-y-auto space-y-4"></div>
    </div>

    <!-- 定型文「編集・保存」モーダル -->
    <div id="modalTemplateEditor" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-md bg-white rounded-xl shadow-2xl z-50 hidden flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-indigo-50 rounded-t-xl">
            <h2 class="font-bold text-indigo-900" id="editorModalTitle">💾 定型文を保存・編集</h2>
            <button onclick="closeAllModals()" class="text-slate-500 hover:text-slate-800 font-bold text-xl px-2">&times;</button>
        </div>
        <div class="p-4 space-y-3">
            <input type="hidden" id="editTmplId">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">📂 カテゴリ</label>
                <input type="text" id="editTmplCategory" list="categoryList" placeholder="カテゴリを入力、または選択" class="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <datalist id="categoryList"></datalist>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">🏷️ 定型文のタイトル</label>
                <input type="text" id="editTmplTitle" placeholder="例：〇〇商品の在庫切れ報告" class="w-full border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">📝 本文</label>
                <textarea id="editTmplText" class="w-full h-32 border border-slate-300 rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>
            <button onclick="saveTemplateSubmit()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow mt-2">
                保存する
            </button>
        </div>
    </div>
    <!-- ========================================================= -->

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzbGircW91tKx9NIihoWRMCiyIYnVbJJoeJZ9IoUf5s6vI71zNVnqJOo38vSOqfeMYzzA/exec";
        
        let allRoomsCache = [];
        let currentRoomMembers = [];
        const FAVORITE_KEY = "chatwork_favorite_rooms_v3";
        const TEMPLATE_KEY = "chatwork_custom_templates_v2";

        window.addEventListener('DOMContentLoaded', () => {
            fetchRooms();
            renderTemplateSelects();
        });

        function getTemplates() {
            try { return JSON.parse(localStorage.getItem(TEMPLATE_KEY)) || []; } catch(e) { return []; }
        }

        function insertTemplate(selectEl, textareaId) {
            const templateId = selectEl.value;
            if (!templateId) return;

            if (templateId === "manage") {
                openTemplateManager();
                selectEl.selectedIndex = 0;
                return;
            }

            const templates = getTemplates();
            const tmpl = templates.find(t => t.id === templateId);
            if (tmpl) {
                const textarea = document.getElementById(textareaId);
                textarea.value += (textarea.value ? '\n' : '') + tmpl.text;
            }
            selectEl.selectedIndex = 0;
        }

        function renderTemplateSelects() {
            const templates = getTemplates();
            const grouped = templates.reduce((acc, t) => {
                const cat = t.category || '未分類';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(t);
                return acc;
            }, {});

            let optionsHtml = '<option value="">📥 登録済み定型文を呼び出す</option>';
            for (const [cat, tmpls] of Object.entries(grouped)) {
                optionsHtml += `<optgroup label="📂 ${escapeHtml(cat)}">`;
                tmpls.forEach(t => {
                    optionsHtml += `<option value="${t.id}">📄 ${escapeHtml(t.title)}</option>`;
                });
                optionsHtml += `</optgroup>`;
            }

            if (templates.length > 0) {
                optionsHtml += `<option disabled>──────────</option>`;
                optionsHtml += `<option value="manage">⚙️ 定型文の管理 (編集・削除)</option>`;
            }

            document.querySelectorAll('.template-dropdown').forEach(sel => {
                sel.innerHTML = optionsHtml;
            });
        }

        function closeAllModals() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('modalTemplateManager').style.display = 'none';
            document.getElementById('modalTemplateEditor').style.display = 'none';
        }

        function updateCategoryDatalist() {
            const templates = getTemplates();
            const categories = [...new Set(templates.map(t => t.category || '未分類'))];
            document.getElementById('categoryList').innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">`).join('');
        }

        function openTemplateEditorForSave(textareaId) {
            const text = document.getElementById(textareaId).value.trim();
            if (!text) { alert('保存する文章が入力されていません。'); return; }
            
            document.getElementById('editorModalTitle').textContent = '💾 新しい定型文を登録';
            document.getElementById('editTmplId').value = '';
            document.getElementById('editTmplCategory').value = '未分類';
            document.getElementById('editTmplTitle').value = '';
            document.getElementById('editTmplText').value = text;
            
            updateCategoryDatalist();
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalTemplateEditor').style.display = 'flex';
        }

        function openTemplateEditorForEdit(id) {
            const tmpl = getTemplates().find(t => t.id === id);
            if (!tmpl) return;

            document.getElementById('editorModalTitle').textContent = '✏️ 定型文を編集';
            document.getElementById('editTmplId').value = tmpl.id;
            document.getElementById('editTmplCategory').value = tmpl.category || '未分類';
            document.getElementById('editTmplTitle').value = tmpl.title;
            document.getElementById('editTmplText').value = tmpl.text;
            
            updateCategoryDatalist();
            document.getElementById('modalTemplateManager').style.display = 'none';
            document.getElementById('modalTemplateEditor').style.display = 'flex';
        }

        function saveTemplateSubmit() {
            const id = document.getElementById('editTmplId').value;
            const category = document.getElementById('editTmplCategory').value.trim() || '未分類';
            const title = document.getElementById('editTmplTitle').value.trim();
            const text = document.getElementById('editTmplText').value.trim();

            if (!title || !text) { alert('タイトルと本文は両方入力してください。'); return; }

            let templates = getTemplates();
            if (id) {
                const idx = templates.findIndex(t => t.id === id);
                if (idx > -1) templates[idx] = { id, category, title, text };
            } else {
                templates.push({ id: Date.now().toString(), category, title, text });
            }

            localStorage.setItem(TEMPLATE_KEY, JSON.stringify(templates));
            renderTemplateSelects();
            
            if (id) {
                document.getElementById('modalTemplateEditor').style.display = 'none';
                openTemplateManager(); 
            } else {
                closeAllModals();
                alert('保存しました！');
            }
        }

        function openTemplateManager() {
            const templates = getTemplates();
            const container = document.getElementById('templateManagerList');
            container.innerHTML = '';

            if (templates.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">保存された定型文はありません。</p>';
            } else {
                const grouped = templates.reduce((acc, t) => {
                    const cat = t.category || '未分類';
                    if (!acc[cat]) acc[cat] = [];
                    acc[cat].push(t);
                    return acc;
                }, {});

                for (const [cat, tmpls] of Object.entries(grouped)) {
                    let html = `<div class="mb-4"><h3 class="text-xs font-bold text-slate-500 border-b border-slate-200 pb-1 mb-2">📂 ${escapeHtml(cat)}</h3><div class="space-y-2">`;
                    tmpls.forEach(t => {
                        html += `
                            <div class="bg-white border border-slate-200 rounded p-2.5 flex justify-between items-center shadow-sm">
                                <div class="truncate pr-2 font-bold text-sm text-slate-700">${escapeHtml(t.title)}</div>
                                <div class="flex gap-1 shrink-0">
                                    <button onclick="openTemplateEditorForEdit('${t.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2 py-1.5 rounded border border-slate-300">✏️ 編集</button>
                                    <button onclick="deleteTemplate('${t.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs px-2 py-1.5 rounded border border-red-200">🗑️ 削除</button>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                    container.innerHTML += html;
                }
            }

            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalTemplateManager').style.display = 'flex';
        }

        function deleteTemplate(id) {
            let templates = getTemplates();
            const tmpl = templates.find(t => t.id === id);
            if (!tmpl) return;

            if (confirm(`定型文「${tmpl.title}」を削除しますか？`)) {
                templates = templates.filter(t => t.id !== id);
                localStorage.setItem(TEMPLATE_KEY, JSON.stringify(templates));
                renderTemplateSelects();
                openTemplateManager();
            }
        }

        function getCurrentToken() { return document.getElementById('accountSelect').value; }
        function changeAccount() { document.getElementById('messageListContainer').innerHTML = ''; fetchRooms(); }
        function getFavorites() { return JSON.parse(localStorage.getItem(FAVORITE_KEY)) || []; }

        function togglePinCurrentRoom() {
            const selectEl = document.getElementById('roomSelect');
            const roomId = selectEl.value;
            if (!roomId) { alert('セラーを選択してください。'); return; }

            let favorites = getFavorites();
            const index = favorites.indexOf(roomId);
            if (index > -1) { favorites.splice(index, 1); } else { favorites.push(roomId); }
            
            localStorage.setItem(FAVORITE_KEY, JSON.stringify(favorites));
            filterRooms();
            selectEl.value = roomId;
            updatePinButtonState();
        }

        function updatePinButtonState() {
            const selectEl = document.getElementById('roomSelect');
            const pinBtn = document.getElementById('pinBtn');
            const roomId = selectEl.value;
            if (getFavorites().includes(roomId)) {
                pinBtn.className = "bg-amber-500 text-white text-xs px-3 py-2.5 rounded-lg font-bold shadow-sm shrink-0";
                pinBtn.textContent = "⭐ 登録中";
            } else {
                pinBtn.className = "bg-amber-100 text-amber-800 text-xs px-3 py-2.5 rounded-lg font-bold border border-amber-300 shrink-0";
                pinBtn.textContent = "⭐ ピン留め";
            }
        }

        async function fetchRooms() {
            const statusEl = document.getElementById('loadStatus');
            statusEl.textContent = "読込中...";
            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "get_rooms", token: getCurrentToken() })
                });
                const data = await response.json();
                if (data.status !== "success") throw new Error(data.message);

                allRoomsCache = data.rooms;
                filterRooms();
                statusEl.textContent = "準備完了";
                statusEl.className = "text-xs bg-emerald-500 px-2 py-0.5 rounded-full text-white";
            } catch (e) {
                statusEl.textContent = "エラー";
                statusEl.className = "text-xs bg-red-500 px-2 py-0.5 rounded-full text-white";
            }
        }

        function filterRooms() {
            const keyword = document.getElementById('roomSearchInput').value.toLowerCase();
            const unreadOnly = document.getElementById('unreadOnlyToggle').checked;
            const filtered = allRoomsCache.filter(r => r.name.toLowerCase().includes(keyword) && (unreadOnly ? r.unread_num > 0 : true));
            renderRoomOptions(filtered);
        }

        function renderRoomOptions(rooms) {
            const selectEl = document.getElementById('roomSelect');
            const favorites = getFavorites();
            let favList = [], normalList = [];
            
            rooms.forEach(r => favorites.includes(String(r.room_id)) ? favList.push(r) : normalList.push(r));
            let html = '<option value="">-- セラーを選択 --</option>';

            if (favList.length > 0) {
                html += '<optgroup label="⭐ お気に入り">';
                favList.forEach(r => html += `<option value="${r.room_id}">⭐ ${escapeHtml(r.name)}${r.unread_num > 0 ? ` (🔴未読 ${r.unread_num})` : ''}</option>`);
                html += '</optgroup>';
            }
            if (normalList.length > 0) {
                html += '<optgroup label="📁 その他">';
                normalList.forEach(r => html += `<option value="${r.room_id}">${escapeHtml(r.name)}${r.unread_num > 0 ? ` (🔴未読 ${r.unread_num})` : ''}</option>`);
                html += '</optgroup>';
            }
            selectEl.innerHTML = html;
            selectEl.onchange = updatePinButtonState;
        }

        async function loadRoomMessages() {
            const roomId = document.getElementById('roomSelect').value;
            if (!roomId) { alert('セラーを選択してください。'); return; }

            const container = document.getElementById('messageListContainer');
            document.getElementById('messageLoading').style.display = 'block';
            container.innerHTML = '';

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "get_room_data", token: getCurrentToken(), room_id: roomId })
                });
                const data = await response.json();
                if (data.status !== "success") throw new Error(data.message);

                currentRoomMembers = data.members || [];
                let messages = data.messages || [];

                if (messages.length === 0) {
                    container.innerHTML = '<div class="text-xs text-slate-500 p-4 bg-white rounded-xl text-center">メッセージが見つかりませんでした。</div>';
                    return;
                }

                // 🔄 【変更点】取得したメッセージを「新しい順（タイムスタンプの降順）」に並び替え
                messages.sort((a, b) => b.send_time - a.send_time);

                let html = '';
                messages.forEach(msg => {
                    const senderName = msg.account && msg.account.name ? msg.account.name : '不明';
                    const senderId = msg.account && msg.account.account_id ? msg.account.account_id : '';
                    let sendDateStr = msg.send_time ? new Date(msg.send_time * 1000).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
                    const uniqueId = `reply_txt_${msg.message_id}`;

                    html += `
                        <div class="message-card bg-white border border-slate-200 p-3.5 rounded-xl shadow-sm space-y-2">
                            <div class="text-xs text-indigo-600 font-bold flex justify-between">
                                <span>👤 ${escapeHtml(senderName)}</span>
                                <span class="text-slate-400 font-normal">📅 ${sendDateStr}</span>
                            </div>
                            <div class="text-sm whitespace-pre-wrap text-slate-700 bg-slate-50 p-2.5 rounded-lg border border-slate-100">${escapeHtml(msg.body)}</div>
                            
                            <button onclick="showReplyEditor(this)" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs py-2 rounded-lg font-bold border border-slate-300 active:scale-95 transition">
                                ↩️ このメッセージに返信する
                            </button>
                            
                            <div class="reply-editor-area mt-2 space-y-2" style="display:none;" data-sender-id="${senderId}" data-sender-name="${escapeHtml(senderName)}">
                                <div class="flex gap-2 mb-1">
                                    <select onchange="insertMention(this, '${uniqueId}')" class="flex-1 text-xs border border-slate-300 rounded p-1.5 bg-white font-bold focus:outline-none shadow-sm">
                                        <option value="">👤 宛先(To)を追加</option>
                                    </select>
                                </div>
                                <div class="flex gap-2 mb-1">
                                    <select onchange="insertTemplate(this, '${uniqueId}')" class="flex-1 template-dropdown text-xs border border-indigo-300 rounded p-1.5 bg-white text-indigo-950 font-bold focus:outline-none shadow-sm">
                                        <option value="">📥 定型文を呼び出す</option>
                                    </select>
                                    <button onclick="openTemplateEditorForSave('${uniqueId}')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 text-xs px-2 py-1.5 rounded font-bold border border-indigo-300 shrink-0 shadow-sm active:scale-95 transition">
                                        💾 登録
                                    </button>
                                </div>
                                <textarea id="${uniqueId}" class="w-full h-28 text-sm p-2.5 border border-slate-300 rounded-lg bg-white focus:outline-none"></textarea>
                                <button onclick="sendReplyToChatwork('${uniqueId}', this)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2.5 rounded-lg font-bold shadow-sm active:scale-95 transition">
                                    📤 Chatworkに送信
                                </button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                renderTemplateSelects();
            } catch (e) {
                alert('取得エラー: ' + e.message);
            } finally {
                document.getElementById('messageLoading').style.display = 'none';
            }
        }

        function showReplyEditor(btnEl) {
            const card = btnEl.closest('.message-card');
            const editorArea = card.querySelector('.reply-editor-area');
            const mentionSelect = editorArea.querySelector('select');
            
            editorArea.style.display = 'block';
            btnEl.style.display = 'none';

            if (mentionSelect.options.length <= 1) {
                const senderId = editorArea.getAttribute('data-sender-id');
                const senderName = editorArea.getAttribute('data-sender-name');
                let opts = '<option value="">👤 宛先(To)を追加</option>';
                let addedIds = new Set();
                
                if (senderId) {
                    opts += `<option value="${senderId}" data-name="${senderName}">発言者: ${senderName}</option>`;
                    addedIds.add(String(senderId));
                }
                currentRoomMembers.forEach(m => {
                    const mId = String(m.account_id);
                    if (!addedIds.has(mId)) {
                        opts += `<option value="${mId}" data-name="${escapeHtml(m.name)}">${escapeHtml(m.name)}</option>`;
                        addedIds.add(mId);
                    }
                });
                mentionSelect.innerHTML = opts;
            }
        }

        function insertMention(selectEl, textareaId) {
            const accountId = selectEl.value;
            if (!accountId) return;
            const name = selectEl.options[selectEl.selectedIndex].getAttribute('data-name');
            const textarea = document.getElementById(textareaId);
            textarea.value = `[to:${accountId}] ${name}さん\n` + textarea.value;
            selectEl.selectedIndex = 0;
        }

        async function sendReplyToChatwork(textareaId, btnEl) {
            const roomId = document.getElementById('roomSelect').value;
            const bodyText = document.getElementById(textareaId).value.trim();

            if (!bodyText) { alert('メッセージが空です。'); return; }
            if (!confirm('Chatworkに送信しますか？')) return;

            btnEl.disabled = true;
            btnEl.textContent = "送信中...";

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "send_message", token: getCurrentToken(), room_id: roomId, body: bodyText })
                });
                const data = await response.json();
                if (data.status !== "success") throw new Error(data.message);

                btnEl.textContent = "✅ 送信完了！";
                btnEl.className = "w-full bg-slate-300 text-white text-xs py-2.5 rounded-lg cursor-default";
            } catch (e) {
                alert('送信失敗: ' + e.message);
                btnEl.disabled = false;
                btnEl.textContent = "📤 Chatworkに送信";
            }
        }

        async function sendDirectMessage(btnEl) {
            const roomId = document.getElementById('roomSelect').value;
            const textarea = document.getElementById('newDirectMessage');
            if (!roomId || !textarea.value.trim()) { alert('ルームを選択し、メッセージを入力してください。'); return; }
            
            btnEl.disabled = true;
            btnEl.textContent = "送信中...";
            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "send_message", token: getCurrentToken(), room_id: roomId, body: textarea.value.trim() })
                });
                if ((await response.json()).status !== "success") throw new Error("エラー");
                alert('送信しました！');
                textarea.value = '';
            } catch (e) { alert('送信失敗'); }
            btnEl.disabled = false;
            btnEl.textContent = "📤 直接メッセージを送信する";
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&'`<>"]/g, m => ({'&':'&amp;',"'":'&#x27;','`':'&#x60;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
        }
    </script>
</body>
</html>
