<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>未読バーストコックピット</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .btn { height: 44px; border-radius: 12px; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 12px; cursor: pointer; transition: transform .1s; white-space: nowrap; }
        .btn:active { transform: scale(.97); }
        .btn:disabled { opacity: .5; }
        .btn-sub  { background: #f1f5f9; color: #334155; }
        .btn-main { background: #4f46e5; color: #fff; }
        .btn-ok   { background: #059669; color: #fff; }
        .btn-ai   { background: linear-gradient(90deg, #7c3aed, #4f46e5); color: #fff; }
        .inp { width: 100%; border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px 12px; font-size: 16px; background: #fff; }
        .inp:focus { outline: 2px solid #818cf8; outline-offset: 0; border-color: transparent; }
        .clamp { display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
        .clamp-s { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .msg-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.7; }
        .tab-btn { height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: #94a3b8; cursor: pointer; }
        .tab-btn .ico { font-size: 22px; line-height: 1; filter: grayscale(1); opacity: .6; }
        .tab-btn.active { color: #4f46e5; }
        .tab-btn.active .ico { filter: none; opacity: 1; }
        .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 28rem; margin: 0 auto; background: #fff; border-radius: 20px 20px 0 0; max-height: 88vh; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); display: none; box-shadow: 0 -8px 30px rgba(0,0,0,.15); }
        .sheet-head { position: sticky; top: 0; background: #fff; padding: 10px 20px 12px; border-bottom: 1px solid #f1f5f9; z-index: 1; }
        .sheet-head::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 9px; background: #cbd5e1; margin: 0 auto 10px; }
        .sheet-row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 20px; font-size: 16px; font-weight: 600; text-align: left; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .sheet-row:active { background: #f8fafc; }
        .field-label { font-size: 12px; color: #64748b; font-weight: 700; display: block; margin-bottom: 2px; }
        .mine { background: #eef2ff; border-radius: 12px; padding: 8px 10px; margin: 0 -4px; }
        .room-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px 16px; text-align: left; cursor: pointer; }
        .room-row:active { background: #f8fafc; }
        #toast { transition: opacity .2s; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-30 bg-indigo-600 text-white shadow" style="padding-top: env(safe-area-inset-top, 0px);">
        <div class="max-w-md mx-auto px-3 py-2.5 flex items-center gap-2">
            <select id="accountSelect" onchange="onAccountChange()" class="flex-1 min-w-0 bg-indigo-500 text-white font-bold rounded-xl px-3 h-11 text-[16px] border-0">
                <option value="staff" selected>ラクロジスタッフ</option>
                <option value="matsushita">松下</option>
            </select>
            <span id="loadStatus" class="shrink-0 text-xs font-bold bg-indigo-500 px-2.5 py-1 rounded-full">読込中</span>
            <button onclick="refreshCurrentView(true)" class="shrink-0 w-11 h-11 rounded-xl bg-indigo-700 text-lg cursor-pointer" aria-label="更新">🔄</button>
        </div>
    </header>

    <div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[60] bg-slate-900 text-white text-sm font-bold px-4 py-2.5 rounded-full shadow-lg pointer-events-none opacity-0 text-center" style="top: calc(70px + env(safe-area-inset-top, 0px)); max-width: 90vw;"></div>

    <main class="max-w-md mx-auto px-3 pt-3" style="padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px));">

        <!-- 一覧用ツールバー（未読・後で） -->
        <div id="listToolbar" class="flex items-center justify-between mb-2 px-1 gap-2">
            <label class="flex items-center gap-2 text-sm font-bold text-slate-600 py-2 cursor-pointer shrink-0">
                <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)" class="w-5 h-5 accent-indigo-600"> すべて
            </label>
            <span id="lastUpdated" class="text-xs text-slate-400 truncate"></span>
            <button onclick="copyAllUnreadChats()" class="text-sm font-bold text-indigo-700 py-2 px-1 cursor-pointer shrink-0">📋 全部コピー</button>
        </div>

        <div id="burstModeContainer" class="space-y-3"></div>
        <div id="laterModeContainer" class="space-y-3" style="display:none;"></div>

        <div id="normalModeContainer" style="display:none;">
            <!-- ルーム一覧 -->
            <div id="roomListView">
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <button id="chipAll" onclick="setRoomFilter('all')" class="btn btn-main">すべてのルーム</button>
                    <button id="chipOption" onclick="setRoomFilter('option')" class="btn btn-sub">🎥 撮影オプション</button>
                </div>
                <input type="search" id="roomSearchInput" oninput="renderRoomList()" placeholder="🔍 ルーム名で検索" class="inp mb-3">
                <div id="optionHeader" class="mb-3" style="display:none;"></div>
                <div id="roomList" class="bg-white rounded-2xl shadow-sm divide-y divide-slate-100 overflow-hidden"></div>
            </div>
            <!-- ルームの中身 -->
            <div id="roomDetailView" style="display:none;">
                <button onclick="backToRoomList()" class="text-indigo-700 font-bold text-base py-2 px-1 mb-1 cursor-pointer">← ルーム一覧</button>
                <div id="singleRoomMessageContainer" class="space-y-3"></div>
            </div>
        </div>
        <div id="searchModeContainer" style="display:none;">
            <div class="bg-white rounded-2xl shadow-sm p-4 space-y-3">
                <div class="font-bold text-base">🔍 直近の問い合わせを探す</div>
                <input type="search" id="searchKeyword" placeholder="キーワード（例：返品　解約）" class="inp" onkeydown="if(event.key==='Enter'){this.blur();runSearch();}">
                <div class="text-xs text-slate-500 -mt-1">スペースで区切ると「どれかを含む」で探します</div>
                <div class="flex gap-2">
                    <select id="searchDays" class="inp flex-1">
                        <option value="1">今日・昨日</option>
                        <option value="3">直近3日</option>
                        <option value="7" selected>直近1週間</option>
                        <option value="14">直近2週間</option>
                        <option value="30">直近1か月</option>
                    </select>
                    <button id="searchBtn" onclick="runSearch()" class="btn btn-main shrink-0 px-6">検索</button>
                </div>
                <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                    <input type="checkbox" id="searchIncludeMine" class="w-5 h-5 accent-indigo-600"> 自社の発言も含める
                </label>
            </div>
            <div id="searchResults" class="space-y-3 mt-3"></div>
        </div>
    </main>

    <!-- 選択中バー -->
    <div id="selectionBar" class="fixed inset-x-0 z-30" style="display:none; bottom: calc(60px + env(safe-area-inset-bottom, 0px));">
        <div class="max-w-md mx-auto px-3 pb-2">
            <div class="bg-slate-900 text-white rounded-2xl flex items-center justify-between pl-4 pr-2 py-2 shadow-lg">
                <span class="text-sm font-bold"><span id="selectedCount">0</span>件 選択中</span>
                <button onclick="batchMarkAsRead()" class="btn btn-ok">✓ 既読にする</button>
            </div>
        </div>
    </div>

    <!-- 下部タブ -->
    <nav class="fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
        <div class="max-w-md mx-auto grid grid-cols-4">
            <button id="tabBurst" class="tab-btn active" onclick="switchMode('burst')"><span class="ico">⚡</span>未読</button>
            <button id="tabLater" class="tab-btn" onclick="switchMode('later')"><span class="ico">⏳</span>後で (<span id="laterCountBadge">0</span>)</button>
            <button id="tabNormal" class="tab-btn" onclick="switchMode('normal')"><span class="ico">📁</span>ルーム</button>
            <button id="tabSearch" class="tab-btn" onclick="switchMode('search')"><span class="ico">🔍</span>検索</button>
        </div>
    </nav>

    <!-- シート類 -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/50 z-40" style="display:none;" onclick="closeAllModals()"></div>

    <div id="sheetActions" class="sheet">
        <div class="sheet-head"><div id="sheetActionsTitle" class="font-bold text-base truncate text-center"></div></div>
        <div id="sheetActionsBody"></div>
        <button onclick="closeAllModals()" class="sheet-row justify-center text-slate-500">閉じる</button>
    </div>

    <div id="modalSellerInfo" class="sheet">
        <div class="sheet-head"><div class="font-bold text-base text-center">🔑 セラー情報</div></div>
        <div class="p-5 space-y-4">
            <div><span class="field-label">管理番号</span><span id="sellerModalKanriNo" class="font-bold text-base">-</span> <span id="sellerModalSheet" class="text-xs text-slate-400"></span></div>
            <div><span class="field-label">お名前 / ショップ名</span><span id="sellerModalName" class="font-bold text-base">-</span><div id="sellerModalShopName" class="text-sm text-slate-600">-</div></div>
            <div class="bg-indigo-50 p-4 rounded-xl space-y-3">
                <div><span class="field-label text-indigo-700">ログインID</span><span id="sellerModalId" class="font-mono text-base select-all break-all">-</span></div>
                <div><span class="field-label text-indigo-700">パスワード</span><span id="sellerModalPass" class="font-mono text-base select-all break-all">-</span></div>
            </div>
            <div id="sellerModalExtras" class="space-y-3"></div>
            <button onclick="closeAllModals()" class="btn btn-sub w-full">閉じる</button>
        </div>
    </div>

    <div id="modalLinkCopy" class="sheet">
        <div class="sheet-head"><div class="font-bold text-base text-center">🚀 スタッフ連絡に登録</div></div>
        <div class="p-5 space-y-3">
            <input type="hidden" id="linkRoomId"><input type="hidden" id="linkRoomName"><input type="hidden" id="linkSenderName"><input type="hidden" id="linkMessageBody">
            <div class="grid grid-cols-2 gap-2">
                <div><label class="field-label">From</label><input type="text" id="linkFromInput" value="松下" class="inp"></div>
                <div><label class="field-label">To</label><input type="text" id="linkToInput" value="スタッフ全員" class="inp"></div>
            </div>
            <div><label class="field-label">メモ（任意）</label><textarea id="linkMemoInput" rows="3" class="inp"></textarea></div>
            <div><label class="field-label">画像（任意）</label><input type="file" id="linkImageInput" accept="image/*" class="inp text-sm bg-slate-50"></div>
            <button onclick="registerToStaffApp(this)" class="btn btn-main w-full">🚀 登録する</button>
        </div>
    </div>

    <!-- 画像ビューア -->
    <div id="imageViewer" class="fixed inset-0 z-[70] bg-black/95 flex-col" style="display:none;">
        <div class="flex items-center gap-2 px-3 text-white" style="padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px;">
            <div id="viewerName" class="flex-1 min-w-0 truncate text-sm font-bold"></div>
            <button onclick="closeViewer()" class="w-11 h-11 text-2xl shrink-0 cursor-pointer" aria-label="閉じる">✕</button>
        </div>
        <div class="flex-1 min-h-0 flex items-center justify-center overflow-auto p-2" onclick="if(event.target===this) closeViewer()">
            <div id="viewerLoading" class="text-white text-base">読み込み中…</div>
            <div id="viewerError" class="text-white text-base text-center px-6 leading-relaxed" style="display:none;"></div>
            <img id="viewerImg" alt="" class="max-w-full max-h-full object-contain" style="display:none;">
        </div>
        <div class="px-3" style="padding-top: 8px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));">
            <button id="viewerDownloadBtn" class="btn btn-sub w-full">⬇ ダウンロード</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzbGircW91tKx9NIihoWRMCiyIYnVbJJoeJZ9IoUf5s6vI71zNVnqJOo38vSOqfeMYzzA/exec";
        const SECRET_KEY = "chatwork_cockpit_secret_v1";
        const BUNDLE_CACHE_KEY = "cw_unread_bundle_v2_";
        const LATER_CACHE_KEY = "cw_later_cache_v1_";
        const OLD_LATER_KEY = "chatwork_later_rooms_v2";   // 以前の端末保存（共有化のため移行）
        const MYIDS_KEY = "cw_my_ids_v1";
        const AUTO_REFRESH_MS = 30 * 1000;                 // アプリに戻った時、30秒以上経っていれば自動更新
        const MAX_SHOW = 5;                                // 未読カードに表示する最大件数

        let allRoomsCache = [];
        let roomMembersCache = {};
        let currentMode = 'burst';
        let currentRoomId = null;
        let lastFetchAt = 0;
        let myIds = new Set(JSON.parse(localStorage.getItem(MYIDS_KEY) || "[]"));
        window.messageStore = {};
        window.roomNameMap = {};

        window.addEventListener('DOMContentLoaded', () => {
            updateLaterBadge();
            fetchAllUnreadRooms();
            setTimeout(() => loadOptionSellers(false), 1500);
        });

        // アプリに戻ってきた時に自動更新
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            if (Date.now() - lastFetchAt < AUTO_REFRESH_MS) return;
            if (currentMode === 'burst') fetchAllUnreadRooms(false);
            else if (currentMode === 'later') renderLaterRooms(false);
            else if (currentMode === 'normal' && !currentRoomId) fetchNormalRooms(true);
        });

        document.addEventListener('change', e => {
            if (e.target.classList && e.target.classList.contains('room-checkbox')) updateSelectionBar();
        });

        // ===== Firestore（使う時だけ読み込む） =====
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
            authDomain: "souko-2de57.firebaseapp.com",
            projectId: "souko-2de57",
            storageBucket: "souko-2de57.firebasestorage.app",
            messagingSenderId: "642116656086",
            appId: "1:642116656086:web:139cc5558a4ef6ebda6277"
        };
        const FS_TS = "__SERVER_TIMESTAMP__";
        let _fsPromise = null;
        function loadFirestore() {
            if (!_fsPromise) {
                _fsPromise = Promise.all([
                    import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"),
                    import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js")
                ]).then(([appMod, fsMod]) => {
                    const app = appMod.initializeApp(FIREBASE_CONFIG);
                    return { db: fsMod.getFirestore(app), collection: fsMod.collection, addDoc: fsMod.addDoc, serverTimestamp: fsMod.serverTimestamp };
                }).catch(err => { _fsPromise = null; throw err; });
            }
            return _fsPromise;
        }
        async function fsAdd(collectionName, data) {
            const f = await loadFirestore();
            const doc = {};
            Object.keys(data).forEach(k => { doc[k] = data[k] === FS_TS ? f.serverTimestamp() : data[k]; });
            return f.addDoc(f.collection(f.db, collectionName), doc);
        }

        // ===== 共通 =====
        function getAccount() { return document.getElementById('accountSelect').value; }
        function esc(str) {
            return (str === undefined || str === null) ? '' : String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function safeId(id) { return String(id || '').replace(/[^0-9]/g, ''); }
        function getUnread(r) { return Number(r.unread_num !== undefined ? r.unread_num : (r.unread_count || 0)); }
        function isMine(m) { return !!(m && m.account && myIds.has(String(m.account.account_id))); }
        function senderName(m) { return m && m.account ? m.account.name : "相手"; }
        function hm(d) { return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = 1;
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.style.opacity = 0, 2200);
        }

        function fmtTime(sec) {
            if (!sec) return '';
            const d = new Date(sec * 1000);
            return d.toDateString() === new Date().toDateString() ? `今日 ${hm(d)}` : `${d.getMonth() + 1}/${d.getDate()} ${hm(d)}`;
        }

        function setLastUpdated(fromCache) {
            const el = document.getElementById('lastUpdated');
            el.textContent = fromCache ? '前回の内容を表示中…' : `最終更新 ${hm(new Date())}`;
        }

        function updateMyIds(ids) {
            if (!Array.isArray(ids)) return;
            myIds = new Set(ids.map(String));
            try { localStorage.setItem(MYIDS_KEY, JSON.stringify(ids)); } catch (e) {}
        }

        function cleanBody(b) {
            return String(b || '')
                .replace(/\[download:\d+\][\s\S]*?\[\/download\]/g, '')
                .replace(/\[To:\d+\]/g, '@')
                .replace(/\[toall\]/gi, '@全員 ')
                .replace(/\[rp aid=\d+ to=\d+-\d+\]/g, '↩ ')
                .replace(/\[(piconname|picon):\d+\]/g, '')
                .replace(/\[qt\]\[qtmeta[^\]]*\]/g, '＞ ')
                .replace(/\[\/qt\]/g, '\n')
                .replace(/\[\/?info\]/g, '')
                .replace(/\[title\]/g, '【').replace(/\[\/title\]/g, '】\n')
                .replace(/\[hr\]/g, '──────')
                .replace(/\[preview[^\]]*\]/g, '')
                .replace(/\[dtext:[^\]]*\]/g, '')
                .replace(/\[\/?code\]/g, '')
                .replace(/【\s*】\n?/g, '')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        // AI・コピー用の1行（自社の発言には【自社】を付ける）
        function lineFor(m) {
            const files = parseFiles(m.body);
            const text = cleanBody(m.body) + (files.length ? '\n' + files.map(f => '📎 ' + f.name).join('\n') : '');
            return `${isMine(m) ? '【自社】' : ''}${senderName(m)}: ${text}`;
        }

        // ===== 添付ファイル =====
        const fileNameMap = {};
        const fileUrlCache = {};
        const URL_CACHE_MS = 3 * 60 * 1000;

        function parseFiles(raw) {
            const files = [];
            const re = /\[download:(\d+)\]([\s\S]*?)\[\/download\]/g;
            let m;
            while ((m = re.exec(String(raw || ''))) !== null) {
                const name = m[2].trim();
                const base = name.replace(/\s*\([\d.,]+\s*[KMGT]?B\)\s*$/i, '');
                files.push({ id: m[1], name: name, base: base });
                fileNameMap[m[1]] = base;
            }
            return files;
        }
        function isImageFile(name) { return /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(name || ''); }

        function attachmentsHtml(roomId, files) {
            if (!files || files.length === 0) return '';
            const rid = safeId(roomId);
            return `<div class="mt-2 space-y-2">` + files.map(f => {
                const img = isImageFile(f.base);
                return `
                    <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-xl p-2 pl-3">
                        <span class="text-xl shrink-0">${img ? '🖼️' : '📄'}</span>
                        <span class="flex-1 min-w-0 text-sm truncate">${esc(f.name)}</span>
                        ${img ? `<button onclick="previewImage('${rid}', '${safeId(f.id)}')" class="btn btn-main shrink-0" style="height:38px">見る</button>` : ''}
                        <button onclick="downloadFile('${rid}', '${safeId(f.id)}')" class="btn btn-sub shrink-0" style="height:38px">⬇ 保存</button>
                    </div>`;
            }).join('') + `</div>`;
        }

        async function getFileUrl(roomId, fileId) {
            const c = fileUrlCache[fileId];
            if (c && Date.now() - c.t < URL_CACHE_MS) return c.url;
            const data = await callApi("get_room_file", { room_id: roomId, file_id: fileId });
            const url = data.file && data.file.download_url;
            if (!url) throw new Error("ファイルのURLを取得できませんでした");
            fileUrlCache[fileId] = { url: url, t: Date.now() };
            return url;
        }

        window.previewImage = async function(roomId, fileId) {
            const viewer = document.getElementById('imageViewer');
            const img = document.getElementById('viewerImg');
            const loading = document.getElementById('viewerLoading');
            const err = document.getElementById('viewerError');
            document.getElementById('viewerName').textContent = fileNameMap[fileId] || '';
            document.getElementById('viewerDownloadBtn').onclick = () => downloadFile(roomId, fileId);
            img.style.display = 'none';
            img.removeAttribute('src');
            err.style.display = 'none';
            loading.style.display = 'block';
            viewer.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            try {
                const url = await getFileUrl(roomId, fileId);
                img.onload = () => { loading.style.display = 'none'; img.style.display = 'block'; };
                img.onerror = () => {
                    loading.style.display = 'none';
                    err.textContent = 'この端末では画像を表示できませんでした（HEIC形式など）。下の「ダウンロード」から開いてください。';
                    err.style.display = 'block';
                };
                img.src = url;
            } catch (e) {
                loading.style.display = 'none';
                err.textContent = '読み込みに失敗しました：' + e.message;
                err.style.display = 'block';
            }
        };
        window.closeViewer = function() {
            document.getElementById('imageViewer').style.display = 'none';
            document.getElementById('viewerImg').removeAttribute('src');
            document.body.style.overflow = '';
        };
        window.downloadFile = async function(roomId, fileId) {
            const c = fileUrlCache[fileId];
            if (c && Date.now() - c.t < URL_CACHE_MS) { window.open(c.url, '_blank'); return; }
            const w = window.open('', '_blank');
            if (w) w.document.write('<p style="font-family:sans-serif;font-size:18px;padding:24px">ファイルを準備中…</p>');
            try {

        // ===== 通信 =====
        function getSecret() {
            let s = localStorage.getItem(SECRET_KEY);
            if (!s) {

                if (s) localStorage.setItem(SECRET_KEY, s);
            }
            return s;
        }
        async function callApi(action, params = {}) {
            const body = Object.assign({}, params, { action: action, account: getAccount(), secret: getSecret() });
            const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(body) });
            const data = await res.json();
            if (data.code === "auth") {
                localStorage.removeItem(SECRET_KEY);
                throw new Error("合言葉が違います。🔄を押して入力し直してください");
            }
            if (data.status !== "success") throw new Error(data.message || "エラー");
            if (data.my_ids) updateMyIds(data.my_ids);
            if (data.later) saveLaterLocal(data.later);
            return data;
        }

        // entry = { messages:[最大5件] } / { error } / null(読込中)
        function burstCardHtml(roomId, roomName, badge, badgeCls, entry, unreadNum) {
            const rid = safeId(roomId);
            window.roomNameMap[rid] = roomName;
            const head = cardHeadHtml(roomId, roomName, badge, badgeCls);
            const wrap = (inner, extraCls, cardKey) =>
                `<div class="burst-card bg-white rounded-2xl shadow-sm p-4 ${extraCls || ''}" data-room-id="${rid}" data-room-name="${esc(roomName)}" data-card-key="${cardKey || ''}">${head}${inner}</div>`;

            if (!entry) return wrap('<div class="mt-3 text-sm text-slate-400">読込中…</div>');
            if (entry.error) return wrap(`<div class="mt-3 text-sm text-red-500">取得失敗：${esc(entry.error)}</div>`);
            const msgs = entry.messages || [];
            if (msgs.length === 0) return wrap('<div class="mt-3 text-sm text-slate-400">メッセージなし</div>');

            // 未読の件数分（最大5件）を表示
            const n = Math.min(Math.max(Number(unreadNum) || 1, 1), msgs.length, MAX_SHOW);
            const shown = msgs.slice(-n);
            const last = msgs[msgs.length - 1];
            const lastIsMine = isMine(last);
            const lastCustomer = msgs.slice().reverse().find(m => !isMine(m));

            // カード全体用（AIには取得した最大5件の流れを渡す）
            const cardKey = `c_${rid}_${Math.random().toString(36).slice(2, 8)}`;
            const thread = msgs.map(lineFor).join('\n\n');
            window.messageStore[cardKey] = {
                body: shown.map(lineFor).join('\n\n'), context: thread, roomId: rid, roomName,
                sender: lastCustomer ? senderName(lastCustomer) : senderName(last),
                replyTo: lastCustomer ? { aid: safeId(lastCustomer.account && lastCustomer.account.account_id), mid: safeId(lastCustomer.message_id), name: senderName(lastCustomer) } : null
            };

            const more = Number(unreadNum) > MAX_SHOW ? `<div class="text-xs text-slate-400 mt-2">※ 未読はほかに ${Number(unreadNum) - MAX_SHOW} 件あります（「ルーム」タブで確認できます）</div>` : '';
            const notice = lastIsMine ? `<div class="mt-3 text-sm font-bold text-emerald-700 bg-emerald-50 rounded-xl px-3 py-2">✅ 最後の発言は自社です（返信済みかもしれません）</div>` : '';
            const items = shown.map((m, i) => {
                const k = storeMessage(rid, roomName, m);
                return `<div class="${i > 0 ? 'mt-3 pt-3 border-t border-slate-100' : ''}">${messageHtml(k, m, { small: i < shown.length - 1 })}</div>`;
            }).join('');

            const inner = `
                ${notice}
                <div class="mt-3">${items}${more}</div>
                <div class="flex gap-2 mt-3">
                    <button onclick="toggleReply('${cardKey}', this)" class="btn ${lastIsMine ? 'btn-sub' : 'btn-main'} flex-1">💬 返信</button>
                    <button onclick="markAsRead('${rid}', '${safeId(last.message_id)}', this)" class="btn btn-sub flex-1">✓ 既読</button>
                    <button onclick="openMsgActions('${cardKey}')" class="btn btn-sub w-12 shrink-0 text-lg" aria-label="その他">⋯</button>
                </div>
                ${replyPanelHtml(cardKey, null, '📤 送信して完了')}`;
            return wrap(inner, lastIsMine ? 'opacity-75' : '', cardKey);
        }

        function compressImage(file, maxSize = 1280, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
                img.src = url;
            });
        }
        window.registerToStaffApp = async function(btnEl) {

        // ===== 撮影オプションのセラー（連絡用） =====
        const OPTION_CACHE_KEY = "cw_option_sellers_v1_";
        const OPTION_CACHE_MS = 6 * 60 * 60 * 1000;   // 6時間ごとに自動で取り直し
        let roomFilter = 'all';
        let optionData = null;          // { t, sellers }
        let optionRoomIds = new Set();
        let optionLoading = null;

        function setOptionData(d) {

        async function loadOptionSellers(force) {
            const key = OPTION_CACHE_KEY + getAccount();
            if (!force) {
                try {
                    const c = JSON.parse(localStorage.getItem(key));
                    if (c && c.sellers) {
                        setOptionData(c);
                        applyOptionBadges();
                        if (Date.now() - c.t < OPTION_CACHE_MS) return;
                    }
                } catch (e) {}
            }
            if (optionLoading) return optionLoading;
            optionLoading = (async () => {
                try {
                    const data = await callApi("get_option_sellers", { label: "動画撮影オプション" });
                    const d = { t: Date.now(), sellers: data.sellers || [] };
                    try { localStorage.setItem(key, JSON.stringify(d)); } catch (e) {}
                    setOptionData(d);
                    applyOptionBadges();
                    if (currentMode === 'normal' && roomFilter === 'option') renderOptionList();
                } finally {
                    optionLoading = null;
                }

        // タブ区切り → スプレッドシートにそのまま貼れる
        window.copyOptionList = function() {
            const sellers = filteredOptionSellers();
            if (!sellers.length) return;
            const clean = v => String(v == null ? '' : v).replace(/[\t\n\r]+/g, ' ').trim();
            const rows = [['管理番号', 'ショップ名', 'お名前', 'ルーム名', '未読', '最終更新'].join('\t')];

                .then(() => showToast(`${sellers.length} 名をコピーしました`))

        window.openRoomFromList = function(roomId) {

        async function openRoom(roomId) {

                lastFetchAt = Date.now();
                const msgs = roomData.messages || [];
                const members = roomData.members || [];
                roomMembersCache[currentRoomId] = members;
                const roomObj = allRoomsCache.find(r => String(r.room_id) === currentRoomId);
                const roomName = roomObj ? roomObj.name : "ルーム";
                window.roomNameMap[currentRoomId] = roomName;
                const latest = msgs[msgs.length - 1] || {};
                const recent = msgs.slice(-20);
                const later = isLater(currentRoomId);

                let html = `
                    <div class="bg-white rounded-2xl shadow-sm p-4">
                        <div class="font-bold text-base" data-op-room="${currentRoomId}">${esc(roomName)}</div>
                        <div class="grid grid-cols-4 gap-2 mt-3">
                            <button onclick="fetchSellerInfo('${currentRoomId}')" class="btn btn-sub px-1 text-[13px]">🔑 セラー</button>
                            <button onclick="copyAllRoomMessages('${currentRoomId}')" class="btn btn-sub px-1 text-[13px]">📋 コピー</button>
                            <button onclick="markAsRead('${currentRoomId}', '${safeId(latest.message_id)}', this)" class="btn btn-sub px-1 text-[13px]">✓ 既読</button>
                            <button onclick="toggleLaterRoom('${currentRoomId}'); this.textContent = isLater('${currentRoomId}') ? '⏳ 後で中' : '⏳ 後で';" class="btn btn-sub px-1 text-[13px]">${later ? '⏳ 後で中' : '⏳ 後で'}</button>
                        </div>
                    </div>`;

                if (recent.length === 0) {
                    html += emptyBox('まだメッセージがありません');

                    html += `<div class="text-xs font-bold text-slate-400 px-1">直近 ${recent.length} 件（下が最新）</div>`;
                    recent.forEach((m, idx) => {

                        // AIには、このメッセージまでの直近6件の流れを渡す
                        const absIdx = msgs.length - recent.length + idx;

                        const mine = isMine(m);
                        html += `
                            <div class="bg-white rounded-2xl shadow-sm p-4">
                                ${messageHtml(key, m)}
                                <div class="flex gap-2 mt-3">
                                    ${mine ? '' : `<button onclick="toggleReply('${key}', this)" class="btn btn-sub flex-1">💬 返信</button>`}
                                    <button onclick="openMsgActions('${key}')" class="btn btn-sub ${mine ? 'flex-1' : 'w-12 shrink-0'} text-lg" aria-label="その他">⋯</button>
                                </div>
                                ${mine ? '' : replyPanelHtml(key, members, '📤 送信')}
                            </div>`;
                    });
                }
                html += buildComposeBox(currentRoomId, roomName, msgs, members, recent);
                container.innerHTML = html;
                applyOptionBadges();
                setStatus(roomName.length > 8 ? roomName.slice(0, 8) + '…' : roomName);
                setTimeout(() => container.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' }), 50);
            } catch (e) {
                container.innerHTML = `<div class="text-sm text-red-500 bg-white p-4 rounded-2xl shadow-sm">エラー: ${esc(e.message)}</div>`;
            }
        }

        // ===== 直近の問い合わせ検索 =====
        let lastSearch = null;

        function escRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        function toHalf(s) { return String(s).replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }

        // キーワード部分に色を付ける（全角・半角、大文字・小文字を区別しない）
        function highlight(text, words) {
            const safe = esc(text);
            if (!words.length) return safe;
            const half = toHalf(safe).toLowerCase();
            const marks = [];
            words.forEach(w => {
                const ew = esc(w);
                let i = half.indexOf(ew);
                while (i !== -1) { marks.push([i, i + ew.length]); i = half.indexOf(ew, i + ew.length); }
            });
            if (!marks.length) return safe;
            marks.sort((a, b) => a[0] - b[0]);
            let out = '', pos = 0;
            marks.forEach(([a, b]) => {
                if (a < pos) return;
                out += safe.slice(pos, a) + '<mark class="bg-yellow-200 rounded px-0.5">' + safe.slice(a, b) + '</mark>';
                pos = b;
            });
            return out + safe.slice(pos);
        }

        let searchSeq = 0;
        let searchTimer = null;

        // resume=true のときは、前回の検索の続きから
        window.runSearch = async function(resume) {
            clearTimeout(searchTimer);
            if (!resume) {
                const keyword = document.getElementById('searchKeyword').value.trim();
                if (!keyword) { showToast('キーワードを入力してください'); return; }
                lastSearch = {
                    keyword: keyword,
                    days: Number(document.getElementById('searchDays').value),
                    includeMine: document.getElementById('searchIncludeMine').checked,
                    results: [], scanned: 0, total: null, failed: 0,
                    nextOffset: 0, waitUntil: 0, running: false, error: '', seq: ++searchSeq
                };
            }
            const st = lastSearch;
            if (!st || st.nextOffset === null || st.running) return;
            const seq = st.seq;
            const btn = document.getElementById('searchBtn');
            st.running = true;
            st.waitUntil = 0;
            st.error = '';
            btn.disabled = true;
            btn.textContent = '検索中…';
            setStatus('検索中…');
            renderSearchResults(st);

            try {
                while (st.nextOffset !== null) {
                    const data = await callApi("search_recent", {
                        keyword: st.keyword, days: st.days, include_mine: st.includeMine, offset: st.nextOffset
                    });
                    if (seq !== searchSeq) return;
                    st.total = data.total_rooms;
                    if (data.wait_sec > 0) {
                        // API回数の回復待ち → 回復したら自動で続きを検索
                        st.waitUntil = Date.now() + data.wait_sec * 1000;
                        searchTimer = setTimeout(() => {
                            if (lastSearch === st && currentMode === 'search') runSearch(true);
                        }, data.wait_sec * 1000 + 1000);
                        break;
                    }
                    st.results = st.results.concat(data.results || []);
                    st.scanned += data.scanned || 0;
                    st.failed += data.failed || 0;
                    st.nextOffset = data.next_offset;
                    renderSearchResults(st);
                }
            } catch (e) {
                if (seq !== searchSeq) return;
                st.error = e.message;
            } finally {
                if (seq === searchSeq) {
                    st.running = false;
                    btn.disabled = false;
                    btn.textContent = '検索';
                    renderSearchResults(st);
                }
            }
        };

        function renderSearchResults(st) {
            const box = document.getElementById('searchResults');
            const results = st.results.slice().sort((a, b) => b.latest_time - a.latest_time);
            const words = st.keyword.split(/[\s　]+/).filter(Boolean).map(w => toHalf(w).toLowerCase());
            const hitTotal = results.reduce((n, r) => n + r.hit_count, 0);
            const done = st.nextOffset === null;
            const waiting = st.waitUntil > Date.now();

            if (st.running) setStatus('検索中…');
            else if (waiting) setStatus('回復待ち', 'bg-amber-500');
            else setStatus(`${results.length} ルーム`, results.length ? 'bg-amber-500' : 'bg-emerald-500');

            const totalTxt = st.total === null ? '…' : st.total;
            const pct = st.total ? Math.round(st.scanned / st.total * 100) : 0;
            let progress = '';
            if (!done) {
                progress = `
                    <div class="mt-3">
                        <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-indigo-500 transition-all" style="width:${pct}%"></div></div>
                        <div class="text-xs text-slate-500 mt-1">${st.scanned} / ${totalTxt} ルーム確認済み</div>
                    </div>`;
            }
            let note = '';
            if (waiting) {
                const min = Math.max(1, Math.ceil((st.waitUntil - Date.now()) / 60000));
                note = `<div class="text-sm text-amber-800 bg-amber-50 rounded-xl p-3 mt-3 leading-relaxed">
                    普段の既読・送信が止まらないよう、Chatworkの利用回数の回復を待っています。<b>約${min}分後に自動で続きを検索します。</b>
                    <button onclick="runSearch(true)" class="btn btn-sub w-full mt-2">今すぐ続きを検索</button></div>`;
            } else if (st.error) {
                note = `<div class="text-sm text-red-600 bg-red-50 rounded-xl p-3 mt-3">検索が途中で止まりました：${esc(st.error)}
                    <button onclick="runSearch(true)" class="btn btn-sub w-full mt-2">続きから再開</button></div>`;
            }
            if (st.failed) note += `<div class="text-xs text-amber-700 mt-2">※ ${st.failed} ルームは取得に失敗しました。少し時間をおいて再検索してください。</div>`;

            let html = `
                <div class="bg-white rounded-2xl shadow-sm p-4">
                    <div class="text-base font-bold">${results.length} ルーム / ${hitTotal} 件ヒット${st.running ? '<span class="text-sm font-normal text-slate-400">（検索中…）</span>' : ''}</div>
                    <div class="text-xs text-slate-500 mt-1">${done
                        ? `直近${st.days}日に更新があった ${st.scanned} ルームをすべて確認しました（各ルーム最新100件まで）`
                        : `直近${st.days}日に更新があったルームを順番に確認しています`}</div>
                    ${progress}${note}
                    ${results.length ? `<button onclick="copySearchResults()" class="btn btn-sub w-full mt-3">📋 セラー一覧をコピー（スプレッドシート貼り付け用）</button>` : ''}
                </div>`;

            if (!results.length && done && !st.running) html += emptyBox('該当するチャットは見つかりませんでした');
            results.forEach(r => {
                const rid = safeId(r.room_id);
                window.roomNameMap[rid] = r.room_name;
                const sl = r.seller;
                html += `
                    <div class="bg-white rounded-2xl shadow-sm p-4">
                        <div class="flex items-start gap-2">
                            <div class="flex-1 min-w-0">
                                <div class="font-bold text-base truncate">${esc(r.room_name)}</div>
                                <div class="text-sm text-slate-600 mt-0.5">${sl ? `管理番号 ${esc(sl.kanriNo)}・${esc(sl.shopName)}` : '<span class="text-slate-400">セラー情報なし</span>'}</div>
                            </div>
                            <span class="shrink-0 text-xs font-bold bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full">${r.hit_count}件</span>
                        </div>
                        <div class="mt-3 space-y-2">
                            ${r.hits.map(h => `
                                <div class="bg-slate-50 rounded-xl p-3">
                                    <div class="text-xs text-slate-500">${esc(h.sender)}・${fmtTime(h.send_time)}</div>
                                    <div class="msg-body text-[14px] mt-1">${highlight(h.snippet, words)}</div>
                                </div>`).join('')}
                            ${r.hit_count > r.hits.length ? `<div class="text-xs text-slate-400">ほか ${r.hit_count - r.hits.length} 件</div>` : ''}
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <button onclick="openRoomFromList('${rid}')" class="btn btn-main">📁 ルームを開く</button>
                            <button onclick="fetchSellerInfo('${rid}')" class="btn btn-sub">🔑 セラー情報</button>
                        </div>
                    </div>`;
            });
            box.innerHTML = html;
        }

        // タブ区切りでコピー → スプレッドシートにそのまま貼れる
        window.copySearchResults = function() {
            if (!lastSearch || !lastSearch.results.length) return;
            const clean = v => String(v == null ? '' : v).replace(/[\t\n\r]+/g, ' ').trim();
            const rows = [['管理番号', 'ショップ名', 'お名前', 'ルーム名', 'ヒット数', '最新日時', '最新の内容'].join('\t')];
            lastSearch.results.slice().sort((a, b) => b.latest_time - a.latest_time).forEach(r => {
                const s = r.seller || {};
                const d = new Date(r.latest_time * 1000);
                const dt = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${hm(d)}`;
                rows.push([s.kanriNo, s.shopName, s.name, r.room_name, r.hit_count, dt, r.hits[0] ? r.hits[0].snippet : ''].map(clean).join('\t'));
            });
            navigator.clipboard.writeText(rows.join('\n'))
                .then(() => showToast(`${lastSearch.results.length} 件をコピーしました`))
                .catch(err => alert("コピーに失敗しました: " + err));
        };

        // ===== 新規発信 =====
        function buildComposeBox(roomId, roomName, messages, members, recent) {
            const rid = safeId(roomId);
            const key = `compose_${rid}`;
            window.messageStore[key] = {
                body: '', context: messages.slice(-10).map(lineFor).join("\n\n"),
                fullText: (recent || []).map(lineFor).join("\n\n"),
                sender: "", roomId: rid, roomName, replyTo: null
            };
            return `
                <div class="bg-white border-2 border-emerald-300 rounded-2xl shadow-sm p-4 space-y-2">
                    <div class="font-bold text-base text-emerald-800">✏️ 新しく発信する</div>
                    <select id="member_select_${key}" data-loaded="1" onchange="insertMentionForMsg('${key}')" class="inp">${memberOptionsHtml(members)}</select>
                    <textarea id="custom_prompt_${key}" rows="2" placeholder="伝えたい内容をざっくり（例：明日の出荷は14時締め切り）" class="inp bg-slate-50"></textarea>
                    <button onclick="generateComposeAi('${key}', this)" class="btn btn-ai w-full">✨ AIで文章を作成</button>
                    <textarea id="reply_text_${key}" rows="6" placeholder="送信するメッセージ（直接入力もOK）" class="inp"></textarea>
                    <button onclick="sendComposeMessage('${key}', this)" class="btn btn-ok w-full">📤 送信</button>
                </div>`;
        }

        window.generateComposeAi = async function(key, btnEl) {
            const m = window.messageStore[key] || {};
            const textarea = document.getElementById(`reply_text_${key}`);
            const intent = document.getElementById(`custom_prompt_${key}`).value.trim();
            if (!intent) { showToast("伝えたい内容を入力してください"); return; }
            const toLines = (textarea.value.match(/^\[To:\d+\][^\n]*\n/gm) || []).join("");
            btnEl.disabled = true;
            btnEl.textContent = "AI作成中…";
            try {
                const data = await callApi("generate_ai_reply", {
                    mode: "compose", room_id: m.roomId, room_name: m.roomName || "ルーム",
                    context: m.context || "", custom_prompt: intent
                });
                textarea.value = toLines + (data.ai_reply || "");
                logAiDraft(m, data.ai_reply || "", intent, m.context || "", 'compose');
            } catch (e) {
                alert("AI作成エラー: " + e.message);
            } finally {
                btnEl.disabled = false;
                btnEl.textContent = "✨ AIで文章を作成";
            }
        };

        window.sendComposeMessage = async function(key, btn) {
            const m = window.messageStore[key] || {};
            const finalMsg = document.getElementById(`reply_text_${key}`).value.trim();
            if (!finalMsg) { showToast("メッセージを入力してください"); return; }
            if (!confirm(`「${m.roomName}」に送信しますか？\n\n${finalMsg.slice(0, 80)}${finalMsg.length > 80 ? '…' : ''}`)) return;
            btn.disabled = true;
            btn.textContent = "送信中…";
            try {
                await callApi("send_message", { room_id: m.roomId, body: finalMsg });
                saveSendLog(m, finalMsg, 'compose');
                showToast("送信しました");
                openRoom(m.roomId);
            } catch (e) {
                alert("送信失敗: " + e.message);
                btn.disabled = false;
                btn.textContent = "📤 送信";
            }
        };

        // ===== 未読タブ =====
        function unreadOf(data) {
            const latest = data.latest || {};
            const lastIsMine = r => {
                const ms = (latest[String(r.room_id)] || {}).messages || [];
                return ms.length ? isMine(ms[ms.length - 1]) : false;
            };
            // お客様の発言が最後のルームを上に、自社が最後のルームは下へ
            return (data.rooms || []).filter(r => getUnread(r) > 0)
                .sort((a, b) => (lastIsMine(a) - lastIsMine(b)) || (b.last_update_time || 0) - (a.last_update_time || 0));
        }
        function setUnreadStatus(n) {
            if (n === 0) setStatus('未読ゼロ', 'bg-emerald-500');
            else setStatus(`未読 ${n}`, 'bg-amber-500');
        }
        function renderUnreadBundle(data) {
            const container = document.getElementById('burstModeContainer');
            allRoomsCache = data.rooms || [];
            const rooms = unreadOf(data);
            setUnreadStatus(rooms.length);
            if (rooms.length === 0) { container.innerHTML = emptyBox('🎉 未読はありません'); return; }
            const latest = data.latest || {};
            container.innerHTML = rooms.map(r =>
                burstCardHtml(r.room_id, r.name, `未読 ${getUnread(r)}`, "bg-red-500 text-white", latest[String(r.room_id)] || { error: '取得できませんでした' }, getUnread(r))
            ).join('');
            updateSelectionBar();
            applyOptionBadges();
        }
        function bundleSignature(data) {
            const latest = data.latest || {};
            return unreadOf(data).map(r => {
                const ms = (latest[String(r.room_id)] || {}).messages || [];
                return `${r.room_id}:${getUnread(r)}:${ms.length ? ms[ms.length - 1].message_id : ''}`;
            }).join('|');
        }
        function isUserBusy(container) {
            const panelOpen = Array.from(container.querySelectorAll('[id^="reply_panel_"]')).some(p => p.style.display !== 'none');
            const typed = Array.from(container.querySelectorAll('textarea, input[type="text"]')).some(t => t.value.trim());
            return panelOpen || typed || !!container.querySelector('.room-checkbox:checked');
        }
        function readBundleCache(acc) {
            try { return JSON.parse(localStorage.getItem(BUNDLE_CACHE_KEY + acc)); } catch (e) { return null; }
        }
        function markReadInCache(ids) {
            const c = readBundleCache(getAccount());
            if (!c || !c.data) return;
            const set = new Set(ids.map(String));
            (c.data.rooms || []).forEach(r => { if (set.has(String(r.room_id))) r.unread_num = 0; });
            try { localStorage.setItem(BUNDLE_CACHE_KEY + getAccount(), JSON.stringify(c)); } catch (e) {}
        }

        let bundleSeq = 0;
        async function fetchAllUnreadRooms(force) {
            const container = document.getElementById('burstModeContainer');
            const acc = getAccount();
            const seq = ++bundleSeq;

            let shownSig = null;
            const cached = readBundleCache(acc);
            if (cached && cached.data && !container.querySelector('.burst-card')) {
                renderUnreadBundle(cached.data);
                shownSig = bundleSignature(cached.data);
                setLastUpdated(true);
            } else if (container.querySelector('.burst-card') && cached && cached.data) {
                shownSig = bundleSignature(cached.data);
            } else {
                container.innerHTML = emptyBox('未読ルームを確認中…');
            }
            setStatus('更新中…');

            try {
                const data = await callApi("get_unread_bundle");
                try { localStorage.setItem(BUNDLE_CACHE_KEY + acc, JSON.stringify({ t: Date.now(), data: data })); } catch (e) {}
                if (seq !== bundleSeq || acc !== getAccount() || currentMode !== 'burst') return;
                lastFetchAt = Date.now();
                allRoomsCache = data.rooms || [];
                setLastUpdated(false);
                migrateOldLater();

                const sig = bundleSignature(data);
                if (shownSig !== null && sig === shownSig && !force) { setUnreadStatus(unreadOf(data).length); return; }
                if (shownSig !== null && !force && isUserBusy(container)) {
                    setUnreadStatus(unreadOf(data).length);
                    showToast('新着があります。🔄で更新できます');
                    return;
                }
                renderUnreadBundle(data);
            } catch (e) {
                if (seq !== bundleSeq) return;
                if (shownSig === null) {
                    container.innerHTML = `<div class="text-sm text-red-500 text-center p-4 bg-white rounded-2xl shadow-sm">エラー: ${esc(e.message)}</div>`;
                } else {
                    showToast('最新の取得に失敗しました（前回の内容を表示中）');
                }
                setStatus('エラー', 'bg-red-500');
            }
        }

        // ===== 返信 =====
        window.generateAiReplyForMessage = async function(key, btnEl) {
            const m = window.messageStore[key] || {};
            const textarea = document.getElementById(`reply_text_${key}`);
            const promptInput = document.getElementById(`custom_prompt_${key}`);
            const customPrompt = promptInput ? promptInput.value.trim() : "";
            const toLines = (textarea.value.match(/^\[To:\d+\][^\n]*\n/gm) || []).join("");
            btnEl.disabled = true;
            btnEl.textContent = "作成中…";
            try {
                const data = await callApi("generate_ai_reply", {
                    room_id: m.roomId, room_name: m.roomName || "ルーム",
                    context: m.context || m.body || "", custom_prompt: customPrompt
                });
                textarea.value = toLines + (data.ai_reply || "");
                logAiDraft(m, data.ai_reply || "", customPrompt, m.context || m.body || "", 'reply');
            } catch (e) {
                alert("AI作成エラー: " + e.message);
            } finally {
                btnEl.disabled = false;
                btnEl.textContent = "✨ AI作成";
            }
        };

        // ===== AI添削ログ（AI案と送信文を1件にひもづけて記録） =====
        function newId() {
            return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        }
        // 比較用：宛先・返信マークの行を外して整える
        function bodyForCompare(t) {
            return String(t || '')
                .replace(/^\[(To:\d+|rp aid=\d+ to=\d+-\d+)\][^\n]*\n?/gm, '')
                .replace(/\[toall\]/gi, '')
                .trim();
        }
        // 2つの文の違いの割合（0＝同じ、1＝まったく別）
        function editRatio(a, b) {
            a = String(a).slice(0, 1500);
            b = String(b).slice(0, 1500);
            if (!a.length && !b.length) return 0;
            let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
            for (let i = 1; i <= a.length; i++) {
                const cur = [i];
                for (let j = 1; j <= b.length; j++) {
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                }
                prev = cur;
            }
            return prev[b.length] / Math.max(a.length, b.length);
        }
        function editLevel(r) { return r < 0.05 ? 'そのまま' : r < 0.3 ? '軽い修正' : '大幅修正'; }

        function logAiDraft(m, aiText, prompt, context, mode) {
            const id = newId();
            m.aiDraft = { id: id, text: aiText, prompt: prompt, count: ((m.aiDraft && m.aiDraft.count) || 0) + 1 };
            fsAdd("ai_reply_logs", {
                draftId: id, account: getAccount(), mode: mode, tab: currentMode,
                roomId: String(m.roomId), roomName: m.roomName || "", context: context,
                aiGeneratedText: aiText, customPrompt: prompt, generateCount: m.aiDraft.count,
                type: mode, status: 'generated', createdAt: FS_TS
            }).catch(err => console.error("AIログ保存失敗:", err));
        }

        function saveSendLog(m, sentText, mode) {
            if (!sentText || !sentText.trim()) return;
            const final = bodyForCompare(sentText);
            const d = m.aiDraft || null;
            const data = {
                account: getAccount(), mode: mode, tab: currentMode,
                roomId: String(m.roomId), roomName: m.roomName || "",
                userEditedText: sentText.trim(), finalText: final,
                usedAi: !!d, draftId: d ? d.id : null,
                aiGeneratedText: d ? d.text : null, customPrompt: d ? d.prompt : null,
                generateCount: d ? d.count : 0,
                context: (m.context || m.body || "").slice(0, 3000),
                updatedAt: FS_TS
            };
            if (d) {
                const r = editRatio(bodyForCompare(d.text), final);
                data.editRatio = Math.round(r * 1000) / 1000;
                data.editLevel = editLevel(r);
                data.aiLength = bodyForCompare(d.text).length;
                data.finalLength = final.length;
            }
            fsAdd("ai_brushup_feedback", data).catch(e => console.error("送信ログ保存失敗:", e));
            m.aiDraft = null;
        }

        window.insertMentionForMsg = function(key) {
            const selectEl = document.getElementById(`member_select_${key}`);
            const textarea = document.getElementById(`reply_text_${key}`);
            if (!selectEl || !textarea || !selectEl.value) return;
            const memberName = selectEl.options[selectEl.selectedIndex].text;
            textarea.value = `[To:${selectEl.value}] ${memberName}さん\n` + textarea.value;
            selectEl.value = '';
            showToast(`${memberName}さんを宛先に追加しました`);
        };

        window.markAsRead = async function(roomId, lastChatId, btn) {
            btn.disabled = true;
            const label = btn.textContent;
            btn.textContent = "処理中…";
            try {
                await callApi("mark_read", { room_id: roomId, last_chat_id: lastChatId });
                markReadInCache([roomId]);
                showToast("既読にしました");
                if (currentMode === 'burst') removeCard(roomId);
                else { btn.disabled = false; btn.textContent = label; }
            } catch (e) {
                alert("既読エラー: " + e.message);
                btn.disabled = false;
                btn.textContent = label;
            }
        };

        // 送信：未読・後でタブでは「送信＋既読＋後で対応から外す」までまとめて完了
        window.sendReplyForMessage = async function(key, btn) {
            const m = window.messageStore[key] || {};
            const textarea = document.getElementById(`reply_text_${key}`);
            let finalMsg = textarea.value.trim();
            if (!finalMsg) { showToast("返信文を入力してください"); return; }

            const rpBox = document.getElementById(`rp_${key}`);
            if (rpBox && rpBox.checked && m.replyTo && m.replyTo.mid) {
                finalMsg = `[rp aid=${m.replyTo.aid} to=${m.roomId}-${m.replyTo.mid}]${m.replyTo.name}さん\n` + finalMsg;
            }
            const preview = textarea.value.trim();
            if (!confirm(`「${m.roomName}」に送信しますか？\n\n${preview.slice(0, 80)}${preview.length > 80 ? '…' : ''}`)) return;

            const done = currentMode !== 'normal';
            btn.disabled = true;
            btn.textContent = "送信中…";
            try {
                await callApi("send_message", { room_id: m.roomId, body: finalMsg, done: true });
                saveSendLog(m, finalMsg, 'reply');
                markReadInCache([m.roomId]);
                showToast(done ? "送信して完了にしました" : "送信しました");
                if (done) removeCard(m.roomId);
                else openRoom(m.roomId);
            } catch (e) {
                alert("送信失敗: " + e.message);
                btn.disabled = false;
                btn.textContent = done ? "📤 送信して完了" : "📤 送信";
            }
        };
    </script>
</body>
</html>
