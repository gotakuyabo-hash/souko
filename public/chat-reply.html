<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Chatwork AI返信アシスタント</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 max-w-2xl mx-auto">
    <div class="bg-white p-4 rounded-lg shadow mb-4">
        <h1 class="text-lg font-bold text-slate-800 mb-2">Chatwork AI返信アシスタント</h1>
        <p class="text-xs text-slate-500 mb-4">セラー（ルーム）を選択してメッセージを読み込み、AI返信案を生成します。</p>
        
        <div class="flex gap-2 mb-4">
            <select id="roomSelect" class="flex-1 border border-slate-300 rounded p-2 text-sm bg-white">
                <option value="">セラー（ルーム）を読み込み中...</option>
            </select>
            <button onclick="loadRoomMessages()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2 rounded font-bold shrink-0">
                メッセージ取得
            </button>
        </div>
    </div>

    <div id="messageLoading" class="text-center text-xs text-gray-500 py-4" style="display:none;">メッセージを取得中...</div>
    <div id="messageListContainer" class="space-y-3"></div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxdeoof0DmHdQla40eeM71k3JdiQ-7BpTjDW8jUsHrLxmNozMdAgXAm9Y4R-49YcypI8w/exec;

        // ページ読み込み時にセラー一覧を取得
        window.addEventListener('DOMContentLoaded', () => {
            fetchRooms();
        });

        async function fetchRooms() {
            const selectEl = document.getElementById('roomSelect');
            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "get_rooms" })
                });
                const data = await response.json();
                if (data.status !== "success") throw new Error(data.message);

                const rooms = data.rooms;
                let html = '<option value="">-- セラー（ルーム）を選択してください --</option>';
                rooms.forEach(room => {
                    const unreadBadge = room.unread_num > 0 ? ` (🔴未読 ${room.unread_num})` : '';
                    html += `<option value="${room.room_id}">${escapeHtml(room.name)}${unreadBadge}</option>`;
                });
                selectEl.innerHTML = html;
            } catch (e) {
                selectEl.innerHTML = '<option value="">ルームの取得に失敗しました</option>';
                alert('ルーム取得エラー: ' + e.message);
            }
        }

        async function loadRoomMessages() {
            const roomId = document.getElementById('roomSelect').value;
            if (!roomId) {
                alert('セラーを選択してください。');
                return;
            }

            const container = document.getElementById('messageListContainer');
            document.getElementById('messageLoading').style.display = 'block';
            container.innerHTML = '';

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "get_room_messages", room_id: roomId })
                });

                const data = await response.json();
                if (data.status !== "success") throw new Error(data.message);

                const messages = data.messages;
                if (messages.length === 0) {
                    container.innerHTML = '<div class="text-xs text-gray-500 p-4 bg-white rounded shadow text-center">メッセージが見つかりませんでした。</div>';
                    return;
                }

                let html = '';
                messages.forEach(msg => {
                    const safeMessage = encodeURIComponent(msg.body);
                    const senderName = msg.account && msg.account.name ? msg.account.name : '不明';
                    html += `
                        <div class="bg-white border border-slate-200 p-3 rounded shadow-sm">
                            <div class="text-xs text-indigo-600 font-bold mb-1">👤 ${escapeHtml(senderName)}</div>
                            <div class="text-sm mb-3 whitespace-pre-wrap text-slate-700">${escapeHtml(msg.body)}</div>
                            <button onclick="generateReplyForMessage('${safeMessage}', this)" class="bg-slate-700 hover:bg-slate-800 text-white text-xs px-3 py-1.5 rounded font-medium">この返信案を作る</button>
                            <div class="ai-reply-area mt-2 text-sm bg-slate-50 p-2.5 rounded border border-slate-200" style="display:none;"></div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (e) {
                alert('取得エラー: ' + e.message);
            } finally {
                document.getElementById('messageLoading').style.display = 'none';
            }
        }

        async function generateReplyForMessage(encodedMessageText, btnEl) {
            const messageText = decodeURIComponent(encodedMessageText);
            const parentCard = btnEl.closest('div');
            const replyArea = parentCard.querySelector('.ai-reply-area');
            replyArea.style.display = 'block';
            replyArea.innerHTML = '<span class="text-xs text-gray-400">AIが返信案を生成中...</span>';

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "generate_reply", message: messageText })
                });
                const data = await response.json();
                if (data.status !== "success") throw new Error(data.message);

                const safeInput = encodeURIComponent(messageText);
                const safeOutput = encodeURIComponent(data.reply);

                replyArea.innerHTML = `
                    <div class="font-bold text-xs text-slate-500 mb-1">AI返信案:</div>
                    <div class="whitespace-pre-wrap mb-2 text-slate-800">${escapeHtml(data.reply)}</div>
                    <button onclick="saveSpecificTraining('${safeInput}', '${safeOutput}', this)" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2.5 py-1 rounded">学習データに保存</button>
                `;
            } catch (e) {
                replyArea.innerHTML = '<span class="text-xs text-red-500">生成失敗</span>';
            }
        }

        async function saveSpecificTraining(encodedInput, encodedOutput, btnEl) {
            const input = decodeURIComponent(encodedInput);
            const output = decodeURIComponent(encodedOutput);
            await saveToFirestore(input, output);
            btnEl.textContent = '保存完了！';
            btnEl.disabled = true;
            btnEl.className = 'bg-gray-300 text-white text-xs px-2.5 py-1 rounded cursor-default';
        }

        // ダミー（必要に応じて既存のFirestore保存関数に繋ぎこんでください）
        async function saveToFirestore(input, output) {
            console.log("Firestore保存:", { input, output });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`<>"]/g, match => ({
                '&': '&amp;',
                "'": '&#x27;',
                '`': '&#x60;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
            })[match]);
        }
    </script>
</body>
</html>
