<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatwork 未読バーストコックピット</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (スタッフ間連絡アプリ連携用) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
            authDomain: "souko-2de57.firebaseapp.com",
            projectId: "souko-2de57",
            storageBucket: "souko-2de57.firebasestorage.app",
            messagingSenderId: "642116656086",
            appId: "1:642116656086:web:139cc5558a4ef6ebda6277",
            measurementId: "G-8WG8GWQGCR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.registerToStaffApp = async function(roomId, roomName, senderName, messageBody, fromVal, toVal, memoVal, btnEl) {
            let taskContent = `【Chatwork連携依頼】\nルーム名: ${roomName}`;
            taskContent += `\n\n👤 発言者: ${senderName}\n💬 メッセージ本文:\n${messageBody}`;
            
            if (memoVal) {
                taskContent += `\n\n📝 連絡メモ:\n${memoVal}`;
            }

            btnEl.disabled = true;
            btnEl.textContent = "登録中...";

            try {
                await addDoc(collection(db, "staff_requests"), {
                    from: fromVal || '未設定',
                    to: toVal || '未設定',
                    task: taskContent,
                    imageUrl: null,
                    status: 'pending',
                    createdAt: serverTimestamp()
                });
                alert('スタッフ間連絡アプリに直接登録しました！');
                closeAllModals();
            } catch (error) {
                alert("登録に失敗しました: " + error.message);
            } finally {
                btnEl.disabled = false;
                btnEl.textContent = "🚀 スタッフ間連絡アプリに登録する";
            }
        };
    </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-16">
    <!-- ヘッダー -->
    <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-20">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <h1 class="text-base font-bold flex items-center gap-2">
                <span>🚀 未読バーストコックピット</span>
            </h1>
            <div class="flex items-center gap-2">
                <span id="loadStatus" class="text-xs bg-indigo-500 px-2 py-0.5 rounded-full text-indigo-100">読込中...</span>
                <button onclick="refreshCurrentView()" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-2.5 py-1.5 rounded font-bold shadow active:scale-95 transition">
                    🔄 更新
                </button>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="max-w-md mx-auto p-3 space-y-3">
        <!-- アカウント＆モード切替カード -->
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
            <div class="flex items-center gap-2">
                <select id="accountSelect" onchange="changeAccount()" class="flex-1 border border-slate-300 rounded-lg p-2 text-xs bg-indigo-50/50 font-bold text-indigo-950 focus:outline-none">
                    <option value="5435a05ddd195c46ca688d021e45bbce" selected>ラクロジスタッフアカウント</option>
                    <option value="57d74ea2e63325c5306b594c3bb231af">松下アカウント</option>
                </select>
            </div>
            
            <!-- タブ切り替え -->
            <div class="flex bg-slate-100 p-1 rounded-lg gap-1">
                <button id="tabBurst" onclick="switchMode('burst')" class="flex-1 py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm transition">
                    ⚡ 未読バースト
                </button>
                <button id="tabLater" onclick="switchMode('later')" class="flex-1 py-1.5 text-[11px] font-bold rounded-md text-slate-600 transition">
                    ⏳ 後で対応 (<span id="laterCountBadge">0</span>)
                </button>
                <button id="tabNormal" onclick="switchMode('normal')" class="flex-1 py-1.5 text-[11px] font-bold rounded-md text-slate-600 transition">
                    📁 通常個別
                </button>
            </div>
        </div>

        <!-- 【モードA】未読バーストフィード表示エリア -->
        <div id="burstModeContainer" class="space-y-3">
            <div class="text-center text-xs text-slate-500 py-8">
                <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-600 border-t-transparent mb-1"></div>
                <div>未読ルームをスキャン中...</div>
            </div>
        </div>

        <!-- 【モードC】後で対応タブ表示エリア -->
        <div id="laterModeContainer" class="space-y-3" style="display:none;"></div>

        <!-- 【モードB】通常ルーム個別選択エリア -->
        <div id="normalModeContainer" class="space-y-3" style="display:none;">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
                <input type="text" id="roomSearchInput" oninput="filterNormalRooms()" placeholder="🔍 ルーム名検索..." class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50 focus:outline-none">
                <select id="roomSelect" onchange="loadSingleRoomMessages()" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white shadow-inner focus:outline-none">
                    <option value="">-- ルームを選択 --</option>
                </select>
            </div>
            <div id="singleRoomMessageContainer" class="space-y-3"></div>
        </div>
    </div>

    <!-- ================= モーダル ================= -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-40 hidden" onclick="closeAllModals()"></div>

    <!-- 🔑 セラー情報表示モーダル -->
    <div id="modalSellerInfo" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-sm bg-white rounded-xl shadow-2xl z-50 hidden flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-indigo-50 rounded-t-xl">
            <h2 class="font-bold text-indigo-900">🔑 紐づくセラー情報</h2>
            <button onclick="closeAllModals()" class="text-slate-500 hover:text-slate-800 font-bold text-xl px-2">&times;</button>
        </div>
        <div class="p-4 space-y-3 text-sm">
            <div>
                <span class="text-xs text-slate-500 font-bold block">管理番号</span>
                <span id="sellerModalKanriNo" class="font-bold text-slate-800">-</span>
            </div>
            <div>
                <span class="text-xs text-slate-500 font-bold block">お名前 / ショップ名</span>
                <span id="sellerModalName" class="font-bold text-slate-800">-</span> (<span id="sellerModalShopName">-</span>)
            </div>
            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2">
                <div>
                    <span class="text-xs text-indigo-600 font-bold block">ログインID</span>
                    <div class="flex items-center justify-between bg-white p-2 rounded border border-slate-200 mt-0.5">
                        <span id="sellerModalId" class="font-mono text-xs select-all">-</span>
                    </div>
                </div>
                <div>
                    <span class="text-xs text-indigo-600 font-bold block">パスワード</span>
                    <div class="flex items-center justify-between bg-white p-2 rounded border border-slate-200 mt-0.5">
                        <span id="sellerModalPass" class="font-mono text-xs select-all">-</span>
                    </div>
                </div>
            </div>
            <button onclick="closeAllModals()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded-lg text-xs transition">
                閉じる
            </button>
        </div>
    </div>

    <!-- スタッフ間連絡 直接登録モーダル -->
    <div id="modalLinkCopy" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-md bg-white rounded-xl shadow-2xl z-50 hidden flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-indigo-50 rounded-t-xl">
            <h2 class="font-bold text-indigo-900">🔗 スタッフ間連絡アプリに登録</h2>
            <button onclick="closeAllModals()" class="text-slate-500 hover:text-slate-800 font-bold text-xl px-2">&times;</button>
        </div>
        <div class="p-4 space-y-3">
            <input type="hidden" id="linkRoomId">
            <input type="hidden" id="linkRoomName">
            <input type="hidden" id="linkSenderName">
            <input type="hidden" id="linkMessageBody">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">👤 From (依頼者・担当者など)</label>
                <input type="text" id="linkFromInput" placeholder="例：松下" class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">🎯 To (宛先スタッフなど)</label>
                <input type="text" id="linkToInput" placeholder="例：スタッフ全員 / 〇〇さん" class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">📝 軽いメモ (自由記述)</label>
                <textarea id="linkMemoInput" placeholder="依頼内容や補足事項など..." class="w-full h-20 border border-slate-300 rounded p-2 text-sm focus:outline-none"></textarea>
            </div>
            <button onclick="submitToStaffApp(this)" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow mt-2 active:scale-95 transition">
                🚀 スタッフ間連絡アプリに登録する
            </button>
        </div>
    </div>
    <!-- ========================================================= -->

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzbGircW91tKx9NIihoWRMCiyIYnVbJJoeJZ9IoUf5s6vI71zNVnqJOo38vSOqfeMYzzA/exec";
        
        let allRoomsCache = [];
        let currentMode = 'burst';
        const FROM_NAME_KEY = "chatwork_staff_from_name_v1";
        const LATER_KEY = "chatwork_later_rooms_v1";

        window.addEventListener('DOMContentLoaded', () => {
            updateLaterBadge();
            fetchAllUnreadRooms();
        });

        function getCurrentToken() { return document.getElementById('accountSelect').value; }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function closeAllModals() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('modalSellerInfo').style.display = 'none';
            document.getElementById('modalLinkCopy').style.display = 'none';
        }

        async function callGasApi(action, params = {}) {
            params.action = action;
            params.token = getCurrentToken();
            const query = new URLSearchParams(params).toString();
            const targetUrl = `${GAS_WEB_APP_URL}?${query}`;

            try {
                const res = await fetch(targetUrl);
                const text = await res.text();

                const data = JSON.parse(text);
                if (data.status !== "success") {
                    throw new Error(data.message || "GAS通信エラー");
                }
                return data;
            } catch (err) {
                throw err;
            }
        }

        function changeAccount() {
            if (currentMode === 'burst') fetchAllUnreadRooms();
            else if (currentMode === 'later') renderLaterRooms();
            else fetchNormalRooms();
        }

        function refreshCurrentView() {
            if (currentMode === 'burst') {
                fetchAllUnreadRooms();
            } else if (currentMode === 'later') {
                renderLaterRooms();
            } else {
                fetchNormalRooms();
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            const btnBurst = document.getElementById('tabBurst');
            const btnLater = document.getElementById('tabLater');
            const btnNormal = document.getElementById('tabNormal');
            const burstCont = document.getElementById('burstModeContainer');
            const laterCont = document.getElementById('laterModeContainer');
            const normalCont = document.getElementById('normalModeContainer');

            btnBurst.className = "flex-1 py-1.5 text-[11px] font-bold rounded-md text-slate-600 transition";
            btnLater.className = "flex-1 py-1.5 text-[11px] font-bold rounded-md text-slate-600 transition";
            btnNormal.className = "flex-1 py-1.5 text-[11px] font-bold rounded-md text-slate-600 transition";
            burstCont.style.display = 'none';
            laterCont.style.display = 'none';
            normalCont.style.display = 'none';

            if (mode === 'burst') {
                btnBurst.className = "flex-1 py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm transition";
                burstCont.style.display = 'block';
                fetchAllUnreadRooms();
            } else if (mode === 'later') {
                btnLater.className = "flex-1 py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm transition";
                laterCont.style.display = 'block';
                renderLaterRooms();
            } else {
                btnNormal.className = "flex-1 py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm transition";
                normalCont.style.display = 'block';
                fetchNormalRooms();
            }
        }

        function openChatworkOfficial(roomId) {
            window.open(`https://www.chatwork.com/#!rid${roomId}`, '_blank');
        }

        async function markRoomAsRead(roomId, lastChatId, btnEl) {
            if (btnEl) {
                btnEl.disabled = true;
                btnEl.textContent = "処理中...";
            }

            try {
                await callGasApi("mark_read", { room_id: roomId, last_chat_id: lastChatId || "" });
                refreshCurrentView();
            } catch (e) {
                alert('既読化失敗: ' + e.message);
                if (btnEl) {
                    btnEl.disabled = false;
                    btnEl.textContent = "📖 既読";
                }
            }
        }

        async function fetchSellerInfo(keyword) {
            if (!keyword) {
                alert("キーワードが見つかりません");
                return;
            }

            document.getElementById('sellerModalKanriNo').textContent = "読み込み中...";
            document.getElementById('sellerModalName').textContent = "-";
            document.getElementById('sellerModalShopName').textContent = "-";
            document.getElementById('sellerModalId').textContent = "-";
            document.getElementById('sellerModalPass').textContent = "-";
            
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalSellerInfo').style.display = 'flex';

            try {
                const data = await callGasApi("get_seller_info", { chatwork_id: keyword });
                
                if (!data.seller || data.seller.error) {
                    document.getElementById('sellerModalKanriNo').textContent = "見つかりませんでした";
                    return;
                }

                const seller = data.seller;
                document.getElementById('sellerModalKanriNo').textContent = seller.kanriNo || 'なし';
                document.getElementById('sellerModalName').textContent = seller.name || 'なし';
                document.getElementById('sellerModalShopName').textContent = seller.shopName || 'なし';
                document.getElementById('sellerModalId').textContent = seller.id || '未登録';
                document.getElementById('sellerModalPass').textContent = seller.pass || '未登録';

            } catch (e) {
                alert("セラー情報の取得に失敗しました: " + e.message);
                closeAllModals();
            }
        }

        function triggerCameraUpload(roomId) {
            const fileInput = document.getElementById(`camera_input_${roomId}`);
            if (fileInput) fileInput.click();
        }

        function triggerFileUpload(roomId) {
            const fileInput = document.getElementById(`file_input_${roomId}`);
            if (fileInput) fileInput.click();
        }

        async function handleFileSelected(roomId, fileInputEl) {
            const file = fileInputEl.files[0];
            if (!file) return;

            if (!confirm(`選択したファイル（${file.name}）をChatworkに送信しますか？`)) {
                fileInputEl.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Data = e.target.result.split(',')[1];
                const fileName = file.name || `file_${Date.now()}`;
                const mimeType = file.type || 'application/octet-stream';

                alert('ファイルをアップロード中...');

                try {
                    await callGasApi("upload_file", {
                        room_id: roomId,
                        file_data: base64Data,
                        file_name: fileName,
                        mime_type: mimeType
                    });

                    alert('📁 ファイルの送信が完了しました！');
                } catch (err) {
                    alert('送信失敗: ' + err.message);
                } finally {
                    fileInputEl.value = '';
                }
            };
            reader.readAsDataURL(file);
        }

        function getLaterRooms() {
            try { return JSON.parse(localStorage.getItem(LATER_KEY)) || {}; } catch(e) { return {}; }
        }

        function updateLaterBadge() {
            const later = getLaterRooms();
            const token = getCurrentToken();
            const list = later[token] || [];
            document.getElementById('laterCountBadge').textContent = list.length;
        }

        function toggleLaterRoom(roomId, roomName, senderName, messageBody, sendDateStr, btnEl) {
            let later = getLaterRooms();
            const token = getCurrentToken();
            if (!later[token]) later[token] = [];

            const index = later[token].findIndex(item => String(item.roomId) === String(roomId));
            if (index > -1) {
                later[token].splice(index, 1);
                btnEl.className = "bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 text-xs px-3 py-2 rounded font-bold shrink-0 transition";
                btnEl.textContent = "⏳ 後で対応する";
            } else {
                later[token].unshift({
                    roomId,
                    roomName,
                    senderName,
                    messageBody,
                    sendDateStr,
                    savedAt: Date.now()
                });
                btnEl.className = "bg-amber-600 text-white text-xs px-3 py-2 rounded font-bold shrink-0 transition";
                btnEl.textContent = "⏳ 後で対応中";
            }

            localStorage.setItem(LATER_KEY, JSON.stringify(later));
            updateLaterBadge();
        }

        function completeLaterRoom(roomId) {
            let later = getLaterRooms();
            const token = getCurrentToken();
            if (later[token]) {
                later[token] = later[token].filter(item => String(item.roomId) !== String(roomId));
                localStorage.setItem(LATER_KEY, JSON.stringify(later));
            }
            renderLaterRooms();
            updateLaterBadge();
        }

        async function fetchNormalRooms() {
            const selectEl = document.getElementById('roomSelect');
            selectEl.innerHTML = '<option value="">-- ルームを読み込み中... --</option>';

            try {
                if (!allRoomsCache || allRoomsCache.length === 0) {
                    const data = await callGasApi("get_rooms");
                    allRoomsCache = data.rooms || [];
                }
                renderNormalRoomOptions(allRoomsCache);
            } catch (e) {
                selectEl.innerHTML = '<option value="">-- ルームの取得に失敗しました --</option>';
            }
        }

        function renderNormalRoomOptions(rooms) {
            const selectEl = document.getElementById('roomSelect');
            let html = '<option value="">-- ルームを選択 --</option>';
            rooms.forEach(r => {
                html += `<option value="${r.room_id}">${escapeHtml(r.name)} (未読: ${r.unread_num})</option>`;
            });
            selectEl.innerHTML = html;
        }

        function filterNormalRooms() {
            const keyword = document.getElementById('roomSearchInput').value.toLowerCase();
            const filtered = allRoomsCache.filter(r => r.name.toLowerCase().includes(keyword));
            renderNormalRoomOptions(filtered);
        }

        function formatSimpleMessageBody(bodyText) {
            if (!bodyText) return '';
            return escapeHtml(bodyText)
                .replace(/[info]/g, '<div class="bg-indigo-50/40 border-l-2 border-indigo-500 p-2 my-1.5 rounded-r text-xs space-y-1">')
                .replace(/\[\/info\]/g, '</div>')
                .replace(/[title]/g, '<div class="font-bold text-indigo-900 text-[11px] border-b border-indigo-100 pb-0.5 mb-1">')
                .replace(/\[\/title\]/g, '</div>')
                .replace(/\n/g, '<br>');
        }

        async function loadSingleRoomMessages() {
            const roomId = document.getElementById('roomSelect').value;
            const container = document.getElementById('singleRoomMessageContainer');

            if (!roomId) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <div class="text-center text-xs text-slate-500 py-8 bg-white rounded-xl shadow-sm border border-slate-200">
                    <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-600 border-t-transparent mb-1"></div>
                    <div>メッセージを取得中...</div>
                </div>
            `;

            try {
                const roomData = await callGasApi("get_room_data", { room_id: roomId });
                const messages = roomData.messages || [];

                const selectedOpt = document.getElementById('roomSelect').options[document.getElementById('roomSelect').selectedIndex];
                const roomName = selectedOpt ? selectedOpt.textContent.split(' (未読:')[0] : '個別ルーム';
                const uniqueTextareaId = `normal_txt_${roomId}`;
                const latestMsg = messages.length > 0 ? messages[messages.length - 1] : null;
                const latestBody = latestMsg ? latestMsg.body : '';
                const latestMessageId = latestMsg ? latestMsg.message_id : '';
                const escapedBodyForModal = escapeHtml(latestBody).replace(/'/g, "\\'").replace(/\n/g, '\\n');

                const later = getLaterRooms();
                const isLater = (later[getCurrentToken()] || []).some(item => String(item.roomId) === String(roomId));

                let membersOpts = '<option value="">👤 宛先(To)を追加</option>';
                (roomData.members || []).forEach(m => {
                    membersOpts += `<option value="${m.account_id}" data-name="${escapeHtml(m.name)}">${escapeHtml(m.name)}</option>`;
                });

                let msgHtml = `
                    <div class="bg-white border-2 border-slate-200 rounded-xl p-3.5 shadow-sm space-y-2.5">
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <h3 class="font-bold text-sm text-slate-800">${escapeHtml(roomName)}</h3>
                            </div>
                            <div class="flex gap-1 shrink-0 flex-wrap justify-end">
                                <button onclick="fetchSellerInfo('${escapeHtml(roomName).replace(/'/g, "\\'")}')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded border border-indigo-200 font-bold">
                                    🔑 セラー
                                </button>
                                <input type="file" id="camera_input_${roomId}" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelected('${roomId}', this)">
                                <input type="file" id="file_input_${roomId}" class="hidden" onchange="handleFileSelected('${roomId}', this)">
                                <button onclick="triggerCameraUpload('${roomId}')" class="text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-800 px-2 py-1 rounded border border-emerald-300 font-bold">
                                    📷 写真
                                </button>
                                <button onclick="triggerFileUpload('${roomId}')" class="text-xs bg-cyan-100 hover:bg-cyan-200 text-cyan-800 px-2 py-1 rounded border border-cyan-300 font-bold">
                                    📁 ファイル
                                </button>

                        <div class="text-2xl">☕</div>
                        <div class="text-sm font-bold text-slate-700">「後で対応」に保存されたルームはありません。</div>
                    </div>
                `;

            }

            let html = '';

            for (const item of list) {
                const uniqueTextareaId = `later_txt_${item.roomId}`;
                const escapedBodyForModal = escapeHtml(item.messageBody).replace(/'/g, "\\'").replace(/\n/g, '\\n');
                const formattedLaterBody = formatSimpleMessageBody(item.messageBody || '');

                html += `

                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="bg-amber-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">⏳ 後で対応</span>
                                    <h3 class="font-bold text-sm text-slate-800">${escapeHtml(item.roomName)}</h3>
                                </div>
                            </div>
                            <div class="flex gap-1 shrink-0 flex-wrap justify-end">

                                    🔑 セラー
                                </button>
                                <input type="file" id="camera_input_${item.roomId}" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelected('${item.roomId}', this)">
                                <input type="file" id="file_input_${item.roomId}" class="hidden" onchange="handleFileSelected('${item.roomId}', this)">
                                <button onclick="triggerCameraUpload('${item.roomId}')" class="text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-800 px-2 py-1 rounded border border-emerald-300 font-bold">
                                    📷 写真
                                </button>
                                <button onclick="triggerFileUpload('${item.roomId}')" class="text-xs bg-cyan-100 hover:bg-cyan-200 text-cyan-800 px-2 py-1 rounded border border-cyan-300 font-bold">
                                    📁 ファイル
                                </button>
                                <button onclick="markRoomAsRead('${item.roomId}', '', this)" class="text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-800 px-2 py-1 rounded border border-indigo-300 font-bold">
                                    📖 既読
                                </button>
                                <button onclick="openChatworkOfficial('${item.roomId}')" class="text-xs bg-sky-100 hover:bg-sky-200 text-sky-800 px-2 py-1 rounded border border-sky-300 font-bold">

                                </button>
                            </div>
                        </div>
                        
                        <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg space-y-1">

                                    </button>

                        </div>

                            <div class="flex gap-1.5">

                        if (selectEl) {
                            let membersOpts = '<option value="">👤 宛先(To)を追加</option>';

        async function sendLaterReply(roomId, textareaId, btnEl) {
            const bodyText = document.getElementById(textareaId).value.trim();
            if (!bodyText) { alert('メッセージが空です。'); return; }
            if (!confirm('返信して「後で対応」リストから削除しますか？')) return;

            btnEl.disabled = true;
            btnEl.textContent = "送信中...";

            try {
                await callGasApi("send_message", { room_id: roomId, body: bodyText });

                let later = getLaterRooms();
                const token = getCurrentToken();
                if (later[token]) {
                    later[token] = later[token].filter(item => String(item.roomId) !== String(roomId));
                    localStorage.setItem(LATER_KEY, JSON.stringify(later));
                }

                btnEl.textContent = "✅ 送信完了＆リストから解除！";
                setTimeout(() => { renderLaterRooms(); updateLaterBadge(); }, 1000);
            } catch (e) {
                alert('送信失敗: ' + e.message);
                btnEl.disabled = false;
                btnEl.textContent = "📤 返信して対応完了にする";
            }
        }

        function openLinkCopyModal(roomId, roomName, senderName, messageBody) {
            document.getElementById('linkRoomId').value = roomId;
            document.getElementById('linkRoomName').value = roomName;
            document.getElementById('linkSenderName').value = senderName;
            document.getElementById('linkMessageBody').value = messageBody;
            
            const savedFrom = localStorage.getItem(FROM_NAME_KEY) || '';
            document.getElementById('linkFromInput').value = savedFrom;
            document.getElementById('linkToInput').value = '';
            document.getElementById('linkMemoInput').value = '';

            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalLinkCopy').style.display = 'flex';
        }

        function submitToStaffApp(btnEl) {
            const roomId = document.getElementById('linkRoomId').value;
            const roomName = document.getElementById('linkRoomName').value;
            const senderName = document.getElementById('linkSenderName').value;
            const messageBody = document.getElementById('linkMessageBody').value;
            const fromVal = document.getElementById('linkFromInput').value.trim();
            const toVal = document.getElementById('linkToInput').value.trim();
            const memoVal = document.getElementById('linkMemoInput').value.trim();

            if (fromVal) {
                localStorage.setItem(FROM_NAME_KEY, fromVal);
            }

            if (window.registerToStaffApp) {
                window.registerToStaffApp(roomId, roomName, senderName, messageBody, fromVal, toVal, memoVal, btnEl);
            } else {
                alert('Firebaseの初期化が完了していません。');
            }
        }

        async function fetchAllUnreadRooms() {
            const statusEl = document.getElementById('loadStatus');
            const burstCont = document.getElementById('burstModeContainer');
            statusEl.textContent = "スキャン中...";
            
            burstCont.innerHTML = `
                <div class="text-center text-xs text-slate-500 py-8 bg-white rounded-xl shadow-sm border border-slate-200">
                    <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-600 border-t-transparent mb-1"></div>

                </div>

            try {
                const data = await callGasApi("get_rooms");
                allRoomsCache = data.rooms || [];
                const unreadRooms = allRoomsCache.filter(r => r.unread_num > 0);

                updateLaterBadge();

                if (unreadRooms.length === 0) {
                    burstCont.innerHTML = `
                        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center space-y-2">
                            <div class="text-2xl">🎉</div>
                            <div class="text-sm font-bold text-slate-700">未読のルームはありません！すべて完了しています。</div>
                        </div>
                    `;
                    statusEl.textContent = "未読ゼロ";
                    statusEl.className = "text-xs bg-emerald-500 px-2 py-0.5 rounded-full text-white";
                    return;
                }

                burstCont.innerHTML = '';

                for (const room of unreadRooms) {
                    const roomId = room.room_id;
                    const cardId = `burst_card_${roomId}`;

                    let cardHtml = `
                        <div id="${cardId}" class="bg-white border-2 border-indigo-100 rounded-xl p-3.5 shadow-sm space-y-2.5">
                            <div class="flex justify-between items-start gap-2">
                                <div>
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        <span class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">未読 ${room.unread_num}件</span>
                                        <h3 class="font-bold text-sm text-slate-800">${escapeHtml(room.name)}</h3>
                                    </div>
                                </div>
                                <div class="flex gap-1 shrink-0 flex-wrap justify-end">
                                    <button onclick="fetchSellerInfo('${escapeHtml(room.name).replace(/'/g, "\\'")}')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded border border-indigo-200 font-bold">
                                        🔑 セラー
                                    </button>
                                    <input type="file" id="camera_input_${roomId}" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelected('${roomId}', this)">
                                    <input type="file" id="file_input_${roomId}" class="hidden" onchange="handleFileSelected('${roomId}', this)">
                                    <button onclick="triggerCameraUpload('${roomId}')" class="text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-800 px-2 py-1 rounded border border-emerald-300 font-bold">
                                        📷 写真
                                    </button>
                                    <button onclick="triggerFileUpload('${roomId}')" class="text-xs bg-cyan-100 hover:bg-cyan-200 text-cyan-800 px-2 py-1 rounded border border-cyan-300 font-bold">
                                        📁 ファイル
                                    </button>
                                    <button id="read_btn_${roomId}" class="text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-800 px-2 py-1 rounded border border-indigo-300 font-bold">
                                        📖 既読
                                    </button>
                                    <button onclick="openChatworkOfficial('${roomId}')" class="text-xs bg-sky-100 hover:bg-sky-200 text-sky-800 px-2 py-1 rounded border border-sky-300 font-bold">
                                        🌐 公式
                                    </button>
                                </div>
                            </div>
                            <div class="burst-msg-area text-xs text-slate-500 p-2 bg-slate-50 rounded">メッセージを読み込み中...</div>
                        </div>
                    `;
                    burstCont.innerHTML += cardHtml;
                }

                unreadRooms.forEach(async (room) => {
                    const roomId = room.room_id;
                    const roomName = room.name;
                    const cardEl = document.getElementById(`burst_card_${roomId}`);
                    if (!cardEl) return;
                    const msgArea = cardEl.querySelector('.burst-msg-area');

                    try {
                        const roomData = await callGasApi("get_room_data", { room_id: roomId });

                        let messages = roomData.messages || [];
                        const readBtn = document.getElementById(`read_btn_${roomId}`);

                        if (messages.length === 0) {
                            msgArea.innerHTML = '<span class="text-slate-400">メッセージなし</span>';
                            if (readBtn) readBtn.onclick = () => markRoomAsRead(roomId, '', readBtn);
                            return;
                        }

                        const latestMsg = messages[messages.length - 1];
                        const latestMessageId = latestMsg.message_id || '';
                        if (readBtn) {
                            readBtn.onclick = () => markRoomAsRead(roomId, latestMessageId, readBtn);
                        }

                        const senderName = latestMsg.account && latestMsg.account.name ? latestMsg.account.name : '不明';
                        const msgTime = latestMsg.send_time || '';
                        let sendDateStr = msgTime ? new Date(msgTime * 1000).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
                        const uniqueTextareaId = `burst_txt_${roomId}`;
                        const formattedLatestBody = formatSimpleMessageBody(latestMsg.body || '');
                        const escapedBodyForModal = escapeHtml(latestMsg.body).replace(/'/g, "\\'").replace(/\n/g, '\\n');
                        const escapedBodyForLater = escapeHtml(latestMsg.body).replace(/'/g, "\\'").replace(/\n/g, '\\n');

                        const later = getLaterRooms();
                        const isLater = (later[getCurrentToken()] || []).some(item => String(item.roomId) === String(roomId));

                        let membersOpts = '<option value="">👤 宛先(To)を追加</option>';
                        (roomData.members || []).forEach(m => {

                                                🔗 連携
                                            </button>
                                       </div>
                                    </div>
                                   <div class="text-xs text-slate-700 whitespace-pre-wrap">${formattedLatestBody}</div>
                                </div>

                                <div class="space-y-2 pt-1">
                                    <div class="flex gap-1.5">
                                     <select onchange="insertMention(this, '${uniqueTextareaId}')" class="flex-1 text-xs border border-slate-300 rounded p-1.5 bg-white font-bold focus:outline-none">
                                            ${membersOpts}
                                     </select>
                                    </div>
                                    <textarea id="${uniqueTextareaId}" class="w-full h-20 text-xs p-2 border border-slate-300 rounded bg-white focus:outline-none" placeholder="返信内容を入力..."></textarea>
                                    
                                    <div class="flex gap-2">
                                     <button onclick="toggleLaterRoom('${roomId}', '${escapeHtml(roomName).replace(/'/g, "\\'")}', '${escapeHtml(senderName).replace(/'/g, "\\'")}', '${escapedBodyForLater}', '${sendDateStr}', this)" class="${isLater ? 'bg-amber-600 text-white' : 'bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300'} text-xs px-3 py-2 rounded font-bold shrink-0 transition">

                                     <button onclick="sendBurstReply('${roomId}', '${uniqueTextareaId}', this)" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2 rounded font-bold shadow-sm active:scale-95 transition">
                                            📤 このルームに返信する
                                     </button>
                                    </div>
                                </div>
                            </div>
                          `;
                    } catch (err) {
                        msgArea.innerHTML = '<span class="text-red-500">取得失敗</span>';
                    }
                });

                statusEl.textContent = `未読 ${unreadRooms.length}件`;
                statusEl.className = "text-xs bg-amber-500 px-2 py-0.5 rounded-full text-white";

            } catch (e) {
                burstCont.innerHTML = `<div class="text-xs text-red-500 text-center p-4">エラー: ${e.message}</div>`;
                statusEl.textContent = "エラー";
            }
        }

        async function sendBurstReply(roomId, textareaId, btnEl) {
            const bodyText = document.getElementById(textareaId).value.trim();
            if (!bodyText) { alert('メッセージが空です。'); return; }
            if (!confirm('この内容で送信しますか？')) return;

            btnEl.disabled = true;
            btnEl.textContent = "送信中...";

            try {
                await callGasApi("send_message", { room_id: roomId, body: bodyText });

                let later = getLaterRooms();
                const token = getCurrentToken();
                if (later[token]) {
                    later[token] = later[token].filter(item => String(item.roomId) !== String(roomId));
                    localStorage.setItem(LATER_KEY, JSON.stringify(later));
                    updateLaterBadge();
                }

                btnEl.textContent = "✅ 送信完了！";
                btnEl.className = "w-full bg-slate-300 text-white text-xs py-2 rounded cursor-default";
                btnEl.closest('.bg-white').style.opacity = '0.6';
            } catch (e) {
                alert('送信失敗: ' + e.message);
                btnEl.disabled = false;
                btnEl.textContent = "📤 このルームに返信する";
            }
        }

        function insertMention(selectEl, textareaId) {
            const val = selectEl.value;
            const name = selectEl.options[selectEl.selectedIndex].getAttribute('data-name');
            if (!val) return;
            const txt = document.getElementById(textareaId);
            txt.value += `[To:${val}] ${name}さん\n`;
            selectEl.value = "";
        }
    </script>
