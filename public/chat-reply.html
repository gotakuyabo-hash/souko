<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>未読バーストコックピット</title>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .btn { height: 44px; border-radius: 12px; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 12px; cursor: pointer; transition: transform .1s; white-space: nowrap; }
        .btn:active { transform: scale(.97); }
        .btn:disabled { opacity: .5; }
        .btn-sub  { background: #f1f5f9; color: #334155; }
        .btn-main { background: #4f46e5; color: #fff; }
        .btn-ok   { background: #059669; color: #fff; }
        .btn-ai   { background: linear-gradient(90deg, #7c3aed, #4f46e5); color: #fff; }
        .inp { width: 100%; border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px 12px; font-size: 16px; background: #fff; }
        .inp:focus { outline: 2px solid #818cf8; outline-offset: 0; border-color: transparent; }
        .clamp { display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
        .clamp-s { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .msg-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.7; }
        .tab-btn { height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: #94a3b8; cursor: pointer; }
        .tab-btn .ico { font-size: 22px; line-height: 1; filter: grayscale(1); opacity: .6; }
        .tab-btn.active { color: #4f46e5; }
        .tab-btn.active .ico { filter: none; opacity: 1; }
        .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 28rem; margin: 0 auto; background: #fff; border-radius: 20px 20px 0 0; max-height: 88vh; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); display: none; box-shadow: 0 -8px 30px rgba(0,0,0,.15); }
        .sheet-head { position: sticky; top: 0; background: #fff; padding: 10px 20px 12px; border-bottom: 1px solid #f1f5f9; z-index: 1; }
        .sheet-head::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 9px; background: #cbd5e1; margin: 0 auto 10px; }
        .sheet-row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 20px; font-size: 16px; font-weight: 600; text-align: left; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .sheet-row:active { background: #f8fafc; }
        .field-label { font-size: 12px; color: #64748b; font-weight: 700; display: block; margin-bottom: 2px; }
        .mine { background: #eef2ff; border-radius: 12px; padding: 8px 10px; margin: 0 -4px; }
        .room-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px 16px; text-align: left; cursor: pointer; }
        .room-row:active { background: #f8fafc; }
        #toast { transition: opacity .2s; }

        /* 画面の幅（スマホは今まで通り、PCは広く使う） */
        .app-w { width: 100%; max-width: 28rem; }
        @media (min-width: 1024px) {
            .app-w { max-width: 1100px; }
            /* 要対応・後で：カードを2列に並べる */
            #burstModeContainer, #laterModeContainer { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
            #burstModeContainer > *, #laterModeContainer > * { margin-top: 0 !important; }
            #burstModeContainer > :not(.burst-card), #laterModeContainer > :not(.burst-card) { grid-column: 1 / -1; }
            /* ルーム：読みやすい幅で中央に */
            #normalModeContainer { max-width: 760px; margin: 0 auto; }
            /* 下から出るシートは、画面中央のウィンドウに */
            .sheet { top: 50%; bottom: auto; transform: translateY(-50%); max-width: 32rem; max-height: 80vh; border-radius: 20px; padding-bottom: 0; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
            .sheet-head::before { display: none; }
            .sheet-head { padding-top: 14px; }
            .btn:hover { filter: brightness(.96); }
            .room-row:hover, .sheet-row:hover { background: #f8fafc; }
            .tab-btn:hover { color: #6366f1; }
        }
    </style>

<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-30 bg-indigo-600 text-white shadow" style="padding-top: env(safe-area-inset-top, 0px);">
        <div class="app-w mx-auto px-3 py-2.5 flex items-center gap-2">
            <select id="accountSelect" onchange="onAccountChange()" class="flex-1 min-w-0 bg-indigo-500 text-white font-bold rounded-xl px-3 h-11 text-[16px] border-0">
                <option value="staff" selected>ラクロジスタッフ</option>
                <option value="matsushita">松下</option>
            </select>
            <span id="loadStatus" class="shrink-0 text-xs font-bold bg-indigo-500 px-2.5 py-1 rounded-full">読込中</span>
            <button onclick="openAiRules()" class="shrink-0 w-11 h-11 rounded-xl bg-indigo-700 text-lg cursor-pointer" aria-label="AI文章ルール">⚙️</button>
            <button onclick="refreshCurrentView(true)" class="shrink-0 w-11 h-11 rounded-xl bg-indigo-700 text-lg cursor-pointer" aria-label="更新">🔄</button>
        </div>
    </header>

    <div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[60] bg-slate-900 text-white text-sm font-bold px-4 py-2.5 rounded-full shadow-lg pointer-events-none opacity-0 text-center" style="top: calc(70px + env(safe-area-inset-top, 0px)); max-width: 90vw;"></div>

    <main class="app-w mx-auto px-3 pt-3" style="padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px));">

        <!-- 一覧用ツールバー（未読・後で） -->
        <div id="listToolbar" class="flex items-center justify-between mb-2 px-1 gap-2">
            <label class="flex items-center gap-2 text-sm font-bold text-slate-600 py-2 cursor-pointer shrink-0">
                <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)" class="w-5 h-5 accent-indigo-600"> すべて
            </label>
            <span id="lastUpdated" class="text-xs text-slate-400 truncate"></span>
            <button onclick="copyAllUnreadChats()" class="text-sm font-bold text-indigo-700 py-2 px-1 cursor-pointer shrink-0">📋 全部コピー</button>
        </div>

        <div id="burstModeContainer" class="space-y-3"></div>
        <div id="laterModeContainer" class="space-y-3" style="display:none;"></div>

        <div id="normalModeContainer" style="display:none;">
            <!-- ルーム一覧 -->
            <div id="roomListView">
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <button id="chipAll" onclick="setRoomFilter('all')" class="btn btn-main">すべてのルーム</button>
                    <button id="chipOption" onclick="setRoomFilter('option')" class="btn btn-sub">🎥 撮影オプション</button>
                </div>
                <input type="search" id="roomSearchInput" oninput="renderRoomList()" placeholder="🔍 ルーム名で検索" class="inp mb-3">
                <div id="optionHeader" class="mb-3" style="display:none;"></div>
                <div id="roomList" class="bg-white rounded-2xl shadow-sm divide-y divide-slate-100 overflow-hidden"></div>
            </div>
            <!-- ルームの中身 -->
            <div id="roomDetailView" style="display:none;">
                <button onclick="backToRoomList()" class="text-indigo-700 font-bold text-base py-2 px-1 mb-1 cursor-pointer">← ルーム一覧</button>
                <div id="singleRoomMessageContainer" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <!-- 選択中バー -->
    <div id="selectionBar" class="fixed inset-x-0 z-30" style="display:none; bottom: calc(60px + env(safe-area-inset-bottom, 0px));">
        <div class="app-w mx-auto px-3 pb-2">
            <div class="bg-slate-900 text-white rounded-2xl flex items-center justify-between pl-4 pr-2 py-2 shadow-lg">
                <span class="text-sm font-bold"><span id="selectedCount">0</span>件 選択中</span>
                <button onclick="batchMarkAsRead()" class="btn btn-ok">✓ 対応済みにする</button>
            </div>
        </div>
    </div>

    <!-- 下部タブ -->
    <nav class="fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
        <div class="app-w mx-auto grid grid-cols-3">
            <button id="tabBurst" class="tab-btn active" onclick="switchMode('burst')"><span class="ico">🚨</span>要対応</button>
            <button id="tabLater" class="tab-btn" onclick="switchMode('later')"><span class="ico">⏳</span><span>後で (<span id="laterCountBadge">0</span>)</span></button>
            <button id="tabNormal" class="tab-btn" onclick="switchMode('normal')"><span class="ico">📁</span>ルーム</button>
        </div>
    </nav>

    <!-- シート類 -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/50 z-40" style="display:none;" onclick="closeAllModals()"></div>

    <div id="sheetActions" class="sheet">
        <div class="sheet-head"><div id="sheetActionsTitle" class="font-bold text-base truncate text-center"></div></div>
        <div id="sheetActionsBody"></div>
        <button onclick="closeAllModals()" class="sheet-row justify-center text-slate-500">閉じる</button>
    </div>

    <div id="modalSellerInfo" class="sheet">
        <div class="sheet-head"><div class="font-bold text-base text-center">🔑 セラー情報</div></div>
        <div class="p-5 space-y-4">
            <div><span class="field-label">管理番号</span><span id="sellerModalKanriNo" class="font-bold text-base">-</span> <span id="sellerModalSheet" class="text-xs text-slate-400"></span></div>
            <div><span class="field-label">お名前 / ショップ名</span><span id="sellerModalName" class="font-bold text-base">-</span><div id="sellerModalShopName" class="text-sm text-slate-600">-</div></div>
            <div class="bg-indigo-50 p-4 rounded-xl space-y-3">
                <div><span class="field-label text-indigo-700">ログインID</span><span id="sellerModalId" class="font-mono text-base select-all break-all">-</span></div>
                <div><span class="field-label text-indigo-700">パスワード</span><span id="sellerModalPass" class="font-mono text-base select-all break-all">-</span></div>
            </div>
            <div id="sellerModalExtras" class="space-y-3"></div>
            <button onclick="closeAllModals()" class="btn btn-sub w-full">閉じる</button>
        </div>
    </div>

    <div id="modalLinkCopy" class="sheet">
        <div class="sheet-head"><div class="font-bold text-base text-center">🚀 スタッフ連絡に登録</div></div>
        <div class="p-5 space-y-3">
            <input type="hidden" id="linkRoomId"><input type="hidden" id="linkRoomName"><input type="hidden" id="linkSenderName"><input type="hidden" id="linkMessageBody">
            <div class="grid grid-cols-2 gap-2">
                <div><label class="field-label">From</label><input type="text" id="linkFromInput" value="松下" class="inp"></div>
                <div><label class="field-label">To</label><input type="text" id="linkToInput" value="スタッフ全員" class="inp"></div>
            </div>
            <div><label class="field-label">メモ（任意）</label><textarea id="linkMemoInput" rows="3" class="inp"></textarea></div>
            <div><label class="field-label">画像（任意）</label><input type="file" id="linkImageInput" accept="image/*" class="inp text-sm bg-slate-50"></div>
            <button onclick="registerToStaffApp(this)" class="btn btn-main w-full">🚀 登録する</button>
        </div>
    </div>

    <div id="modalAiRules" class="sheet">
        <div class="sheet-head"><div class="font-bold text-base text-center">🤖 AI文章ルール</div></div>
        <div class="p-5 space-y-4">
            <div id="aiRulesInfo" class="text-xs text-slate-500">読み込み中…</div>
            <div>
                <div class="flex items-center justify-between"><label class="field-label">共通ルール（すべてのルーム）</label><button onclick="fillAiDefault('common')" class="text-xs font-bold text-indigo-600 py-1 cursor-pointer">初期値を入れる</button></div>
                <textarea id="aiRule_common" rows="10" class="inp text-sm"></textarea>
            </div>
            <div>
                <div class="flex items-center justify-between"><label class="field-label">社外ルーム（セラー様・取引先様）</label><button onclick="fillAiDefault('external')" class="text-xs font-bold text-indigo-600 py-1 cursor-pointer">初期値を入れる</button></div>
                <textarea id="aiRule_external" rows="5" class="inp text-sm"></textarea>
            </div>
            <div>
                <div class="flex items-center justify-between"><label class="field-label">社内ルーム</label><button onclick="fillAiDefault('internal')" class="text-xs font-bold text-indigo-600 py-1 cursor-pointer">初期値を入れる</button></div>
                <textarea id="aiRule_internal" rows="5" class="inp text-sm"></textarea>
            </div>
            <div>
                <div class="flex items-center justify-between"><label class="field-label">社内ルームのID（カンマ区切り）</label><button onclick="fillAiDefault('internalRoomIds')" class="text-xs font-bold text-indigo-600 py-1 cursor-pointer">初期値を入れる</button></div>
                <input type="text" id="aiRule_internalRoomIds" class="inp text-sm" placeholder="例：380072256,123456789" inputmode="numeric">
                <div class="text-xs text-slate-500 mt-1">ルームIDは、ChatworkのURLの「rid」のあとの数字です</div>
            </div>
            <div class="text-xs text-slate-500">空欄の項目は、GASに書いてある初期値が使われます。保存すると1分以内に反映されます。</div>
            <button id="aiRulesSaveBtn" onclick="saveAiRules(this)" class="btn btn-main w-full">💾 保存する</button>
            <button onclick="closeAllModals()" class="btn btn-sub w-full">閉じる</button>
        </div>
    </div>

    <div id="modalEditMsg" class="sheet">
        <div class="sheet-head"><div class="font-bold text-base text-center">✏️ メッセージを編集</div></div>
        <div class="p-5 space-y-4">
            <div id="editMsgInfo" class="text-xs text-slate-500"></div>
            <textarea id="editMsgText" rows="8" class="inp"></textarea>
            <div class="text-xs text-slate-500">先頭の [To:…] や [rp …] は宛先・返信のしるしです。消すと宛先が外れます。</div>
            <button id="editMsgSaveBtn" onclick="saveEditMsg(this)" class="btn btn-main w-full">💾 編集を保存</button>
            <button onclick="closeAllModals()" class="btn btn-sub w-full">閉じる</button>
        </div>
    </div>

    <!-- 画像ビューア -->
    <div id="imageViewer" class="fixed inset-0 z-[70] bg-black/95 flex-col" style="display:none;">
        <div class="flex items-center gap-2 px-3 text-white" style="padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px;">
            <div id="viewerName" class="flex-1 min-w-0 truncate text-sm font-bold"></div>
            <button onclick="closeViewer()" class="w-11 h-11 text-2xl shrink-0 cursor-pointer" aria-label="閉じる">✕</button>
        </div>
        <div class="flex-1 min-h-0 flex items-center justify-center overflow-auto p-2" onclick="if(event.target===this) closeViewer()">
            <div id="viewerLoading" class="text-white text-base">読み込み中…</div>
            <div id="viewerError" class="text-white text-base text-center px-6 leading-relaxed" style="display:none;"></div>
            <img id="viewerImg" alt="" class="max-w-full max-h-full object-contain" style="display:none;">
        </div>
        <div class="px-3" style="padding-top: 8px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));">
            <button id="viewerDownloadBtn" class="btn btn-sub w-full">⬇ ダウンロード</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://asia-northeast1-souko-2de57.cloudfunctions.net/api";   // Cloud Functions（元のGAS：https://script.google.com/macros/s/AKfycbzbGircW91tKx9NIihoWRMCiyIYnVbJJoeJZ9IoUf5s6vI71zNVnqJOo38vSOqfeMYzzA/exec）
        const SECRET_KEY = "chatwork_cockpit_secret_v1";
        const BUNDLE_CACHE_KEY = "cw_unread_bundle_v2_";
        const LATER_CACHE_KEY = "cw_later_cache_v1_";
        const OLD_LATER_KEY = "chatwork_later_rooms_v2";   // 以前の端末保存（共有化のため移行）
        const MYIDS_KEY = "cw_my_ids_v1";
        const AUTO_REFRESH_MS = 30 * 1000;                 // アプリに戻った時、30秒以上経っていれば自動更新
        const MAX_SHOW = 5;                                // 未読カードに表示する最大件数

        let allRoomsCache = [];
        let roomMembersCache = {};
        let currentMode = 'burst';
        let currentRoomId = null;
        let lastFetchAt = 0;
        let myIds = new Set(JSON.parse(localStorage.getItem(MYIDS_KEY) || "[]"));
        window.messageStore = {};
        window.roomNameMap = {};

        window.addEventListener('DOMContentLoaded', () => {
            updateLaterBadge();
            restoreHandledCache(getAccount());
            loadMsgCache();
            fetchAllUnreadRooms();
            setTimeout(() => { loadOptionSellers(false); startOptionOvSync(); }, 1500);
        });

        // アプリに戻ってきた時に自動更新
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            if (Date.now() - lastFetchAt < AUTO_REFRESH_MS) return;
            if (currentMode === 'burst') fetchAllUnreadRooms(false);
            else if (currentMode === 'later') renderLaterRooms(false);
            else if (currentMode === 'normal' && !currentRoomId) fetchNormalRooms(true);
        });

        document.addEventListener('change', e => {
            if (e.target.classList && e.target.classList.contains('room-checkbox')) updateSelectionBar();
        });

        // ===== Firestore（使う時だけ読み込む） =====
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
            authDomain: "souko-2de57.firebaseapp.com",
            projectId: "souko-2de57",
            storageBucket: "souko-2de57.firebasestorage.app",
            messagingSenderId: "642116656086",
            appId: "1:642116656086:web:139cc5558a4ef6ebda6277"
        };
        const FS_TS = "__SERVER_TIMESTAMP__";
        let _fsPromise = null;
        // 端末ごとのID（ログインの記録用）
        function deviceId() {
            let d = localStorage.getItem('cw_device_id');
            if (!d) {
                d = ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9]/g, '').slice(0, 32);
                localStorage.setItem('cw_device_id', d);
            }
            return d;
        }

        // Firestore（合言葉ログイン付き）。最初の1回だけGASから通行証をもらい、以降は自動ログイン
        function loadFirestore() {
            if (!_fsPromise) {
                _fsPromise = (async () => {
                    const [appMod, fsMod, authMod] = await Promise.all([
                        import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"),
                        import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"),
                        import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js")
                    ]);
                    const app = appMod.initializeApp(FIREBASE_CONFIG);
                    const auth = authMod.getAuth(app);
                    await new Promise(res => { const un = authMod.onAuthStateChanged(auth, () => { un(); res(); }); });
                    if (!auth.currentUser) {
                        try {
                            const t = await callApi("get_fb_token", { device_id: deviceId() });
                            await authMod.signInWithCustomToken(auth, t.token);
                        } catch (e) {
                            console.warn('Firestoreへのログインに失敗しました（ルール設定前なら問題ありません）:', e.message);
                        }
                    }
                    let db;
                    try {
                        db = fsMod.initializeFirestore(app, { localCache: fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() }) });
                    } catch (e) {
                        db = fsMod.getFirestore(app);
                    }
                    return {
                        db: db, collection: fsMod.collection, addDoc: fsMod.addDoc, serverTimestamp: fsMod.serverTimestamp,
                        doc: fsMod.doc, getDoc: fsMod.getDoc, setDoc: fsMod.setDoc, onSnapshot: fsMod.onSnapshot,
                        query: fsMod.query, where: fsMod.where, writeBatch: fsMod.writeBatch, deleteDoc: fsMod.deleteDoc, getDocs: fsMod.getDocs,
                        signOut: () => authMod.signOut(auth)
                    };
                })().catch(err => { _fsPromise = null; throw err; });
            }
            return _fsPromise;
        }

        // 通行証が古くなった時（合言葉・世代番号を変えた時）は、ログインし直して再読み込み
        function handleFsDenied(err) {
            if (!err || err.code !== 'permission-denied') return;
            if (sessionStorage.getItem('cw_reauth')) {
                showToast('Firestoreの読み込みが許可されていません。合言葉を確認してください');
                return;
            }
            sessionStorage.setItem('cw_reauth', '1');
            loadFirestore().then(f => f.signOut()).catch(() => {}).finally(() => location.reload());
        }
        async function fsAdd(collectionName, data) {
            const f = await loadFirestore();
            const doc = {};
            Object.keys(data).forEach(k => { doc[k] = data[k] === FS_TS ? f.serverTimestamp() : data[k]; });
            return f.addDoc(f.collection(f.db, collectionName), doc);
        }

        // ===== 共通 =====
        function getAccount() { return document.getElementById('accountSelect').value; }
        function esc(str) {
            return (str === undefined || str === null) ? '' : String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function safeId(id) { return String(id || '').replace(/[^0-9]/g, ''); }
        function getUnread(r) { return Number(r.unread_num !== undefined ? r.unread_num : (r.unread_count || 0)); }
        function isMine(m) { return !!(m && m.account && myIds.has(String(m.account.account_id))); }
        function senderName(m) { return m && m.account ? m.account.name : "相手"; }
        function hm(d) { return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = 1;
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.style.opacity = 0, 2200);
        }

        function fmtTime(sec) {
            if (!sec) return '';
            const d = new Date(sec * 1000);
            return d.toDateString() === new Date().toDateString() ? `今日 ${hm(d)}` : `${d.getMonth() + 1}/${d.getDate()} ${hm(d)}`;
        }

        function setLastUpdated(fromCache) {
            const el = document.getElementById('lastUpdated');
            el.textContent = fromCache ? '前回の内容を表示中…' : `最終更新 ${hm(new Date())}`;
        }

        function updateMyIds(ids) {
            if (!Array.isArray(ids)) return;
            myIds = new Set(ids.map(String));
            try { localStorage.setItem(MYIDS_KEY, JSON.stringify(ids)); } catch (e) {}
        }

        function cleanBody(b) {
            return String(b || '')
                .replace(/\[download:\d+\][\s\S]*?\[\/download\]/g, '')
                .replace(/\[To:\d+\]/g, '@')
                .replace(/\[toall\]/gi, '@全員 ')
                .replace(/\[rp aid=\d+ to=\d+-\d+\]/g, '↩ ')
                .replace(/\[(piconname|picon):\d+\]/g, '')
                .replace(/\[qt\]\[qtmeta[^\]]*\]/g, '＞ ')
                .replace(/\[\/qt\]/g, '\n')
                .replace(/\[\/?info\]/g, '')
                .replace(/\[title\]/g, '【').replace(/\[\/title\]/g, '】\n')
                .replace(/\[hr\]/g, '──────')
                .replace(/\[preview[^\]]*\]/g, '')
                .replace(/\[dtext:[^\]]*\]/g, '')
                .replace(/\[\/?code\]/g, '')
                .replace(/【\s*】\n?/g, '')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        // AI・コピー用の1行（自社の発言には【自社】を付ける）
        function lineFor(m) {
            const files = parseFiles(m.body);
            const text = cleanBody(m.body) + (files.length ? '\n' + files.map(f => '📎 ' + f.name).join('\n') : '');
            return `${isMine(m) ? '【自社】' : ''}${senderName(m)}: ${text}`;
        }

        // ===== 添付ファイル =====
        const fileNameMap = {};
        const fileUrlCache = {};
        const URL_CACHE_MS = 3 * 60 * 1000;

        function parseFiles(raw) {
            const files = [];
            const re = /\[download:(\d+)\]([\s\S]*?)\[\/download\]/g;
            let m;
            while ((m = re.exec(String(raw || ''))) !== null) {
                const name = m[2].trim();
                const base = name.replace(/\s*\([\d.,]+\s*[KMGT]?B\)\s*$/i, '');
                files.push({ id: m[1], name: name, base: base });
                fileNameMap[m[1]] = base;
            }
            return files;
        }
        function isImageFile(name) { return /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(name || ''); }

        function attachmentsHtml(roomId, files) {
            if (!files || files.length === 0) return '';
            const rid = safeId(roomId);
            return `<div class="mt-2 space-y-2">` + files.map(f => {
                const img = isImageFile(f.base);
                return `
                    <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-xl p-2 pl-3">
                        <span class="text-xl shrink-0">${img ? '🖼️' : '📄'}</span>
                        <span class="flex-1 min-w-0 text-sm truncate">${esc(f.name)}</span>
                        ${img ? `<button onclick="previewImage('${rid}', '${safeId(f.id)}')" class="btn btn-main shrink-0" style="height:38px">見る</button>` : ''}
                        <button onclick="downloadFile('${rid}', '${safeId(f.id)}')" class="btn btn-sub shrink-0" style="height:38px">⬇ 保存</button>
                    </div>`;
            }).join('') + `</div>`;
        }

        async function getFileUrl(roomId, fileId) {
            const c = fileUrlCache[fileId];
            if (c && Date.now() - c.t < URL_CACHE_MS) return c.url;
            const data = await callApi("get_room_file", { room_id: roomId, file_id: fileId });
            const url = data.file && data.file.download_url;
            if (!url) throw new Error("ファイルのURLを取得できませんでした");
            fileUrlCache[fileId] = { url: url, t: Date.now() };
            return url;
        }

        window.previewImage = async function(roomId, fileId) {
            const viewer = document.getElementById('imageViewer');
            const img = document.getElementById('viewerImg');
            const loading = document.getElementById('viewerLoading');
            const err = document.getElementById('viewerError');
            document.getElementById('viewerName').textContent = fileNameMap[fileId] || '';
            document.getElementById('viewerDownloadBtn').onclick = () => downloadFile(roomId, fileId);
            img.style.display = 'none';
            img.removeAttribute('src');
            err.style.display = 'none';
            loading.style.display = 'block';
            viewer.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            try {
                const url = await getFileUrl(roomId, fileId);
                img.onload = () => { loading.style.display = 'none'; img.style.display = 'block'; };
                img.onerror = () => {
                    loading.style.display = 'none';
                    err.textContent = 'この端末では画像を表示できませんでした（HEIC形式など）。下の「ダウンロード」から開いてください。';
                    err.style.display = 'block';
                };
                img.src = url;
            } catch (e) {
                loading.style.display = 'none';
                err.textContent = '読み込みに失敗しました：' + e.message;
                err.style.display = 'block';
            }
        };
        window.closeViewer = function() {
            document.getElementById('imageViewer').style.display = 'none';
            document.getElementById('viewerImg').removeAttribute('src');
            document.body.style.overflow = '';
        };
        window.downloadFile = async function(roomId, fileId) {
            const c = fileUrlCache[fileId];
            if (c && Date.now() - c.t < URL_CACHE_MS) { window.open(c.url, '_blank'); return; }
            const w = window.open('', '_blank');
            if (w) w.document.write('<p style="font-family:sans-serif;font-size:18px;padding:24px">ファイルを準備中…</p>');
            try {
                const url = await getFileUrl(roomId, fileId);
                if (w) w.location.href = url; else location.href = url;
            } catch (e) {
                if (w) w.close();
                alert("ダウンロードに失敗しました: " + e.message);
            }
        };

        // ===== シート =====
        function openSheet(id) {
            ['sheetActions', 'modalSellerInfo', 'modalLinkCopy', 'modalAiRules', 'modalEditMsg'].forEach(s => document.getElementById(s).style.display = 'none');
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById(id).style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        function closeAllModals() {
            ['modalOverlay', 'sheetActions', 'modalSellerInfo', 'modalLinkCopy', 'modalAiRules', 'modalEditMsg'].forEach(s => document.getElementById(s).style.display = 'none');
            document.body.style.overflow = '';
        }

        // ===== 通信 =====
        function getSecret() {
            let s = localStorage.getItem(SECRET_KEY);
            if (!s) {
                s = (prompt("合言葉を入力してください") || "").trim();
                if (s) localStorage.setItem(SECRET_KEY, s);
            }
            return s;
        }
        async function callApi(action, params = {}) {
            const body = Object.assign({}, params, { action: action, account: getAccount(), secret: getSecret() });
            const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(body) });
            const data = await res.json();
            if (data.code === "auth") {
                localStorage.removeItem(SECRET_KEY);
                throw new Error("合言葉が違います。🔄を押して入力し直してください");
            }
            if (data.status !== "success") throw new Error(data.message || "エラー");
            if (data.my_ids) updateMyIds(data.my_ids);
            if (data.later) saveLaterLocal(data.later);
            return data;
        }

        function setStatus(text, cls) {
            const el = document.getElementById('loadStatus');
            el.textContent = text;
            el.className = `shrink-0 text-xs font-bold px-2.5 py-1 rounded-full ${cls || 'bg-indigo-500'}`;
        }
        function emptyBox(text) {
            return `<div class="bg-white p-10 rounded-2xl text-center text-base font-bold text-slate-500 shadow-sm">${text}</div>`;
        }

        // ===== 画面切替 =====
        function onAccountChange() {
            allRoomsCache = [];
            roomMembersCache = {};
            currentRoomId = null;
            document.getElementById('burstModeContainer').innerHTML = '';
            document.getElementById('laterModeContainer').innerHTML = '';
            lastBundle = null;
            if (handledUnsub) handledUnsub();
            handledUnsub = null; handledReady = null; handledSynced = false; handledAcc = null;
            resetRoomsSync();
            restoreHandledCache(getAccount());
            setOptionData(null);
            setTimeout(() => loadOptionSellers(false).then(() => { if (roomFilter === 'option') renderRoomList(); }).catch(() => {}), 1500);
            document.getElementById('roomSearchInput').value = '';
            document.getElementById('singleRoomMessageContainer').innerHTML = '';
            updateLaterBadge();
            if (currentMode === 'normal') backToRoomList();
            refreshCurrentView(true);
        }

        function refreshCurrentView(force) {
            document.getElementById('selectAllCheckbox').checked = false;
            updateSelectionBar();
            if (currentMode === 'burst') fetchAllUnreadRooms(force);
            else if (currentMode === 'later') renderLaterRooms(force);
            else if (currentRoomId) openRoom(currentRoomId, { fresh: !!force });
            else fetchNormalRooms(true);
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('selectAllCheckbox').checked = false;
            ['tabBurst', 'tabLater', 'tabNormal'].forEach(id => document.getElementById(id).classList.remove('active'));
            ['burstModeContainer', 'laterModeContainer', 'normalModeContainer'].forEach(id => document.getElementById(id).style.display = 'none');
            document.getElementById('listToolbar').style.display = (mode === 'burst' || mode === 'later') ? 'flex' : 'none';

            if (mode === 'burst') {
                document.getElementById('tabBurst').classList.add('active');
                document.getElementById('burstModeContainer').style.display = 'block';
                fetchAllUnreadRooms(false);
            } else if (mode === 'later') {
                document.getElementById('tabLater').classList.add('active');
                document.getElementById('laterModeContainer').style.display = 'block';
                renderLaterRooms(false);
            } else {
                document.getElementById('tabNormal').classList.add('active');
                document.getElementById('normalModeContainer').style.display = 'block';
                if (!currentRoomId) fetchNormalRooms(false);
            }
            updateSelectionBar();
            window.scrollTo(0, 0);
        }

        // ===== 選択・一括既読 =====
        function activeListId() { return currentMode === 'burst' ? 'burstModeContainer' : 'laterModeContainer'; }
        function updateSelectionBar() {
            const n = (currentMode !== 'burst' && currentMode !== 'later') ? 0 : document.querySelectorAll(`#${activeListId()} .room-checkbox:checked`).length;
            document.getElementById('selectedCount').textContent = n;
            document.getElementById('selectionBar').style.display = n > 0 ? 'block' : 'none';
        }
        window.toggleSelectAll = function(master) {
            document.querySelectorAll(`#${activeListId()} .room-checkbox`).forEach(cb => cb.checked = master.checked);
            updateSelectionBar();
        };
        window.batchMarkAsRead = async function() {
            const checked = document.querySelectorAll(`#${activeListId()} .room-checkbox:checked`);
            if (checked.length === 0) return;
            if (!confirm(`${checked.length} 件のルームを対応済みにしますか？`)) return;
            const ids = Array.from(checked).map(cb => cb.getAttribute('data-room-id'));
            setStatus('処理中…');
            try {
                await setHandled(ids, { reopen: false });
                callApi("mark_read_batch", { room_ids: ids }).catch(() => {});   // Chatwork側も既読に
                if (currentMode === 'later') callApi("set_later", { room_ids: ids, on: false }).catch(() => {});
                markReadInCache(ids);
                showToast(`${ids.length} 件を対応済みにしました`);
            } catch (e) {
                alert("対応済みの保存に失敗しました: " + e.message);
            }
            refreshCurrentView(true);
        };

        // ===== 後で対応（スタッフ全員で共有） =====
        function getLaterLocal() {
            try { return JSON.parse(localStorage.getItem(LATER_CACHE_KEY + getAccount())) || []; } catch (e) { return []; }
        }
        function saveLaterLocal(list) {
            try { localStorage.setItem(LATER_CACHE_KEY + getAccount(), JSON.stringify((list || []).map(String))); } catch (e) {}
            updateLaterBadge();
        }
        function isLater(roomId) { return getLaterLocal().indexOf(String(roomId)) > -1; }
        function updateLaterBadge() { document.getElementById('laterCountBadge').textContent = getLaterLocal().length; }

        // 以前この端末だけに保存していた「後で対応」を共有リストへ移す（初回のみ）
        async function migrateOldLater() {
            const flag = `cw_later_migrated_${getAccount()}`;
            if (localStorage.getItem(flag)) return;
            localStorage.setItem(flag, '1');
            let old = [];
            try { old = (JSON.parse(localStorage.getItem(OLD_LATER_KEY)) || {})[getAccount()] || []; } catch (e) {}
            if (old.length) {
                try { await callApi("set_later", { room_ids: old, on: true }); } catch (e) {}
            }
        }

        window.toggleLaterRoom = async function(roomId) {
            const on = !isLater(roomId);
            const before = getLaterLocal();
            saveLaterLocal(on ? before.concat([String(roomId)]) : before.filter(id => id !== String(roomId)));
            showToast(on ? "「後で対応」に入れました" : "「後で対応」から外しました");
            try {
                await callApi("set_later", { room_ids: [roomId], on: on });
            } catch (e) {
                saveLaterLocal(before);
                alert("「後で対応」の保存に失敗しました: " + e.message);
            }
            if (currentMode === 'later') renderLaterRooms(true);
        };

        async function renderLaterRooms(force) {
            const container = document.getElementById('laterModeContainer');
            const nameOf = id => (allRoomsCache.find(r => String(r.room_id) === String(id)) || {}).name || `ルームID: ${id}`;
            const unreadOfId = id => getUnread(allRoomsCache.find(r => String(r.room_id) === String(id)) || {});
            const draw = (list, latest) => {
                if (list.length === 0) { container.innerHTML = emptyBox('☕ 「後で対応」のルームはありません'); return; }
                container.innerHTML = list.map(id =>
                    burstCardHtml(id, nameOf(id), "後で", "bg-amber-100 text-amber-800",
                        latest ? (latest[String(id)] || { error: '取得できませんでした' }) : null, unreadOfId(id))
                ).join('');
                updateSelectionBar();
                applyOptionBadges();
            };
            draw(getLaterLocal(), null);
            setStatus('更新中…');
            try {
                const data = await callApi("get_later_bundle");
                lastFetchAt = Date.now();
                if (data.rooms) allRoomsCache = data.rooms;
                if (currentMode !== 'later') return;
                if (!force && isUserBusy(container)) { showToast('新着があります。🔄で更新できます'); }
                else draw(data.later || [], data.latest || {});
                setStatus(`後で ${(data.later || []).length}`, 'bg-amber-500');
                setLastUpdated(false);
            } catch (e) {
                setStatus('エラー', 'bg-red-500');
                showToast('取得に失敗しました：' + e.message);
            }
        }

        // ===== メッセージ部品 =====
        function memberOptionsHtml(members) {
            let html = '<option value="">＋ To を追加</option>';
            (Array.isArray(members) ? members : []).forEach(mem => {
                html += `<option value="${safeId(mem.account_id)}">${esc(mem.name)}</option>`;
            });
            return html;
        }

        function storeMessage(roomId, roomName, m) {
            const rid = safeId(roomId);
            const key = `m_${rid}_${safeId(m.message_id)}_${Math.random().toString(36).slice(2, 6)}`;
            const files = parseFiles(m.body);
            const display = cleanBody(m.body);
            const body = display + (files.length ? (display ? '\n' : '') + files.map(f => '📎 ' + f.name).join('\n') : '');
            window.messageStore[key] = {
                body, displayBody: display, files, sender: senderName(m), roomId: rid, roomName,
                mid: safeId(m.message_id), aid: safeId(m.account && m.account.account_id), rawBody: String(m.body || ''), mine: isMine(m),
                replyTo: isMine(m) ? null : { aid: safeId(m.account && m.account.account_id), mid: safeId(m.message_id), name: senderName(m) }
            };
            return key;
        }

        function messageHtml(key, m, opts = {}) {
            const st = window.messageStore[key];
            const mine = isMine(m);
            const avatarUrl = m.account && m.account.avatar_image_url;
            const avatar = avatarUrl
                ? `<img src="${esc(avatarUrl)}" alt="" class="w-8 h-8 rounded-full shrink-0 bg-slate-200 object-cover" loading="lazy">`
                : `<div class="w-8 h-8 rounded-full shrink-0 bg-slate-200"></div>`;
            const body = st.displayBody;
            const clampCls = opts.small ? 'clamp-s' : 'clamp';
            const isLong = opts.small ? (body.length > 90 || body.split('\n').length > 3) : (body.length > 280 || body.split('\n').length > 8);
            return `
                <div class="${mine ? 'mine' : ''}">
                    <div class="flex items-center gap-2">
                        ${avatar}
                        <div class="min-w-0 flex-1">
                            <div class="font-bold text-sm truncate">${esc(senderName(m))}${mine ? ' <span class="text-[11px] font-bold text-indigo-600 bg-white px-1.5 py-0.5 rounded">自社</span>' : ''}</div>
                            <div class="text-xs text-slate-400">${fmtTime(m.send_time)}</div>
                        </div>
                    </div>
                    <div id="body_${key}" class="chat-msg-body-text msg-body mt-1.5 ${isLong ? clampCls : ''} ${opts.small ? 'text-slate-600' : ''}" ${body ? '' : 'style="display:none"'}>${esc(body)}</div>
                    ${isLong ? `<button onclick="expandBody('${key}', this)" class="text-indigo-600 text-sm font-bold py-1 cursor-pointer">続きを読む</button>` : ''}
                    ${attachmentsHtml(st.roomId, st.files)}
                </div>`;
        }
        window.expandBody = function(key, btn) {
            const el = document.getElementById(`body_${key}`);
            el.classList.remove('clamp', 'clamp-s');
            btn.remove();
        };

        // 返信欄（宛先 → AI → 本文 → 返信マーク → 送信 の順に上から下へ）
        function replyPanelHtml(key, members, sendLabel) {
            const st = window.messageStore[key] || {};
            const rp = st.replyTo;
            return `
                <div id="reply_panel_${key}" class="mt-3 pt-3 border-t border-slate-100 space-y-2" style="display:none;">
                    <select id="member_select_${key}" ${members ? 'data-loaded="1"' : ''} onchange="insertMentionForMsg('${key}')" class="inp">${memberOptionsHtml(members)}</select>
                    <div class="flex gap-2">
                        <input type="text" id="custom_prompt_${key}" placeholder="AIへの指示（任意）例：丁寧にお断り" class="inp flex-1 min-w-0 bg-slate-50">
                        <button onclick="generateAiReplyForMessage('${key}', this)" class="btn btn-ai shrink-0">✨ AI作成</button>
                    </div>
                    <textarea id="reply_text_${key}" rows="6" placeholder="返信文" class="inp"></textarea>
                    <button onclick="useLastSent('${key}')" class="btn btn-sub w-full">📋 直前の送信文を使う</button>
                    ${rp && rp.mid ? `<label class="flex items-center gap-2 text-sm text-slate-600 py-1 cursor-pointer">
                        <input type="checkbox" id="rp_${key}" checked class="w-5 h-5 accent-indigo-600 shrink-0">
                        <span>${esc(rp.name)}さんのメッセージへの返信として送る（↩）</span></label>` : ''}
                    ${attachBoxHtml(key)}
                    <button onclick="sendReplyForMessage('${key}', this)" class="btn btn-ok w-full mt-1">${sendLabel || '📤 送信'}</button>
                </div>`;
        }

        // ===== 請求記録（補填・イレギュラー発送など） =====
        //   Firestore：billing_records（合言葉ログインで保護）
        const BILLING_TYPES = ['イレギュラー発送', '補填', '再発送', '着払い立替', '作業費', '資材費', 'その他'];
        let billingCtx = null;

        function todayYmd() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function yen(n) { return '¥' + Math.round(Number(n) || 0).toLocaleString(); }

        window.openBillingForm = async function(key) {
            const m = window.messageStore[key] || {};
            billingCtx = { roomId: m.roomId, roomName: m.roomName || '', sourceText: (m.body || '').slice(0, 500), sourceMsgId: (m.replyTo && m.replyTo.mid) || '' };
            document.getElementById('sheetActionsTitle').textContent = '🧾 請求に記録';
            document.getElementById('sheetActionsBody').innerHTML = `
                <div class="p-5 space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="field-label">管理番号</label><input id="bl_kanri" class="inp" placeholder="読込中…"></div>
                        <div><label class="field-label">日付</label><input id="bl_date" type="date" class="inp" value="${todayYmd()}"></div>
                    </div>
                    <div><label class="field-label">ショップ名・お名前</label><input id="bl_shop" class="inp" placeholder="読込中…"></div>
                    <div><label class="field-label">種類</label>
                        <select id="bl_type" class="inp" onchange="onBillingTypeChange()">${BILLING_TYPES.map(t => `<option>${t}</option>`).join('')}</select></div>
                    <div class="grid grid-cols-3 gap-2">
                        <div><label class="field-label">単価（円）</label><input id="bl_price" type="number" inputmode="numeric" class="inp" oninput="calcBilling()"></div>
                        <div><label class="field-label">数量</label><input id="bl_qty" type="number" inputmode="numeric" class="inp" value="1" oninput="calcBilling()"></div>
                        <div><label class="field-label">税</label><select id="bl_tax" class="inp"><option>税抜</option><option>税込</option></select></div>
                    </div>
                    <div class="text-right font-bold text-base">合計 <span id="bl_total">¥0</span></div>
                    <div><label class="field-label">内容メモ</label><textarea id="bl_memo" rows="2" class="inp" placeholder="例：破損のため再発送（送料・梱包）"></textarea></div>
                    ${billingCtx.sourceText ? `<div class="text-xs text-slate-500 bg-slate-50 rounded-xl p-3 clamp-s">元のメッセージ：${esc(billingCtx.sourceText)}</div>` : ''}
                    <button id="bl_save" onclick="saveBilling(this)" class="btn btn-main w-full">🧾 記録する</button>
                </div>`;
            openSheet('sheetActions');
            // セラー情報を自動で入れる
            try {
                const data = await callApi("get_seller_info", { chatwork_id: billingCtx.roomName });
                const s = data.seller || {};
                const k = document.getElementById('bl_kanri'), sh = document.getElementById('bl_shop');
                if (k && !k.value) k.value = s.error ? '' : (s.kanriNo || '');
                if (sh && !sh.value) sh.value = s.error ? billingCtx.roomName : [s.shopName, s.name].filter(v => v && v !== '不明').join('・');
                if (k) k.placeholder = '管理番号'; if (sh) sh.placeholder = 'ショップ名';
            } catch (e) {
                const sh = document.getElementById('bl_shop');
                if (sh && !sh.value) sh.value = billingCtx.roomName;
            }
        };

        window.onBillingTypeChange = function() {
            // 着払いは税込が基本
            if (document.getElementById('bl_type').value === '着払い立替') document.getElementById('bl_tax').value = '税込';
        };

        window.calcBilling = function() {
            const p = Number(document.getElementById('bl_price').value) || 0;
            const q = Number(document.getElementById('bl_qty').value) || 0;
            document.getElementById('bl_total').textContent = yen(p * q);
        };

        window.saveBilling = async function(btn) {
            if (!billingCtx) return;
            const price = Number(document.getElementById('bl_price').value);
            const qty = Number(document.getElementById('bl_qty').value) || 1;
            const date = document.getElementById('bl_date').value || todayYmd();
            if (!document.getElementById('bl_price').value) { showToast('単価を入力してください'); return; }
            btn.disabled = true;
            btn.textContent = '保存中…';
            try {
                await fsAdd('billing_records', {
                    trackingNo: '',   // 送り状番号の入力は廃止（請求台帳と項目をそろえるため空で保存）
                    account: getAccount(), roomId: String(billingCtx.roomId), roomName: billingCtx.roomName,
                    kanriNo: document.getElementById('bl_kanri').value.trim(),
                    shopName: document.getElementById('bl_shop').value.trim(),
                    date: date, month: date.slice(0, 7),
                    type: document.getElementById('bl_type').value,
                    unitPrice: price, quantity: qty, amount: Math.round(price * qty),
                    taxMode: document.getElementById('bl_tax').value,
                    memo: document.getElementById('bl_memo').value.trim(),
                    sourceMsgId: billingCtx.sourceMsgId, sourceText: billingCtx.sourceText,
                    status: 'unbilled', by: getStaffName(), createdAt: FS_TS
                });
                closeAllModals();
                showToast('請求に記録しました');
                if (currentRoomId) refreshBillingCount(currentRoomId);
            } catch (e) {
                alert('保存に失敗しました: ' + e.message);
                btn.disabled = false;
                btn.textContent = '🧾 記録する';
            }
        };

        async function fetchRoomBilling(roomId) {
            const f = await loadFirestore();
            const snap = await f.getDocs(f.query(f.collection(f.db, 'billing_records'), f.where('roomId', '==', String(roomId))));
            const list = [];
            snap.forEach(d => list.push(Object.assign({ _id: d.id }, d.data())));
            return list.sort((a, b) => String(b.date).localeCompare(String(a.date)));
        }

        // ルーム画面の「🧾 記録 ○件」
        async function refreshBillingCount(roomId) {
            try {
                const list = await fetchRoomBilling(roomId);
                const btn = document.getElementById('billingCountBtn');
                if (!btn || currentRoomId !== safeId(roomId)) return;
                const ym = todayYmd().slice(0, 7);
                const thisMonth = list.filter(r => r.month === ym);
                if (!list.length) { btn.style.display = 'none'; return; }
                btn.style.display = 'flex';
                btn.textContent = `🧾 請求記録 今月${thisMonth.length}件（${yen(thisMonth.reduce((n, r) => n + (r.amount || 0), 0))}）・全${list.length}件`;
            } catch (e) { handleFsDenied(e); }
        }

        window.openBillingList = async function(roomId) {
            document.getElementById('sheetActionsTitle').textContent = '🧾 このルームの請求記録';
            document.getElementById('sheetActionsBody').innerHTML = '<div class="p-6 text-center text-slate-400">読込中…</div>';
            openSheet('sheetActions');
            try {
                const list = await fetchRoomBilling(roomId);
                window._billingList = list;
                document.getElementById('sheetActionsBody').innerHTML = list.length ? list.map((r, i) => `
                    <div class="px-5 py-3 border-b border-slate-100">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded-full ${r.status === 'billed' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${r.status === 'billed' ? '請求済み' : '未請求'}</span>
                            <span class="font-bold flex-1 min-w-0 truncate">${esc(r.date)}　${esc(r.type)}</span>
                            <span class="font-bold shrink-0">${yen(r.amount)}<span class="text-xs text-slate-400">（${esc(r.taxMode || '')}）</span></span>
                        </div>
                        <div class="text-sm text-slate-600 mt-1">${r.trackingNo ? `📦 ${esc(r.trackingNo)}　` : ''}${esc(r.memo || '')}</div>
                        <div class="flex items-center justify-between mt-1">
                            <span class="text-xs text-slate-400">${r.unitPrice != null ? `${yen(r.unitPrice)} × ${r.quantity}` : ''}・${esc(r.by || '')}</span>
                            ${r.status === 'billed' ? '' : `<button onclick="deleteBilling(${i}, '${safeId(roomId)}')" class="text-xs text-red-500 font-bold px-2 py-1 cursor-pointer">削除</button>`}
                        </div>
                    </div>`).join('') : '<div class="p-6 text-center text-slate-400">記録はまだありません</div>';
            } catch (e) {
                handleFsDenied(e);
                document.getElementById('sheetActionsBody').innerHTML = `<div class="p-6 text-center text-red-500">読み込みに失敗しました：${esc(e.message)}</div>`;
            }

        // 5MBを超える写真は自動で縮小
        function shrinkImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const scale = Math.min(1, 2400 / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    canvas.toBlob(b => b ? resolve(b) : reject(new Error('画像の縮小に失敗しました')), 'image/jpeg', 0.82);
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
                img.src = url;
            });
        }
        async function prepareFile(f) {
            if (f.size <= CW_FILE_MAX) return f;
            if (/^image\/(jpeg|png|webp)$/.test(f.type)) {
                const blob = await shrinkImage(f);
                if (blob.size <= CW_FILE_MAX) return new File([blob], f.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
            }
            throw new Error(`「${f.name}」は5MBを超えているため送れません（Chatworkの制限）`);
        }
        function fileToBase64(f) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(String(r.result).split(',')[1] || '');
                r.onerror = () => reject(new Error('ファイルを読み込めませんでした'));
                r.readAsDataURL(f);
            });
        }
        // 1つ目のファイルに本文を付けて送り、2つ目以降はファイルだけ
        async function uploadFiles(roomId, files, message, done, btn) {
            const prepared = [];
            for (const f of files) prepared.push(await prepareFile(f));   // 先に全部チェック（途中で止まらないように）
            for (let i = 0; i < prepared.length; i++) {
                if (btn) btn.textContent = `送信中…（${i + 1}/${prepared.length}）`;
                const f = prepared[i];
                await callApi("upload_file", {
                    room_id: roomId, file_data: await fileToBase64(f), file_name: f.name,
                    mime_type: f.type || 'application/octet-stream',
                    message: i === 0 ? message : '', done: done && i === prepared.length - 1
                });
            }
        }

        // entry = { messages:[最大5件] } / { error } / null(読込中)
        function burstCardHtml(roomId, roomName, badge, badgeCls, entry, unreadNum) {
            const rid = safeId(roomId);
            window.roomNameMap[rid] = roomName;
            const head = cardHeadHtml(roomId, roomName, badge, badgeCls);
            const wrap = (inner, extraCls, cardKey) =>
                `<div class="burst-card bg-white rounded-2xl shadow-sm p-4 ${extraCls || ''}" data-room-id="${rid}" data-room-name="${esc(roomName)}" data-card-key="${cardKey || ''}">${head}${inner}</div>`;

            if (!entry) return wrap('<div class="mt-3 text-sm text-slate-400">読込中…</div>');
            if (entry.error) return wrap(`<div class="mt-3 text-sm text-red-500">取得失敗：${esc(entry.error)}</div>`);
            const msgs = entry.messages || [];
            if (msgs.length === 0) return wrap('<div class="mt-3 text-sm text-slate-400">メッセージなし</div>');

            // 未読の件数分（最大5件）を表示
            const n = Math.min(Math.max(Number(unreadNum) || 1, 1), msgs.length, MAX_SHOW);
            const shown = msgs.slice(-n);
            const last = msgs[msgs.length - 1];
            const lastIsMine = isMine(last);
            const lastCustomer = msgs.slice().reverse().find(m => !isMine(m));

            // カード全体用（AIには取得した最大5件の流れを渡す）
            const cardKey = `c_${rid}_${Math.random().toString(36).slice(2, 8)}`;
            const thread = msgs.map(lineFor).join('\n\n');
            window.messageStore[cardKey] = {
                body: shown.map(lineFor).join('\n\n'), context: thread, roomId: rid, roomName,
                sender: lastCustomer ? senderName(lastCustomer) : senderName(last),
                replyTo: lastCustomer ? { aid: safeId(lastCustomer.account && lastCustomer.account.account_id), mid: safeId(lastCustomer.message_id), name: senderName(lastCustomer) } : null
            };

            const more = Number(unreadNum) > MAX_SHOW ? `<div class="text-xs text-slate-400 mt-2">※ 未読はほかに ${Number(unreadNum) - MAX_SHOW} 件あります（「ルーム」タブで確認できます）</div>` : '';
            const notice = lastIsMine ? `<div class="mt-3 text-sm font-bold text-emerald-700 bg-emerald-50 rounded-xl px-3 py-2">✅ 最後の発言は自社です（返信済みかもしれません）</div>` : '';
            const items = shown.map((m, i) => {
                const k = storeMessage(rid, roomName, m);
                return `<div class="${i > 0 ? 'mt-3 pt-3 border-t border-slate-100' : ''}">${messageHtml(k, m, { small: i < shown.length - 1 })}</div>`;
            }).join('');

            const inner = `
                ${notice}
                <div class="mt-3">${items}${more}</div>
                <div class="flex gap-2 mt-3">
                    <button onclick="toggleReply('${cardKey}', this)" class="btn ${lastIsMine ? 'btn-sub' : 'btn-main'} flex-1">💬 返信</button>
                    <button onclick="markDone('${rid}', '${safeId(last.message_id)}', this)" class="btn btn-sub flex-1">✓ 対応済み</button>
                    <button onclick="openMsgActions('${cardKey}')" class="btn btn-sub w-12 shrink-0 text-lg" aria-label="その他">⋯</button>
                </div>
                ${replyPanelHtml(cardKey, null, '📤 送信して完了')}`;
            return wrap(inner, lastIsMine ? 'opacity-75' : '', cardKey);
        }

        function compressImage(file, maxSize = 1280, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
                img.src = url;
            });
        }

        const OPTION_LABEL = "動画撮影オプション";

        // 管理番号が「単独の番号として」ルーム名に含まれているか（GAS側と同じ判定）
        function containsKanriJs(text, k) {
            let from = 0;
            while (true) {
                const i = text.indexOf(k, from);
                if (i === -1) return false;
                const before = i > 0 ? text.charAt(i - 1) : '';
                const after = text.charAt(i + k.length);
                if (!/[0-9a-z]/.test(before) && !/[0-9a-z]/.test(after)) return true;
                from = i + 1;
            }
        }
        function findRoomByKanri(k) {
            let best = null;
            allRoomsCache.forEach(r => {
                if (containsKanriJs(normKanri(r.name), k) && (!best || (r.last_update_time || 0) > (best.last_update_time || 0))) best = r;
            });
            return best;
        }

        function applyOptionOverrides(raw) {
            const seen = {};
            const sellers = [];
            (raw.sellers || []).forEach(x => {
                const k = normKanri(x.kanriNo);
                const o = optionOv[k];
                seen[k] = true;
                if (o && o.v === '×') return;
                sellers.push(o ? Object.assign({}, x, { manual: true, note: o.note || '', by: o.by || '' }) : x);
            });
            // 手動で「加入」にしたが、シートでは加入になっていないセラー
            Object.keys(optionOv).forEach(k => {

                if (o.v !== '◯' || seen[k]) return;
                const r = findRoomByKanri(k);
                sellers.push({

                    manual: true, note: o.note || '', by: o.by || '',
                    room_id: r ? r.room_id : null, room_name: r ? r.name : '',
                    unread_num: r ? getUnread(r) : 0, last_update_time: r ? (r.last_update_time || 0) : 0

            });
            sellers.sort((a, b) => ((b.unread_num > 0) - (a.unread_num > 0)) || ((!!b.room_id) - (!!a.room_id)) || (b.last_update_time - a.last_update_time));
