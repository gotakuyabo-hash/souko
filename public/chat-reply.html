<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatwork 未読バーストコックピット (構文修復版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
            authDomain: "souko-2de57.firebaseapp.com",
            projectId: "souko-2de57",
            storageBucket: "souko-2de57.firebasestorage.app",
            messagingSenderId: "642116656086",
            appId: "1:642116656086:web:139cc5558a4ef6ebda6277",
            measurementId: "G-8WG8GWQGCR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        // 🚀 スタッフ間連絡アプリへの登録
        window.registerToStaffApp = async function(btnEl) {
            const roomId = document.getElementById('linkRoomId').value;
            const roomName = document.getElementById('linkRoomName').value;
            const senderName = document.getElementById('linkSenderName').value;
            const messageBody = document.getElementById('linkMessageBody').value;
            const fromVal = document.getElementById('linkFromInput').value;
            const toVal = document.getElementById('linkToInput').value;
            const memoVal = document.getElementById('linkMemoInput').value;

            let taskContent = `【Chatwork連携依頼】\nルーム名: ${roomName}`;
            taskContent += `\n\n👤 発言者: ${senderName}\n💬 メッセージ本文:\n${messageBody}`;
            
            if (memoVal) {
                taskContent += `\n\n📝 連絡メモ:\n${memoVal}`;
            }

            btnEl.disabled = true;
            btnEl.textContent = "登録中...";

            try {
                await addDoc(collection(db, "staff_requests"), {
                    from: fromVal || '未設定',
                    to: toVal || '未設定',
                    task: taskContent,
                    imageUrl: null,
                    status: 'pending',
                    createdAt: serverTimestamp()
                });
                alert('スタッフ間連絡アプリに直接登録しました！');
                closeAllModals();
            } catch (error) {
                alert("登録に失敗しました: " + error.message);
            } finally {
                btnEl.disabled = false;
                btnEl.textContent = "🚀 スタッフ間連絡アプリに登録する";
            }
        };

        // 🧠 AI学習ログの自動保存
        window.saveAiFeedbackLog = async function(receivedMessage, aiDraft, finalMessage) {
            if (!receivedMessage || !finalMessage) return;
            try {
                await addDoc(collection(db, "ai_feedback_logs"), {
                    receivedMessage: receivedMessage,
                    aiDraft: aiDraft || "",
                    finalMessage: finalMessage,
                    createdAt: serverTimestamp()
                });
                console.log("✅ AI学習ログを正常に保存しました");
            } catch (e) {
                console.error("❌ AI学習ログの保存に失敗:", e);
            }
        };

        // 📋 Firestoreから定時スキャンの未対応一覧を取得
        window.fetchScheduledUnrepliedRoomsFromFirebase = async function() {
            const container = document.getElementById('scheduledModeContainer');
            container.innerHTML = `
                <div class="text-center text-xs text-slate-500 py-8 bg-white rounded-xl shadow-sm border border-slate-200">
                    <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-600 border-t-transparent mb-1"></div>
                    <div>定時未対応リストを読み込み中...</div>
                </div>
            `;

            try {
                const querySnapshot = await getDocs(collection(db, "unreplied_rooms"));
                let html = '';
                let count = 0;

                querySnapshot.forEach((document) => {
                    const data = document.data();
                    if (data.status === 'pending') {
                        count++;
                        const roomId = data.roomId;
                        const roomName = data.roomName || '名称不明';
                        const chatworkUrl = `https://www.chatwork.com/#!rid${roomId}`;

                        html += `
                            <div id="scheduled_card_${roomId}" class="bg-white border-2 border-indigo-100 rounded-xl p-3.5 shadow-sm space-y-2 flex items-center justify-between">
                                <div class="flex-1 min-w-0 mr-2">
                                    <h3 class="font-bold text-sm text-slate-900 truncate">${escapeHtml(roomName)}</h3>
                                    <div class="text-[11px] text-slate-400 truncate">最終: ${escapeHtml(data.senderName || '相手')} - ${escapeHtml(data.lastMessageBody || '')}</div>
                                </div>
                                <div class="flex items-center gap-1.5 shrink-0">
                                    <a href="${chatworkUrl}" target="_blank" class="bg-sky-500 hover:bg-sky-600 text-white text-xs px-2.5 py-1.5 rounded font-bold shadow-sm transition">
                                        🌐 公式
                                    </a>
                                    <button onclick="updateScheduledRoomStatus('${roomId}', 'done')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2.5 py-1.5 rounded font-bold shadow-sm transition">
                                        ✅ 対応済み
                                    </button>
                                    <button onclick="updateScheduledRoomStatus('${roomId}', 'dismissed')" class="bg-rose-500 hover:bg-rose-600 text-white text-xs px-2.5 py-1.5 rounded font-bold shadow-sm transition">
                                        🚫 退会済(除外)
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                });

                if (count === 0) {
                    container.innerHTML = `
                        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center space-y-2">
                            <div class="text-2xl">🎉</div>
                            <div class="text-sm font-bold text-slate-700">定時未対応のルームはありません！すべてクリアです。</div>
                        </div>
                    `;
                } else {
                    container.innerHTML = html;
                }
                document.getElementById('scheduledCountBadge').textContent = count;
            } catch (e) {
                container.innerHTML = `<div class="text-xs text-red-500 text-center p-4">読み込みエラー: ${e.message}</div>`;
            }
        };

        window.updateScheduledRoomStatus = async function(roomId, newStatus) {
            try {
                const docRef = doc(db, "unreplied_rooms", String(roomId));
                await updateDoc(docRef, {
                    status: newStatus,
                    updatedAt: serverTimestamp()
                });
                const card = document.getElementById(`scheduled_card_${roomId}`);
                if (card) card.remove();
                window.fetchScheduledUnrepliedRoomsFromFirebase();
            } catch (e) {
                alert("ステータスの更新に失敗しました: " + e.message);
            }
        };
    </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-16">
    <!-- ヘッダー -->
    <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-20">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <h1 class="text-base font-bold flex items-center gap-2">
                <span>🚀 未読バーストコックピット</span>
            </h1>
            <div class="flex items-center gap-2">
                <span id="loadStatus" class="text-xs bg-indigo-500 px-2 py-0.5 rounded-full text-indigo-100">読込中...</span>
                <button onclick="refreshCurrentView()" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-2.5 py-1.5 rounded font-bold shadow active:scale-95 transition">
                    🔄 更新
                </button>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="max-w-md mx-auto p-3 space-y-3">
        <!-- アカウント＆モード切替カード -->
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
            <div class="flex items-center gap-2">
                <select id="accountSelect" onchange="changeAccount()" class="flex-1 border border-slate-300 rounded-lg p-2 text-xs bg-indigo-50/50 font-bold text-indigo-950 focus:outline-none">
                    <option value="5435a05ddd195c46ca688d021e45bbce" selected>ラクロジスタッフアカウント</option>
                    <option value="57d74ea2e63325c5306b594c3bb231af">松下アカウント</option>
                </select>
            </div>
            
            <!-- タブ切り替え -->
            <div class="grid grid-cols-4 bg-slate-100 p-1 rounded-lg gap-1">
                <button id="tabBurst" onclick="switchMode('burst')" class="py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm transition">
                    ⚡ 未読
                </button>
                <button id="tabScheduled" onclick="switchMode('scheduled')" class="py-1.5 text-[11px] font-bold rounded-md text-slate-600 transition">
                    🗂️ 定時未対応 (<span id="scheduledCountBadge">0</span>)
                </button>
                <button id="tabLater" onclick="switchMode('later')" class="py-1.5 text-[11px] font-bold rounded-md text-slate-600 transition">
                    ⏳ 後で (<span id="laterCountBadge">0</span>)
                </button>
                <button id="tabNormal" onclick="switchMode('normal')" class="py-1.5 text-[11px] font-bold rounded-md text-slate-600 transition">
                    📁 通常
                </button>
            </div>
        </div>

        <!-- 各種モード表示エリア -->
        <div id="burstModeContainer" class="space-y-3">
            <div class="text-center text-xs text-slate-500 py-8">
                <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-600 border-t-transparent mb-1"></div>
                <div>未読ルームをスキャン中...</div>
            </div>
        </div>

        <div id="scheduledModeContainer" class="space-y-3" style="display:none;"></div>
        <div id="laterModeContainer" class="space-y-3" style="display:none;"></div>

        <div id="normalModeContainer" class="space-y-3" style="display:none;">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
                <input type="text" id="roomSearchInput" oninput="filterNormalRooms()" placeholder="🔍 ルーム名検索..." class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50 focus:outline-none">
                <select id="roomSelect" onchange="loadSingleRoomMessages()" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white shadow-inner focus:outline-none">
                    <option value="">-- ルームを選択 --</option>
                </select>
            </div>
            <div id="singleRoomMessageContainer" class="space-y-3"></div>
        </div>
    </div>

    <!-- ================= モーダル ================= -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-40 hidden" onclick="closeAllModals()"></div>

    <!-- 🔑 セラー情報表示モーダル -->
    <div id="modalSellerInfo" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-sm bg-white rounded-xl shadow-2xl z-50 hidden flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-indigo-50 rounded-t-xl">
            <h2 class="font-bold text-indigo-900">🔑 紐づくセラー情報</h2>
            <button onclick="closeAllModals()" class="text-slate-500 hover:text-slate-800 font-bold text-xl px-2">&times;</button>
        </div>
        <div class="p-4 space-y-3 text-sm">
            <div>
                <span class="text-xs text-slate-500 font-bold block">管理番号</span>
                <span id="sellerModalKanriNo" class="font-bold text-slate-800">-</span>
            </div>
            <div>
                <span class="text-xs text-slate-500 font-bold block">お名前 / ショップ名</span>
                <span id="sellerModalName" class="font-bold text-slate-800">-</span> (<span id="sellerModalShopName">-</span>)
            </div>
            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2">
                <div>
                    <span class="text-xs text-indigo-600 font-bold block">ログインID</span>
                    <div class="flex items-center justify-between bg-white p-2 rounded border border-slate-200 mt-0.5">
                        <span id="sellerModalId" class="font-mono text-xs select-all">-</span>
                    </div>
                </div>
                <div>
                    <span class="text-xs text-indigo-600 font-bold block">パスワード</span>
                    <div class="flex items-center justify-between bg-white p-2 rounded border border-slate-200 mt-0.5">
                        <span id="sellerModalPass" class="font-mono text-xs select-all">-</span>
                    </div>
                </div>
            </div>
            <button onclick="closeAllModals()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded-lg text-xs transition">
                閉じる
            </button>
        </div>
    </div>

    <!-- 🔗 スタッフ間連絡 直接登録モーダル -->
    <div id="modalLinkCopy" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-md bg-white rounded-xl shadow-2xl z-50 hidden flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-indigo-50 rounded-t-xl">
            <h2 class="font-bold text-indigo-900">🔗 スタッフ間連絡アプリに登録</h2>
            <button onclick="closeAllModals()" class="text-slate-500 hover:text-slate-800 font-bold text-xl px-2">&times;</button>
        </div>
        <div class="p-4 space-y-3">
            <input type="hidden" id="linkRoomId">
            <input type="hidden" id="linkRoomName">
            <input type="hidden" id="linkSenderName">
            <input type="hidden" id="linkMessageBody">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">👤 From (依頼者・担当者など)</label>
                <input type="text" id="linkFromInput" placeholder="例：松下" class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">🎯 To (宛先スタッフなど)</label>
                <input type="text" id="linkToInput" placeholder="例：スタッフ全員 / 〇〇さん" class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">📝 軽いメモ (自由記述)</label>
                <textarea id="linkMemoInput" placeholder="依頼内容や補足事項など..." class="w-full h-20 border border-slate-300 rounded p-2 text-sm focus:outline-none"></textarea>
            </div>
            <button onclick="registerToStaffApp(this)" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow mt-2 active:scale-95 transition">
                🚀 スタッフ間連絡アプリに登録する
            </button>
        </div>
    </div>
    <!-- ========================================================= -->

    <!-- メインスクリプト -->
    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzbGircW91tKx9NIihoWRMCiyIYnVbJJoeJZ9IoUf5s6vI71zNVnqJOo38vSOqfeMYzzA/exec";
        
        let allRoomsCache = [];
        let currentMode = 'burst';
        const LATER_KEY = "chatwork_later_rooms_v1";
        let aiDraftMemory = {};

        window.addEventListener('DOMContentLoaded', () => {
            updateLaterBadge();
            fetchAllUnreadRooms();
            if (window.fetchScheduledUnrepliedRoomsFromFirebase) {
                window.fetchScheduledUnrepliedRoomsFromFirebase();
            }
        });

        function getCurrentToken() { return document.getElementById('accountSelect').value; }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function closeAllModals() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('modalSellerInfo').style.display = 'none';
            document.getElementById('modalLinkCopy').style.display = 'none';
        }

        async function callGasApi(action, params = {}) {
            params.action = action;
            params.token = getCurrentToken();
            const query = new URLSearchParams(params).toString();
            const targetUrl = `${GAS_WEB_APP_URL}?${query}`;

            const res = await fetch(targetUrl);
            const text = await res.text();
            const data = JSON.parse(text);
            if (data.status !== "success") {
                throw new Error(data.message || "GAS通信エラー");
            }
            return data;
        }

        function changeAccount() {
            refreshCurrentView();
        }

        function refreshCurrentView() {
            if (currentMode === 'burst') {
                fetchAllUnreadRooms();
            } else if (currentMode === 'scheduled') {
                if (window.fetchScheduledUnrepliedRoomsFromFirebase) window.fetchScheduledUnrepliedRoomsFromFirebase();
            } else if (currentMode === 'later') {
                renderLaterRooms();
            } else {
                fetchNormalRooms();
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            const btnBurst = document.getElementById('tabBurst');
            const btnScheduled = document.getElementById('tabScheduled');
            const btnLater = document.getElementById('tabLater');
            const btnNormal = document.getElementById('tabNormal');
            
            const burstCont = document.getElementById('burstModeContainer');
            const scheduledCont = document.getElementById('scheduledModeContainer');
            const laterCont = document.getElementById('laterModeContainer');
            const normalCont = document.getElementById('normalModeContainer');

            [btnBurst, btnScheduled, btnLater, btnNormal].forEach(b => {
                b.className = "py-1.5 text-[11px] font-bold rounded-md text-slate-600 transition";
            });
            burstCont.style.display = 'none';
            scheduledCont.style.display = 'none';
            laterCont.style.display = 'none';
            normalCont.style.display = 'none';

            if (mode === 'burst') {
                btnBurst.className = "py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm transition";
                burstCont.style.display = 'block';
                fetchAllUnreadRooms();
            } else if (mode === 'scheduled') {
                btnScheduled.className = "py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm transition";
                scheduledCont.style.display = 'block';
                if (window.fetchScheduledUnrepliedRoomsFromFirebase) window.fetchScheduledUnrepliedRoomsFromFirebase();
            } else if (mode === 'later') {
                btnLater.className = "py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm transition";
                laterCont.style.display = 'block';
                renderLaterRooms();
            } else {
                btnNormal.className = "py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm transition";
                normalCont.style.display = 'block';
                fetchNormalRooms();
            }
        }

        // ⏳ 後で対応関連
        function getLaterRooms() {
            try { return JSON.parse(localStorage.getItem(LATER_KEY)) || {}; } catch(e) { return {}; }
        }

        function updateLaterBadge() {
            const later = getLaterRooms();
            const token = getCurrentToken();
            const list = later[token] || [];
            document.getElementById('laterCountBadge').textContent = list.length;
        }

        window.toggleLaterRoom = function(roomId, roomName) {
            const later = getLaterRooms();
            const token = getCurrentToken();
            if (!later[token]) later[token] = [];
            
            const idx = later[token].indexOf(String(roomId));
            if (idx > -1) {
                later[token].splice(idx, 1);
                alert("「後で対応」から外しました。");
            } else {
                later[token].push(String(roomId));
                alert("「後で対応」に追加しました！");
            }
            localStorage.setItem(LATER_KEY, JSON.stringify(later));
            updateLaterBadge();
            if (currentMode === 'later') renderLaterRooms();
        };

        function renderLaterRooms() {
            const container = document.getElementById('laterModeContainer');
            const later = getLaterRooms();
            const token = getCurrentToken();
            const list = later[token] || [];

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center space-y-2">
                        <div class="text-2xl">☕</div>
                        <div class="text-sm font-bold text-slate-700">「後で」に保存されているルームはありません。</div>
                    </div>
                `;
                return;
            }

            let html = '';
            list.forEach(roomId => {
                const roomObj = allRoomsCache.find(r => String(r.room_id) === String(roomId));
                const name = roomObj ? roomObj.name : `ルームID: ${roomId}`;
                html += `
                    <div class="bg-white border-2 border-amber-100 rounded-xl p-3.5 shadow-sm flex items-center justify-between">
                        <div class="font-bold text-sm text-slate-800 truncate mr-2">${escapeHtml(name)}</div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <a href="https://www.chatwork.com/#!rid${roomId}" target="_blank" class="bg-sky-500 text-white text-xs px-2.5 py-1.5 rounded font-bold">🌐 公式</a>
                            <button onclick="toggleLaterRoom('${roomId}')" class="bg-rose-500 text-white text-xs px-2.5 py-1.5 rounded font-bold">❌ 解除</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 🔗 スタッフ間連絡モーダルを開く
        window.openStaffAppModal = function(roomId, roomName, senderName, messageBody) {
            document.getElementById('linkRoomId').value = roomId;
            document.getElementById('linkRoomName').value = roomName;
            document.getElementById('linkSenderName').value = senderName;
            document.getElementById('linkMessageBody').value = messageBody;
            document.getElementById('linkFromInput').value = "松下";
            document.getElementById('linkToInput').value = "スタッフ全員";
            document.getElementById('linkMemoInput').value = "";

            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalLinkCopy').style.display = 'flex';
        };

        // 🔑 セラー情報取得
        async function fetchSellerInfo(keyword) {
            if (!keyword) { alert("キーワードが見つかりません"); return; }
            document.getElementById('sellerModalKanriNo').textContent = "読み込み中...";
            document.getElementById('sellerModalName').textContent = "-";
            document.getElementById('sellerModalShopName').textContent = "-";
            document.getElementById('sellerModalId').textContent = "-";
            document.getElementById('sellerModalPass').textContent = "-";
            
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalSellerInfo').style.display = 'flex';

            try {
                const data = await callGasApi("get_seller_info", { chatwork_id: keyword });
                if (!data.seller || data.seller.error) {
                    document.getElementById('sellerModalKanriNo').textContent = "見つかりませんでした";
                    return;
                }
                const seller = data.seller;
                document.getElementById('sellerModalKanriNo').textContent = seller.kanriNo || 'なし';
                document.getElementById('sellerModalName').textContent = seller.name || 'なし';
                document.getElementById('sellerModalShopName').textContent = seller.shopName || 'なし';
                document.getElementById('sellerModalId').textContent = seller.id || '未登録';
                document.getElementById('sellerModalPass').textContent = seller.pass || '未登録';
            } catch (e) {
                alert("セラー情報の取得に失敗しました: " + e.message);
                closeAllModals();
            }
        }

        // 📁 通常ルーム管理
        async function fetchNormalRooms() {
            const selectEl = document.getElementById('roomSelect');
            selectEl.innerHTML = '<option value="">-- ルーム一覧を読み込み中... --</option>';

            try {
                if (allRoomsCache.length === 0) {
                    const data = await callGasApi("get_rooms");
                    allRoomsCache = data.rooms || [];
                }
                renderRoomOptions(allRoomsCache);
            } catch (e) {
                selectEl.innerHTML = `<option value="">ルーム一覧の取得失敗: ${e.message}</option>`;
            }
        }

        function renderRoomOptions(rooms) {
            const selectEl = document.getElementById('roomSelect');
            let html = '<option value="">-- ルームを選択 --</option>';
            rooms.forEach(room => {
                const unreadMark = room.unread_num > 0 ? ` [未読 ${room.unread_num}件]` : '';
                html += `<option value="${room.room_id}">${escapeHtml(room.name)}${unreadMark}</option>`;
            });
            selectEl.innerHTML = html;
        }

        function filterNormalRooms() {
            const keyword = document.getElementById('roomSearchInput').value.toLowerCase();
            const filtered = allRoomsCache.filter(r => r.name.toLowerCase().includes(keyword));
            renderRoomOptions(filtered);
        }

        async function loadSingleRoomMessages() {
            const roomId = document.getElementById('roomSelect').value;
            const container = document.getElementById('singleRoomMessageContainer');
            if (!roomId) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <div class="text-center text-xs text-slate-500 py-6 bg-white rounded-xl shadow-sm border border-slate-200">
                    <div class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-indigo-600 border-t-transparent mb-1"></div>
                    <div>メッセージを取得中...</div>
                </div>
            `;

            try {
                const roomData = await callGasApi("get_room_data", { room_id: roomId });
                const messages = roomData.messages || [];
                
                if (messages.length === 0) {
                    container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center text-xs text-slate-500">メッセージはありません</div>`;
                    return;
                }

                const latestMsg = messages[messages.length - 1];
                const roomObj = allRoomsCache.find(r => String(r.room_id) === String(roomId));
                const roomName = roomObj ? roomObj.name : "ルーム";

                container.innerHTML = buildMessageCardHtml(roomId, roomName, latestMsg, roomObj?.unread_num || 0);
            } catch (e) {
                container.innerHTML = `<div class="text-xs text-red-500 text-center p-4">メッセージ取得エラー: ${e.message}</div>`;
            }
        }

        // 🖼️ Chatworkの添付ファイルやBBCode形式のファイルアップロード情報を綺麗にパースして表示する関数
        function parseChatworkFilesAndBody(msgBody, files) {
            let renderedBody = escapeHtml(msgBody);

            renderedBody = renderedBody.replace(/[info]([\s\S]*?)\[\/info\]/g, (match, inner) => {
                let title = "";
                const titleMatch = inner.match(/[title]([\s\S]*?)\[\/title\]/);
                if (titleMatch) title = titleMatch[1].trim();

                let fileId = "";
                const dlMatch = inner.match(/\[download:(\d+)\]/);
                if (dlMatch) fileId = dlMatch[1];

                let fileName = "添付ファイル";
                const textMatch = inner.match(/\[download:\d+\]([\s\S]*?)\[\/download\]/);
                if (textMatch) fileName = textMatch[1].trim();

                return `
                    <div class="my-2 p-2.5 bg-indigo-50/60 rounded-lg border border-indigo-200 space-y-1.5">
                        <div class="text-[11px] font-bold text-indigo-900">📎 ${escapeHtml(title || 'ファイルアップロード')}</div>
                        <div class="text-xs font-semibold text-slate-700">${escapeHtml(fileName)}</div>
                        ${fileId ? `<div class="text-[10px] text-slate-400">File ID: ${fileId}</div>` : ''}
                    </div>
                `;
            });

            let apiFilesHtml = "";
            if (files && files.length > 0) {
                files.forEach(file => {
                    const isImage = file.filename && /\.(jpg|jpeg|png|gif|webp)$/i.test(file.filename);
                    if (isImage && file.download_url) {
                        apiFilesHtml += `
                            <div class="mt-2 space-y-1">
                                <a href="${file.download_url}" target="_blank" class="block">
                                    <img src="${file.download_url}" alt="${escapeHtml(file.filename)}" class="max-h-40 rounded border border-slate-200 object-cover shadow-sm">
                                </a>
                                <div class="text-[10px] text-slate-400">📷 ${escapeHtml(file.filename)}</div>
                            </div>
                        `;
                    } else if (file.download_url) {
                        apiFilesHtml += `
                            <div class="mt-2 p-2 bg-white rounded border border-slate-200 flex items-center justify-between">
                                <span class="text-xs font-bold text-slate-700">📎 ${escapeHtml(file.filename || '添付ファイル')}</span>
                                <a href="${file.download_url}" target="_blank" class="text-xs bg-sky-500 text-white px-2 py-1 rounded font-bold shadow-sm">ダウンロード</a>
                            </div>
                        `;
                    }
                });
            }

            return `<div class="whitespace-pre-wrap">${renderedBody}</div>${apiFilesHtml}`;
        }

        function buildMessageCardHtml(roomId, roomName, latestMsg, unreadNum) {
            const msgBody = latestMsg.body || "";
            const senderName = latestMsg.account ? latestMsg.account.name : "相手";
            const files = latestMsg.files || [];
            const parsedContent = parseChatworkFilesAndBody(msgBody, files);

            return `
                <div id="card_${roomId}" class="bg-white border-2 border-indigo-100 rounded-xl p-3.5 shadow-sm space-y-3">
                    <div class="space-y-1.5 pb-2 border-b border-slate-100">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                ${unreadNum > 0 ? `<span class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">未読 ${unreadNum}件</span>` : ''}
                                <h3 class="font-bold text-sm text-slate-900">${escapeHtml(roomName)}</h3>
                            </div>
                            <button onclick="toggleLaterRoom('${roomId}', '${escapeHtml(roomName).replace(/'/g, "\\'")}')" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-900 px-2.5 py-1 rounded font-bold transition">
                                ⏳ 後で対応
                            </button>
                        </div>
                        <button onclick="fetchSellerInfo('${escapeHtml(roomName).replace(/'/g, "\\'")}')" class="w-full text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-2 px-3 rounded-lg border border-indigo-200 font-bold flex items-center justify-center gap-1.5 shadow-sm transition">
                            🔑 セラー情報を確認する
                        </button>
                    </div>

                    <div class="text-xs text-slate-700 p-2.5 bg-slate-50 rounded space-y-1">
                        <div class="font-bold text-[11px] text-indigo-900">👤 ${escapeHtml(senderName)} の発言:</div>
                        ${parsedContent}
                    </div>

                    <!-- スタッフ間連絡アプリ連携ボタン -->
                    <button onclick="openStaffAppModal('${roomId}', '${escapeHtml(roomName).replace(/'/g, "\\'")}', '${escapeHtml(senderName).replace(/'/g, "\\'")}', ${JSON.stringify(msgBody)})" class="w-full text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-800 py-2 px-3 rounded-lg border border-emerald-200 font-bold flex items-center justify-center gap-1.5 shadow-sm transition">
                        🚀 スタッフ間連絡アプリに登録する
                    </button>

                    <!-- AIアシスタント ＆ 返信欄 -->
                    <div class="space-y-2 pt-1 bg-indigo-50/40 p-2.5 rounded-lg border border-indigo-100">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-indigo-800">🤖 AI返信アシスタント</span>
                        </div>
                        <input type="text" id="ai_prompt_${roomId}" placeholder="💡 AIへの指示（例：明日対応する旨を伝える）..." class="w-full text-xs border border-indigo-200 rounded p-1.5 bg-white focus:outline-none focus:border-indigo-500">
                        <button onclick="generateAiDraft('${roomId}', ${JSON.stringify(msgBody)})" class="w-full text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 rounded transition shadow-sm">
                            ✨ AI返信案を作成
                        </button>
                        <textarea id="reply_text_${roomId}" data-received="${escapeHtml(msgBody)}" placeholder="生成された返信案がここに表示されます..." class="w-full h-20 text-xs border border-slate-300 rounded p-2 bg-white focus:outline-none focus:border-indigo-500"></textarea>
                        
                        <!-- 📷 カメラ撮影 ＆ 📁 ファイル添付コントロール -->
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold py-2 px-2 rounded text-center shadow-sm transition flex items-center justify-center gap-1">
                                <span>📷 カメラ撮影</span>
                                <input type="file" accept="image/*" capture="environment" id="reply_camera_${roomId}" onchange="handleFileSelect('${roomId}', this)" class="hidden">
                            </label>
                            <label class="cursor-pointer bg-slate-600 hover:bg-slate-700 text-white text-[11px] font-bold py-2 px-2 rounded text-center shadow-sm transition flex items-center justify-center gap-1">
                                <span>📁 ファイル選択</span>
                                <input type="file" id="reply_file_${roomId}" onchange="handleFileSelect('${roomId}', this)" class="hidden">
                            </label>
                        </div>
                        <div id="file_preview_${roomId}" class="text-[11px] text-indigo-700 font-bold bg-white p-2 rounded border border-indigo-200 hidden"></div>

                        <div class="flex gap-2 pt-1">
                            <button onclick="sendReplyMessage('${roomId}', '${latestMsg.message_id || ''}', this)" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 rounded shadow transition">
                                📤 返信して既読にする
                            </button>
                            <button onclick="markRoomAsRead('${roomId}', '${latestMsg.message_id || ''}')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-3 py-2 rounded transition">
                                📖 既読のみ
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleFileSelect = function(roomId, inputEl) {
            const previewEl = document.getElementById(`file_preview_${roomId}`);
            if (inputEl.files && inputEl.files[0]) {
                const file = inputEl.files[0];
                previewEl.textContent = `📎 添付予定: ${file.name} (${Math.round(file.size / 1024)} KB)`;
                previewEl.style.display = 'block';
            } else {
                previewEl.style.display = 'none';
            }
        };

        async function generateAiDraft(roomId, receivedMsg) {
            const promptInput = document.getElementById(`ai_prompt_${roomId}`);
            const textarea = document.getElementById(`reply_text_${roomId}`);
            if (!textarea) return;
            
            const customInstruction = promptInput ? promptInput.value.trim() : "";
            textarea.value = "🤖 AI返信案を作成中...";
            
            setTimeout(() => {
                let draft = "";
                if (customInstruction) {
                    draft = `お世話になっております。\n${customInstruction}\n\n引き続きよろしくお願いいたします。`;
                } else if (receivedMsg.includes("納品") || receivedMsg.includes("商品")) {
                    draft = "お世話になっております。ご連絡いただきありがとうございます。\n商品の納品件、確認いたしました。引き続きよろしくお願いいたします。";
                } else if (receivedMsg.includes("エラー") || receivedMsg.includes("トラブル")) {
                    draft = "お世話になっております。ご迷惑をおかけし申し訳ございません。\n状況を確認いたしますので、少々お待ちくださいませ。";
                } else {
                    draft = "お世話になっております。ご連絡ありがとうございます。\n内容を確認の上、改めてご回答いたします。";
                }
                textarea.value = draft;
                aiDraftMemory[roomId] = draft;
            }, 600);
        }

        async function sendReplyMessage(roomId, lastChatId, btnEl) {
            const textarea = document.getElementById(`reply_text_${roomId}`);
            const cameraInput = document.getElementById(`reply_camera_${roomId}`);
            const fileInput = document.getElementById(`reply_file_${roomId}`);
            
            const hasText = textarea && textarea.value.trim();
            const hasFile = (cameraInput && cameraInput.files.length > 0) || (fileInput && fileInput.files.length > 0);

            if (!hasText && !hasFile) {
                alert("送信するメッセージまたはファイルを入力・選択してください。");
                return;
            }
            const finalMessage = textarea.value.trim();
            const receivedMsg = textarea.dataset.received || "";

            btnEl.disabled = true;
            btnEl.textContent = "送信中...";

            try {
                if (finalMessage) {
                    await callGasApi("send_message", { room_id: roomId, body: finalMessage });
                }
                
                if (window.saveAiFeedbackLog) {
                    await window.saveAiFeedbackLog(receivedMsg, aiDraftMemory[roomId] || "", finalMessage);
                }

                alert("メッセージを送信しました！");
                await markRoomAsRead(roomId, lastChatId);
            } catch (e) {
                alert("送信に失敗しました: " + e.message);
                btnEl.disabled = false;
                btnEl.textContent = "📤 返信して既読にする";
            }
        }

        async function markRoomAsRead(roomId, lastChatId) {
            try {
                await callGasApi("mark_read", { room_id: roomId, last_chat_id: lastChatId || "" });
                refreshCurrentView();
            } catch (e) {
                alert('既読化失敗: ' + e.message);
            }
        }

        async function fetchAllUnreadRooms() {
            const statusEl = document.getElementById('loadStatus');
            const burstCont = document.getElementById('burstModeContainer');
            statusEl.textContent = "スキャン中...";
            
            burstCont.innerHTML = `
                <div class="text-center text-xs text-slate-500 py-8 bg-white rounded-xl shadow-sm border border-slate-200">
                    <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-600 border-t-transparent mb-1"></div>
                    <div>未読ルームのメッセージを一括スキャン中...</div>
                </div>
            `;

            try {
                const data = await callGasApi("get_rooms");
                allRoomsCache = data.rooms || [];
                const unreadRooms = allRoomsCache.filter(r => r.unread_num > 0);

                updateLaterBadge();

                if (unreadRooms.length === 0) {
                    burstCont.innerHTML = `
                        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center space-y-2">
                            <div class="text-2xl">🎉</div>
                            <div class="text-sm font-bold text-slate-700">未読のルームはありません！すべて完了しています。</div>
                        </div>
                    `;
                    statusEl.textContent = "未読ゼロ";
                    statusEl.className = "text-xs bg-emerald-500 px-2 py-0.5 rounded-full text-white";
                    return;
                }

                burstCont.innerHTML = '';
                for (const room of unreadRooms) {
                    const roomId = room.room_id;
                    const cardId = `burst_card_${roomId}`;
                    burstCont.innerHTML += `
                        <div id="${cardId}" class="bg-white border-2 border-indigo-100 rounded-xl p-3.5 shadow-sm space-y-3">
                            <div class="space-y-1.5 pb-2 border-b border-slate-100">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        <span class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">未読 ${room.unread_num}件</span>
                                        <h3 class="font-bold text-sm text-slate-900">${escapeHtml(room.name)}</h3>
                                    </div>
                                    <button onclick="toggleLaterRoom('${roomId}', '${escapeHtml(room.name).replace(/'/g, "\\'")}')" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-900 px-2.5 py-1 rounded font-bold transition">
                                        ⏳ 後で対応
                                    </button>
                                </div>
                                <button onclick="fetchSellerInfo('${escapeHtml(room.name).replace(/'/g, "\\'")}')" class="w-full text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-2 px-3 rounded-lg border border-indigo-200 font-bold flex items-center justify-center gap-1.5 shadow-sm transition">
                                    🔑 セラー情報を確認する
                                </button>
                            </div>
                            <div class="burst-msg-area text-xs text-slate-500 p-2 bg-slate-50 rounded">メッセージを読み込み中...</div>
                        </div>
                    `;
                }

                unreadRooms.forEach(async (room) => {
                    const roomId = room.room_id;
                    const cardEl = document.getElementById(`burst_card_${roomId}`);
                    if (!cardEl) return;
                    try {
                        const roomData = await callGasApi("get_room_data", { room_id: roomId });
                        const messages = roomData.messages || [];
                        if (messages.length === 0) {
                            cardEl.querySelector('.burst-msg-area').innerHTML = '<span class="text-slate-400">メッセージなし</span>';
                            return;
                        }
                        const latestMsg = messages[messages.length - 1];
                        cardEl.outerHTML = buildMessageCardHtml(roomId, room.name, latestMsg, room.unread_num);
                    } catch (e) {
                        cardEl.querySelector('.burst-msg-area').innerHTML = '<span class="text-red-500">取得失敗</span>';
                    }
                });

                statusEl.textContent = `未読 ${unreadRooms.length}件`;
                statusEl.className = "text-xs bg-amber-500 px-2 py-0.5 rounded-full text-white";
            } catch (e) {
                burstCont.innerHTML = `<div class="text-xs text-red-500 text-center p-4">エラー: ${e.message}</div>`;
                statusEl.textContent = "エラー";
            }
        }
    </script>
</body>
</html>
