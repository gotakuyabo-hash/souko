<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatwork 未読バーストコックピット (完全安定版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0",
            authDomain: "souko-2de57.firebaseapp.com",
            projectId: "souko-2de57",
            storageBucket: "souko-2de57.firebasestorage.app",
            messagingSenderId: "642116656086",
            appId: "1:642116656086:web:139cc5558a4ef6ebda6277"
        });
        const db = getFirestore(app);
        window.db = db;

        // 🚀 スタッフ間連絡アプリへの登録（Firestore: staff_requests）
        window.registerToStaffApp = async function(btnEl) {
            const roomId = document.getElementById('linkRoomId').value;
            const roomName = document.getElementById('linkRoomName').value;
            const senderName = document.getElementById('linkSenderName').value;
            const messageBody = document.getElementById('linkMessageBody').value;
            
            const fromVal = document.getElementById('linkFromInput').value;
            const toVal = document.getElementById('linkToInput').value;
            const memoVal = document.getElementById('linkMemoInput').value;
            const imageInput = document.getElementById('linkImageInput');

            let taskContent = `【Chatwork連携依頼】\nルーム名: ${roomName}\n\n👤 発言者: ${senderName}\n💬 メッセージ本文:\n${messageBody}`;
            if (memoVal) taskContent += `\n\n📝 連絡メモ:\n${memoVal}`;

            btnEl.disabled = true;
            btnEl.textContent = "登録中...";

            try {
                let imageUrl = null;
                if (imageInput && imageInput.files && imageInput.files[0]) {
                    const file = imageInput.files[0];
                    imageUrl = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                }

                await addDoc(collection(db, "staff_requests"), {
                    from: fromVal || '未設定',
                    to: toVal || '未設定',
                    task: taskContent,
                    imageUrl: imageUrl,
                    status: 'pending',
                    createdAt: serverTimestamp()
                });
                alert('スタッフ間連絡アプリに登録しました！');
                closeAllModals();
            } catch (error) {
                alert("登録失敗: " + error.message);
            } finally {
                btnEl.disabled = false;
                btnEl.textContent = "🚀 スタッフ間連絡アプリに登録する";
            }
        };
    </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-16 text-xs">
    <!-- ヘッダー -->
    <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-20">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <h1 class="text-sm font-bold">🚀 未読バーストコックピット</h1>
            <div class="flex items-center gap-2">
                <span id="loadStatus" class="text-xs bg-indigo-500 px-2 py-0.5 rounded-full text-indigo-100">読込中...</span>
                <button onclick="refreshCurrentView()" class="bg-indigo-700 text-xs px-2.5 py-1.5 rounded font-bold cursor-pointer">🔄 更新</button>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="max-w-md mx-auto p-3 space-y-3">
        <!-- アカウント選択 ＆ タブ切り替え -->
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
            <select id="accountSelect" onchange="refreshCurrentView()" class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-indigo-50 font-bold text-indigo-950">
                <option value="5435a05ddd195c46ca688d021e45bbce" selected>ラクロジスタッフアカウント</option>
                <option value="57d74ea2e63325c5306b594c3bb231af">松下アカウント</option>
            </select>
            
            <div class="grid grid-cols-3 bg-slate-100 p-1 rounded-lg gap-1">
                <button id="tabBurst" onclick="switchMode('burst')" class="py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm cursor-pointer">⚡ 未読</button>
                <button id="tabLater" onclick="switchMode('later')" class="py-1.5 text-[11px] font-bold rounded-md text-slate-600 cursor-pointer">⏳ 後で (<span id="laterCountBadge">0</span>)</button>
                <button id="tabNormal" onclick="switchMode('normal')" class="py-1.5 text-[11px] font-bold rounded-md text-slate-600 cursor-pointer">📁 通常</button>
            </div>

            <!-- 一括操作バー（未読・後でタブでのみ表示） -->
            <div id="batchActionBar" class="space-y-2 pt-2 border-t border-slate-100">
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-1.5 font-bold cursor-pointer text-slate-600">
                        <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)" class="w-3.5 h-3.5 rounded"> 全選択
                    </label>
                    <button onclick="batchMarkAsRead()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded shadow-sm text-xs cursor-pointer">
                        ✅ 選択したルームを一括既読
                    </button>
                </div>
                <div>
                    <button onclick="copyAllUnreadChats(this)" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-1.5 rounded shadow-sm text-xs cursor-pointer">
                        📋 未読タブの全チャットをまとめてコピー
                    </button>
                </div>
            </div>
        </div>

        <!-- 各モードコンテナ -->
        <div id="burstModeContainer" class="space-y-3"></div>
        <div id="laterModeContainer" class="space-y-3" style="display:none;"></div>
        <div id="normalModeContainer" class="space-y-3" style="display:none;">
            <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
                <input type="text" id="roomSearchInput" oninput="filterNormalRooms()" placeholder="🔍 ルーム名検索..." class="w-full border rounded-lg p-2 text-xs bg-slate-50">
                <select id="roomSelect" onchange="loadSingleRoomMessages()" class="w-full border rounded-lg p-2.5 text-xs bg-white shadow-inner font-bold">
                    <option value="">-- ルームを選択 --</option>
                </select>
            </div>
            <div id="singleRoomMessageContainer" class="space-y-3"></div>
        </div>
    </div>

    <!-- モーダル群 -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-40 hidden" onclick="closeAllModals()"></div>

    <!-- 🔑 セラー情報モーダル -->
    <div id="modalSellerInfo" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-sm bg-white rounded-xl shadow-2xl z-50 hidden flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-indigo-50 rounded-t-xl">
            <h2 class="font-bold text-indigo-900 text-xs">🔑 紐づくセラー情報</h2>
            <button onclick="closeAllModals()" class="text-base px-2 cursor-pointer">&times;</button>
        </div>
        <div class="p-4 space-y-3 text-xs">
            <div><span class="text-[11px] text-slate-500 font-bold block">管理番号</span><span id="sellerModalKanriNo" class="font-bold">-</span></div>
            <div><span class="text-[11px] text-slate-500 font-bold block">お名前 / ショップ名</span><span id="sellerModalName" class="font-bold">-</span> (<span id="sellerModalShopName">-</span>)</div>
            <div class="bg-slate-50 p-3 rounded-lg border space-y-2">
                <div><span class="text-[11px] text-indigo-600 font-bold block">ログインID</span><span id="sellerModalId" class="font-mono text-xs select-all">-</span></div>
                <div><span class="text-[11px] text-indigo-600 font-bold block">パスワード</span><span id="sellerModalPass" class="font-mono text-xs select-all">-</span></div>
            </div>
            <button onclick="closeAllModals()" class="w-full bg-slate-200 py-2 rounded-lg text-xs font-bold cursor-pointer">閉じる</button>
        </div>
    </div>

    <!-- 🔗 スタッフ間連絡モーダル -->
    <div id="modalLinkCopy" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-md bg-white rounded-xl shadow-2xl z-50 hidden flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-indigo-50 rounded-t-xl">
            <h2 class="font-bold text-indigo-900 text-xs">🔗 スタッフ間連絡に登録</h2>
            <button onclick="closeAllModals()" class="text-base px-2 cursor-pointer">&times;</button>
        </div>
        <div class="p-4 space-y-3 text-xs">
            <input type="hidden" id="linkRoomId"><input type="hidden" id="linkRoomName"><input type="hidden" id="linkSenderName"><input type="hidden" id="linkMessageBody">
            <div><label class="block font-bold text-slate-600 mb-1">👤 From</label><input type="text" id="linkFromInput" value="松下" class="w-full border rounded p-2 text-xs"></div>
            <div><label class="block font-bold text-slate-600 mb-1">🎯 To</label><input type="text" id="linkToInput" value="スタッフ全員" class="w-full border rounded p-2 text-xs"></div>
            <div><label class="block font-bold text-slate-600 mb-1">📷 画像アップロード</label><input type="file" id="linkImageInput" accept="image/*" class="w-full border rounded p-1.5 text-xs bg-slate-50"></div>
            <div><label class="block font-bold text-slate-600 mb-1">📝 軽いメモ</label><textarea id="linkMemoInput" class="w-full h-16 border rounded p-2 text-xs"></textarea></div>
            <button onclick="registerToStaffApp(this)" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg shadow cursor-pointer text-xs">🚀 スタッフ間連絡アプリに登録する</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzbGircW91tKx9NIihoWRMCiyIYnVbJJoeJZ9IoUf5s6vI71zNVnqJOo38vSOqfeMYzzA/exec";
        let allRoomsCache = [];
        let unreadRoomsCache = [];
        let roomMembersCache = {};
        let currentMode = 'burst';
        window.messageStore = {};
        const LATER_KEY = "chatwork_later_rooms_v1";

        window.addEventListener('DOMContentLoaded', () => {
            updateLaterBadge();
            fetchAllUnreadRooms();
        });

        function getToken() { return document.getElementById('accountSelect').value; }
        function esc(str) { return !str ? '' : String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function closeAllModals() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('modalSellerInfo').style.display = 'none';
            document.getElementById('modalLinkCopy').style.display = 'none';
        }

        async function callApi(action, params = {}) {
            params.action = action;
            params.token = getToken();
            const res = await fetch(`${GAS_URL}?${new URLSearchParams(params)}`);
            const data = await res.json();
            if (data.status !== "success") throw new Error(data.message || "エラー");
            return data;
        }

        function refreshCurrentView() {
            document.getElementById('selectAllCheckbox').checked = false;
            if (currentMode === 'burst') fetchAllUnreadRooms();
            else if (currentMode === 'later') renderLaterRooms();
            else fetchNormalRooms();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('selectAllCheckbox').checked = false;
            ['tabBurst', 'tabLater', 'tabNormal'].forEach(id => {
                document.getElementById(id).className = "py-1.5 text-[11px] font-bold rounded-md text-slate-600 cursor-pointer";
            });
            ['burstModeContainer', 'laterModeContainer', 'normalModeContainer', 'batchActionBar'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });

            if (mode === 'burst') {
                document.getElementById('tabBurst').className = "py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm cursor-pointer";
                document.getElementById('burstModeContainer').style.display = 'block';
                document.getElementById('batchActionBar').style.display = 'block';
                fetchAllUnreadRooms();
            } else if (mode === 'later') {
                document.getElementById('tabLater').className = "py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm cursor-pointer";
                document.getElementById('laterModeContainer').style.display = 'block';
                document.getElementById('batchActionBar').style.display = 'block';
                renderLaterRooms();
            } else {
                document.getElementById('tabNormal').className = "py-1.5 text-[11px] font-bold rounded-md bg-white text-indigo-600 shadow-sm cursor-pointer";
                document.getElementById('normalModeContainer').style.display = 'block';
                fetchNormalRooms();
            }
        }

        // ⏳ 後で対応機能
        function getLaterRooms() { try { return JSON.parse(localStorage.getItem(LATER_KEY)) || {}; } catch(e) { return {}; } }
        function updateLaterBadge() {
            const later = getLaterRooms();
            document.getElementById('laterCountBadge').textContent = (later[getToken()] || []).length;
        }
        window.toggleLaterRoom = function(roomId) {
            const later = getLaterRooms();
            const token = getToken();
            if (!later[token]) later[token] = [];
            const idx = later[token].indexOf(String(roomId));
            if (idx > -1) { 
                later[token].splice(idx, 1); 
                alert("「後で対応」から外しました。"); 
            } else { 
                later[token].push(String(roomId)); 
                alert("「後で対応」に追加しました！"); 
            }
            localStorage.setItem(LATER_KEY, JSON.stringify(later));
            updateLaterBadge();
            if (currentMode === 'later') renderLaterRooms();
        };

        function renderLaterRooms() {
            const container = document.getElementById('laterModeContainer');
            const list = getLaterRooms()[getToken()] || [];
            if (list.length === 0) {
                container.innerHTML = '<div class="bg-white p-8 rounded-xl text-center text-xs font-bold text-slate-700 shadow-sm border">☕ 「後で対応」に保存されたルームはありません。</div>';
                return;
            }
            container.innerHTML = '';
            list.forEach(roomId => {
                const roomObj = allRoomsCache.find(r => String(r.room_id) === String(roomId));
                const roomName = roomObj ? roomObj.name : `ルームID: ${roomId}`;
                renderBurstCard(container, roomId, roomName, "⏳ 後で対応", "border-amber-200");
            });
        }

        // ⚡ 未読タブ用カード描画
        async function renderBurstCard(container, roomId, roomName, badgeText, borderColor, unreadBadge = null) {
            const cardDiv = document.createElement('div');
            cardDiv.className = `burst-card bg-white border-2 ${borderColor} rounded-xl p-3.5 shadow-sm space-y-3 w-full max-w-full overflow-hidden box-border`;
            cardDiv.setAttribute('data-room-name', roomName);
            cardDiv.innerHTML = `
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                    <div class="flex items-center gap-2 min-w-0 mr-2">
                        <input type="checkbox" class="room-checkbox w-4 h-4 rounded cursor-pointer" data-room-id="${roomId}">
                        <span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0">${unreadBadge || badgeText}</span>
                        <h3 class="font-bold text-xs text-slate-900 truncate">${esc(roomName)}</h3>
                    </div>
                </div>
                <div class="msg-loading text-xs text-slate-400 text-center py-2">メッセージ読込中...</div>
            `;
            container.appendChild(cardDiv);

            try {
                const roomData = await callApi("get_room_data", { room_id: roomId });
                const msgs = roomData.messages || [];
                roomMembersCache[roomId] = roomData.members || [];

                if (msgs.length === 0) {
                    cardDiv.querySelector('.msg-loading').innerHTML = 'メッセージなし';
                    return;
                }
                cardDiv.innerHTML = `
                    <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                        <div class="flex items-center gap-2 min-w-0 mr-2">
                            <input type="checkbox" class="room-checkbox w-4 h-4 rounded cursor-pointer" data-room-id="${roomId}">
                            <span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0">${unreadBadge || badgeText}</span>
                            <h3 class="font-bold text-xs text-slate-900 truncate">${esc(roomName)}</h3>
                        </div>
                    </div>
                    ${buildCardContent(roomId, roomName, msgs, roomData.members || [], 1)}
                `;
            } catch (e) {
                cardDiv.querySelector('.msg-loading').innerHTML = '<span class="text-red-500">メッセージ取得失敗</span>';
            }
        }

        window.toggleSelectAll = function(masterCheckbox) {
            const checkboxes = document.querySelectorAll('.room-checkbox');
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
        };

        window.batchMarkAsRead = async function() {
            const checkedBoxes = document.querySelectorAll('.room-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert("既読にするルームが選択されていません。");
                return;
            }
            if (!confirm(`選択された ${checkedBoxes.length} 件のルームを既読にしますか？`)) return;

            let successCount = 0;
            for (const cb of checkedBoxes) {
                const roomId = cb.getAttribute('data-room-id');
                try {
                    await callApi("mark_read", { room_id: roomId });
                    successCount++;
                } catch (e) {}
            }
            alert(`${successCount} 件のルームを既読にしました！`);
            refreshCurrentView();
        };

        // 📋 単体コピー機能
        window.copyMessageText = function(msgKey, btn) {
            const text = window.messageStore[msgKey] || "";
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = "✅ コピー完了";
                btn.className = btn.className.replace("bg-slate-200 hover:bg-slate-300 text-slate-700", "bg-emerald-500 text-white");
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.className = btn.className.replace("bg-emerald-500 text-white", "bg-slate-200 hover:bg-slate-300 text-slate-700");
                }, 1500);
            }).catch(err => {
                alert("コピーに失敗しました: " + err);
            });
        };

        // 📋 未読タブの全チャット一括コピー
        window.copyAllUnreadChats = function(btn) {
            const activeContainer = currentMode === 'burst' ? document.getElementById('burstModeContainer') : document.getElementById('laterModeContainer');
            const cardElements = activeContainer.querySelectorAll('.burst-card');

            if (cardElements.length === 0) {
                alert("コピーする未読メッセージがありません。");
                return;
            }

            let combinedText = "【未読チャット一覧】\n\n";
            cardElements.forEach((card, idx) => {
                const roomName = card.getAttribute('data-room-name') || "ルーム";
                const bodyEl = card.querySelector('.chat-msg-body-text');
                const bodyText = bodyEl ? bodyEl.textContent : "";
                combinedText += `■ [${idx + 1}] ルーム: ${roomName}\n${bodyText}\n\n--------------------\n\n`;
            });

            navigator.clipboard.writeText(combinedText.trim()).then(() => {
                const originalText = btn.textContent;
                btn.textContent = "✅ 全未読チャットのコピー完了！";
                btn.className = btn.className.replace("bg-sky-600 hover:bg-sky-700 text-white", "bg-emerald-600 text-white");
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.className = btn.className.replace("bg-emerald-600 text-white", "bg-sky-600 hover:bg-sky-700 text-white");
                }, 1500);
            }).catch(err => {
                alert("一括コピーに失敗しました: " + err);
            });
        };

        // 📁 通常タブの20件一括コピー
        window.copyAllRoomMessages = function(roomName, btn) {
            const msgContainers = document.querySelectorAll('#singleRoomMessageContainer .chat-msg-body-text');
            if (msgContainers.length === 0) {
                alert("コピーするメッセージがありません。");
                return;
            }
            let combinedText = `【ルーム名: ${roomName}】\n\n`;
            msgContainers.forEach((el, idx) => {
                combinedText += `--- メッセージ ${idx + 1} ---\n` + el.textContent + `\n\n`;
            });

            navigator.clipboard.writeText(combinedText.trim()).then(() => {
                const originalText = btn.textContent;
                btn.textContent = "✅ 20件コピー完了";
                btn.className = btn.className.replace("bg-indigo-600 hover:bg-indigo-700 text-white", "bg-emerald-600 text-white");
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.className = btn.className.replace("bg-emerald-600 text-white", "bg-indigo-600 hover:bg-indigo-700 text-white");
                }, 1500);
            }).catch(err => {
                alert("一括コピーに失敗しました: " + err);
            });
        };

        // 🚀 スタッフ間連絡モーダルを開く（ここでフォームへ確実に値をセットするよう修正）
        window.openStaffAppModal = function(msgKey, roomName, senderName) {
            const messageBody = window.messageStore[msgKey] || "";
            document.getElementById('linkRoomId').value = "";
            document.getElementById('linkRoomName').value = roomName;
            document.getElementById('linkSenderName').value = senderName;
            document.getElementById('linkMessageBody').value = messageBody;
            
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalLinkCopy').style.display = 'flex';
        };

        window.fetchSellerInfo = async function(keyword) {
            if (!keyword) return;
            document.getElementById('sellerModalKanriNo').textContent = "読込中...";
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('modalSellerInfo').style.display = 'flex';
            try {
                const data = await callApi("get_seller_info", { chatwork_id: keyword });
                if (!data.seller || data.seller.error) {
                    document.getElementById('sellerModalKanriNo').textContent = "見つかりませんでした";
                    return;
                }
                const s = data.seller;
                document.getElementById('sellerModalKanriNo').textContent = s.kanriNo || 'なし';
                document.getElementById('sellerModalName').textContent = s.name || 'なし';
                document.getElementById('sellerModalShopName').textContent = s.shopName || 'なし';
                document.getElementById('sellerModalId').textContent = s.id || '未登録';
                document.getElementById('sellerModalPass').textContent = s.pass || '未登録';
            } catch (e) {
                alert("取得失敗: " + e.message);
                closeAllModals();
            }
        };

        // 📁 通常タブ
        async function fetchNormalRooms() {
            const selectEl = document.getElementById('roomSelect');
            selectEl.innerHTML = '<option value="">-- ルーム一覧読み込み中... --</option>';
            try {
                if (allRoomsCache.length === 0) {
                    const data = await callApi("get_rooms");
                    allRoomsCache = data.rooms || [];
                }
                renderRoomOptions(allRoomsCache);
            } catch (e) { selectEl.innerHTML = `<option value="">取得失敗: ${e.message}</option>`; }
        }
        function renderRoomOptions(rooms) {
            const selectEl = document.getElementById('roomSelect');
            let html = '<option value="">-- ルームを選択 --</option>';
            rooms.forEach(r => {
                const unread = Number(r.unread_num !== undefined ? r.unread_num : (r.unread_count || 0));
                html += `<option value="${r.room_id}">${esc(r.name)}${unread > 0 ? ` [未読 ${unread}件]` : ''}</option>`;
            });
            selectEl.innerHTML = html;
        }
        function filterNormalRooms() {
            const kw = document.getElementById('roomSearchInput').value.toLowerCase();
            renderRoomOptions(allRoomsCache.filter(r => r.name.toLowerCase().includes(kw)));
        }
        async function loadSingleRoomMessages() {
            const roomId = document.getElementById('roomSelect').value;
            const container = document.getElementById('singleRoomMessageContainer');
            if (!roomId) { container.innerHTML = ''; return; }
            container.innerHTML = '<div class="text-center text-xs text-slate-500 py-6 bg-white rounded-xl shadow-sm border">メッセージ取得中...</div>';
            try {
                const roomData = await callApi("get_room_data", { room_id: roomId });
                const msgs = roomData.messages || [];
                roomMembersCache[roomId] = roomData.members || [];
                if (msgs.length === 0) { container.innerHTML = '<div class="bg-white p-6 rounded-xl text-center text-xs shadow-sm border">メッセージなし</div>'; return; }
                const roomObj = allRoomsCache.find(r => String(r.room_id) === String(roomId));
                container.innerHTML = buildCardContent(roomId, roomObj?.name || "ルーム", msgs, roomData.members || [], 20, true);
            } catch (e) { container.innerHTML = `<div class="text-xs text-red-500 bg-white p-4 rounded-xl shadow-sm border">エラー: ${e.message}</div>`; }
        }

        function parseMessageBody(body) {
            return `<div class="chat-msg-body-text whitespace-pre-wrap break-all text-xs">${esc(body)}</div>`;
        }

        // ⚡ 未読ルーム一覧スキャン
        async function fetchAllUnreadRooms() {
            const container = document.getElementById('burstModeContainer');
            const statusEl = document.getElementById('loadStatus');
            container.innerHTML = '<div class="text-center text-xs text-slate-500 py-8 bg-white rounded-xl shadow-sm border">未読ルームをスキャン中...</div>';
            statusEl.textContent = "スキャン中...";

            try {
                const data = await callApi("get_rooms");
                allRoomsCache = data.rooms || [];
                
                unreadRoomsCache = allRoomsCache.filter(r => {
                    const unread = Number(r.unread_num !== undefined ? r.unread_num : (r.unread_count || 0));
                    return unread > 0;
                });

                updateLaterBadge();

                if (unreadRoomsCache.length === 0) {
                    container.innerHTML = '<div class="bg-white p-8 rounded-xl text-center text-sm font-bold text-slate-700 shadow-sm border">🎉 未読のルームはありません！</div>';
                    statusEl.textContent = "未読ゼロ";
                    statusEl.className = "text-xs bg-emerald-500 px-2 py-0.5 rounded-full text-white";
                    return;
                }

                container.innerHTML = '';
                unreadRoomsCache.forEach(room => {
                    const unread = Number(room.unread_num !== undefined ? room.unread_num : (room.unread_count || 0));
                    renderBurstCard(container, room.room_id, room.name, "未読", "border-indigo-100", `未読 ${unread}件`);
                });

                statusEl.textContent = `未読 ${unreadRoomsCache.length}件`;
                statusEl.className = "text-xs bg-amber-500 px-2 py-0.5 rounded-full text-white";

            } catch (e) {
                container.innerHTML = `<div class="text-xs text-red-500 text-center p-4 bg-white rounded-xl shadow-sm border">エラー: ${e.message}</div>`;
                statusEl.textContent = "エラー";
            }
        }

        // カード内部のHTML生成
        function buildCardContent(roomId, roomName, messages, members, displayCount = 1, isNormalTab = false) {
            let chatHistoryHtml = '';
            let latestMsg = {};

            const chatCount = Math.min(messages.length, displayCount);
            const recentMsgs = messages.slice(messages.length - chatCount);
            latestMsg = messages[messages.length - 1] || {};
            const lastChatId = latestMsg.message_id || "";
            const chatworkRoomUrl = `https://www.chatwork.com/#!rid${roomId}`;

            recentMsgs.forEach((m, idx) => {
                const sender = m.account ? m.account.name : "相手";
                const body = m.body || "";
                const parsed = parseMessageBody(body);
                
                const msgKey = `msg_${roomId}_${idx}_${Math.random().toString(36).substr(2, 6)}`;
                window.messageStore[msgKey] = body;

                chatHistoryHtml += `
                    <div class="p-2.5 bg-slate-50 rounded-lg border border-slate-200 space-y-2 w-full box-border">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-[11px] text-indigo-900">👤 ${esc(sender)}:</span>
                            <button onclick="copyMessageText('${msgKey}', this)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded cursor-pointer transition">📋 コピー</button>
                        </div>
                        ${parsed}
                        <div class="grid grid-cols-2 gap-1.5 pt-1">
                            <a href="${chatworkRoomUrl}" target="_blank" class="bg-sky-500 hover:bg-sky-600 text-white text-[11px] font-bold py-1 px-2 rounded text-center transition block truncate">
                                🌐 公式ルーム
                            </a>
                            <button onclick="openStaffAppModal('${msgKey}', '${esc(roomName)}', '${esc(sender)}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold py-1 px-2 rounded shadow-sm transition cursor-pointer truncate">
                                🚀 スタッフ連絡
                            </button>
                        </div>
                    </div>
                `;
            });

            let batchCopyHeaderBtn = '';
            if (isNormalTab) {
                const safeRoomNameForCopy = roomName.replace(/'/g, "\\'");
                batchCopyHeaderBtn = `
                    <button onclick="copyAllRoomMessages('${safeRoomNameForCopy}', this)" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-lg shadow-sm transition cursor-pointer mb-2">
                        📁 表示中の ${chatCount}件のチャットをまとめてコピー
                    </button>
                `;
            }

            chatHistoryHtml = `
                <div class="space-y-2 max-h-80 overflow-y-auto pr-1 w-full box-border">
                    <div class="text-[10px] font-bold text-slate-400">💬 メッセージ (${chatCount}件)</div>
                    ${batchCopyHeaderBtn}
                    ${chatHistoryHtml}
                </div>
            `;

            let memberOptions = '<option value="">-- メンバーを選択してTo追加 --</option>';
            if (Array.isArray(members)) {
                members.forEach(m => {
                    memberOptions += `<option value="${m.account_id}">${esc(m.name)}</option>`;
                });
            }

            return `
                <div class="space-y-2 pb-2 border-b border-slate-100 flex items-center gap-2">
                    <button onclick="fetchSellerInfo('${esc(roomName)}')" class="flex-1 text-xs bg-indigo-50 text-indigo-700 py-1.5 rounded-lg border border-indigo-200 font-bold cursor-pointer">🔑 セラー情報</button>
                    <button onclick="toggleLaterRoom('${roomId}')" class="text-xs bg-amber-100 text-amber-900 px-3 py-1.5 rounded-lg font-bold cursor-pointer">⏳ 後で対応</button>
                </div>
                
                ${chatHistoryHtml}

                <div class="space-y-2 pt-1 bg-indigo-50/40 p-2.5 rounded-lg border border-indigo-100 w-full box-border">
                    <div class="flex items-center gap-1.5 pt-1">
                        <select id="member_select_${roomId}" class="flex-1 border rounded p-1 text-xs bg-white font-bold">
                            ${memberOptions}
                        </select>
                        <button onclick="insertSelectedMention('${roomId}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1 rounded shrink-0 cursor-pointer">💬 To追加</button>
                    </div>

                    <textarea id="reply_text_${roomId}" placeholder="返信案..." class="w-full h-16 text-xs border rounded p-2 bg-white box-border"></textarea>

                    <div class="flex gap-2 pt-1">
                        <button onclick="sendReplyMessage('${roomId}', this)" class="flex-1 bg-emerald-600 text-white text-xs font-bold py-1.5 rounded cursor-pointer">📤 メッセージ送信</button>
                        <button onclick="markAsRead('${roomId}', '${lastChatId}', this)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold py-1.5 px-3 rounded cursor-pointer">📖 既読にする</button>
                    </div>
                </div>
            `;
        }

        window.insertSelectedMention = function(roomId) {
            const selectEl = document.getElementById(`member_select_${roomId}`);
            const textarea = document.getElementById(`reply_text_${roomId}`);
            if (!selectEl || !textarea) return;

            const accountId = selectEl.value;
            const memberName = selectEl.options[selectEl.selectedIndex].text;

            if (!accountId) {
                alert("宛先にするメンバーを選択してください。");
                return;
            }

            const mentionText = `[To:${accountId}] ${memberName}さん\n`;
            textarea.value = mentionText + textarea.value;
            textarea.focus();
        };

        // 📖 個別既読にする機能
        window.markAsRead = async function(roomId, lastChatId, btn) {
            btn.disabled = true;
            btn.textContent = "処理中...";
            try {
                await callApi("mark_read", { room_id: roomId, last_chat_id: lastChatId });
                alert("既読にしました！");
                refreshCurrentView();
            } catch (e) {
                alert("既読エラー: " + e.message);
                btn.disabled = false;
                btn.textContent = "📖 既読にする";
            }
        };

        // 📤 メッセージ送信
        window.sendReplyMessage = async function(roomId, btn) {
            const roomIdStr = String(roomId);
            const textarea = document.getElementById(`reply_text_${roomIdStr}`);
            if (!textarea || !textarea.value.trim()) { alert("返信文を入力してください。"); return; }
            const finalMsg = textarea.value.trim();
            btn.disabled = true; btn.textContent = "送信中...";
            try {
                await callApi("send_message", { room_id: roomIdStr, body: finalMsg });
                alert("送信しました！");
                btn.disabled = false; btn.textContent = "📤 メッセージ送信";
            } catch (e) {
                alert("送信失敗: " + e.message);
                btn.disabled = false; btn.textContent = "📤 メッセージ送信";
            }
        };
    </script>
</body>
</html>
