<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatwork 未読対応アシスタント（定型文マスター版）</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">
    <!-- ヘッダー -->
    <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto">
            <h1 class="text-base font-bold flex items-center justify-between">
                <span>💬 Chatwork 爆速返信アシスタント</span>
                <span id="loadStatus" class="text-xs bg-indigo-500 px-2 py-0.5 rounded-full text-indigo-100">読込中...</span>
            </h1>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="max-w-md mx-auto p-3 space-y-3">
        <!-- アカウント選択 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-1.5">
            <label class="block text-xs font-bold text-slate-600">👤 アカウント</label>
            <select id="accountSelect" onchange="changeAccount()" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-indigo-50/50 font-bold text-indigo-950 focus:outline-none">
                <option value="57d74ea2e63325c5306b594c3bb231af">松下アカウント</option>
                <option value="5435a05ddd195c46ca688d021e45bbce">ラクロジスタッフアカウント</option>
            </select>
        </div>

        <!-- ルーム選択 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
            <div class="flex justify-between items-center">
                <label class="block text-xs font-bold text-slate-600">📁 セラー（ルーム）選択</label>
                <label class="flex items-center gap-1.5 cursor-pointer text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-200">
                    <input type="checkbox" id="unreadOnlyToggle" onchange="filterRooms()" class="rounded text-indigo-600">
                    🔴 未読のみ
                </label>
            </div>
            <input type="text" id="roomSearchInput" oninput="filterRooms()" placeholder="🔍 ルーム名検索..." class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50 focus:outline-none">
            <div class="space-y-2">
                <select id="roomSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white shadow-inner focus:outline-none">
                    <option value="">読込中...</option>
                </select>
                <div class="flex gap-2">
                    <button onclick="loadRoomMessages()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-2.5 rounded-lg shadow active:scale-95 transition">
                        メッセージを見る
                    </button>
                    <button onclick="togglePinCurrentRoom()" id="pinBtn" class="bg-amber-100 text-amber-800 text-xs px-3 py-2.5 rounded-lg font-bold border border-amber-300 shrink-0">
                        ⭐ ピン留め
                    </button>
                </div>
            </div>
        </div>

        <!-- 新規発信 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <label class="block text-xs font-bold text-slate-600">✍️ 選択中のルームへ新規発信</label>
            <div class="flex gap-2 mb-1">
                <select id="directTemplateSelect" onchange="insertTemplate(this, 'newDirectMessage')" class="flex-1 text-xs border border-indigo-300 rounded p-1.5 bg-white text-indigo-950 font-bold focus:outline-none shadow-sm template-dropdown">
                    <option value="">📥 定型文を呼び出す</option>
                </select>
                <button onclick="openTemplateEditorForSave('newDirectMessage')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 text-xs px-2 py-1.5 rounded font-bold border border-indigo-300 shrink-0 shadow-sm active:scale-95 transition">
                    💾 登録
                </button>
            </div>
            <textarea id="newDirectMessage" placeholder="ここに送信するメッセージを入力..." class="w-full h-20 text-sm p-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:outline-none"></textarea>
            <button onclick="sendDirectMessage(this)" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs py-2.5 rounded-lg font-bold shadow-sm active:scale-95 transition">
                📤 直接メッセージを送信する
            </button>
        </div>

        <!-- メッセージ表示エリア -->
        <div id="messageLoading" class="text-center text-xs text-slate-500 py-6" style="display:none;">
            <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-600 border-t-transparent mb-1"></div>
            <div>取得中...</div>
        </div>
        <div id="messageListContainer" class="space-y-3"></div>
    </div>

    <!-- ================= モーダル（ポップアップUI） ================= -->
    <!-- 背景
