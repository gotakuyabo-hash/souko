<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>出荷件数 日別集計</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f4f6f8; font-family: sans-serif; padding: 12px; color: #1e293b; }
        .card { background: white; padding: 16px; border-radius: 8px; max-width: 600px; margin: 0 auto 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .service-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .service-name-input { flex: 1; min-width: 0; padding: 8px; font-size: 14px; border: 1px solid #ced4da; border-radius: 4px; font-weight: bold; color: #495057; background: #fff; }
        .count-input { width: 95px; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 16px; text-align: center; }
        .action-btns { display: flex; gap: 4px; }
        .action-btns button { padding: 6px 8px; font-size: 12px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-delete { background-color: #dc3545 !important; }
        .total-box { background-color: #e9ecef; padding: 12px; border-radius: 6px; text-align: right; font-size: 16px; font-weight: bold; margin-top: 16px; }
        .total-box span { color: #007bff; font-size: 22px; margin-left: 8px; }
    </style>
</head>
<body>
    <div style="max-width: 600px; margin: 0 auto;">
        <a href="index.html" class="text-blue-600 font-bold mb-3 inline-block text-sm">← ポータルサイトに戻る</a>
        <div class="card">
            <h1 class="text-lg font-bold text-slate-800 mb-1">📊 出荷件数 日別集計・サービス管理</h1>
            <p class="text-xs text-gray-500 mb-3">Firestoreリアルタイム同期版</p>

            <div class="mb-3 bg-slate-50 p-3 rounded-lg flex items-center gap-3">
                <div class="flex-1">
                    <label class="block text-xs font-bold text-slate-700 mb-1">対象日</label>
                    <input type="date" id="commonDate" onchange="loadShukkaByDate(this.value)" class="w-full p-2 border rounded bg-white text-sm">
                </div>
            </div>

            <!-- 週次・月次集計表示エリア -->
            <div class="grid grid-cols-2 gap-2 mb-4">
                <div class="bg-slate-100 p-3 rounded-lg text-right">
                    <div class="text-xs text-gray-500 font-bold">週次合計 (<span id="weekRange">--</span>)</div>
                    <span id="weekTotal" class="text-lg font-bold text-blue-600">0</span> 件
                </div>
                <div class="bg-slate-100 p-3 rounded-lg text-right">
                    <div class="text-xs text-gray-500 font-bold">月次合計 (<span id="monthRange">--</span>)</div>
                    <span id="monthTotal" class="text-lg font-bold text-emerald-600">0</span> 件
                </div>
            </div>

            <p class="text-xs text-gray-500 mb-3">※サービス名の変更、並び替え（↑↓）、削除、新規追加が可能です</p>

            <div id="serviceList"></div>

            <div class="flex gap-2 mt-4 pt-4 border-t border-dashed">
                <input type="text" id="newServiceName" placeholder="追加するサービス名" class="flex-1 p-2 border rounded text-sm min-w-0">
                <button onclick="addService()" class="bg-cyan-600 text-white px-3 py-2 rounded font-bold text-xs whitespace-nowrap">サービス追加</button>
            </div>

            <div class="total-box">
                総合計 (日別): <span id="grandTotal">0</span> 件
            </div>

            <div class="flex gap-2 mt-5">
                <button id="clearBtn" class="bg-gray-500 text-white p-3 rounded font-bold text-sm flex-1">入力クリア</button>
                <button onclick="saveShukkaData()" class="bg-emerald-600 text-white p-3 rounded font-bold text-sm flex-[2]">データを保存</button>
            </div>
            <span id="shukkaMsg" class="block text-center font-bold text-emerald-600 text-xs mt-2"></span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyAFeCMbCRN0Rj3dKnLu25Nw6f_M0RG_wg0", authDomain: "souko-2de57.firebaseapp.com", projectId: "souko-2de57" }));
        const defaultServices = ['サービス1', 'サービス2', 'サービス3', 'サービス4', 'サービス5', 'サービス6', 'サービス7', 'サービス8'];
        let currentServices = [];
        let autoSaveTimer = null;

        async function init() {
            const today = new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '-');
            document.getElementById('commonDate').value = today;

            try {
                const docSnap = await getDoc(doc(db, "settings", "shukka_services"));
                currentServices = docSnap.exists() && docSnap.data().services ? docSnap.data().services : [...defaultServices];
            } catch(e) { currentServices = [...defaultServices]; }

            renderServices({});
            loadShukkaByDate(today);
        }

        function getCurrentInputs() {
            const counts = {};
            document.querySelectorAll('.service-row').forEach(row => {
                const name = row.querySelector('.service-name-input').value;
                const val = row.querySelector('.count-input').value;
                if (name) counts[name] = val === '' ? '' : Number(val);
            });
            return counts;
        }

        function renderServices(counts = {}) {
            const container = document.getElementById('serviceList');
            container.innerHTML = '';
            currentServices.forEach((name, index) => {
                const val = counts[name] !== undefined ? counts[name] : '';
                container.innerHTML += `<div class="service-row">
                    <input type="text" class="service-name-input" data-index="${index}" value="${name}">
                    <input type="number" class="count-input" min="0" placeholder="0" value="${val}" inputmode="numeric">
                    <div class="action-btns">
                        <button onclick="moveService(${index}, -1)">↑</button>
                        <button onclick="moveService(${index}, 1)">↓</button>
                        <button class="btn-delete" onclick="deleteService(${index})">削除</button>
                    </div>
                </div>`;
            });
            calcTotal();
            setupNameChangeEvents();
            setupAutoSaveEvents();
        }

        window.calcTotal = () => {
            let total = 0;
            document.querySelectorAll('.count-input').forEach(input => {
                const val = parseInt(input.value, 10);
                if (!isNaN(val)) total += val;
            });
            document.getElementById('grandTotal').textContent = total.toLocaleString();
        };

        // ── 日付ユーティリティ ──
        function parseDate(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // 週の計算（月曜始まり〜日曜終わり）
        function getWeekDates(dateStr) {
            const d = parseDate(dateStr);
            const day = d.getDay();
            const diffToMonday = day === 0 ? -6 : 1 - day;
            const monday = new Date(d);
            monday.setDate(d.getDate() + diffToMonday);

            const dates = [];
            for (let i = 0; i < 7; i++) {
                const temp = new Date(monday);
                temp.setDate(monday.getDate() + i);
                dates.push(formatDate(temp));
            }
            return {
                dates: dates,
                rangeText: `${monday.getMonth()+1}/${monday.getDate()}〜${parseDate(dates[6]).getMonth()+1}/${parseDate(dates[6]).getDate()}`
            };
        }

        // 月の計算（1日〜末日）
        function getMonthDates(dateStr) {
            const [y, m] = dateStr.split('-').map(Number);
            const lastDay = new Date(y, m, 0).getDate();
            const dates = [];
            for (let i = 1; i <= lastDay; i++) {
                dates.push(`${y}-${String(m).padStart(2, '0')}-${String(i).padStart(2, '0')}`);
            }
            return {
                dates: dates,
                rangeText: `${y}年${m}月`
            };
        }

        // 週次・月次の数値をFirestoreから一括取得して集計
        async function loadPeriodTotals(dateStr) {
            if (!dateStr) return;

            const weekInfo = getWeekDates(dateStr);
            const monthInfo = getMonthDates(dateStr);

            document.getElementById('weekRange').textContent = weekInfo.rangeText;
            document.getElementById('monthRange').textContent = monthInfo.rangeText;

            // 週次集計
            let weekTotal = 0;
            const weekSnaps = await Promise.all(weekInfo.dates.map(d => getDoc(doc(db, "shukka_records", d))));
            weekSnaps.forEach(snap => {
                if (snap.exists()) {
                    Object.values(snap.data()).forEach(val => {
                        const num = parseInt(val, 10);
                        if (!isNaN(num)) weekTotal += num;
                    });
                }
            });
            document.getElementById('weekTotal').textContent = weekTotal.toLocaleString();

            // 月次集計
            let monthTotal = 0;
            const monthSnaps = await Promise.all(monthInfo.dates.map(d => getDoc(doc(db, "shukka_records", d))));
            monthSnaps.forEach(snap => {
                if (snap.exists()) {
                    Object.values(snap.data()).forEach(val => {
                        const num = parseInt(val, 10);
                        if (!isNaN(num)) monthTotal += num;
                    });
                }
            });
            document.getElementById('monthTotal').textContent = monthTotal.toLocaleString();
        }

        // ── オートセーブ関連のイベント設定 ──
        function setupAutoSaveEvents() {
            document.querySelectorAll('.count-input').forEach(input => {
                input.addEventListener('input', () => {
                    calcTotal();
                    const msg = document.getElementById('shukkaMsg');
                    msg.className = "block text-center font-bold text-amber-500 text-xs mt-2";
                    msg.innerText = "変更を検出し待機中...";

                    clearTimeout(autoSaveTimer);
                    autoSaveTimer = setTimeout(async () => {
                        await executeAutoSave();
                    }, 1500);
                });

                input.addEventListener('blur', async () => {
                    clearTimeout(autoSaveTimer);
                    await executeAutoSave();
                });
            });
        }

        async function executeAutoSave() {
            const date = document.getElementById('commonDate').value;
            if (!date) return;
            try {
                await setDoc(doc(db, "shukka_records", date), getCurrentInputs());
                loadPeriodTotals(date); // 保存時に週次・月次も再計算
                const msg = document.getElementById('shukkaMsg');
                msg.className = "block text-center font-bold text-emerald-600 text-xs mt-2";
                msg.innerText = "自動保存しました";
                setTimeout(() => {
                    if (msg.innerText === "自動保存しました") msg.innerText = '';
                }, 2000);
            } catch (e) {
                console.error(e);
                const msg = document.getElementById('shukkaMsg');
                msg.className = "block text-center font-bold text-red-600 text-xs mt-2";
                msg.innerText = "自動保存に失敗しました";
            }
        }

        function setupNameChangeEvents() {
            document.querySelectorAll('.service-name-input').forEach(input => {
                input.addEventListener('change', async function() {
                    const idx = this.getAttribute('data-index');
                    const newName = this.value.trim();
                    if (!newName) { alert('サービス名を入力してください'); renderServices(getCurrentInputs()); return; }
                    currentServices[idx] = newName;
                    await setDoc(doc(db, "settings", "shukka_services"), { services: currentServices });
                    renderServices(getCurrentInputs());
                });
            });
        }

        window.addService = async () => {
            const input = document.getElementById('newServiceName');
            const name = input.value.trim();
            if (!name) { alert('追加するサービス名を入力してください'); return; }
            currentServices.push(name);
            await setDoc(doc(db, "settings", "shukka_services"), { services: currentServices });
            input.value = '';
            renderServices(getCurrentInputs());
        };

        window.moveService = async (index, dir) => {
            const newIdx = index + dir;
            if (newIdx < 0 || newIdx >= currentServices.length) return;
            const counts = getCurrentInputs();
            const temp = currentServices[index];
            currentServices[index] = currentServices[newIdx];
            currentServices[newIdx] = temp;
            await setDoc(doc(db, "settings", "shukka_services"), { services: currentServices });
            renderServices(counts);
        };

        window.deleteService = async (index) => {
            if (currentServices.length <= 1) { alert('サービスは最低1つ必要です。'); return; }
            if (confirm(`「${currentServices[index]}」を削除しますか？`)) {
                const counts = getCurrentInputs();
                currentServices.splice(index, 1);
                await setDoc(doc(db, "settings", "shukka_services"), { services: currentServices });
                renderServices(counts);
            }
        };

        window.loadShukkaByDate = async (date) => {
            if (!date) return;
            try {
                const docSnap = await getDoc(doc(db, "shukka_records", date));
                renderServices(docSnap.exists() ? docSnap.data() : {});
                await loadPeriodTotals(date); // 日付変更時に週次・月次を読み込み
            } catch(e) { renderServices({}); }
        };

        window.saveShukkaData = async () => {
            clearTimeout(autoSaveTimer);
            const date = document.getElementById('commonDate').value;
            if (!date) { alert('対象日を選択してください。'); return; }
            await setDoc(doc(db, "shukka_records", date), getCurrentInputs());
            await loadPeriodTotals(date);
            const msg = document.getElementById('shukkaMsg');
            msg.className = "block text-center font-bold text-emerald-600 text-xs mt-2";
            msg.innerText = "出荷件数データをクラウドに保存しました！";
            setTimeout(() => msg.innerText = '', 2500);
        };

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (confirm('入力された件数をクリアしますか？')) {
                document.querySelectorAll('.count-input').forEach(input => input.value = '');
                calcTotal();
                saveShukkaData();
            }
        });

        init();
    </script>
</body>
</html>
