name: Deploy to Firebase

on:
  push:
    branches: [ main ]

jobs:
  deploy_all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install
        working-directory: functions

      # ▼ サービスアカウントのファイルを作成し、認証を通す準備 ▼
      - name: Setup Service Account
        run: |
          echo "$GCP_SA_KEY" > ./service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=./service-account.json" >> $GITHUB_ENV
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUKO_2DE57 }}'

      # ▼ Hostingのデプロイ ▼
      - name: Deploy Hosting
        run: npx firebase-tools@latest deploy --only hosting --project souko-2de57
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./service-account.json

      # ▼ Functionsのデプロイ ▼
      - name: Deploy Functions
        run: npx firebase-tools@latest deploy --only functions --project souko-2de57
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./service-account.json

      # ▼ デプロイ完了時のSlack通知 ▼
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          node -e '
            const https = require("https");
            const commitMsg = process.env.COMMIT_MSG || "更新";
            const firstLine = commitMsg.split("\n")[0];
            const text = `<!channel> アプリが更新されました: ${firstLine}`;
            const data = JSON.stringify({ text });
            const url = new URL(process.env.SLACK_WEBHOOK_URL);
            const req = https.request({
              hostname: url.hostname,
              path: url.pathname + url.search,
              method: "POST",
              headers: { "Content-Type": "application/json" }
            }, (res) => {
              let body = "";
              res.on("data", (chunk) => body += chunk);
              res.on("end", () => {
                console.log("Webhook Response Status:", res.statusCode);
                console.log("Webhook Response Body:", body);
              });
            });
            req.write(data);
            req.end();
          '
