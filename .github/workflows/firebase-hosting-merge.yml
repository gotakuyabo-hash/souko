name: Deploy to Firebase
on:
  push:
    branches: [ main ]
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      # 1. ウェブサイト(Hosting)のデプロイ
      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUKO_2DE57 }}'
          channelId: live
          projectId: souko-2de57
          entryPoint: '.'
          
      # 2. 関数に必要なパッケージを自動インストール（これを追加！）
      - name: Install Functions Dependencies
        run: npm install
        working-directory: functions
          
      # 3. 関数(Functions)のデプロイ
      - name: Deploy Functions
        uses: w9jds/firebase-action@v13.3.0
        with:
          args: deploy --only functions --project souko-2de57
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUKO_2DE57 }}'
