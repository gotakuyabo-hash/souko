Name: Deploy to Firebase

on:
  push:
    branches: [ main ]

jobs:
  deploy_all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci
        working-directory: functions

      # ▼ Hosting & Functions のデプロイ（最新のfirebase-toolsを直接使用） ▼
      - name: Deploy to Firebase
        run: npx firebase-tools@latest deploy --project souko-2de57 --force
        env:
          FIREBASE_TOKEN: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUKO_2DE57 }}'
          # ※もしサービスアカウントのJSONをそのまま入れている場合は GCP_SA_KEY にしてください
          # GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUKO_2DE57 }}'

      # ▼ シンプルなWebhookを使ったSlack通知 ▼
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          node -e '
            const https = require("https");
            const commitMsg = process.env.COMMIT_MSG || "更新";
            const firstLine = commitMsg.split("\n")[0];
            const text = `<!channel> アプリが更新されました: ${firstLine}`;

            const data = JSON.stringify({ text });
            const url = new URL(process.env.SLACK_WEBHOOK_URL);
            const req = https.request({
              hostname: url.hostname,
              path: url.pathname + url.search,
              method: "POST",
              headers: { "Content-Type": "application/json" }
            }, (res) => {
              let body = "";
              res.on("data", (chunk) => body += chunk);
              res.on("end", () => {
                console.log("Webhook Response Status:", res.statusCode);
                console.log("Webhook Response Body:", body);
              });
            });
            req.write(data);
            req.end();
          '
