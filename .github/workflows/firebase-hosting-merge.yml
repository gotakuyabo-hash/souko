name: Deploy to Firebase
on:
  push:
    branches: [ main ]
jobs:
  deploy_all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ▼ Hosting（ウェブサイト）のデプロイ ▼
      # 安定した firebase CLI を直接叩く方式に変更
      - name: Deploy Hosting
        uses: w9jds/firebase-action@v13.3.0
        with:
          args: deploy --only hosting --project souko-2de57
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUKO_2DE57 }}'
          
      - name: Install Functions Dependencies
        run: npm install
        working-directory: functions
          
      - name: Create .env file
        run: echo "SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}" > functions/.env
          
      - name: Deploy Functions
        uses: w9jds/firebase-action@v13.3.0
        with:
          args: deploy --only functions --project souko-2de57 --force
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUKO_2DE57 }}'

      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          node -e '
            const https = require("https");
            const commitMsg = process.env.COMMIT_MSG || "更新";
            const firstLine = commitMsg.split("\n")[0];
            const text = `<!channel> アプリが更新されました: ${firstLine}`;

            const data = JSON.stringify({ text });
            const url = new URL(process.env.SLACK_WEBHOOK_URL);
            const req = https.request({
              hostname: url.hostname,
              path: url.pathname + url.search,
              method: "POST",
              headers: { "Content-Type": "application/json" }
            }, (res) => {
              res.on("data", () => {});
            });
            req.write(data);
            req.end();
          '
