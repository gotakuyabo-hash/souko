name: Deploy to Firebase

on:
  push:
    branches: [ main ]

jobs:
  deploy_all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ▼ Hosting（ウェブサイト）のデプロイ ▼
      - name: Deploy Hosting
        uses: w9jds/firebase-action@v13.3.0
        with:
          args: deploy --only hosting --project souko-2de57
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUKO_2DE57 }}'
          
      - name: Install Functions Dependencies
        run: npm install
        working-directory: functions
          
      # ▼ Functions用の環境変数（BotトークンとチャンネルID）をセット ▼
      - name: Create .env file
        run: |
          echo "SLACK_BOT_TOKEN=xoxb-12298738971271-12335980754341-Gyr1dMmAD1GuA9cer4ORb5vl" > functions/.env
          echo "SLACK_CHANNEL_ID=C0CA2ENCN1E" >> functions/.env
          
      - name: Deploy Functions
        uses: w9jds/firebase-action@v13.3.0
        with:
          args: deploy --only functions --project souko-2de57 --force
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUKO_2DE57 }}'

      # ▼ デプロイ完了後のSlack通知（Botトークン方式） ▼
      - name: Send Slack Notification
        env:
          SLACK_BOT_TOKEN: "xoxb-12298738971271-12335980754341-Gyr1dMmAD1GuA9cer4ORb5vl"
          SLACK_CHANNEL_ID: "C0CA2ENCN1E"
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          node -e '
            const https = require("https");
            const commitMsg = process.env.COMMIT_MSG || "更新";
            const firstLine = commitMsg.split("\n")[0];
            const text = `<!channel> アプリが更新されました: ${firstLine}`;

            const data = JSON.stringify({
              channel: process.env.SLACK_CHANNEL_ID,
              text: text
            });

            const req = https.request({
              hostname: "slack.com",
              path: "/api/chat.postMessage",
              method: "POST",
              headers: {
                "Content-Type": "application/json; charset=utf-8",
                "Authorization": `Bearer ${process.env.SLACK_BOT_TOKEN}`
              }
            }, (res) => {
              let body = "";
              res.on("data", (chunk) => body += chunk);
              res.on("end", () => {
                console.log("Slack API Response:", body);
              });
            });

            req.write(data);
            req.end();
          '
