name: Deploy to Firebase Functions
on:
  push:
    branches: [ main ]
jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      # 1. 関数に必要なパッケージをインストール
      - name: Install Functions Dependencies
        run: npm install
        working-directory: functions
          
      # 2. 関数(Functions)だけをデプロイ
      - name: Deploy Functions
        uses: w9jds/firebase-action@v13.3.0
        with:
          args: deploy --only functions --project souko-2de57
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOUKO_2DE57 }}'
