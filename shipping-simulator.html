<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>受注データ処理シミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.1.0/encoding.min.js"></script>
    <style>
        body { background: #f4f6f8; font-family: sans-serif; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 98%; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div style="max-width: 98%; margin: 0 auto;">
        <a href="index.html" class="text-blue-600 font-bold mb-4 inline-block">← ポータルサイトに戻る</a>
        <div class="card">
            <h2 class="text-lg font-bold mb-4">受注データ処理シミュレーター（振り分けくん）</h2>
            <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
                <input type="file" id="csvFile" accept=".csv" class="text-xs">
                <button id="dlBtn" onclick="downloadCSV()" disabled class="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white px-4 py-2 rounded text-xs font-bold transition">ステータス220のみCSVダウンロード</button>
            </div>
            <div class="max-h-[600px] overflow-auto border rounded bg-slate-50">
                <table id="table" class="w-full text-xs text-left border-collapse whitespace-nowrap">
                    <thead id="thead" class="bg-slate-100 sticky top-0 z-10">
                        <tr><th class="p-2 border">インポート待ち...</th></tr>
                    </thead>
                    <tbody id="tbody">
                        <tr><td class="p-6 text-center text-gray-400">CSVファイルをインポートしてください</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let rawHeader = [], rows = [];

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const buffer = event.target.result;
                const codes = new Uint8Array(buffer);

                const encoding = Encoding.detect(codes);
                const unicodeStr = Encoding.convert(codes, { to: 'UNICODE', from: encoding, type: 'string' });

                parseCSVRobust(unicodeStr);
            };
            reader.readAsArrayBuffer(file);
        });

        function parseCSVRobust(text) {
            let records = [], currentRow = [], currentField = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i], nextChar = text[i + 1];
                if (char === '"') {
                    if (inQuotes && nextChar === '"') { currentField += '"'; i++; } else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentField); currentField = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    currentRow.push(currentField);
                    records.push(currentRow);
                    currentRow = []; currentField = '';
                } else { currentField += char; }
            }
            if (currentField !== '' || currentRow.length > 0) { currentRow.push(currentField); records.push(currentRow); }

            if (records.length === 0) return;

            rawHeader = records[0];

            rows = [];
            for (let i = 1; i < records.length; i++) {
                let cols = records[i];
                if (!cols || cols.length <= 1) continue;
                let hasValidData = cols.some(val => val !== "" && val !== "0" && val !== null);
                if (!hasValidData) continue;

                while (cols.length < 28) cols.push('');
                let initialH = cols[7] || '';
                let initialAB = cols[27] || '';
                rows.push({
                    cols: cols,
                    h: initialH,
                    ab: initialAB,
                    originalH: initialH,   // 元のステータスを保持
                    originalAB: initialAB  // 元のAB列を保持
                });
            }

            renderTable();
            document.getElementById('dlBtn').disabled = false;
        }

        function renderTable() {
            const thead = document.getElementById('thead');
            thead.innerHTML = '<tr class="bg-slate-100">' + rawHeader.map((h, i) => {
                let label = String(h !== null && h !== undefined ? h : '').replace(/^"|"$/g, '').replace(/""/g, '"');
                if (i === 5) label = 'F列: ' + label;
                if (i === 7) label = 'H列(スタ): ' + label;
                if (i === 27) label = 'AB列: ' + label;
                return `<th class="p-2 border border-slate-200 font-semibold text-slate-700">${label}</th>`;
            }).join('') + '</tr>';

            const tbody = document.getElementById('tbody');
            if (rows.length === 0) {
                tbody.innerHTML = '<tr><td class="p-6 text-center text-gray-400" colspan="' + rawHeader.length + '">有効なデータが見つかりませんでした</td></tr>';
                return;
            }

            tbody.innerHTML = rows.map((rowObj, idx) => {
                let cols = rowObj.cols;
                return `<tr class="hover:bg-slate-100 bg-white">` + cols.map((val, j) => {
                    let tdClass = "p-2 border border-slate-200";
                    let clickAttr = "";

                    let displayVal = String(val !== null && val !== undefined ? val : '').replace(/^"|"$/g, '').replace(/""/g, '"');

                    if (displayVal === "0" && j !== 5) {
                        displayVal = "";
                    }

                    if (j === 5) {
                        tdClass += " bg-sky-50 text-sky-700 font-bold cursor-pointer text-center hover:bg-sky-100";
                        clickAttr = `onclick="updateRow(${idx})" title="クリックで220設定 / 再クリックで元に戻す"`;
                        if (!displayVal || displayVal === "0") displayVal = '237';
                    } else if (j === 7 && rowObj.h === '220') {
                        tdClass += " bg-emerald-50 text-emerald-700 font-bold";
                    } else if (j === 27 && rowObj.ab) {
                        tdClass += " bg-emerald-50 text-emerald-700 font-bold";
                    }
                    return `<td class="${tdClass}" ${clickAttr}>${displayVal}</td>`;
                }).join('') + `</tr>`;
            }).join('');
        }

        function updateRow(idx) {
            let rowObj = rows[idx];
            if (rowObj.h === '220') {
                // すでに220の場合は元の値に戻す
                rowObj.h = rowObj.originalH;
                rowObj.ab = rowObj.originalAB;
                rowObj.cols[7] = rowObj.originalH;
                rowObj.cols[27] = rowObj.originalAB;
            } else {
                // 220に変更し、タイムスタンプを付与
                rowObj.h = '220';
                const timeString = new Date().toTimeString().split(' ')[0];
                rowObj.ab = timeString;
                rowObj.cols[7] = '220';
                rowObj.cols[27] = timeString;
            }
            renderTable();
        }

        function downloadCSV() {
            const filtered = rows.filter(r => r.h === '220');
            if (filtered.length === 0) { alert('ステータス220に設定された行がありません。F列をクリックしてください。'); return; }

            let csvContent = rawHeader.map(escapeCSV).join(',') + '\r\n';
            filtered.forEach(row => {
                csvContent += row.cols.map(escapeCSV).join(',') + '\r\n';
            });

            const unicodeList = Encoding.stringToCode(csvContent);
            const sjisCodeList = Encoding.convert(unicodeList, { to: 'SJIS', from: 'UNICODE', type: 'array' });
            const uint8Array = new Uint8Array(sjisCodeList);

            const blob = new Blob([uint8Array], { type: 'text/csv;charset=shift_jis;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'processed_order_status220.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function escapeCSV(str) {
            if (str === null || str === undefined) return '""';
            let stringVal = String(str);
            if (stringVal.includes(',') || stringVal.includes('"') || stringVal.includes('\n') || stringVal.includes('\r')) {
                return '"' + stringVal.replace(/"/g, '""') + '"';
            }
            return stringVal;
        }
    </script>
</body>
</html>
